- url: https://archive.org/details/cia-readingroom-document-cia-rdp96-00789r002800180001-2
  status: archived
  archive_status: 1
  artifacts:
  - extraction_type: ocr-scan
    format: pdf
    archived_date: '2026-05-15'
    path: government/cia-rdp96-00789r002800180001-2-stargate-project-an-overview-19930430.pdf
    note: '''STAR GATE PROJECT: AN OVERVIEW'' (Short Title DTI-S-1056-SL), Defense Intelligence Agency Directorate for Scientific and Technical Intelligence, 30 April 1993 (29 pages). CIA Reading Room document CIA-RDP96-00789R002800180001-2 (Approved For Release 2000/08/08); mirrored via Internet Archive (URL embedded in PDF metadata Keywords field). DIA internal program-overview briefing of STAR GATE — the umbrella designation for the remote-viewing investigation that ran at SRI International (Menlo Park, CA) from 1970 to 1990 and at Princeton University. Attests: ''1970-1990 — SRI INTERNATIONAL, MENLO PARK, CA'' program window; CIA initiation followed by DIA continuation of funding; the SRI program discontinued in 1990; eleven years of work ''headed by Dr. H. Puthoff.'' Primary-source attestation of the formal Stargate program designation and the SRI funding chain (CIA → DIA). Closes Russell Targ artifact rumor r4 (CIA/DIA-funded SRI psychic-abilities investigation = Stargate Project, 1972-1995). OCR-scan PDF (Internet Archive''s pymupdf + mupdf rendering of typewritten 1993 CIA scans); visible spacing/character artifacts on headings and tables consistent with typewriter-scan OCR.'
- url: https://archive.org/download/army_ttsa_crada/ARMY_text.pdf
  status: archived
  archive_status: 1
  wayback_skip: true
  artifacts:
  - format: pdf
    archived_date: '2026-04-22'
    path: government/army-ttsa-crada-19-15-nete-20191001.pdf
    note: 'The actual Cooperative Research and Development Agreement (CRADA) #19-15 between To The Stars Academy of Arts and Science, Inc. and the U.S. Army Combat Capabilities Development Command (CCDC) Ground Vehicle Systems Center, Warren MI. CRADA title: ''Novel & Emerging Technology Exploitation (NETE)''. Effective date 2019-10-01 (TTSA announced publicly 2019-10-17). 8-page text-extractable OCR''d PDF distributed via Internet Archive (item: army_ttsa_crada). Names signatories — Army side: Ben Soave + Dr. Joseph Cannon (Principal Investigators, Ground Vehicle Survivability and Protection / GVSP); TTSA side: Luis Elizondo (Principal Investigator, Director of Global Security and Special Programs). Estimated USG resources value: $750k. Technology scope: ''inertial mass reduction mechanical/structural metamaterials, electromagnetic metamaterial wave guides, quantum physics, quantum communications, and beamed energy propulsion''. Other Participants clause: ''The Office of the Secretary of Defense (OSD) can share historical reports of findings and origin of materiel solutions in the possession of the Collaborator'' — establishes OSD connection to the material''s origin-history. Primary-source Army-side confirmation of the CRADA that AARO HRR Vol I (2024) later references as the TTSA-U.S. Army material-analysis relationship predating AARO custody.'
