    note: 'Luis D. Elizondo''s sworn Question-for-the-Record (QFR) response to Rep. Eric Burlison''s Dec 9, 2024 QFR letter (cover letter signed by subcommittee chairs Nancy Mace and Glenn Grothman), responding to the November 13, 2024 joint Subcommittee hearing ''Unidentified Anomalous Phenomena: Exposing the Truth'' (Subcommittees on Cybersecurity, Information Technology, and Government Innovation; National Security, the Border, and Foreign Affairs). 8-page Word-converted PDF (Acrobat PDFMaker 24 / Adobe PDF Library 24.5.83). Signed by Luis D. Elizondo, dated Dec 19, 2024, return-addressed P.O. Box 337, Buffalo WY 82834. Q1 response identifies Dr. James Lacatski (former Director of AAWSAP) as author of the DOPSR-cleared statement (Sep 6, 2023) naming James Ryder, and quotes the verbatim Lacatski statement (matching SD004 page-1 verbatim text). Q6 response: ''Yes. The CIA opposed the transfer of materials of advanced, non-human origin from Lockheed Martin to Bigelow Aerospace.'' Q7 response: confirms Patuxent River Naval Air Station SAP-F hangar (~$10M, funding requested by then-Representative Steny Hoyer); Elizondo personally visited; no materials transferred at time of visit. Q11: notes $22M AAWSAP funding was directed to varied programmatic needs (37 DIRDs published; see Attachment 3 for complete list). Hosted on Douglas Johnson''s Ghost-blog CDN as the public mirror; canonical docs.house.gov path /meetings/GO/GO12/20241113/117721/HHRG-118-GO12-QFR-ElizondoL.pdf returns the docs.house.gov 404 ASP.NET error page (verified 2026-05-07) — the QFR was not published on the official House Oversight document repository; the Douglas Johnson mirror is the public-record route.'
