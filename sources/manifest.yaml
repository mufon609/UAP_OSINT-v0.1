    note: 'SRI International official ''About'' page (www.sri.com/about/), retrieved 2026-05-15. SRI''s first-party institutional anchor. Verbatim self-attestation: ''An independent nonprofit R&D institute with deep roots in Silicon Valley''; ''Founded in 1946 as Stanford Research Institute, and independent since 1970, we acquired Sarnoff Corp. (formerly RCA Labs) in 1987 and the Palo Alto Research Center (PARC) in 2023''; ''Today, our 1,500 researchers and professional staff work with government and commercial customers and collaborators''. Identifies current CEO David Parekh, headquarters at 333 Ravenswood Ave, Menlo Park, CA 94025 USA, and the 13,000+ patents / 50+ spin-off companies / 500+ R&D projects per year institutional scale. Page footer carries ''© 2026 SRI INTERNATIONAL'' (canonical legal name). Research divisions named in primary navigation: Advanced Technology & Systems / Biosciences / Education / Information & Computing Sciences / Integrated Systems & Solutions; commercialization arms: Commercial R&D / Ventures / Center for Innovation, Strategy & Policy / Nomura-SRI Innovation Center. Does NOT explicitly attest the date of the rebrand from ''Stanford Research Institute'' to ''SRI International'' — implicit between the 1970 independence event and present-day ''SRI International'' branding. Text-native HTML (WordPress / Yoast SEO); clean extraction via html.parser visible-text walk.'
