  extrinsic_authorship: 'The Author line on the document is redacted under FOIA (b)(6), so no author name appears on the document. The DIA-to-Congress products list attributes the report to Dr. Eric Davis, EarthTech International (attachment 14, "Concepts for Extracting Energy from the Quantum Vacuum").'
description: 'Concepts for Extracting Energy From the Quantum Vacuum. The Defense Intelligence Reference Document is 6 April 2010, with an ICOD of 1 December 2009 and control number DIA-08-1004-007, UNCLASSIFIED. Where the Prepared by and Author appear, the document gives (b)(3):10 USC 424 and Defense Intelligence Agency ([`/organizations/dia`]) and, on the Author line, (b)(6). An Administrative Note states the product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, Advanced Aerospace Weapon System Applications (AAWSA) Program [`/organizations/aawsap`], and that comments or questions should be addressed to the AAWSA Program Manager. The document is one of a series of FY 2009 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]).


  The Summary characterized the vacuum of space as filled with electromagnetic waves, random in phase and amplitude, referred to as the electromagnetic quantum vacuum, the lowest energy state of otherwise empty space; integrated over all frequency modes up to the Planck frequency it represents an energy density far in excess of any other known energy source, even if only an infinitesimal fraction is accessible. This zero-point field (ZPF) energy is responsible for well-known physical effects such as the Lamb shift, spontaneous atomic emission, low-temperature van der Waals forces, and the Casimir effect. Rather than eliminate the ZPF energy from the equations, the paper, exploring the possibility that it is a real energy, considers that it can be tapped as a source of power or harnessed to generate a propulsive force for space travel — the notion of exchanging energy with the quantum vacuum is the focus of the paper. The breakthrough desired in space travel is to eliminate the need to carry propellant at all, that is, to generate a propulsive force without carrying and ejecting propellant.


  The report reviews historical concepts for extracting energy from the vacuum, the origin of zero-point field energy in the elements of QED and SED theory, and a set of selected experimental concepts for theoretical and laboratory investigation: voltage fluctuations in coils induced by the ZPF, ZPF energy extraction by ground state energy reduction, the tunable Casimir effect, and the EV phenomenon. A subset of the proposed concepts has undergone preliminary evaluation by Lockheed-Martin ([`/organizations/lockheed-martin`]) review panels involving both internal R&D personnel and outside experts on theory and experimentation. For one concept — the Mead ([`/people/franklin-mead`]) and Nachamkin ([`/people/jack-nachamkin`]) patent invention — a computer model study performed at the Air Force Research Laboratory ([`/organizations/afrl`]) (Edwards AFB, CA) indicates the invention could work, though no experimental study has been performed to validate this in the lab. The author ([`/people/eric-davis`]) wishes, in the Acknowledgements, to thank colleagues H. E. Puthoff ([`/people/hal-puthoff`]) of EarthTech, Int''l ([`/organizations/earthtech-international`]) and three Lockheed Martin personnel — V. Teofilo ([`/people/vincent-teofilo`]), J. Newmeyer ([`/people/jeff-newmeyer`]), and E. H. Allen ([`/people/edward-allen`]) — among the contributions to the report. The Conclusion: The Way Forward to 2050 states that second-quantized QED, based on the concept of an immutable, non-degradable vacuum, does not support the concept of continuous vacuum energy conversion, while SED as an alternative theory has enough shortcomings that it is not at present an adequate tool; whether useful conversion of energy from quantum fluctuations can be accomplished is yet to be determined.

  '
