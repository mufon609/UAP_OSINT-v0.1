    location: 'Administrative Notes'
  significance: Ties the document to the DIA AAWSAP DIRD series; program-office identifiers redacted under 10 USC 424 and (b)(6).
  context: Administrative block on the title-verso page; "Weapons System Applications (AAWSA)" is the source's form (sic).
  claim_group: dird-series-provenance
- id: q3
  added_date: '2026-06-11'
  text: 'Space exploration 40 years into the future may include manned missions to parts of the outer solar system. A possible scenario may include sending a small fleet of craft with different primary missions. For example, a trailing spacecraft of nuclear powered electromagnets designed to shield the manned part of the fleet from solar radiation; halo spacecraft with powerful radars to scout for incoming objects; exploration and mining craft, etc. The fleet could regularly travel out of unaided visual range of each other, joining up when necessary for maintenance, exchange of materials such as fuel, or other necessities. Piloting these multiple craft could be economically accomplished if only one remote pilot on station at a time was necessary.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'section "Summary", opening paragraph'
  significance: The 40-year deep-space fleet scenario that motivates the whole study — matches the AATIP "present out to the next 40 years" framing.
  context: Opening paragraph of the Summary.
  claim_group: deep-space-fleet-scenario
- id: q4
  added_date: '2026-06-11'
  text: 'The cognitive limitation of a human astronaut and his ability to perform the multiple-vehicle piloting task is the focus of this paper as little work has been done in this specific area.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'section "Summary", second paragraph'
  significance: Statement of thesis and scope.
  context: Summary, second paragraph.
  claim_group: thesis-scope
- id: q5
  added_date: '2026-06-11'
  text: 'In both areas it has been shown the cognitive limits on the number of craft capable of simultaneous control is 16 for simple destination selection, 7 for moderately complex piloting and/or mission task completion, and 4 for complex heterogeneous craft.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'section "Summary", final paragraph'
  significance: The headline quantitative finding — the 16/7/4 cognitive-limit ladder.
  context: Summary, final paragraph; "both areas" are air traffic control and multiple-unmanned-vehicle piloting research.
  claim_group: cognitive-limit-findings
- id: q6
  added_date: '2026-06-11'
  text: 'It is not a surprise that there is little work in this specific area – in fact there were zero peer-reviewed articles in the major journals concerning remote piloting of multiple spacecraft (published in the last 30 years).'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 1: Introduction, third paragraph'
  significance: Documents the literature gap the study works around by analogy to ATC and UAV research.
  context: Introduction; en-dash as in source.
  claim_group: research-gap
- id: q7
  added_date: '2026-06-11'
  text: 'When a pilot or ATC operator is in control of several craft they have developed an internal mental representation of the identity, position, mission, and current direction of each object tracked. This is referred to colloquially as "the big picture." This mental representation is also called situational awareness.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 1: Introduction, "big picture" paragraph'
  significance: Defines the central construct ("the big picture" / situational awareness) whose object-capacity the paper tries to bound.
  context: Introduction, fourth paragraph.
  claim_group: big-picture-concept
- id: q8
  added_date: '2026-06-11'
  text: 'For the current treatise we will consider only traditional humans as pilots. Cyborg-enhanced astrobots are a topic for another tome.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 1: Introduction, scope-limitation sentence'
  significance: Explicit scope limitation — and a characteristic flourish of the DIRD series' speculative register.
  context: Introduction, before the task-demand/workload framework.
  claim_group: thesis-scope
- id: q9
  added_date: '2026-06-11'
  text: 'There are three approaches to measuring mental workload in a subject performing a primary task. The first is subjective evaluation, either post-hoc self-report questionnaires concentrating on how "busy" one may have felt, or an experimental observation of activity. The second is performance measures, an objective evaluation of how well the subject completes the primary task, a secondary task, or an experimentally inserted reference task. The final approach is to record real-time physiological measures, with the assumption that increased workload increases anxiety and this will be exhibited by changes in the autonomic nervous system (ANS).'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 2: Measurement of Mental Workload, opening paragraph'
  significance: The methods taxonomy (subjective / performance / physiological) that organizes Chapter 2.
  context: Chapter 2 opening.
  claim_group: workload-measurement-methods
- id: q10
  added_date: '2026-06-11'
  text: 'Results showed that a relatively small number of aircraft can greatly increase the perceived workload.  Boag concludes that perceived complexity is the number one factor in determining workload, and that although conflicts are the major source of complexity in the ATC task, and these can be modeled somewhat using a combination of aircraft separation and transitioni variables, individual differences still have significant impact on when a controller may reach overload.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 3: Studies in Cognitive Workload for Air Traffic Controllers, Boag 2006 paragraph'
  significance: Chapter 3 finding — complexity, not raw aircraft count, drives workload.
  context: Boag 2006 study of professional controllers using MARC complexity ranking; "transitioni" preserves the fused footnote-i marker from the clean-text sibling (sic).
  claim_group: cognitive-limit-findings
- id: q11
  added_date: '2026-06-11'
  text: 'Lamoureaux researched in 1999 whether a proposed ATC augmentation system could safely allow smaller distances between aircraft and thus increase traffic capacity without building new airports or runways.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 3, Lamoureaux/Lamoureux 1999 paragraph (after Figure 3)'
  significance: Introduces the workload-prediction modeling study; prose spells the name "Lamoureaux" while the source''s own reference entry [26] gives "Lamoureux, T." (sic).
  context: Chapter 3, study described against Table 1 aircraft-pair complexity variables.
  claim_group: workload-prediction-models
- id: q12
  added_date: '2026-06-11'
  text: 'Using a model based on task variance and complexity of current aircraft under control, the researchers were able to predict perceived workload 74% of the time, but more importantly, were able to predict a self-rating of 4 for 80% of the cases.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 3, Lamoureaux/Lamoureux 1999 paragraph, prediction results'
  significance: Quantified result that perceived workload — including near-overload self-ratings — can be predicted from task complexity models.
  context: Same Lamoureux 1999 study; self-rating 4 corresponds to the A3/B near-overload band.
  claim_group: workload-prediction-models
- id: q13
  added_date: '2026-06-11'
  text: 'The Brookings data was reanalyzed by Wilson in 2003 using an artificial neural network approach as well as a stepwise discriminate analysis to classify a physiological state as either operational or overloaded. Wilson successfully classified the overload condition consistently in more than 98% of the cases.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 3, Wilson 2003 reanalysis paragraph'
  significance: Key physiological-classification result — overload states machine-classifiable at >98% from psychophysiological data.
  context: Reanalysis of the Brookings 1996 simulated-TRACON dataset.
  claim_group: physiological-overload-classification
- id: q14
  added_date: '2026-06-11'
  text: 'In this type of a control system the raw number of vehicles under one pilot''s control can dramatically increase, but the number of swarms then takes the place of the number of vehicles in developing big picture cognitive limits.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 4: Studies in Command of Multiple Semi-Automated Vehicles, UAV-swarm paragraph'
  significance: Extends the cognitive-limit framework to swarm control — swarms, not vehicles, become the tracked objects; the same paragraph notes such systems are under development for space exploration.
  context: Chapter 4, second paragraph, on UAV swarms commanded as units.
  claim_group: uav-swarm-analogue
- id: q15
  added_date: '2026-06-11'
  text: 'Attempting to increase the limits of UAV to pilot ratio, Ruff examined simulations using three augmented control techniques: manual, management by consent, and management by exception. The authors concluded that the middle level of automation performed best when considering that augmentation algorithms may have associated errors. They also concluded that the absolute maximum number of UAVs a person could control is four.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 4, Ruff simulation paragraph'
  significance: Source of the "4 for complex heterogeneous craft" bound; no reference entry for Ruff appears in the source''s References list.
  context: Chapter 4; the Ruff paragraph carries no citation marker.
  claim_group: cognitive-limit-findings
- id: q16
  added_date: '2026-06-11'
  text: 'the utilization measure in multiple-object tracking and retargeting is similar to a grandmaster playing many games of chess simultaneously. They walk from board to board, think for a bit, make a move, and then move to the next board. Many high-level chess players can look at board position and evaluate what the next move is without knowledge of previous moves in the game. The question at hand is, how many simultaneous games can the grandmaster play before he is forced to revert to cold position analysis with every new presentation of a game? The conclusion is 16, and it agrees with previous work on free flight ATC.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 4, Cummings chess-grandmaster analogy paragraph'
  significance: The chess-grandmaster analogy grounding the upper bound of 16 simultaneously tracked objects.
  context: Discussion of Cummings'' cruise-missile retargeting study and the 70%-utilization measure.
  claim_group: cognitive-limit-findings
- id: q17
  added_date: '2026-06-11'
  text: 'She concluded again that 70% utilization is optimal, but notes that the queuing theory concept of wait times will significantly affect the maximum number of vehicles that can be attended.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 4, Cummings heterogeneity follow-up paragraph'
  significance: The 70%-utilization ceiling and the wait-time mechanism that reduces controllable aircraft to seven with more complex interfaces.
  context: '"She" is Cummings; the following sentences define interaction, neglect, and wait times.'
  claim_group: cognitive-limit-findings
- id: q18
  added_date: '2026-06-11'
  text: 'The number of four is consistent with standard estimates of human working memory being able to handle three to five disparate objects at a time. This implies that disparate, complex interfaces require resources from working memory to prevent loss of the big picture.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 5: Discussion, working-memory paragraph'
  significance: Interprets the empirical 4-craft bound through working-memory capacity (3-5 disparate objects).
  context: Discussion, tying Ruff''s limit to working-memory research.
  claim_group: working-memory-interpretation
- id: q19
  added_date: '2026-06-11'
  text: 'Augmentation of the human capabilities mainly appears to be helping to maintain a higher number of working memory registers. Whether it is the handwritten blocks for the ATCs, the stored instructions for the Dixon study, or the dual displays of Cummings, the most effective augmentations in the studies above hold information for quick visual retrieval that the brain would otherwise keep in working memory.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 5: Discussion, augmentation paragraph'
  significance: Discussion finding — effective augmentation works as external working memory.
  context: Discussion, synthesizing the ATC and UAV augmentation results.
  claim_group: working-memory-interpretation
- id: q20
  added_date: '2026-06-11'
  text: 'Any external automation system to assist the operator in making decisions will have an associated error rate. It was also shown in the ATC and piloting tasks that alerts need to contain a level of noise (false alarms) of 20-25% to avoid automation bias.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 5: Discussion, automation-bias paragraph'
  significance: Counterintuitive design finding — alarms must be 20-25% wrong to keep operators vigilant.
  context: Discussion, drawing on the Wickens dual-task alarm study in Chapter 3.
  claim_group: automation-bias
- id: q21
  added_date: '2026-06-11'
  text: 'Regarding where the future of this work is headed, it is certain that the field is just getting started. Apollo spacecraft required dozens of ground operators to monitor for system failures, and just a few years ago it required two soldiers to operate a simple reconnaissance drone (most of them still do). It is fortunate that ATC and UAV control appear to be extremely applicable to the initial direction of remote space vehicle operations. The 5-year timeframe should see spacecraft-specific simulator studies begin to appear in major peer-reviewed journals.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 5: Discussion, future-direction paragraph'
  significance: Forecast paragraph — from Apollo''s dozens-of-operators baseline to a predicted 5-year emergence of spacecraft-specific simulator studies.
  context: Discussion, penultimate paragraph.
  claim_group: future-research-forecast
- id: q22
  added_date: '2026-06-11'
  text: 'The major advance to come in developing augmented human capability to pilot multiple spacecraft will be in understanding the cognitive organization of multitasking. With brain imaging it has been shown that multiple resource theory seems to follow the anatomical organization of the brain. In the next 40 years we will find out why the functional studies in multiple task completion don''t seem to follow the predictions of multiple resource theory.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 5: Discussion, closing paragraph'
  significance: Closing 40-year forward look matching the AATIP horizon — the open theoretical problem is the cognitive organization of multitasking.
  context: Final paragraph of the Discussion.
  claim_group: future-research-forecast
- id: q23
  added_date: '2026-06-11'
  text: 'There is a lack of research in the area of cognitive limits on the number of spacecraft one pilot could control given any mission scenario. Two models for examining what are similar activities are air traffic control and remote piloting of multiple unmanned vehicles. We have shown the research progress in both areas, and the cognitive limits on the number of craft that can be simultaneously controlled are 16 for simple destination selection, 7 for moderately complex piloting and/or mission task completion, and 4 for complex heterogeneous craft. Future research may increase the automation component of aircraft and mission control, but there is no evidence to date that a complete mental picture can be maintained, even with external working memory augmentation, for more than about 16 objects at one time.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 6: Conclusions, first paragraph'
  significance: The document''s formal conclusion — restates the 16/7/4 ladder and the ~16-object ceiling on the mental picture even with augmentation.
  context: Conclusions, first paragraph.
  claim_group: cognitive-limit-findings
- id: q24
  added_date: '2026-06-11'
  text: 'We have additionally shown that physiological variables can be objectively employed to indicate overload. Nominal success has been achieved in classifying physiological states near high workload and thus able to predict and thus possibly prevent overload. We expect this classification will be achieved with near perfect accuracy within five years of specific studies being commenced.'
  source:
    path: government/dird-34-cognitive-limits-unmanned-spacecraft-2010.pdf
    location: 'Chapter 6: Conclusions, second paragraph'
  significance: Second formal conclusion — physiological overload prediction is feasible and expected to reach near-perfect accuracy within five years of dedicated studies.
  context: Conclusions, second paragraph; awkward "and thus able to predict and thus possibly prevent" phrasing is the source''s (sic).
  claim_group: physiological-overload-classification
