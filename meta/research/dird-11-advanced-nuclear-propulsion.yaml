  extrinsic_authorship: 'No author is named on the document itself — the Author line is redacted under FOIA exemption (b)(6) and the Prepared by line under (b)(3):10 USC 424, which shows only "Defense Intelligence Agency." The DIA-to-Congress AAWSAP products list attributes the report to Dr. F. Winterberg of the University of Nevada – Reno (attachment #2). The document''s own body does not carry the name on its face, but it intrinsically echoes that attribution: the References repeatedly cite "F. Winterberg" (entries [1], [2], [8], [9], [10], [13], [16], [17], [21]), and the Preface is written in the first person ("Having been born in Germany in 1929, I received my Ph.D. in physics under Heisenberg in 1955…"; the Lifting-of-Large-Payloads section refers to a technique "one I had first proposed in a classified report dated January 1970"), consistent with single-author authorship while the byline stays FOIA-redacted. Cross-reference [`/documents/dia-aatip-products-list-2018`]. Nothing about specific reference co-authorship is asserted beyond what is visible in the body.'
