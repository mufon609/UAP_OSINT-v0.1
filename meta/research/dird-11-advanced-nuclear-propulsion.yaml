- id: q-introduction-thesis
  added_date: '2026-05-26'
  text: |-
    As Hermann Oberth proved for chemical rockets in his 1923 book The Rocket into
    Planetary Space (Reference 6), this paper will try to prove for thermonuclear rockets
    the following:

    • At the present state of science and technology one can build spaceships driven by
    deuterium thermonuclear reactions, able to reach the outer limits of the solar
    system.

    • Such spaceships permit the manned exploration of the entire solar system and
    beyond, with the ultimate potential to reach nearby solar systems.
  source:
    path: government/dird-11-advanced-nuclear-propulsion-20100311.pdf
    location: 'section "Introduction", thesis bullets'
  significance: The document's stated thesis — that at the present state of science and technology one can build deuterium-thermonuclear-driven spaceships able to reach the outer solar system and permit manned exploration of the entire solar system and beyond
  statement_date: '2010-03-11'
- id: q-deuterium-preferred-fuel
  added_date: '2026-05-26'
  text: |-
    To appreciate the importance of deuterium as the preferred and abundantly available
    nuclear rocket fuel, one must consider the secondary reactions with D of the He? and T
    reaction products from D-D fusion.
  source:
    path: government/dird-11-advanced-nuclear-propulsion-20100311.pdf
    location: 'section "Deuterium as the Preferred Nuclear Rocket Fuel", ¶1'
  significance: The propulsion thesis stated plainly — deuterium is framed as the preferred and abundantly available nuclear rocket fuel; preserves the OCR rendering "He?" for He3
  statement_date: '2010-03-11'
- id: q-deuterium-availability
  added_date: '2026-05-26'
  text: |-
    Deuterium can be used as the rocket fuel of choice in addition to any inert material that
    is suitable as a propellant. This propellant material is available on most planetary
    bodies and particularly on the comets of the Oort cloud.
  source:
    path: government/dird-11-advanced-nuclear-propulsion-20100311.pdf
    location: 'section "Introduction", deuterium-as-fuel-of-choice ¶'
  significance: Establishes the fuel-availability premise — deuterium plus an inert propellant available on most planetary bodies and on the comets of the Oort cloud, the basis for in-situ refueling
  statement_date: '2010-03-11'
- id: q-lifting-payloads-task
  added_date: '2026-05-26'
  text: |-
    To lift large payloads into Earth orbit remains the most difficult task. For a launch from
    the Earth's surface, magnetic insulation inside the Earth's atmosphere fails, and with it
    the proposed pure deuterium bomb configuration. A different technique is suggested
    here, one I had first proposed in a classified report dated January 1970 (Reference 9),
    declassified in July 2007, and thereafter published (Reference 17).
  source:
    path: government/dird-11-advanced-nuclear-propulsion-20100311.pdf
    location: 'section "Lifting of Large Payloads Into Earth Orbit", ¶1'
  significance: Frames the deep-space-mission application's hardest sub-problem — lifting large payloads into Earth orbit — and the first-person provenance of the alternative launch technique (classified 1970, declassified 2007)
  statement_date: '2010-03-11'
- id: q-conclusion-feasibility
  added_date: '2026-05-26'
  text: |-
    If large-scale manned spaceflight has any future, a high-specific-impulse, high-thrust
    propulsion system is needed. The only known propulsion concept with this property is
    nuclear bomb propulsion.
  source:
    path: government/dird-11-advanced-nuclear-propulsion-20100311.pdf
    location: 'section "Conclusion", ¶1'
  significance: The Conclusion's feasibility/relevance thesis — large-scale manned spaceflight requires a high-specific-impulse, high-thrust system, and the only known concept with that property is nuclear bomb propulsion
  statement_date: '2010-03-11'
- id: q-conclusion-deuterium-oort
  added_date: '2026-05-26'
  text: |-
    Looking to the future, using deuterium—widely available on most planets of the solar
    system and in the Oort cloud outside the solar system—as the nuclear rocket fuel would
    make manned space flight to the Oort cloud possible, at a distance at about one-tenth
    of one light year.
  source:
    path: government/dird-11-advanced-nuclear-propulsion-20100311.pdf
    location: 'section "Conclusion", closing ¶'
  significance: The closing relevance statement — deuterium as the abundantly available rocket fuel would make manned space flight to the Oort cloud (about one-tenth of a light year) possible
  statement_date: '2010-03-11'
