description: 'Advanced Nuclear Propulsion for Manned Deep Space Missions. The Defense Intelligence Reference Document, 11 March 2010, has an ICOD of 1 December 2009 and control DIA-08-1003-007, UNCLASSIFIED//FOR OFFICIAL USE ONLY, with FOR OFFICIAL USE ONLY struck through to UNCLASSIFIED. Where the document shows Prepared by and Author, it shows [(b)(3):10 USC 424] and Defense Intelligence Agency ([`/organizations/dia`]) and [(b)(6)]. An Administrative Note states the product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, [(b)(3):10 USC 424] Advanced Aerospace Weapon System Applications (AAWSA) Program [`/organizations/aawsap`], with a COPYRIGHT WARNING that further dissemination of the photographs in this publication is not authorized, and that comments or questions pertaining to this document should be addressed to the AAWSA Program Manager. The document is made available through the declassification efforts and research of John Greenewald, Jr., creator of The Black Vault ([`/organizations/the-black-vault`]). It is one of the FY 2009 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]).


  The paper will try to prove for thermonuclear rockets that at the present state of science and technology one can build spaceships driven by deuterium thermonuclear reactions, able to reach the outer limits of the solar system, and that such spaceships permit the manned exploration of the entire solar system and beyond, with the ultimate potential to reach nearby solar systems. The propulsion concept is the nonfission ignition of small deuterium thermonuclear microexplosions, replacing the pusher plate of the Orion concept with a magnetic mirror reflecting the plasma-fireball of the thermonuclear microexplosion. Deuterium is the preferred and abundantly available nuclear rocket fuel; it can be used as the rocket fuel of choice in addition to any inert material that is suitable as a propellant, available on most planetary bodies and particularly on the comets of the Oort cloud, so that the spacecraft can be refueled while landing on a planetary body.


  Two concepts are of great importance for the envisioned deuterium fusion-driven starship: the concept of magnetic insulation, which permits the attainment of ultrahigh voltages in high vacuum, and the concept of inductive charging, by which a magnetically insulated conductor can be charged up to very high electric potentials — the spacecraft, acting as a capacitor, charged up to GeV potentials in the ultrahigh vacuum of space. To lift large payloads into Earth orbit remains the most difficult task, because magnetic insulation inside the Earth''s atmosphere fails; for that step a different technique is suggested, one the author had first proposed in a classified report dated January 1970, declassified in July 2007. For testing the deuterium microdetonation concept, an alternative is proposed: replacing the huge spaceship used as a large capacitor with a Super Marx generator, which can achieve on Earth what the spaceship can achieve in space, without radioactive fallout. An Appendix presents Conjectured Metastable Superexplosives Formed Under High Pressure for Thermonuclear Ignition. The Conclusion states that if large-scale manned spaceflight has any future, a high-specific-impulse, high-thrust propulsion system is needed, that the only known propulsion concept with this property is nuclear bomb propulsion, and that using deuterium as the nuclear rocket fuel would make manned space flight to the Oort cloud possible, at a distance at about one-tenth of one light year.

  '
