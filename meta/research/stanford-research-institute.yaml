- id: q36
  added_date: '2026-05-17'
  text: |
    H. E. Puthoff; Stanford Research Institute; Letter to K. Green/OSI, June '1:7, 1972-
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 7, footnote'
  context: 'Kenneth A. Kress, ''Parapsychology in Intelligence: A Personal Review and Conclusions,'' Studies in Intelligence Vol. 21 No. 4, Winter 1977 — bibliographic footnote at p. 8.'
  statement_date: '1972-06-17'
  significance: 'CIA primary-source attestation of K. Green at OSI as the earliest named CIA-side recipient of Puthoff''s June 17, 1972 letter from Stanford Research Institute — the personal-communication channel that delivered the SRI magnetometer demonstration record to the Agency. The same Kress paper at p. 10 (footnote, not separately quoted here) separately attests K. Green/LSD/OSI (Life Sciences Division of OSI) as author of a 9 November 1973 CIA Memorandum for the Record on "Verification of Remote Viewing Experiments at Stanford Research Institute"; Green''s OSI role as CIA-side program officer thus spans at least the program-inception window from June 1972 through November 1973. Source carries OCR artifact "''1:7," for "17," — preserved as-source per OCR-scan source-form-preservation discipline; see naming_quirks nq14.'

- id: q37
  added_date: '2026-05-17'
  text: |
    He later worked on the network information center for the ARPANET, a precursor to the modern Internet, as a staff engineer of Stanford Research Institute’s International Augmentation Research Center, under Douglas Engelbart.
  source:
    path: government/solfoundation-vallee-people-page-20260517.html
    location: '¶2'
  context: 'Sol Foundation ''People'' page for Jacques Vallée ([`/people/jacques-vallee`]) — thesolfoundation.org/people/jacques-vallee-3/, retrieved 2026-05-17. Page-attributed Sol role: Emeritus Advisor.'
  significance: 'Sol Foundation institutional attestation of Jacques Vallée as a staff engineer at SRI''s Augmentation Research Center (ARC) under Douglas Engelbart, working on the ARPANET network information center. Identifies Vallée''s SRI affiliation as the computer-science / ARPANET division (ARC under Engelbart), distinct from the contemporaneous SRI parapsychology investigation under Puthoff and Targ (q7–q10) — same parent institution, different division. Sol page does not attest specific years of Vallée''s ARC tenure. Source-form note: Sol writes "Stanford Research Institute’s International Augmentation Research Center" — the canonical name of the Engelbart division is "Augmentation Research Center" (ARC); "International" is Sol''s descriptive insertion (likely conflating with the post-1977 institutional rename "SRI International") and not part of the division''s historical name. Preserved verbatim per source-form-preservation discipline; see naming_quirks nq15.'

