  significance: 'Targ first-person attestation of Hella Hammid''s pre-SRI profession — a distinguished LIFE magazine photographer — establishing the occupational background of the SRI remote-viewing "control" subject whose ten-year SRI tenure is attested in q18. Complements q18 (the CIA-requested control-subject role) with the photographer descriptor that q18 does not carry.'

