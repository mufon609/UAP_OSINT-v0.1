timeline:

- id: tl1
  added_date: '2026-05-15'
  date: '1946'
  category: founding
  event: 'SRI [`/organizations/stanford-research-institute`] founded by Stanford University [`/organizations/stanford-university`] as the Stanford Research Institute. Stanford University trustees approve the proposal in principle; Articles of incorporation signed and filed with the state of California; nonprofit status granted; eleven SRI directors elected by Stanford trustees. Specific within-1946 date not attested.'
  source:
    path: news/sri-com-about-history-1940s-wayback-2004.html
    location: '1946 entry'

- id: tl1a
  added_date: '2026-05-15'
  date: '1968'
  category: innovation
  event: 'Douglas Engelbart [`/people/douglas-engelbart`] and his SRI team give the first demonstration ever of personal computing at the Fall Joint Computer Conference in San Francisco — the "Mother of All Demos".'
  source:
    path: news/sri-com-about-history-1960s-wayback-2004.html
    location: '1968 entry (Engelbart)'

- id: tl1b
  added_date: '2026-05-15'
  date: '1968'
  category: governance
  event: 'Charles A. Anderson [`/people/charles-a-anderson`] becomes SRI''s president.'
  source:
    path: news/sri-com-about-history-1960s-wayback-2004.html
    location: '1968 entry (Anderson)'

- id: tl1c
  added_date: '2026-05-15'
  date: '1969'
  category: innovation
  event: 'SRI receives the first login on the ARPANET [`/organizations/arpanet`] — the world''s first computer network with flexible routing, and the predecessor to today''s Internet.'
  source:
    path: news/sri-com-about-history-1960s-wayback-2004.html
    location: '1969 entry (ARPANET)'

