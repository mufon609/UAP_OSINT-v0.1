  category: governance
  event: 'SRI International files FY2024 Form 990 with the IRS. Independent audit accompanying the filing identifies a going concern flag — substantial doubt about the organization''s ability to meet its financial obligations and continue operating for the foreseeable future. FY2024 revenue $437,926,151; total assets $409,624,782; net assets $178,034,904.'
  source:
