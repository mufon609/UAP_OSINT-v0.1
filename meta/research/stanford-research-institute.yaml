- id: tl3
  added_date: '2026-05-15'
  date: '1972-04'
  category: program-inception
  event: 'Russell Targ [`/people/russell-targ`] meets with CIA [`/organizations/cia`] personnel from the Office of Scientific Intelligence (OSI), having "recently joined the Stanford Research Institute (SRI)". First documented CIA-SRI contact initiating the parapsychology investigation.'
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 8, ¶2'

- id: tl4
  added_date: '2026-05-15'
  date: '1972-08'
  category: contract
  event: 'OTS project officer contracts for $874 demonstration with Targ [`/people/russell-targ`] and Harold E. Puthoff [`/people/hal-puthoff`] at SRI. First formal CIA contract for the SRI parapsychology investigation.'
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 8, ¶4'

- id: tl4b
  added_date: '2026-05-15'
  date: '1972'
  category: program-inception
  event: 'Ingo Swann [`/people/ingo-swann`] joins the SRI parapsychology investigation per Targ IRVA 2002 talk abstract — "New York artist, and psychic, Ingo Swann taught us how to experience remote viewing in the laboratory". Specific date within 1972 not attested.'
  source:
    path: news/irva-targ-russell-wayback-20250123.html
    location: 'Presentations, IRVA 2002 talk abstract'

- id: tl5
  added_date: '2026-05-15'
  date: '1972-10-01'
  category: contract
  event: 'OTS Contract 8473 ($50,000 expanded effort with Targ [`/people/russell-targ`] and Puthoff [`/people/hal-puthoff`] at SRI) per Kress 1977 footnote 4.'
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 8, footnote 4'

- id: tl5b
  added_date: '2026-05-15'
  date: '1973'
  category: program-inception
  event: 'Pat Price [`/people/pat-price`] arrives at SRI in early-to-mid 1973 per Kress 1977 narrative ordering (specific arrival date not attested) as the third sensitive subject; "the remote viewing experiments... began in earnest". Per Targ IRVA 2002, Price was a "retired police commissioner".'
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 9, ¶1'

- id: tl6
  added_date: '2026-05-15'
  date: '1974-02'
  category: contract
  event: 'Jointly funded ORD and OTS program at SRI begins with Targ [`/people/russell-targ`] and Puthoff [`/people/hal-puthoff`] per Kress 1977. Expansion of the 1972 OTS-only funding line.'
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 8, ¶5'

- id: tl6b
  added_date: '2026-05-15'
  date: '1974'
  category: program-inception
  event: 'Hella Hammid [`/people/hella-hammid`] joins the SRI remote-viewing program as the CIA-requested "control" subject to supplement Pat Price and Ingo Swann per Targ IRVA 2009 talk abstract. Ten-year SRI tenure (1974–1984).'
  source:
    path: news/irva-targ-russell-wayback-20250123.html
    location: 'Presentations, IRVA 2009 (Hella Hammid Tribute) talk abstract'

- id: tl7
  added_date: '2026-05-15'
  date: '1974-10-18'
  category: publication
  event: 'Targ [`/people/russell-targ`] and Puthoff [`/people/hal-puthoff`] publish [`/documents/nature-1974-targ-puthoff-information-transmission`] "Information transmission under conditions of sensory shielding" in Nature 251, 602–607 (DOI 10.1038/251602a0). Affiliation: Electronics and Bioengineering Laboratory, Stanford Research Institute, Menlo Park, California, 94025.'
  source:
    path: news/nature-1974-targ-puthoff-information-transmission-abstract.html
    location: '¶1'

- id: tl8
  added_date: '2026-05-15'
  date: '1975-12-01'
  category: publication
  event: 'Puthoff [`/people/hal-puthoff`] and Targ [`/people/russell-targ`] publish [`/documents/sri-perceptual-augmentation-techniques-final-report-1975`] "Perceptual Augmentation Techniques: Part Two — Research Report" as the Stanford Research Institute Final Report, cited by AIR 1995.'
  source:
    path: government/air-mumford-evaluation-remote-viewing-stargate-19950929.pdf
    location: 'p. 3-30 (bibliography)'

- id: tl9
  added_date: '2026-05-15'
  date: '1976-11'
  category: institutional
  event: 'DCI George Bush [`/people/george-h-w-bush`] becomes aware of Soviet visits to Puthoff [`/people/hal-puthoff`] and Targ [`/people/russell-targ`] at SRI; requests and receives briefing on CIA''s [`/organizations/cia`] parapsychology investigations.'
  source:
    path: government/cia-kress-parapsychology-in-intelligence-studies-intelligence-1977-declassified-1996.pdf
    location: 'p. 15, ¶1'

- id: tl9a
  added_date: '2026-05-15'
  date: '1977'
  category: governance
  event: 'Stanford Research Institute officially becomes SRI International, with a new logo to reflect the change, per the 2004-era SRI history page. Specific within-1977 date not attested.'
  source:
    path: news/sri-com-about-history-1970s-wayback-2004.html
    location: '1977 entry (rename)'

- id: tl9b
  added_date: '2026-05-15'
  date: '1979'
  category: governance
  event: 'William F. Miller [`/people/william-f-miller`] becomes SRI''s president, succeeding Charles A. Anderson [`/people/charles-a-anderson`].'
  source:
    path: news/sri-com-about-history-1970s-wayback-2004.html
    location: '1979 entry (Miller presidency)'

- id: tl10
  added_date: '2026-05-15'
  date: '1987'
  category: acquisition
  event: 'SRI acquires Sarnoff Corp. [`/organizations/sarnoff-corp`] (formerly RCA Labs). Specific date within 1987 not attested.'
  source:
    path: news/sri-international-about-20260515.html
    location: '¶4'

- id: tl11
  added_date: '2026-05-15'
  date: '1990'
  category: program-termination
  event: 'SRI parapsychology investigation discontinued. FY 1991 Congressional direction for DIA [`/organizations/dia`] establishes successor research at SAIC [`/organizations/saic`] in Menlo Park, CA.'
  source:
    path: government/cia-rdp96-00789r002800180001-2-stargate-project-an-overview-19930430.pdf
    location: 'p. 10, ¶3'

- id: tl12
  added_date: '2026-05-15'
  date: '1995-09-29'
  category: external-evaluation
  event: 'American Institutes for Research [`/organizations/american-institutes-for-research`] publishes [`/documents/air-mumford-evaluation-remote-viewing-1995`] "An Evaluation of Remote Viewing: Research and Applications" — independent government-commissioned evaluation of the Stargate program. Section 3 covers the 1973-1988 SRI experimental record. The two-member evaluation panel: Jessica Utts [`/people/jessica-utts`] (Statistics, UC Davis) and Raymond Hyman [`/people/raymond-hyman`] (Psychology, University of Oregon).'
  source:
    path: government/air-mumford-evaluation-remote-viewing-stargate-19950929.pdf
    location: 'Cover page'

- id: tl12a
  added_date: '2026-05-15'
  date: '2000s'
  category: innovation
  event: 'Artificial intelligence: CALO — 2000s SRI innovation per the sri.com Timeline of Innovation page 6. CALO (Cognitive Assistant that Learns and Organizes) was the SRI-led DARPA program from which the Siri voice assistant spun out.'
  source:
    path: news/sri-international-timeline-of-innovation-page6-20260515.html
    location: '2000s entries section'

- id: tl12b
  added_date: '2026-05-15'
  date: '2000s'
  category: innovation
  event: 'Siri — 2000s SRI innovation per the sri.com Timeline of Innovation page 6. Siri (the voice-assistant technology subsequently acquired by Apple Inc. in 2010 per public record; Apple acquisition not attested in the archived corpus).'
  source:
    path: news/sri-international-timeline-of-innovation-page6-20260515.html
    location: '2000s entries section'

- id: tl12c
  added_date: '2026-05-15'
  date: '2010s'
  category: innovation
  event: 'NASA Parker Solar Probe — 2010s SRI innovation per the sri.com Timeline of Innovation page 7. SRI instrument contribution to the NASA [`/organizations/nasa`] solar-science mission.'
  source:
    path: news/sri-international-timeline-of-innovation-page7-20260515.html
    location: '2010s entries section'

- id: tl13
  added_date: '2026-05-15'
  date: '2023'
  category: acquisition
  event: 'SRI receives the Palo Alto Research Center [`/organizations/parc`] (PARC) as a donation. Specific date within 2023 not attested.'
  source:
    path: news/sri-international-timeline-of-innovation-20260515.html
    location: '¶2'

- id: tl14
  added_date: '2026-05-15'
  date: '2020s'
  category: innovation
  event: 'NASA Europa Clipper — 2020s SRI innovation per the sri.com Timeline of Innovation page 7. SRI instrument contribution to the NASA [`/organizations/nasa`] Jupiter-moon mission.'
  source:
    path: news/sri-international-timeline-of-innovation-page7-20260515.html
    location: '2020s entries section'

- id: tl15
  added_date: '2026-05-15'
