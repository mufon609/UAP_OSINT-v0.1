- id: q7
  added_date: '2026-06-06'
  text: >-
    Of the applications of high-frequency gravitational waves (HFGWs), communication appears to be the most important and most immediate. Gravitational waves have a very low cross section for absorption by normal matter, so high-frequency waves could, in principle, carry significant information content with effectively no absorption unlike electromagnetic (EM) waves.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 1.1 Introduction'
  significance: Thesis statement — HFGW communication as the most important, most immediate HFGW application, framed on the low-absorption advantage over EM waves.
  statement_date: '2010-04-06'
- id: q8
  added_date: '2026-06-06'
  text: >-
    HFGWs pass through all ordinary material things without attenuation and represent the ultimate wireless system. One could communicate directly through the Earth from Moscow in Russia to Caracas in Venezuela—without the need for fiber optic cables, microwave relays, or satellite transponders.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 1.1 Introduction'
  significance: Core capability claim — through-the-Earth, unattenuated point-to-point communication bypassing all conventional infrastructure ("the ultimate wireless system").
  statement_date: '2010-04-06'
- id: q9
  added_date: '2026-06-06'
  text: >-
    Multi-channel HFGW communications can be both point-to-point (for example, to deeply submerged submarines) and point-to-multipoint, like cell phones.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 1.1 Introduction'
  significance: Defense-relevant use case — communication to deeply submerged submarines, a long-standing hard problem for EM/RF; anchors the report's military-applications framing.
  statement_date: '2010-04-06'
- id: q10
  added_date: '2026-06-06'
  text: >-
    High-frequency gravitational waves, as defined by physicists Douglass and Braginsky (1979), are gravitational waves having frequencies higher than 100 kHz.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 1.2 Definition of High-Frequency Gravitational Waves'
  significance: Operative definition of HFGW — frequencies above 100 kHz, the term on which the entire report turns.
  statement_date: '2010-04-06'
- id: q11
  added_date: '2026-06-06'
  text: >-
    Low-frequency gravitational waves (LFGWs), such as those detectable by interferometric GW detectors (for example, the Laser Interferometer Gravitational Observatory, or LIGO) are not applicable to communications due to their very long wavelengths, often thousands of kilometers in length and, even more importantly, the inability to generate them effectively in the laboratory. Furthermore LFGW detectors cannot detect HFGWs (Shawhan, P. S., 2004).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 1.2 Definition of High-Frequency Gravitational Waves'
  significance: Demarcates HFGW from the LIGO/LFGW regime — why conventional gravitational-wave science is inapplicable, motivating the laboratory HFGW program.
  statement_date: '2010-04-06'
- id: q12
  added_date: '2026-06-06'
  text: >-
    Fourteen laboratory high-frequency gravitational wave (HFGW) generators (or transmitters) have been proposed in the past 45 years in peer-reviewed journal articles.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Quantitative state-of-field claim — fourteen proposed HFGW generators over 45 years, establishing the literature base the report surveys.
  statement_date: '2010-04-06'
- id: q13
  added_date: '2026-06-06'
  text: >-
    The Piezoelectric Approach to HFGW generation is best for the proof-of-concept test and the proposed IR-excited Molecules Approach is best for an operational communications HFGW transmitter.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Headline generation finding — piezoelectric (FBAR) for proof-of-concept, IR-excited molecules for an operational transmitter; the report's transmitter recommendation.
  statement_date: '2010-04-06'
- id: q14
  added_date: '2026-06-06'
  text: >-
    Ten different HFGW detectors (or receivers) have been proposed since 1978 and reported in peer-reviewed journal articles.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Quantitative state-of-field claim for detectors — ten proposed HFGW receivers since 1978.
  statement_date: '2010-04-06'
- id: q15
  added_date: '2026-06-06'
  text: >-
    Several different HFGW receivers can be utilized for communication, but the proposed Li-Baker detector (plans & specification development in Appendix B) shows the most promise (underlying concept in Appendix C).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Headline detection finding — the Li-Baker detector as the most promising HFGW receiver; the report's central detector recommendation (its design occupies Appendix B).
  statement_date: '2010-04-06'
- id: q16
  added_date: '2026-06-06'
  text: >-
    Because HFGW communications are carried on an extremely narrow beam directly through the Earth, there is a very low probability of interception.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Defense-relevant property — low probability of interception (LPI) from narrow through-Earth beaming, a key military communications advantage.
  statement_date: '2010-04-06'
- id: q17
  added_date: '2026-06-06'
  text: >-
    Theoretical results confirm that the Li-Baker detector is photon-signal limited, not quantum-noise limited—that is, the Standard Quantum Limit is so low that a properly designed Li-Baker detector can have sufficient sensitivity to observe HFGWs of amplitude A ≈ 10⁻³² m/m.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Central quantitative sensitivity claim — Li-Baker detector is photon-signal (not quantum-noise) limited, sensitive to strain A ≈ 10⁻³² m/m.
  statement_date: '2010-04-06'
- id: q18
  added_date: '2026-06-06'
  text: >-
    Utilizing the IR-excited Molecules HFGW generator approach and the Li-Baker detector, the theoretical information-transfer rate over 7,000 km of distance, beamed directly through the Earth, is about 1.9 × 10⁶ bits per second.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Headline performance figure — ~1.9 × 10⁶ bps over 7,000 km through the Earth, the quantitative endpoint of the whole transmitter-plus-detector analysis.
  statement_date: '2010-04-06'
- id: q19
  added_date: '2026-06-06'
  text: >-
    HFGW sources on the Earth, the Moon, and Mars may act as reference standards for interplanetary navigation, with the advantage that they cannot be shielded or shadowed by planetary masses.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Summary'
  significance: Interplanetary-navigation application — HFGW beacons on Earth/Moon/Mars as unshieldable reference standards; the report's space-navigation thesis.
  statement_date: '2010-04-06'
- id: q20
  added_date: '2026-06-06'
  text: >-
    Electromagnetic forces are more than 10³⁵ larger than gravitational forces and should be employed in laboratory GW generation.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1.1 HFGW Generator Concepts'
  significance: Foundational generation principle — using EM (not gravitational) forces, 10³⁵ stronger, to drive the mass "jerk" producing HFGWs in the lab.
  statement_date: '2010-04-06'
- id: q21
  added_date: '2026-06-06'
  text: >-
    The first generation means is the same for gravitational waves (GWs) of all frequencies and is based upon the quadrupole equation first derived by Einstein in 1918.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1.1 HFGW Generator Concepts'
  significance: Theoretical basis — HFGW generation rests on Einstein's 1918 quadrupole equation (recast by Baker (2006) in terms of mass "jerk").
  statement_date: '2010-04-06'
- id: q22
  added_date: '2026-06-06'
  text: >-
    In August of 1974 Chapline, Nuckolls and Woods suggested the generation of HFGWs by nuclear explosions.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1.1 HFGW Generator Concepts'
  significance: Notable historical generation concept — HFGW production by nuclear explosions, one of the high-energy generation approaches surveyed.
  statement_date: '2010-04-06'
- id: q23
  added_date: '2026-06-06'
  text: >-
    The Li-Baker HFGW detector was invented by R. M L Baker, Jr. of Transportation Sciences Corporation, California and patented in P. R. China (Baker, 2001). Based upon the theory of Li, Tang and Zhao (1992) termed the Li-effect, the detector was proposed by Baker during the period 1999-2000, a patent for it was filed in 2001, subsequently granted (Baker, 2001), and preliminary details were published later by Baker, Stephenson and Li (2008a).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.1 Alternative Approaches'
  significance: Provenance of the Li-Baker detector — invented by R. M L Baker, Jr. (Transportation Sciences Corporation), patented in P.R. China, built on the Li-effect (Li, Tang and Zhao 1992); links the document's extrinsic author to its central technology.
  statement_date: '2010-04-06'
- id: q24
  added_date: '2026-06-06'
  text: >-
    With the Li-Effect, a gravitational wave transfers energy to a separately generated electromagnetic (EM) wave in the presence of a static magnetic field. That EM wave has the same frequency as the GW and moves in the same direction. This is the "synchro-resonance condition," in which the EM and GW waves are synchronized (move in the same direction and have the same frequency) and is unlike the Gertsenshtein-Effect.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.2 Concept (Li-Effect)'
  significance: Core physics of detection — the Li-effect / synchro-resonance condition by which a GW transfers energy to a co-propagating EM wave in a static magnetic field, the principle the Li-Baker detector exploits.
  statement_date: '2010-04-06'
- id: q25
  added_date: '2026-06-06'
  text: >-
    The detector, shown in Figure 14, has five major components:
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.4 Li-Baker HFGW Detector'
  significance: Opens the Li-Baker detector hardware description — the five-component architecture (Gaussian beam, static B-field, fractal-membrane reflectors, shielded microwave receivers, sub-48 mK cooling).
  statement_date: '2010-04-06'
- id: q26
  added_date: '2026-06-06'
  text: >-
    Interior noise from thermal photon generation is eliminated by cooling the Li-Baker detection apparatus to below ~ 48 mK (0.048 Kelvin).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.4 Li-Baker HFGW Detector'
  significance: Key engineering parameter — cryogenic cooling below ~48 mK to suppress thermal-photon noise, one of the detector's defining operating requirements.
  statement_date: '2010-04-06'
- id: q28
  added_date: '2026-06-06'
  text: >-
    Using C.E. Shannon's classical equation (1948), the maximum rate of information transfer, C, is given by:
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 3.2 Bandwidth'
  significance: Basis for the headline ~1.9 × 10⁶ bps rate — the Shannon-capacity calculation (C = Blog₂(1+S/N)) underlying the report's quantitative communications claim.
  statement_date: '2010-04-06'
- id: q29
  added_date: '2026-06-06'
  text: >-
    Thus, the HFGW FTS system could be used as a navigational aid, akin to the GPS system.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 3.3 Frequency and Time Standard'
  significance: Frequency-Time-Standard application — an HFGW FTS as a GPS-like navigational aid, the report's near-term low-bandwidth use case.
  statement_date: '2010-04-06'
- id: q30
  added_date: '2026-06-06'
  text: >-
    At this precision one could measure the time delay caused by changing once centimeter in height in the Earth's gravitational field.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 3.4 Possible Future Upgrades to the FTS Devices'
  significance: Optical-lattice-clock precision claim (1 part in 10¹⁸); preserves the in-document typo "once centimeter" (for "one centimeter") verbatim per no-correction discipline.
  statement_date: '2010-04-06'
- id: q31
  added_date: '2026-06-06'
  text: >-
    In the receiver all these same noise sources are duplicated in reverse, as shown on the right had side of Figure 16.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 3.1.1 Signal-to-Noise Ratio'
  significance: Link-budget / SNR discussion; quoted to preserve the in-document typo "right had side" (for "right hand side") verbatim per no-correction discipline.
  statement_date: '2010-04-06'
- id: q32
  added_date: '2026-06-06'
  text: >-
    The most stunning advances in HFGW applications will probably not be in communications, but in the remotely HFGW-generated nuclear fusion, HFGW propulsion and HFGW surveillance.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.4 Other Possible HFGW Applications'
  significance: Most UAP/weapons-relevant passage — the document's own forecast that the most stunning HFGW applications are remote-generated nuclear fusion, propulsion, and surveillance, not communications.
  statement_date: '2010-04-06'
- id: q33
  added_date: '2026-06-06'
  text: >-
    If an ultra-high-intensity HFGW flux impinges on a nucleus, it is possible that it could initiate nuclear fusion at a remote location, or mass disruption.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.4 Other Possible HFGW Applications'
  significance: Remote-effects weapons concept — HFGW-initiated remote nuclear fusion or "mass disruption," a directed-energy-style application of interest to AAWSAP.
  statement_date: '2010-04-06'
- id: q34
  added_date: '2026-06-06'
  text: >-
    HFGWs could theoretically be used for propulsion and control of the motion of objects such as missiles, missile warheads, spacecraft, and asteroids, and remote control of clouds of hazardous vapors.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.4 Other Possible HFGW Applications'
  significance: HFGW-propulsion / object-motion-control concept — propulsion and steering of missiles, spacecraft, and asteroids; a direct advanced-aerospace-weapons application thread.
  statement_date: '2010-04-06'
- id: q35
  added_date: '2026-06-06'
  text: >-
    Gravitational field changes by one or more HFGW generators could urge a spacecraft in a given direction, causing a lower static gravitational field in front of a vehicle (it "falls" forward) and a higher one behind (providing a "push").
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.4 Other Possible HFGW Applications'
  significance: Field-propulsion mechanism — engineering a static-g-field gradient so a vehicle "falls forward," the report's gravitational-propulsion concept (cf. the antigravity/warp DIRDs).
  statement_date: '2010-04-06'
- id: q36
  added_date: '2026-06-06'
  text: >-
    "Since it has definite energy, the gravitational wave is itself is the source of some additional gravitational field (static g-field).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.4 Other Possible HFGW Applications'
  significance: Quoted Landau & Lifshitz (1975) basis for HFGW propulsion; preserves the in-document typo "is itself is the source" verbatim per no-correction discipline.
  statement_date: '2010-04-06'
- id: q37
  added_date: '2026-06-06'
  text: >-
    A novel means of imaging or HFGW surveillance might be developed in future to establish a system to allow for observing activities and materials in three dimensions, within and below structures and within the Earth and its oceans.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.4 Other Possible HFGW Applications'
  significance: HFGW-surveillance concept — through-structure, through-Earth, through-ocean 3-D imaging; an intelligence/ISR application of interest to the AAWSAP program.
  statement_date: '2010-04-06'
- id: q38
  added_date: '2026-06-06'
  text: >-
    The vast distances involved will require some form of communication that entails faster-than-light (FTL) propagation. While this is a highly speculative area, such schemes have been proposed for FTL HFGW. Both Fontana and Meholic (unpublished reports) have proposed models of the universe, such as the trispace model, in which subluminal or luminal gravitational waves may couple into a super-luminal "parallel universe" inside which FTL speeds are possible.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.5 2050 and Beyond'
  significance: Most speculative forward-look — FTL HFGW communication via a "trispace"/parallel-universe coupling model (Fontana, Meholic); the report's far-future endpoint, characteristic of the AAWSAP DIRD theoretical reach.
  statement_date: '2010-04-06'
- id: q39
  added_date: '2026-06-06'
  text: >-
    The research published in technical papers authored by Gary Stephenson, chief investigator for Seculine Consulting, (Stephenson, 2009a, Harper Stephenson (2007) and Stephenson (2009b)) were crucial in the preparation of this study and is gratefully acknowledged.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 5.0 Acknowledgements'
  significance: Names Gary Stephenson (Seculine Consulting) as a key contributor whose papers underpin the study — an in-document collaborator attribution.
  statement_date: '2010-04-06'
- id: q40
  added_date: '2026-06-06'
  text: >-
    The partnership consists of Louisiana State University (LSU) and Transportation Sciences Corporation (TSC) in California.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Appendix B: Li-Baker HFGW Detector'
  significance: Identifies the academia/industry partnership (LSU + Transportation Sciences Corporation) proposed to build the Li-Baker detector under continued funding.
  statement_date: '2010-04-06'
- id: q41
  added_date: '2026-06-06'
  text: >-
    Use will primarily be made of "off-the-shelf" components, and components described in the open scientific literature and in the various patents issued to Project Scientist Robert M L Baker, Jr. (Baker, 1999, 2000, 2001, and Patents Pending) who is the inventor of the Li-Baker HFGW Detector (Baker, 2001).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Appendix B: Li-Baker HFGW Detector'
  significance: In-document naming of "Project Scientist Robert M L Baker, Jr." as inventor of the Li-Baker detector — the closest the document body comes to attesting the (FOIA-redacted) authorship; corroborates the extrinsic Dr. Robert Baker / GravWave attribution.
  statement_date: '2010-04-06'
- id: q42
  added_date: '2026-06-07'
  text: >-
    This last effect enters as the square of the number of elements, N , as proved using General Relativity analyses by Dehnen and Romero-Borja's analyses (Romero and Dehnen, 1981; Dehnen and Romero, 2003). Such N² dependence also may be the key to successful laboratory generation of GWs, especially HFGWs.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1 HFGW Generators'
  significance: States the N²-scaling generation law — GW power grows as the square of the number of in-phase radiating elements — attributed to the Dehnen & Romero-Borja General Relativity analyses, the core mechanism motivating the large-N molecular generator.
  statement_date: '2010-04-06'
- id: q43
  added_date: '2026-06-07'
  text: >-
    Next consider a number N of such orbit planes stacked one on top of another with the gravitational-wave (GW) radiation growing flux (Wm⁻²) proportional to N² as the GW moves up the axis of the N orbit planes as in Figure 5.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1 HFGW Generators'
  significance: The geometric statement of the N²-flux scaling — stacked orbit planes give a GW flux proportional to N² up the stack axis — the design principle behind the stacked-waveguide-ring generator.
  statement_date: '2010-04-06'
- id: q44
  added_date: '2026-06-07'
  text: >-
    For an operational 50,000Å infrared (IR), 12.5 meter long, 10-meter radius (10⁴ concentric rings per plate so Pᵢ = 1.29×10² Wm⁻² and 10⁷ plates) cylindrical HFGW generator (Woods and Baker, 2009), the flux at a one-meter distance from the generator is, according to Table 1 of Black and Baker (2009) for N = 10⁷, (1.146×10¹²) × (1.29×10²) = 1.48×10¹⁴ Wm⁻² (very large, but with a very narrow 2.3×10⁻⁴ radian half-power-point needle beam).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1 HFGW Generators (operational IR generator)'
  significance: The operational IR-molecule transmitter specification — 50,000Å IR, 12.5 m × 10 m cylinder, 10⁷ plates — yielding a 1.48×10¹⁴ Wm⁻² source flux confined to a 2.3×10⁻⁴ radian needle beam, the LPI beam-width and link-budget numerator.
  statement_date: '2010-04-06'
- id: q45
  added_date: '2026-06-07'
  text: >-
    received signal, S, is (1.48×10¹⁴)/(7×10⁶)² = 3 Wm⁻², more than adequate for an effective communication system.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1 HFGW Generators (link budget)'
  significance: The 1/R² link budget — the 1.48×10¹⁴ Wm⁻² source flux falls to S ≈ 3 Wm⁻² received at 7,000 km — the figure feeding the report's bandwidth/Shannon-rate claim.
  statement_date: '2010-04-06'
- id: q46
  added_date: '2026-06-07'
  text: >-
    From Equation (2) the amplitude A of the HFGW at 7,000 km with the HFGW frequency (twice the IR frequency of v_GW = 1.2×10¹⁴ s⁻¹) given by: A = 1.28×10⁻¹⁸ (S/v_GW )½ = 1.8×10⁻³² (in dimensionless units or m/m), which would be detectable by the currently designed Li-Baker HFGW detector.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.1 HFGW Generators (carrier frequency)'
  significance: Fixes the generation carrier at twice the IR frequency, v_GW = 1.2×10¹⁴ s⁻¹ — orders of magnitude above the Li-Baker detector's ~10 GHz design band — and the resulting received amplitude A = 1.8×10⁻³² m/m the detector must resolve.
  statement_date: '2010-04-06'
- id: q48
  added_date: '2026-06-07'
  text: >-
    h_det = 1.8×10^-37 m/m represents the lowest possible GW amplitude detectable by each RF receiver in the Li-Baker HFGW detector, limited by quantum back-action.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.3 Quantum Back-Action Limit'
  significance: The quantitative SQL detection floor — h_det = 1.8×10⁻³⁷ m/m — sitting roughly five orders of magnitude below the A ≈ 10⁻³² m/m signal, the margin establishing the detector is not quantum-noise limited.
  statement_date: '2010-04-06'
- id: q49
  added_date: '2026-06-07'
  text: >-
    The resultant efficiency of detection of HFGWs is very much greater than from the inverse Gertsenshtein effect, which has been exploited in some previously proposed HFGW detectors and found to have insufficient sensitivity to HFGWs (Eardley, et al., 2008).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.2 The Li-Effect'
  significance: The skeptical-review item — the report concedes that the inverse Gertsenshtein effect used in prior HFGW detectors was found to have insufficient sensitivity per the JASON/ODNI assessment (Eardley et al., 2008), the finding motivating the Li-Baker design.
  statement_date: '2010-04-06'
- id: q50
  added_date: '2026-06-07'
  text: >-
    In the past few years, HFGW detectors have been fabricated at Birmingham University, England, INFN Genoa, Italy and in Japan. These types of detectors may be promising for the detection of the HFGWs in the GHz band (MHz band for the Japanese) in the future, but currently, their sensitivities are orders of magnitude less than what is required for the detection of high-frequency relic gravitational waves (HFRGWs) from the big bang.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 2.2.1 Alternative Approaches'
  significance: Names the real fabricated HFGW detectors — Birmingham University, INFN Genoa, and the Japanese instrument — while conceding their sensitivities fall orders of magnitude short of what HFGW detection requires, the state-of-the-art shortfall the Li-Baker detector is proposed to close.
  statement_date: '2010-04-06'
- id: q51
  added_date: '2026-06-07'
  text: >-
    To this end we will investigate the feasibility of co-developing with a third-party (for example, National High Magnetic Field Laboratory, Tallahassee, Florida) a custom-made high-field design capable of up to 35T (Bird, 2004), which may be realizable during the construction phase of the Li-Baker detector. If successful, achieving this value of magnetic field would improve the sensitivity of the Li-Baker detector by an order of magnitude.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Appendix B: Li-Baker HFGW Detector (DD1.7.2 Emerging technology)'
  significance: The emerging-technology magnet lever — a custom 35 T high-field magnet (vs. the ~3 T nominal baseline) would improve detector sensitivity by an order of magnitude, the headroom the program banks on for an operational receiver.
  statement_date: '2010-04-06'
- id: q52
  added_date: '2026-06-07'
  text: >-
    A timing standard alone, provided by HFGW stations around the globe, could result in a multi-billion dollar savings in conventional telecom systems over ten years, according to the recent analysis of Harper and Stephenson (2007).
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 1.1 Introduction'
  significance: The report's stated economic justification — an HFGW frequency-time standard could yield multi-billion-dollar telecom savings over ten years (Harper and Stephenson, 2007) — the cost case for funding an HFGW communications program.
  statement_date: '2010-04-06'
- id: q53
  added_date: '2026-06-07'
  text: >-
    A suggested developmental roadmap schedule and phasing timeline is included as Figure 24. Theoretical research is always an ongoing enterprise, but it is especially important to encourage work in the development of experimental approaches aimed at demonstrating laboratory generation and sensing of gravitational waves for the next few years. This is the kind of academic work that is best done in a research university setting, at least for the next ten years or so, until laboratory experiments can verify laboratory generation. Without early confirmation the technology will not gain widespread acceptance and move forward.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.1 Developmental Roadmap'
  significance: Developmental roadmap — a suggested HFGW-communications development schedule and phasing timeline (Figure 24); near-term experimental work is held to be best done in a research university setting for at least the next ten years, until laboratory generation can be verified.
  statement_date: '2010-04-06'
- id: q54
  added_date: '2026-06-07'
  text: >-
    The most benefit would come from a coordinated effort spread over a number of different universities. Wherever possible, pre-existing assets should be utilized to stretch funding as far as possible. For example, if synchrotron light is needed to verify the Gertsenshtein effect and the Li-effect, a survey of existing national synchrotron light facilities should be part of the funded effort to find an appropriate host facility. The funding activity—that is, the National Science Foundation—would have the overall responsibility to coordinate this activity in an ongoing manner, through proposal review, contract awards, and progress reviews, and the approach should be flexible enough to allow the redirection of funding should a particularly promising new technology or invention move to the forefront.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.1 Developmental Roadmap'
  significance: Funding-coordination model — a multi-university coordinated effort leveraging pre-existing assets, with the National Science Foundation named as the funding activity responsible for coordinating proposal review, contract awards, and progress reviews; the document's proposed funding structure.
  statement_date: '2010-04-06'
- id: q55
  added_date: '2026-06-07'
  text: >-
    Assuming that positive laboratory results can be achieved and peer reviewed in a 10 to 12 year timeframe, the next step would call for a period of prototype development, in which the device physics and engineering needed to support the technology could be matured. As prototypes show promise they could be transitioned to device development, the first time that industry would likely enter the field. Once the individual devices required to support GW communication technology—for example, GW generators and GW sensors—are in place, at that point it will be possible to begin full-scale development of systems applications. This is a conservative timeline, based on scaling from the development of previous technologies. If breakthroughs materialize, or if the pace of technological development quickens, progress may certainly occur more quickly than this.
  source:
    path: government/dird-21-hfgw-communications-20100406.pdf
    location: 'Section 4.1 Developmental Roadmap'
  significance: Development timeline — assuming peer-reviewed positive laboratory results within a 10-to-12-year timeframe, the program phases into prototype development, then device development (industry's entry point), then full-scale systems-applications development; characterized in-document as a conservative timeline.
  statement_date: '2010-04-06'
