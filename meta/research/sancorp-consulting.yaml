description: 'Sancorp Consulting, LLC is a Falls Church, Virginia federal contractor that provides intelligence, counterintelligence, insider threat, and operations support services to the Office of the Under Secretary of Defense for Intelligence and Security ([`/organizations/ousd-is`]). Sancorp''s public-facing Past Performance page (2026 capture) lists the customer of HQ003425FE388 as "Office of the Under Secretary of War for Intelligence and Security" — Executive Order 14347 of September 5, 2025 authorizes the Department of Defense and the Office of the Secretary of Defense to be referred to as the Department of War and the Office of the Secretary of War in non-statutory contexts (Sec. 2(b)), authorizes the Secretary of Defense to use the additional secondary title Secretary of War (Sec. 2(a)), and provides that statutory references to the Department of Defense shall remain controlling until changed subsequently by the law (Sec. 2(e)). Sancorp was founded July 28, 2016. Its Unique Entity Identifier is GRYKNJ8BGFC8 and its CAGE Code is 7NZQ9. Per HigherGov registry data the company''s SBA 8(a) Certification was Graduated August 26, 2017 to March 11, 2026; it also has Service Disabled Veteran Owned Small Business and Veteran Owned Business certifications. GovCon in a Box lists Sancorp''s federal awards (under awarding agencies including the Department of Defense ([`/organizations/dod`]), the General Services Administration ([`/organizations/gsa`]), the Department of the Army ([`/organizations/department-of-the-army`]), the Department of Justice ([`/organizations/department-of-justice`]), the Department of the Navy ([`/organizations/department-of-the-navy`]), and the Missile Defense Agency ([`/organizations/mda`]), with the Office of the Secretary of Defense ([`/organizations/osd`]) as the parent organization for the contracts issued via Washington Headquarters Services) at $61.47M across 185 awards (First Award April 21, 2022; Last Award December 2, 2025).


  Sancorp''s contract record with OUSD(I&S), awarded by Washington Headquarters Services, includes HQ003418C0123 ("CI Metrics Study Support", September 27, 2018) and HQ003419C0159 ("Strengthening Insider Threat Support Services", September 20, 2019). In 2022 Sancorp was awarded two contracts that placed the same vendor inside two related OUSD(I&S) offices: HQ003422C0064 ("IPMO Support Services", June 9, 2022) supports the Influence and Perception Management Office (established March 1, 2022 by direction from the Secretary of Defense and the Under Secretary of Defense for Intelligence and Security, per a memorandum signed by James A. Holly ([`/people/james-holly`]), Acting Director — see [`/documents/ipmo-notre-dame-memo-2022`]), and HQ003422C0094 ("AARO Support Services", September 1, 2022) supports the All-domain Anomaly Resolution Office. The AARO contract''s Performance Work Statement ([`/documents/blackvault-sancorp-23-f-1114-aaro-pws`]), released via FOIA case 23-F-1114 (125 pages responsive, 11 pages withheld in their entirety per (b)(5), portions of the remaining 114 pages exempt from release per (b)(4) and (b)(6)), defines deliverables across Executive Administrative Support, Strategy, Plans, and Policy Support, Congressional Affairs, Public Affairs, and FOIA Support, Data Architecture Support, Planning, Programming, Budgeting and Executive Support, Reporting Support, and Operations Support. The contract was issued by WHS Acquisition Directorate ([`/organizations/whs-acquisition-directorate`]) on solicitation HQ003422R0192; signed by Contracting Officer Jacqueline Verrine ([`/people/jacqueline-verrine`]) (Team Lead, Technical Analysis Branch, Enterprise Office Secretary of Defense ([`/organizations/whs-eosd`]), WHS Acquisition Directorate) on September 1, 2022. Section 7 information contact: Contract Specialist Rainie Wells ([`/people/rainie-wells`]). The contract was awarded under DFARS 252.219-7009 SECTION 8(A) DIRECT AWARD with the Small Business Administration Richmond District Office ([`/organizations/sba-richmond-district-office`]) as the cognizant SBA office; Defense Contract Audit Agency ([`/organizations/dcaa`]) DODAAC HAA47 audits the LH and T&M CLINs. The IPMO contract is described in Sancorp''s own Company News as "professional, administrative, and operational support services to the Influence and Perception Management Office (IPMO)" at OUSD(I&S).


  Sancorp joined the Intelligence and National Security Alliance (INSA) Insider Threat Subcommittee in March 2021 and contributed to INSA''s October 2021 white paper "The Need for Transparency on Insider Threats: Improving Information Sharing Between Government and Industry" — published the same month. INSA''s September 2022 Insider Threat Program Naming Convention paper ([`/documents/insa-naming-convention-2022`]) states that "Counter-insider threat was developed by the Office of the Undersecretary of Defense for Intelligence and Security (OUSDI&S)." Subsequent Sancorp prime contracts include HQ003423C0061 and HQ003424C0046 ("Specialized and Sensitive Administrative, Policy, Operations, and Analytic Support Services" — IPMO continuation), HQ003424C0096 ("Exec. Admin, Ops, Policy & PPBE Sppt Svc" — AARO follow-on), HQ003424F0411 ("LABOR" — $11.2M task order supporting Office of the Assistant Secretary of Defense for Homeland Defense and Hemispheric Affairs and Office of the Deputy Assistant Secretary of Defense for Nuclear and Countering Weapons of Mass Destruction), HQ003425FE388 (Counterintelligence, Law Enforcement and Security Policy, Operations, Analytic and Business Operations support), HQ003425FE405 (Office of the Under Secretary of Defense for Policy office management and executive support — Sancorp Past Performance separately lists this customer as Office of the Under Secretary of War for Policy), and W519TC23F0545 (Chief Digital and Artificial Intelligence Office Algorithmic Warfare and Public Affairs). After GAO ([`/organizations/gao`]) denied Sancorp''s protest of two OUSD(I&S) call orders awarded to Premier Enterprise Solutions (Executive Directorate, EXDIR ([`/organizations/ousd-is-exdir`])) and Arlo Solutions ([`/organizations/arlo-solutions`]) (Sensitive Activities and Special Programs, SASP ([`/organizations/ousd-is-sasp`])) in B-422985.4, B-422985.5 (June 11, 2025) — Solicitation HQ003424R0178 issued call orders for SASP and EXDIR support services; Sancorp''s IPMO ([`/organizations/ipmo`]) prime contracts (HQ003422C0064, HQ003423C0061, HQ003424C0046) and AARO ([`/organizations/aaro`]) prime contracts (HQ003422C0094, HQ003424C0096) are independent of HQ003424R0178 and continued under Sancorp — Sancorp also won W912CL25CA005 (USSOUTHCOM Support to Special Technical Operations including Special Access Programs, Alternative and Compensatory Control Measures, Military Deception (MILDEC), and Intelligence Planning, June 30, 2025) and HQ085926FG471 (Missile Defense Agency Scalable Homeland Innovative Enterprise Layered Defense Initial Order, December 19, 2025). The August 2025 GSA OASIS+ 8(a) Contract award is described by Sancorp as covering "integrated solutions in Program Management, Engineering Services, Research & Development, and Intelligence Support to help federal agencies achieve mission success."


  Both Sancorp PWSs are publicly available via DoD FOIA channels — the IPMO contract HQ003422C0064 PWS ([`/documents/foia-23-f-0906-sancorp-ipmo-pws`], dated April 25, 2022; FOIA case 23-F-0906) and the AARO contract HQ003422C0094 PWS ([`/documents/blackvault-sancorp-23-f-1114-aaro-pws`], dated July 7, 2022; FOIA case 23-F-1114, released to John Greenewald via The Black Vault) — both were issued by Washington Headquarters Services Acquisition Directorate as 8(a) sole-source procurements with Sancorp as the awardee. The PWSs share overlapping task scope including Executive Administrative Support, Strategy/Plans/Policy Support, and Operations Support; the IPMO PWS §5.4 tasks the contractor to "assist IPMO leadership in the development and promulgation of strategy, plans, and policy for DoD influence, deception, and perception management related operations, activities, and investments."


  Sancorp''s public-facing Past Performance page (sancorpconsulting.com) lists 19 prime contracts including the IPMO solicitation HQ003422R0164 ("Specialized and Sensitive Administrative, Security, Policy, Operations, and Analytic Support Services"), the OUSD(I&S) Counter-Insider Threat Program Office contract HQ003419C0159, the OUSD(I&S) Counterintelligence Analytical Support contract HQ003420C0167, and follow-on prime contracts HQ003425FE388 (Office of the Under Secretary of War for Intelligence and Security) and HQ003425FE405 (Office of the Under Secretary of War for Policy). Absent from the public-facing Past Performance list are the Sancorp AARO Support Services prime contracts HQ003422C0094 (signed September 1, 2022) and HQ003424C0096 (signed August 23, 2024), both established via FOIA 23-F-1114 and USAspending.gov contract records cited in primary sources.


  On April 19, 2023, AARO ([`/organizations/aaro`]) director Dr. Sean Kirkpatrick ([`/people/sean-kirkpatrick`]) told the Subcommittee on Emerging Threats and Capabilities that AARO would need additional authorization from Congress to begin counterintelligence work. Sancorp''s AARO Support Services contract HQ003422C0094 had started in 2022, prior to that hearing; Sancorp''s prior OUSD(I&S) prime contracts include CI Metrics Study Support (HQ003418C0123, September 27, 2018), Strengthening Insider Threat Support Services (HQ003419C0159, September 20, 2019), and Counterintelligence Analytic Studies Support Services (HQ003420C0167, September 25, 2020). Per the MuckRock fee waiver request from Robert Skvarla, Jr. (FOIA case 23-F-0905, filed May 19, 2023), Sancorp''s contract with AARO "would help clarify this apparent contradiction."

  '
