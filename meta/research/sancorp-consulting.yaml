  added_date: '2026-09-26'
  text: 'In its response, Sancorp confirms that X “resigned from Sancorp in February 2025” and provided a copy of X’s letter of resignation, dated February 7, 2025--before the agency issued the SASP call order at issue.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: '¶ In its response, Sancorp confirms that X “resigned from Sancorp in February 2025”'
  significance: 'GAO decision: Sancorp confirmed X resigned from Sancorp in February 2025 and produced X''s resignation letter dated February 7, 2025, which predates issuance of the SASP call order.'
  claim_group: gao-b-422985-sasp-key-personnel
  statement_date: '2025-06-11'
- id: q157
  added_date: '2026-09-26'
  text: 'In this connection, the protester asserts that X had “left Sancorp amicably.”'
