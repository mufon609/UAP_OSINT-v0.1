    source_path: news/sancorp-careers-20260430.html
    resolution: preserve-as-sic-in-quotes
    note: 'Sancorp uses all-caps SANCORP in its own branded text. The SAM.gov / HigherGov capability description uses mixed-case "SanCorp Consulting, LLC". The canonical legal name per USAspending is "SANCORP CONSULTING, LLC". Preserve as-written in verbatim quotes.'
  - id: nq2
    added_date: '2026-04-30'
    observed: 'OUSDI&S'
    canonical: 'OUSD(I&S)'
    location: 'INSA Naming Convention paper, p. 4 COUNTER-INSIDER THREAT section'
    source_path: news/insa-naming-convention-20220900.pdf
    resolution: preserve-as-sic-in-quotes
    note: 'INSA paper writes "OUSDI&S" without parentheses around (I&S). The canonical DoD form is "OUSD(I&S)" — the abbreviation expands to Office of the Under Secretary of Defense for Intelligence and Security.'
  - id: nq3
    added_date: '2026-04-30'
