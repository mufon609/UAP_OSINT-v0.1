description: 'Sancorp Consulting, LLC is a Falls Church, Virginia ([`/locations/falls-church-virginia`]) federal contractor that provides intelligence, counterintelligence, insider threat, and operations support services to the Office of the Under Secretary of Defense for Intelligence and Security ([`/organizations/ousd-is`]). Sancorp''s public-facing Past Performance page (2026 capture) lists the customer of HQ003425FE388 as "Office of the Under Secretary of War for Intelligence and Security" — Executive Order 14347 ([`/documents/eo-14347-restoring-department-of-war`]) of September 5, 2025 authorizes the Department of Defense and the Office of the Secretary of Defense to be referred to as the Department of War and the Office of the Secretary of War in non-statutory contexts (Sec. 2(b)), authorizes the Secretary of Defense to use the additional secondary title Secretary of War (Sec. 2(a)), applies these provisions, as appropriate, to subordinate officials within the Department of Defense, who may use corresponding secondary titles such as Under Secretary of War in the contexts described in subsection (a) (Sec. 2(c)), and provides that statutory references to the Department of Defense shall remain controlling until changed subsequently by the law (Sec. 2(e)). Sancorp was founded July 28, 2016. Its Unique Entity Identifier is GRYKNJ8BGFC8 and its CAGE Code is 7NZQ9. Per HigherGov registry data the company''s SBA 8(a) Certification was Graduated August 26, 2017 to March 11, 2026; it also has Service Disabled Veteran Owned Small Business and Veteran Owned Business certifications. GovCon in a Box lists Sancorp''s federal awards (under awarding agencies including the Department of Defense ([`/organizations/dod`]), the General Services Administration ([`/organizations/gsa`]), the Department of the Army ([`/organizations/department-of-the-army`]), the Department of Justice ([`/organizations/department-of-justice`]), the Department of the Navy ([`/organizations/department-of-the-navy`]), and the Missile Defense Agency ([`/organizations/mda`]), with the Office of the Secretary of Defense ([`/organizations/osd`]) as the parent organization for the contracts issued via Washington Headquarters Services) at $61.47M across 185 awards (First Award April 21, 2022; Last Award December 2, 2025).


  Sancorp''s contract record with OUSD(I&S), awarded by Washington Headquarters Services, includes HQ003418C0123 ("CI Metrics Study Support", September 27, 2018) and HQ003419C0159 ("Strengthening Insider Threat Support Services", September 20, 2019). In 2022 Sancorp was awarded two contracts that placed the same vendor inside two related OUSD(I&S) offices: HQ003422C0064 ("IPMO Support Services", June 9, 2022) supports the Influence and Perception Management Office (established March 1, 2022 by direction from the Secretary of Defense and the Under Secretary of Defense for Intelligence and Security, per a memorandum signed by James A. Holly ([`/people/james-holly`]), Acting Director — see [`/documents/ipmo-notre-dame-memo-2022`]), and HQ003422C0094 ("AARO Support Services", September 1, 2022) supports the All-domain Anomaly Resolution Office. The AARO contract''s Performance Work Statement ([`/documents/blackvault-sancorp-23-f-1114-aaro-pws`]), released via FOIA case 23-F-1114 (125 pages responsive, 11 pages withheld in their entirety per (b)(5), portions of the remaining 114 pages exempt from release per (b)(4) and (b)(6)), defines deliverables across Executive Administrative Support, Strategy, Plans, and Policy Support, Congressional Affairs, Public Affairs, and FOIA Support, Data Architecture Support, Planning, Programming, Budgeting and Executive Support, Reporting Support, and Operations Support. The contract was issued by WHS Acquisition Directorate ([`/organizations/whs-acquisition-directorate`]) on solicitation HQ003422R0192; signed by Contracting Officer Jacqueline Verrine ([`/people/jacqueline-verrine`]) (Team Lead, Technical Analysis Branch, Enterprise Office Secretary of Defense ([`/organizations/whs-eosd`]), WHS Acquisition Directorate) on September 1, 2022. Section 7 information contact: Contract Specialist Rainie Wells ([`/people/rainie-wells`]). The contract was awarded under DFARS 252.219-7009 SECTION 8(A) DIRECT AWARD with the Small Business Administration Richmond District Office ([`/organizations/sba-richmond-district-office`]) as the cognizant SBA office; Defense Contract Audit Agency ([`/organizations/dcaa`]) DODAAC HAA47 audits the LH and T&M CLINs. The IPMO contract is described in Sancorp''s own Company News as "professional, administrative, and operational support services to the Influence and Perception Management Office (IPMO)" at OUSD(I&S).


  Sancorp joined the Intelligence and National Security Alliance (INSA) Insider Threat Subcommittee in March 2021 and contributed to INSA''s October 2021 white paper "The Need for Transparency on Insider Threats: Improving Information Sharing Between Government and Industry" — published the same month. INSA''s September 2022 Insider Threat Program Naming Convention paper ([`/documents/insa-naming-convention-2022`]) states that "Counter-insider threat was developed by the Office of the Undersecretary of Defense for Intelligence and Security (OUSDI&S)." Subsequent Sancorp prime contracts include HQ003423C0061 and HQ003424C0046 ("Specialized and Sensitive Administrative, Policy, Operations, and Analytic Support Services" — IPMO continuation), HQ003424C0096 ("Exec. Admin, Ops, Policy & PPBE Sppt Svc"; its transaction descriptions carry "OUSDIS ALL-DOMAIN ANOMALY RESOLUTION OFFICE (AARO)" from modification P00005, July 10, 2025), HQ003424F0411 ("LABOR" — $11.2M task order supporting Office of the Assistant Secretary of Defense for Homeland Defense and Hemispheric Affairs and Office of the Deputy Assistant Secretary of Defense for Nuclear and Countering Weapons of Mass Destruction), HQ003425FE388 (Counterintelligence, Law Enforcement and Security Policy, Operations, Analytic and Business Operations support), HQ003425FE405 (Office of the Under Secretary of Defense for Policy office management and executive support — Sancorp Past Performance separately lists this customer as Office of the Under Secretary of War for Policy), and W519TC23F0545 (Chief Digital and Artificial Intelligence Office Algorithmic Warfare and Public Affairs). After GAO ([`/organizations/gao`]) denied Sancorp''s protest of two OUSD(I&S) call orders awarded to Premier Enterprise Solutions (Executive Directorate, EXDIR ([`/organizations/ousd-is-exdir`])) and Arlo Solutions ([`/organizations/arlo-solutions`]) (Sensitive Activities and Special Programs, SASP ([`/organizations/ousd-is-sasp`])) in B-422985.4, B-422985.5 (June 11, 2025) — Solicitation HQ003424R0178 issued call orders for SASP and EXDIR support services; Sancorp''s IPMO ([`/organizations/ipmo`]) prime contracts (HQ003422C0064, HQ003423C0061, HQ003424C0046) and AARO ([`/organizations/aaro`]) prime contracts (HQ003422C0094, HQ003424C0096) are independent of HQ003424R0178 and continued under Sancorp — Sancorp also won W912CL25CA005 (USSOUTHCOM Support to Special Technical Operations including Special Access Programs, Alternative and Compensatory Control Measures, Military Deception (MILDEC), and Intelligence Planning, June 30, 2025) and HQ085926FG471 (Missile Defense Agency Scalable Homeland Innovative Enterprise Layered Defense Initial Order, December 19, 2025). The August 2025 GSA OASIS+ 8(a) Contract award is described by Sancorp as covering "integrated solutions in Program Management, Engineering Services, Research & Development, and Intelligence Support to help federal agencies achieve mission success."


  Both Sancorp PWSs are publicly available via DoD FOIA channels — the IPMO contract HQ003422C0064 PWS ([`/documents/foia-23-f-0906-sancorp-ipmo-pws`], dated April 25, 2022; FOIA case 23-F-0906) and the AARO contract HQ003422C0094 PWS ([`/documents/blackvault-sancorp-23-f-1114-aaro-pws`], dated July 7, 2022; FOIA case 23-F-1114, released to John Greenewald via The Black Vault) — and the USAspending award records for both contracts, each naming Sancorp as recipient, record the set-aside as "8(A) SOLE SOURCE". The PWSs share overlapping task scope including Executive Administrative Support, Strategy/Plans/Policy Support, and Operations Support; the IPMO PWS §5.4 tasks the contractor to "assist IPMO leadership in the development and promulgation of strategy, plans, and policy for DoD influence, deception, and perception management related operations, activities, and investments."


  Sancorp''s public-facing Past Performance page (sancorpconsulting.com) lists 19 prime contracts including the IPMO solicitation HQ003422R0164 ("Specialized and Sensitive Administrative, Security, Policy, Operations, and Analytic Support Services"), the OUSD(I&S) Counter-Insider Threat Program Office contract HQ003419C0159, the OUSD(I&S) Counterintelligence Analytical Support contract HQ003420C0167, the prime contract HQ003425A0001 (listed as "Office of the Assistant Secretary of Defense for Science & Technology Programs and Operations Support"), and prime contracts HQ003425FE388 (Office of the Under Secretary of War for Intelligence and Security) and HQ003425FE405 (Office of the Under Secretary of War for Policy). Absent from the public-facing Past Performance list are the Sancorp AARO prime contracts HQ003422C0094 ("AARO Support Services", signed September 1, 2022; established via FOIA 23-F-1114 and USAspending.gov contract records) and HQ003424C0096 (signed August 23, 2024; established via USAspending.gov contract records).


  On April 19, 2023, AARO ([`/organizations/aaro`]) director Dr. Sean Kirkpatrick ([`/people/sean-kirkpatrick`]) told the Subcommittee on Emerging Threats and Capabilities that AARO would need additional authorization from Congress to begin counterintelligence work. Sancorp''s AARO Support Services contract HQ003422C0094 had started in 2022, prior to that hearing; Sancorp''s prior OUSD(I&S) prime contracts include CI Metrics Study Support (HQ003418C0123, September 27, 2018), Strengthening Insider Threat Support Services (HQ003419C0159, September 20, 2019), and Counterintelligence Analytic Studies Support Services (HQ003420C0167, September 25, 2020). Per the MuckRock fee waiver request from Robert Skvarla, Jr. ([`/people/robert-skvarla`]) (FOIA case 23-F-0905, filed May 19, 2023), Sancorp''s contract with AARO "would help clarify this apparent contradiction."


  On February 14, 2025 Washington Headquarters Services ([`/organizations/whs`]) signed three BPAs numbered HQ003425A0001, HQ003425A0002, and HQ003425A0003, each recorded as a MULTIPLE AWARD vehicle: HQ003425A0001 to Sancorp, HQ003425A0002 to COMPREHENSIVE APPROACH LLC ([`/organizations/comprehensive-approach-solutions`]) of Fairfax, Virginia ([`/locations/fairfax-virginia`]), and HQ003425A0003 to PREMIER ENTERPRISE SOLUTIONS, LLC ([`/organizations/premier-enterprise-solutions`]) of Upper Marlboro, Maryland ([`/locations/upper-marlboro-maryland`]). The HQ003425A0002 and HQ003425A0003 records describe technical, administrative and professional support services to the Under Secretary of Defense for Intelligence & Security enterprise, and all three records list the funding office as "OSD OUSD(I)". Sancorp''s AARO Support Services contract HQ003422C0094 lists the same "OSD OUSD(I)" funding office as the Counterintelligence, Law Enforcement and Security call order HQ003425FE388. Congress ([`/organizations/congress`]) redesignated the position of Under Secretary of Defense for Intelligence (USD(I)) as the Under Secretary of Defense for Intelligence and Security in the National Defense Authorization Act (NDAA) for Fiscal Year 2020 (Section 1621 of P.L. 116-92), per the Congressional Research Service; the award records do not expand the abbreviation. In GAO decision B-422985.4, B-422985.5, the contracting officer, as source selection authority, determined that WHS would establish BPAs with four vendors, including Sancorp, Premier, and Arlo; the decision gives no BPA numbers; Sancorp does not challenge the establishment of the BPAs. Three BPA CALL orders under Sancorp''s HQ003425A0001 are in the retrieved USAspending records: HQ003425FE174, HQ003425FE388 (Counterintelligence, Law Enforcement and Security), and HQ003426FE050. HQ003425FE174, signed June 20, 2025 with place of performance Alexandria, Virginia ([`/locations/alexandria-virginia`]), lists the funding office as "OUSD(AT & L)" ([`/organizations/ousd-atl`]); its P00001 modification of July 24, 2025 states "THE OASD(ST) REQUIRES ANALYTICAL, TECHNICAL, ADMINISTRATIVE, AND PROGRAMMATIC SUPPORT", naming the Office of the Assistant Secretary of Defense for Science and Technology ([`/organizations/oasd-st`]) as the requiring office.


  SAM.gov notice TR011720251116 ([`/documents/samgov-tr011720251116-notice`]), "Support Services for the Office of the Under Secretary of Defense for Intelligence & Security", is a notice of intent by Washington Headquarters Services, Acquisition Directorate, on behalf of the Office of the Under Secretary of Defense for Intelligence and Security, pursuant to FAR 5.203(a) ([`/documents/federal-acquisition-regulations`]), to award short-term, sole source extension contracts to the incumbent contractors. Item 4) names Sancorp Consulting, LLC, performing services under contract HQ003424C0046 concluding on March 27, 2025, with an anticipated period of performance for the bridge contracts of four months, from March 28, 2025, to July 27, 2025, under FAR 6.302-1(a)(2)(iii)(A), Only One Responsible Source. The notice''s March 27, 2025 conclusion date differs from the period of performance end in the HQ003424C0046 USAspending award record (Primary Contracts). In the FPDS ([`/organizations/fpds`]) record for HQ003424C0046, the current completion date is 2024-09-27 on the base award; modification P00001, an option exercised on 2024-09-27, extended it to 2025-03-27; modification P00002, a change order signed 2025-03-27, extended it to 2025-07-27, the end of the bridge period in the notice, although the FPDS record does not name the notice; and modification P00006, a change order signed 2025-07-25, extended it to 2026-05-27. Modifications P00002, P00003 and P00004 carry the description IPMO SUPPORT SERVICES. The other incumbent contractors are Booz Allen Hamilton Inc. ([`/organizations/booz-allen-hamilton`]) of McLean Virginia ([`/locations/mclean-virginia`]) (WHS-AD TEAMS BPA, HQ003415A0010, Task Order HQ003419F0506, and HQ003424C0050), Digital Forensics Services ([`/organizations/digital-forensics-services`]) of Greenbelt Maryland ([`/locations/greenbelt-maryland`]) (HQ003421C0050), and Premier Enterprise Solutions, LLC ([`/organizations/premier-enterprise-solutions`]) of Upper Marlboro, MD ([`/locations/upper-marlboro-maryland`]) (HQ003422C0127). The notice states that the Government has established an Enterprise Blanket Purchase Agreement for OUSD(I&S) and that the requirements are going through the procurement process for award; it gives no BPA number. Its place of performance is Washington, District of Columbia ([`/locations/washington-dc`]); the primary contact is Lawan Ferguson ([`/people/lawan-ferguson`]) and the secondary contact is Syreeta A. Donald ([`/people/syreeta-a-donald`]).


  HQ003426FE050, signed January 28, 2026, is a BPA CALL under HQ003425A0001 for "ADMINISTRATIVE, ANALYTIC, SCIENTIFIC, INFORMATION TECHNOLOGY AND SUBJECT MATTER EXPERTISE SUPPORT SERVICES". Its period of performance is 2026-01-28 to 2027-07-31, with a potential end date of 2030-07-31; the record reports a total obligation of $5317041.31 and base and all options of $20115030.67, with 4 offers received and extent competed "COMPETED UNDER SAP". The awarding agency is Washington Headquarters Services; the funding agency is the Immediate Office of the Secretary of Defense ([`/organizations/osd`]), funding office "OSD OUSD(I)" ([`/organizations/ousd-is`]); the place of performance is Washington, DC ([`/locations/washington-dc`]). The HQ003426FE050 award record does not name AARO ([`/organizations/aaro`]). Any link between HQ003426FE050 and AARO is not confirmed, and Relationships lists it separately from the confirmed entries.


  Sancorp''s own job requisition 1258 for a Staff Officer III, posted August 10, 2026, uses the same services phrase: Administrative, Analytic, Scientific, Information Technology and Subject Matter Expertise Support Services in direct support to Research, Development, Test & Evaluation Activities within Office of the Under Secretary of War for Intelligence and Security (OUSW(I&S)) All-Domain Anomaly Resolution Office (AARO). Its requisition location is Arlington, VA ([`/locations/arlington-virginia`]) and its work location is the National Capital Region ([`/locations/national-capital-region`]). Requisition 1260 (Budget Analyst III, posted August 14, 2026) and requisition 1206 (Field Operations & Sensor Support SME IV/ Action Officer, posted September 4, 2026) use the same phrase but name OUSW(I&S) only, not AARO; requisition 1206 also calls for experience across the Intelligence Community ([`/organizations/intelligence-community`]) and with the National Defense Strategy ([`/documents/national-defense-strategy`]). None of the three job posting records names a contract number. The phrase in requisition 1258 is the only basis in these sources for any link between HQ003426FE050 and AARO, and the evidence limits it: the same "OSD OUSD(I)" funding office also appears on HQ003425FE388 (Counterintelligence, Law Enforcement and Security), HQ003424C0096, and HQ003422C0094; all five HQ003426FE050 transaction records (the base award through modification P00004, June 4, 2026) carry the same description and none names AARO; and two of the three job posting records that use the phrase do not name AARO. Each of the three describes Sancorp as "an SDVOSB and SBA 8(a) company", SBA being the Small Business Administration ([`/organizations/sba`]).


  The HQ003424C0096 transaction records carry the description "OUSDIS ALL-DOMAIN ANOMALY RESOLUTION OFFICE (AARO)" from modification P00005 (July 10, 2025) forward; the base award and the P00001 through P00004 descriptions do not carry that label. Modification P00007 (May 6, 2026) records a federal action obligation of -$56454.61. The September 25, 2026 award record reports a total obligation of $3415374.79 with the period of performance ending January 31, 2026; the April 30, 2026 capture of the same record had reported $3471829.4.

  '
