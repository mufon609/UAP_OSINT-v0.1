description: |-
  Traversable Wormholes, Stargates, and Negative Energy. The Defense Intelligence Reference Document is 6 April 2010, with an ICOD of 1 December 2009 and control number DIA-08-1004-004, UNCLASSIFIED//FOR OFFICIAL USE ONLY. Where the Prepared by and Author appear, the document gives (b)(3):10 USC 424 and Defense Intelligence Agency ([`/organizations/dia`]) and, on the Author line, (b)(6). An Administrative Note states the product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, Advanced Aerospace Weapon System Applications (AAWSA) Program [`/organizations/aawsap`], and that comments or questions should be addressed to the AAWSA Program Manager. The document is one of a series of FY 2009 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]); the author ([`/people/eric-davis`]) appears there, not on the document, which shows only (b)(6) on the Author line.


  The Summary states that implementation of faster-than-light interstellar travel via traversable wormholes generally requires engineering spacetime into very specialized local geometries, and that the analysis of these via Einstein's General Theory of Relativity demonstrates such geometries require the use of exotic matter; these issues are reviewed and summarized. The principle of traversable wormholes was discovered in 1985 by Morris ([`/people/michael-morris`]) and Thorne ([`/people/kip-thorne`]) as an academic exercise at the request of Carl Sagan ([`/people/carl-sagan`]) for his novel Contact. The source of matter for a traversable wormhole must have zero or negative energy density and/or an outward radial tension (negative pressure) larger than the magnitude of the energy density; a 1-handle/throat wormhole is the most desirable engineering solution, requiring zero or arbitrarily little negative energy. A stargate is a traversable wormhole with a flat-face shape for the throat rather than the spherical-shaped throat of the Morris and Thorne wormhole, constructed by generating a thin shell or surface layer of exotic matter. The exotic matter threading a wormhole throat produces repulsive gravity, which will then deflect light rays, so the entrance to a spherically symmetric wormhole looks like a sphere that contains the mirror image of the far region, and if a small wormhole were to begin to appear or even bump into our local space one would perceive this process as the occurrence of an unusually bright spot in the sky with blue and red Doppler shifting.


  What is exotic about this matter is that it must have negative energy density and/or negative flux, unlike the non-negative energy density of all observed forms of matter in classical physics; the energy conditions are shown not to be absolute — Visser ([`/people/matt-visser`]) showed all generic spacetime geometries violate them, and quantum effects generically violate the average NEC (ANEC). Negative energy has been produced in the laboratory, and the paper reviewed methods for generating it: static radial electric and magnetic fields from ultrahigh-intensity tabletop lasers using chirped-pulse amplification, the squeezed state of the electromagnetic field, gravitationally squeezed electromagnetic ZPF, and the Casimir effect — the easiest and most well known way — together with the dynamical Casimir effect of moving mirrors and the use of the Casimir effect for traversable wormholes. Section IV reviewed the negative energy requirements and physical constraints: a wormhole 1-m in size requires a mass of about -0.71 in units of the mass of the planet Jupiter, and the mass requirement grows negative-large as the wormhole size increases, though the non-linearity of the general relativistic field equation dictates that the total mass seen by remote observers is zero, while Visser et al. demonstrated as a general result that traversable wormholes can be supported by arbitrarily small quantities of negative energy. The Quantum Inequalities conjecture postulates three constraints on negative energy pulses that the Casimir effect and its non-Maxwellian quantum field analogs violate, and a spatial volume integral quantifier can make the energy condition violation arbitrarily small but cannot make it vanish entirely. General relativity theory provides a recipe for the essential geometric and material ingredients required to open and maintain a wormhole, but not the required assembly instructions, so the author is convinced that the answer can only be found through empirical studies designed to decide whether the present general relativistic recipe is enough to work with. Negative energy should be observable in lab experiments through a unique signature in lensing, chromaticity and intensity effects, and through a non-optical scheme using switched particle detectors. The Conclusion states that a traversable wormhole can be demonstrated in the laboratory as long as there is a focused, sustained level of long-term research support, that we already make small amounts of negative energy in the lab but do not yet know if we can access larger amounts at the needed scale, and that empirical studies will be necessary to find the answer once we develop an intense source of negative energy.
