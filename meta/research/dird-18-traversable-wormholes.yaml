- id: q4
  added_date: '2026-05-24'
  text: Implementation of faster-than-light (FTL) interstellar travel via traversable wormholes generally
    requires the engineering of spacetime into very specialized local geometries. The analysis of these
    via Einstein's General Theory of Relativity, plus the resultant equations of state, demonstrates that
    such geometries require the use of “exotic” matter. It has been claimed that since such matter violates
    the energy conditions, FTL spacetimes are not plausible. However, it has been shown that this is a
    spurious issue. The identification, magnitude, and production of exotic matter are seen to be a key
    technical challenge, however. These issues are reviewed and summarized, and an assessment on the present
    state of their resolution is provided.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "I. Summary" (¶ Implementation of faster-than-light)'
  significance: 'Section I Summary — thesis: faster-than-light travel via traversable wormholes requires
    exotic matter; the energy-condition objection is a spurious issue; the identification, magnitude,
    and production of exotic matter is the key technical challenge'
  statement_date: '2010-04-06'
  claim_group: thesis-scope
- id: q5
  added_date: '2026-05-24'
  text: In 1985 CalTech physicists M. Morris and K. Thorne discovered the principle of traversable wormholes
    based on Einstein's General Theory of Relativity (published in 1915). Morris and Thorne (Reference
    1) and Morris et al. (Reference 2) did this as an academic exercise at the request of Carl Sagan,
    who had completed the draft of his novel Contact.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "I. Summary" (¶ In 1985 CalTech physicists)'
  significance: 'Section I Summary — historical origin of traversable-wormhole physics: Morris and Thorne
    (1985), based on Einstein''s General Theory of Relativity, as an academic exercise at the request
    of Carl Sagan for his novel Contact'
  statement_date: '2010-04-06'
  claim_group: thesis-scope
- id: q6
  added_date: '2026-05-24'
  text: By inserting Equation (1) into the Einstein field equation and cranking through the math, one
    can derive the density and flux of energy and momentum (a.k.a. pressure) encoded by 7, for the source
    of matter that is required to produce the traversable wormhole. The results show that the source of
    matter must have zero or negative energy density and/or an outward radial tension (negative pressure)
    that is larger than the magnitude of the energy density (Reference 1-3).
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "A. TRAVERSABLE WORMHOLES" (¶ By inserting Equation (1))'
  significance: Section II.A — the source matter for a traversable wormhole must have zero or negative
    energy density and/or an outward radial tension (negative pressure) larger than the magnitude of the
    energy density
  statement_date: '2010-04-06'
  claim_group: section-2a-traversable-wormholes
- id: q7
  added_date: '2026-05-24'
  text: 'It is clear from this that as the number of wormhole handles/throats increases the amount of
    negative energy required to create the wormhole will grow larger in magnitude. This is an undesirable
    demand on any putative negative energy generator. It is clear then that item (a) defines the most
    desirable engineering solution one can hope for: a 1-handle/throat traversable wormhole that will
    require zero or (arbitrarily) little negative energy to create.'
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "A. TRAVERSABLE WORMHOLES" (¶ It is clear from this)'
  significance: Section II.A — a single-handle/throat traversable wormhole is the most desirable engineering
    solution, requiring zero or arbitrarily little negative energy; more handles/throats increase the
    negative energy required
  statement_date: '2010-04-06'
  claim_group: section-2a-traversable-wormholes
- id: q8
  added_date: '2026-05-24'
  text: It is a straightforward exercise to design a real “stargate” from wormhole physics. A stargate
    is essentially a traversable wormhole with a flat-face shape for the throat as opposed to the spherical-shaped
    throat of the Morris and Thorne wormhole as discussed in the previous section. A traveler going through
    a stargate will simply be shunted into another remote spacetime region within our universe or into
    another universe.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. THE “STARGATE” SOLUTION" (¶ It is a straightforward exercise)'
  significance: Section II.B — a “stargate” is defined as a traversable wormhole with a flat-face throat
    rather than the spherical-shaped throat of the Morris and Thorne wormhole
  statement_date: '2010-04-06'
  claim_group: section-2b-stargate-solution
- id: q9
  added_date: '2026-05-24'
  text: Therefore, one can construct a stargate by generating a thin shell or surface layer of exotic
    matter much like a thin film of soap stretched across a loop of wire.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. THE “STARGATE” SOLUTION" (¶ which is a remarkable result)'
  significance: Section II.B — a stargate can be constructed by generating a thin shell or surface layer
    of exotic matter, likened to a thin film of soap stretched across a loop of wire
  statement_date: '2010-04-06'
  claim_group: section-2b-stargate-solution
- id: q10
  added_date: '2026-05-24'
  text: The exotic matter threading a traversable wormhole throat produces repulsive gravity, which will
    then deflect light rays going through and around it. The entrance to the spherically symmetric Morris
    & Thorne wormhole looks like a sphere that contains the mirror image of a whole other universe or
    remote region within our own universe, incredibly shrunken and distorted (see Figure 6).
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "C. WHAT A WORMHOLE LOOKS LIKE IN THE REAL WORLD" (¶ The exotic matter threading)'
  significance: Section II.C — the exotic matter threading a wormhole throat produces repulsive gravity
    that deflects light; the entrance to a spherical Morris & Thorne wormhole looks like a sphere holding
    a shrunken, distorted mirror image of the far region
  statement_date: '2010-04-06'
  claim_group: section-2c-real-world-appearance
- id: q11
  added_date: '2026-05-24'
  text: If a small wormhole (three or more dimensional) were to begin to appear or even bump into our
    local space, one would perceive this process as the occurrence of an unusually bright spot in the
    sky. Blue and red Doppler shifting of this bright spot would manifest when the intersection of the
    wormhole with our local space grows or recedes, respectively.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "C. WHAT A WORMHOLE LOOKS LIKE IN THE REAL WORLD" (¶ If a small wormhole)'
  significance: Section II.C — a small wormhole intersecting our local space would appear as an unusually
    bright spot in the sky, with blue and red Doppler shifting as the intersection grows or recedes
  statement_date: '2010-04-06'
  claim_group: section-2c-real-world-appearance
- id: q12
  added_date: '2026-05-24'
  text: This section will consider the physics of the exotic matter that is required to build traversable
    wormholes. What exactly is “exotic” matter? In classical physics the energy density of all observed
    forms of matter (fields) is non-negative. What is exotic about the type of matter that must be used
    to generate traversable wormhole spacetime is that it must have negative energy density and/or negative
    flux (Reference 10).
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "III. The General Relativistic Definition of Exotic Matter and the Energy Conditions"
      (¶ This section will consider)'
  significance: Section III — “exotic” matter is defined as matter with negative energy density and/or
    negative flux, unlike the non-negative energy density of all classically observed forms of matter
  statement_date: '2010-04-06'
  claim_group: section-3-exotic-matter-energy-conditions
- id: q13
  added_date: '2026-05-24'
  text: Furthermore, Visser (Reference 3) showed that all (generic) spacetime geometries violate all the
    energy conditions. So the condition that pe > pi and/or pe = 0 must be obeyed by all forms of matter
    in nature is spurious. Violating the energy conditions commits no offense against nature. Negative
    energy has been produced in the laboratory and this will be discussed in the following sections.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "III. The General Relativistic Definition of Exotic Matter and the Energy Conditions"
      (¶ Further investigation into this technical issue)'
  significance: Section III — Visser showed all generic spacetime geometries violate all the energy conditions;
    the conditions are not absolute, violating them commits no offense against nature, and negative energy
    has been produced in the laboratory
  statement_date: '2010-04-06'
  claim_group: section-3-exotic-matter-energy-conditions
- id: q14
  added_date: '2026-05-24'
  text: The bad news is that real physical matter is not “reasonable” because the energy conditions are
    in general violated by semiclassical quantum effects (occurring at order n) (Reference 3).5 More specifically,
    quantum effects generically violate the average NEC (ANEC). Furthermore, it was discovered in 1965
    that quantum field theory has the remarkable property of allowing states of matter containing local
    regions of negative energy density or negative fluxes (Reference 12).
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "III. The General Relativistic Definition of Exotic Matter and the Energy Conditions"
      (¶ The bad news is that real physical matter)'
  significance: Section III — quantum effects generically violate the averaged Null Energy Condition (ANEC);
    since 1965 quantum field theory is known to allow states of matter with local regions of negative
    energy density or negative fluxes
  statement_date: '2010-04-06'
  claim_group: section-3-exotic-matter-energy-conditions
- id: q15
  added_date: '2026-05-24'
  text: Suffice it to say that ultrahigh-intensity tabletop lasers have been used to generate extreme
    electric and magnetic field strengths in the lab. Ultrahigh-intensity lasers use the chirped-pulse
    amplification (CPA) technique to boost the total output beam power.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "1. Static Radial Electric & Magnetic Fields" (¶ It is beyond the scope of this study
      to include all)'
  significance: Section III.B.1 (static radial electric and magnetic fields) — ultrahigh-intensity tabletop
    lasers using the chirped-pulse amplification (CPA) technique generate extreme electric and magnetic
    field strengths in the lab
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q16
  added_date: '2026-05-24'
  text: The squeezed state of the electromagnetic field is a primary example of a quantum field that has
    negative energy density and negative energy flux. Such a state became a physical reality in the laboratory
    as a result of the nonlinear-optics technique of “squeezing,”
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "2. Squeezed Quantum Vacuum" (¶ The squeezed state of the electromagnetic field)'
  significance: Section III.B.2 (squeezed quantum vacuum) — the squeezed state of the electromagnetic
    field is a primary realized example of negative energy density and flux, achieved by the nonlinear-optics
    technique of squeezing
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q17
  added_date: '2026-05-24'
  text: The analysis, via quantum optics, showed that gravitation itself provides the mechanism for generating
    the squeezed vacuum states needed to support stable traversable wormholes. The production of negative
    energy densities via a squeezed vacuum is a necessary and unavoidable consequence of the interaction
    or coupling between ordinary matter and gravity, and this defines what is meant by gravitationally
    squeezed vacuum states.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "3. Gravitationally Squeezed Electromagnetic ZPF" (¶ The analysis, via quantum optics)'
  significance: Section III.B.3 (gravitationally squeezed electromagnetic ZPF) — gravitation itself generates
    the squeezed vacuum states needed for stable traversable wormholes; negative-energy production is
    a necessary and unavoidable consequence of the coupling between ordinary matter and gravity
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q18
  added_date: '2026-05-24'
  text: The Casimir effect is by far the easiest and most well known way to generate negative energy in
    the lab. The Casimir effect that is familiar to most people is the force that is associated with the
    electromagnetic quantum vacuum (Reference 51). This is an attractive force that must exist between
    any two neutral (uncharged), parallel, flat, conducting surfaces (é.g., metallic plates) in a vacuum.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "4. Vacuum Field Stress: Negative Energy from the Casimir Effect" (¶ The Casimir effect
      is by far the easiest)'
  significance: 'Section III.B.4 (Casimir effect) — the Casimir effect is the easiest and best-known way
    to generate negative energy in the lab: an attractive force between two neutral, parallel, flat, conducting
    surfaces in a vacuum'
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q19
  added_date: '2026-05-24'
  text: Negative energy can be created by a single moving reflecting (conducting) surface (a.k.a. a moving
    mirror). A mirror moving with increasing acceleration generates a flux of negative energy that emanates
    from its surface and flows out into the space ahead of the mirror (Reference 25, 56).
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "5. Dynamical Casimir Effect: Moving Mirrors" (¶ Negative energy can be created by
      a single moving — flux from an accelerating mirror)'
  significance: Section III.B.5 (dynamical Casimir effect / moving mirrors) — a single moving conducting
    surface under increasing acceleration generates a flux of negative energy that flows out into the
    space ahead of the mirror
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q20
  added_date: '2026-05-24'
  text: However, this effect is known to be exceedingly small, and it is not the most effective way to
    produce negative energy. This scheme will not be considered any further.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "5. Dynamical Casimir Effect: Moving Mirrors" (¶ Negative energy can be created by
      a single moving — effect exceedingly small, scheme not considered further)'
  significance: Section III.B.5 (dynamical Casimir effect / moving mirrors) — the moving-mirror effect
    is exceedingly small, not the most effective way to produce negative energy, and the scheme will not
    be considered any further
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q21
  added_date: '2026-05-24'
  text: The electromagnetic Casimir effect can be used in principle to create a traversable wormhole.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "6. Casimir Effect: Negative Energy for Traversable Wormholes" (¶ The electromagnetic
      Casimir effect can be used in principle — opening claim)'
  significance: Section III.B.6 (Casimir effect for traversable wormholes) — in principle the electromagnetic
    Casimir effect can be used to create a traversable wormhole
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q22
  added_date: '2026-05-24'
  text: But cavity dimensions must be made exceedingly small in order to generate a significant amount
    of negative energy.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "6. Casimir Effect: Negative Energy for Traversable Wormholes" (¶ The electromagnetic
      Casimir effect can be used in principle — cavity dimensions must be exceedingly small)'
  significance: Section III.B.6 (Casimir effect for traversable wormholes) — cavity dimensions must be
    made exceedingly small to generate a significant amount of negative energy
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q23
  added_date: '2026-05-24'
  text: There is no technology known today that can engineer a cavity with such minuscule plate separations.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "6. Casimir Effect: Negative Energy for Traversable Wormholes" (¶ The electromagnetic
      Casimir effect can be used in principle — no technology known today for such minuscule plate separations)'
  significance: Section III.B.6 (Casimir effect for traversable wormholes) — no technology known today
    can engineer a cavity with such minuscule plate separations
  statement_date: '2010-04-06'
  claim_group: section-3b-generating-negative-energy
- id: q24
  added_date: '2026-05-24'
  text: 'However, the reader should be forewarned that there are a number of published claims that the
    energy condition violations can be avoided. These claims are just semantic games whereby investigators
    universally invoke the following scenario: divide the total stress-energy into weird matter plus normal
    matter, push all the energy condition violations into the weird matter so that the normal matter does
    not violate the energy conditions. Given that the energy conditions are not absolute, such rearranging
    approaches are not necessary.'
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "A. NEGATIVE ENERGY REQUIREMENTS AND ENERGY CONDITION VIOLATIONS" (¶ One knows how
      to make small quantities)'
  significance: Section IV.A — published claims that energy-condition violations can be avoided are dismissed
    as semantic games; since the energy conditions are not absolute, such rearranging is unnecessary
  statement_date: '2010-04-06'
  claim_group: section-4a-energy-requirements
- id: q25
  added_date: '2026-05-24'
  text: Equation (9) shows that a mass of —0.71 M) will be required to build a wormhole 1-m in size. As
    the wormhole size increases, the mass requirement grows negative-large.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "A. NEGATIVE ENERGY REQUIREMENTS AND ENERGY CONDITION VIOLATIONS" (¶ where Myn is
      the (equivalent) mass — Equation (9), mass of −0.71 for a 1-m wormhole)'
  significance: Section IV.A — Equation (9) shows a mass of about −0.71 (Jupiter-mass, OCR-rendered ‘M)’)
    is required to build a 1-metre wormhole, growing negative-large as the wormhole size increases
  statement_date: '2010-04-06'
  claim_group: section-4a-energy-requirements
- id: q26
  added_date: '2026-05-24'
  text: After being alarmed by the magnitude of the results, one should note that Mun is not the total
    mass of the wormhole as seen by remote observers. The non-linearity of the general relativistic field
    equation dictates that the total mass is zero
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "A. NEGATIVE ENERGY REQUIREMENTS AND ENERGY CONDITION VIOLATIONS" (¶ where Myn is
      the (equivalent) mass — total mass seen by remote observers is zero)'
  significance: Section IV.A — the equivalent mass (OCR-rendered ‘Mun’) is not the total mass seen by
    remote observers; the non-linearity of the general relativistic field equation dictates that the total
    mass is zero
  statement_date: '2010-04-06'
  claim_group: section-4a-energy-requirements
- id: q27
  added_date: '2026-05-24'
  text: Finally, Visser et al. (Reference 59) demonstrated the existence of spacetime geometries containing
    traversable wormholes that are supported by arbitrarily small quantities of negative energy, and this
    was proved to be a general result.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "A. NEGATIVE ENERGY REQUIREMENTS AND ENERGY CONDITION VIOLATIONS" (¶ where Myn is
      the (equivalent) mass — Visser et al., arbitrarily small negative energy)'
  significance: Section IV.A — Visser et al. demonstrated, as a general result, the existence of spacetime
    geometries containing traversable wormholes supported by arbitrarily small quantities of negative
    energy
  statement_date: '2010-04-06'
  claim_group: section-4a-energy-requirements
- id: q28
  added_date: '2026-05-24'
  text: The Quantum Inequalities (QI) conjecture is an extension of the Heisenberg Uncertainty Principle
    to curved spacetimes.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ The Quantum Inequalities (QI) conjecture
      — QI defined as an extension of the Heisenberg Uncertainty Principle)'
  significance: Section IV.B — the Quantum Inequalities (QI) conjecture is an extension of the Heisenberg
    Uncertainty Principle to curved spacetimes
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q29
  added_date: '2026-05-24'
  text: 'When generating negative energy the QI postulate that: a) the longer the pulse of negative energy
    lasts, the weaker it must be; b) a pulse of positive energy must follow and the magnitude of the positive
    pulse must exceed that of the initial negative pulse; and c) the longer the time interval between
    the two pulses, the larger the positive pulse must be. This actually sounds quite reasonable on energy
    conservation grounds until one discovers that the Casimir effect and its non-Maxwellian quantum field
    analogs violate all three conditions.'
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ The Quantum Inequalities (QI) conjecture
      — the three QI postulates and their Casimir-effect violation)'
  significance: Section IV.B — the Quantum Inequalities postulate three conditions on negative-energy
    pulses, all three of which the Casimir effect and its non-Maxwellian quantum field analogs violate
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q30
  added_date: '2026-05-24'
  text: It turns out that Visser and coworkers (Reference 59, 63, 64) developed a superior way to properly
    quantify the amount of negative energy or energy condition violations required to build a traversable
    wormhole spacetime. They propose a quantifier in terms of a spatial volume integral
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ It turns out that Visser and coworkers
      — superior spatial-volume-integral quantifier)'
  significance: Section IV.B — Visser and coworkers developed a superior quantifier, in terms of a spatial
    volume integral, for the negative energy or energy-condition violations required to build a traversable
    wormhole spacetime
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q31
  added_date: '2026-05-24'
  text: It was further shown that Equation (10) can be adjusted to become vanishingly small by appropriate
    choice of parameters; therefore, examples can be constructed whereby the energy condition violation
    can be made arbitrarily small. But the violation cannot be made to vanish entirely.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ It turns out that Visser and coworkers
      — Equation (10) made arbitrarily small but not vanishing)'
  significance: Section IV.B — the volume-integral quantifier can be adjusted to become vanishingly small,
    so the energy-condition violation can be made arbitrarily small, but the violation cannot be made
    to vanish entirely
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q32
  added_date: '2026-05-24'
  text: However, one still does not know how to construct a traversable wormhole because general relativity
    theory only provides a recipe for the essential geometric and material ingredients required to open
    and maintain one, but not the required assembly instructions.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ It is on the basis of the foregoing
      discussion — recipe but not assembly instructions)'
  significance: Section IV.B — general relativity theory provides a recipe for the geometric and material
    ingredients to open and maintain a traversable wormhole, but not the required assembly instructions
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q33
  added_date: '2026-05-24'
  text: The author is convinced that the answer can only be found through empirical studies designed to
    decide whether the present general relativistic recipe is enough to work with or an additional construction
    mechanism will be required.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ It is on the basis of the foregoing
      discussion — author convinced only empirical studies can decide)'
  significance: Section IV.B — the author holds that empirical studies are the only way to decide whether
    the present general relativistic recipe suffices or an additional construction mechanism is required
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q34
  added_date: '2026-05-24'
  text: The coupled mass conservation law shows that for a sufficiently large net transfer of mass the
    final (equivalent) mass of the exit mouth becomes negative. This is actually a beneficial result because
    ANEC violations are required just to hold the wormhole throat open in the first place. If it appears
    that a runaway reaction might occur, then it would be prudent for wormhole engineers to simply “turn
    off” the wormhole for a brief moment and then “turn it back on” (i.e., “reset” the wormhole) to restart
    space transportation operations.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "B. PHYSICAL CONSTRAINTS ON NEGATIVE ENERGY" (¶ where p, is the outward radial pressure)'
  significance: Section IV.B — a large net mass transfer makes the exit mouth's equivalent mass negative,
    which is beneficial since ANEC violations hold the throat open; engineers could “reset” the wormhole
    (turn off then on) to avert a runaway reaction
  statement_date: '2010-04-06'
  claim_group: section-4b-physical-constraints
- id: q35
  added_date: '2026-05-24'
  text: Negative energy should be observable in lab experiments. The presence of naturally occurring negative
    energy regions in space is predicted to produce a unique signature corresponding to lensing, chromaticity
    and intensity effects in micro-and macro-lensing events on galactic and extragalactic/cosmological
    scales (Reference 66-71). It has been shown that these effects provide a specific signature that allows
    for discrimination between ordinary (positive energy) and negative energy lenses via the spectral
    analysis of astronomical lensing events.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "C. OBSERVING NEGATIVE ENERGY IN THE LAB" (¶ Negative energy should be observable)'
  significance: Section IV.C — naturally occurring negative energy regions are predicted to produce a
    unique lensing, chromaticity, and intensity signature in micro- and macro-lensing events, spectrally
    distinguishable from ordinary positive-energy lenses
  statement_date: '2010-04-06'
  claim_group: section-4c-observing-negative-energy
- id: q36
  added_date: '2026-05-24'
  text: A non-optical scheme for detecting negative energy in experiments was recently reported by Davies
    and Ottewill (Reference 72) who studied the response of switched particle detectors to static negative
    energy densities and negative energy fluxes.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "C. OBSERVING NEGATIVE ENERGY IN THE LAB" (¶ A non-optical scheme for detecting negative
      energy — Davies and Ottewill, switched particle detectors)'
  significance: Section IV.C — Davies and Ottewill reported a non-optical scheme for detecting negative
    energy, studying the response of switched particle detectors to static negative energy densities and
    fluxes
  statement_date: '2010-04-06'
  claim_group: section-4c-observing-negative-energy
- id: q37
  added_date: '2026-05-24'
  text: they showed that negative energy should have the effect of enhancing deexcitation (i.e., induce
    cooling) of the detector.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "C. OBSERVING NEGATIVE ENERGY IN THE LAB" (¶ A non-optical scheme for detecting negative
      energy — negative energy enhancing deexcitation/cooling of the detector)'
  significance: Section IV.C — they showed negative energy should enhance deexcitation (induce cooling)
    of the detector
  statement_date: '2010-04-06'
  claim_group: section-4c-observing-negative-energy
- id: q38
  added_date: '2026-05-24'
  text: The progress of science and technology is rapid, but highly dependent on adequate and sustained
    focus, effort, and support. On this basis, it is possible that a traversable wormhole can be demonstrated
    in the laboratory as long as there is a focused, sustained level of long-term research support.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "V. Conclusion: The Way Forward" (¶ More than 40 years elapsed)'
  significance: 'Section V Conclusion — the report''s bottom-line feasibility finding: a traversable wormhole
    can be demonstrated in the laboratory given a focused, sustained level of long-term research support'
  statement_date: '2010-04-06'
  claim_group: section-5-conclusion
- id: q39
  added_date: '2026-05-24'
  text: A game changer may appear that could dramatically accelerate or alter the direction of an experimental
    traversable wormhole program. Such a game changer could entail new physics that is predicted by a
    complete, comprehensive quantum gravity theory
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "V. Conclusion: The Way Forward" (¶ A game changer may appear — new physics from
      a complete quantum gravity theory)'
  significance: Section V Conclusion — a “game changer” could dramatically accelerate or alter an experimental
    traversable wormhole program, such as new physics predicted by a complete, comprehensive quantum gravity
    theory
  statement_date: '2010-04-06'
  claim_group: section-5-conclusion
- id: q40
  added_date: '2026-05-24'
  text: or a completely new theory for the quantum vacuum and its related spacetime physics (e.q., “emergent”
    spacetime/gravity theories (Reference 73, 74)).
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "V. Conclusion: The Way Forward" (¶ A game changer may appear — or a new theory for
      the quantum vacuum / “emergent” spacetime)'
  significance: Section V Conclusion — or a completely new theory for the quantum vacuum and its related
    spacetime physics, such as “emergent” spacetime/gravity theories
  statement_date: '2010-04-06'
  claim_group: section-5-conclusion
- id: q41
  added_date: '2026-05-24'
  text: |-
    Going forward toward the demonstration of a traversable wormhole will require the following:

    e Generating Negative Energy in the Lab: Our assessment concludes that we already make small amounts of negative energy in the lab, but we do not yet know if we can access larger amounts for extended periods of time over extended spatial distributions for the purpose of engineering a traversable wormhole.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "V. Conclusion: The Way Forward" (¶ Going forward toward the demonstration)'
  significance: 'Section V Conclusion — the “Going forward” research agenda; first item: small amounts
    of negative energy are already made in the lab, but it is not yet known whether larger amounts can
    be accessed over the periods, distances, and distributions needed to engineer a traversable wormhole'
  statement_date: '2010-04-06'
  claim_group: section-5-conclusion
- id: q42
  added_date: '2026-05-24'
  text: 'Constructing Traversable Wormholes in the Lab: Einstein''s General Theory of Relativity does
    not provide instructions on how to construct a traversable wormhole in space or inside a laboratory
    vacuum vessel.'
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "V. Conclusion: The Way Forward" (¶ Constructing Traversable Wormholes in the Lab
      — GR provides no construction instructions)'
  significance: Section V Conclusion — Einstein's General Theory of Relativity does not provide instructions
    on how to construct a traversable wormhole in space or inside a laboratory vacuum vessel
  statement_date: '2010-04-06'
  claim_group: section-5-conclusion
- id: q43
  added_date: '2026-05-24'
  text: Theoretical studies need to be implemented to address this question and the author believes that
    empirical studies will be necessary to find the answer once we develop an intense source of negative
    energy.
  source:
    path: government/dird-18-traversable-wormholes-20100406.pdf
    location: 'section "V. Conclusion: The Way Forward" (¶ Constructing Traversable Wormholes in the Lab
      — theoretical then empirical studies once an intense negative-energy source exists)'
  significance: Section V Conclusion — the author believes theoretical and then empirical studies will
    be necessary to learn how to construct a wormhole, once an intense source of negative energy is developed
  statement_date: '2010-04-06'
  claim_group: section-5-conclusion
