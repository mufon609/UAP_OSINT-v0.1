background: 'Luis D. Elizondo is a former United States Army ([`/organizations/us-army`]) Counter Intelligence Special Agent and Department of Defense ([`/organizations/dod`]) civilian intelligence official who served as the senior ranking person of the Advanced Aerospace Threat Identification Program ([`/organizations/aatip`]) (“AATIP”) within the Department of Defense, per his December 19, 2024 written response to a Question for the Record posed by Rep. Eric Burlison ([`/people/eric-burlison`]). The New York Times ([`/organizations/the-new-york-times`]) report “Glowing Auras and ‘Black Money’: The Pentagon’s Mysterious U.F.O. Program,” by Helene Cooper ([`/people/helene-cooper`]), Ralph Blumenthal ([`/people/ralph-blumenthal`]) and Leslie Kean ([`/people/leslie-kean`]) on December 16, 2017, reported that the program “was run by a military intelligence official, Luis Elizondo, on the fifth floor of the Pentagon’s C Ring, deep within the building’s maze,” and that he “led the Pentagon effort to investigate U.F.O.s until October,” when he resigned. On the Joe Rogan Experience ([`/transcripts/jre-2194-elizondo-2024`]) of August 23, 2024, Elizondo said that he “got there in 2008” and that “early 2009 is when I was approached by two individuals” about a program, and that he “met for the first time” Dr. James Lacatski ([`/people/james-lacatski`]).


  Following his October 2017 resignation, Elizondo joined Hal Puthoff ([`/people/hal-puthoff`]) and Christopher Mellon ([`/people/christopher-mellon`]) at the commercial venture To the Stars Academy of Arts and Science ([`/organizations/ttsa`]), as The New York Times reported. He went on to testify on November 13, 2024 at the joint House Committee on Oversight and Accountability subcommittee hearing ([`/events/2024-11-13-house-oversight-uap-hearing`]) titled “Unidentified Anomalous Phenomena: Exposing the Truth,” convened by Nancy Mace ([`/people/nancy-mace`]) and Glenn Grothman ([`/people/glenn-grothman`]), and on December 19, 2024 submitted written responses to Rep. Burlison’s Questions for the Record, addressed from a P.O. Box in Buffalo, Wyoming. He wrote that “the U.S. Government (or a defense contractor) has in its possession exotic materials of nonhuman origin,” that scientists were part of a conversation “sponsored by the White House in approximately 2004” about whether the public was “prepared for the acknowledgement of UAP,” and that “the CIA opposed the transfer of materials of advanced, non-human origin from Lockheed Martin ([`/organizations/lockheed-martin`]) to Bigelow Aerospace ([`/organizations/bigelow-aerospace`]).” He described “passive resistance” within the Central Intelligence Agency ([`/organizations/cia`]) and a “more active campaign” within the United States Air Force ([`/organizations/us-air-force`]) to “suppress inquiries and investigations into the UAP topic”; the 2017 New York Times had reported that after the program’s funding ended in 2012 he “worked with officials from the Navy ([`/organizations/us-navy`]) and the C.I.A.”'

top_relevance: 'Elizondo served as the senior ranking person of AATIP, and what he has placed on the public record is central to this investigation. In his December 19, 2024 written responses to Rep. Burlison ([`/people/eric-burlison`]), presented at the UNCLASSIFIED level, he states that AATIP “engaged senior executives at DoD Defense aerospace companies who claimed they possessed recovered ‘exotic material’ not made by any U.S. or foreign source”; that “the U.S. Government (or a defense contractor) has in its possession exotic materials of nonhuman origin”; that he is “aware of several incidents where the U.S. military and certain Defense Contract companies recovered craft/vehicles of non-human origin” and that “in some cases biological specimens were recovered”; that “the CIA opposed the transfer of materials of advanced, non-human origin from Lockheed Martin to Bigelow Aerospace”; that a hangar at the Patuxent River Naval Air Station, built to the requirements of a Special Access Program Facility (“SAP-F”) with funding “approximately $10 million ... allocated at the request of then-Representative Steny Hoyer ([`/people/steny-hoyer`]),” was “designed to facilitate the transfer of future materials via air and river” though “no materials had yet been transferred” when he visited; and that he and former colleagues “faced retaliation,” including efforts “to suspend or revoke our security clearances,” harassment, surveillance, and “death threats.” The same responses state that confirmation “may be inferred from an official DoD Office of Prepublication and Security Review (‘DOPSR’) document, dated September 6, 2023,” which “authorized the release of a statement” by Dr. James Lacatski ([`/people/james-lacatski`]) on the “crash retrieval of UAP material recovered during the 1950s” and the “22M allocated for DIA AAWSAP ... originally intended to SCIF-out Bigelow Aerospace facilities in Las Vegas.” His earlier 2017 account to The New York Times ([`/organizations/the-new-york-times`]) first made AATIP public, and his 2024 Joe Rogan Experience ([`/transcripts/jre-2194-elizondo-2024`]) interview places the same points on the public record, including his account of being approached in 2009 by Dr. James Lacatski.'

