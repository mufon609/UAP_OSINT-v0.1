timeline:
- id: t12
  added_date: '2026-05-07'
  date: '2011'
  event: 'Engineer Montgomery Childs, while researching photovoltaic energy production systems, observes solar behavior contradicting the standard model of solar physics; subsequently discovers Electric Sun model researchers — antecedent to the 2012 EU Conference proposal (Genesis report p. 2).'
  source:
    path: news/safireproject-genesis-report-20180223.pdf
    location: 'p. 2, ¶1'
  category: antecedent
- id: t1
  added_date: '2026-05-07'
  date: '2012'
  event: 'Montgomery Childs proposes SAFIRE at the 2012 Electric Universe Conference (David Talbott invitation); Scott Mainwaring brings the proposal to his father Bruce; the Mainwarings support the project through the Mainwaring Archive Foundation.'
  source:
    path: news/safireproject-genesis-snapshot.html
    location: '¶3-7'
  category: founding
- id: t2
  added_date: '2026-05-07'
  date: '2013'
  event: 'SAFIRE I — proof-of-concept bench-top bell-jar prototype — in the lab per the Aureon Energy history page caption ("Historical photo of SAFIRE I in in the lab 2013"). Same year, Dr. William A. Gardner begins a five-year collaboration with James T. Ryder per Gardner''s biography.'
  source:
    path: news/aureonenergy-history-snapshot.html
    location: '¶3 (SAFIRE I caption)'
  category: milestone
- id: t3
  added_date: '2026-05-07'
  date: '2014'
  event: 'Aureon Energy team page:Jan Onderco joins the SAFIRE project at Aurtas International in Mississauga (designing and developing SCADA systems and data transformation engines for physics research); Jason Lickver also joins the SAFIRE Team in 2014 as Senior Design Engineer on SAFIRE II and III.'
  source:
    path: news/aureonenergy-team-snapshot.html
    location: '¶12 (Onderco bio); ¶10 (Lickver bio)'
  category: personnel
- id: t4
  added_date: '2026-05-07'
  date: '2016-06-15'
  event: 'SAFIRE first-firing date — the SAFIRE PROJECT Genesis report cover photo caption attests "The SAFIRE sun, photographed in the SAFIRE lab, Mississauga, Ontario, Canada, June 15, 2016". The same project''s resources page caption attests "This is an image of the 12 centimeter anode several minutes after SAFIRE is first fired up in June of 2016".'
  source:
    path: news/safireproject-genesis-report-20180223.pdf
    location: 'p. 1 (cover photo caption)'
  category: milestone
- id: t5
  added_date: '2026-05-07'
  date: '2017'
  event: '90 minute SAFIRE PROJECT presentation given by Montgomery Childs and Dr. Michael Clarage at the 2017 Electric Universe FUTURE SCIENCE Conference in Phoenix Arizona. Per the Phase Three page, the SAFIRE laboratory was completed and fully commissioned and through 2017 the SAFIRE team performed numerous experiments.'
  source:
    path: news/safireproject-phase-three-snapshot.html
    location: '¶8'
  category: presentation
