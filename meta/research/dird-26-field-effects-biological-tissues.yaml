- id: q7
  added_date: '2026-05-23'
  text: |-
    Several years ago three previous fit and active individuals experienced an
    anomalous ["irregular, incongruous and inconsistent with their domain"]
    aerospace-related event. Within 72 hours they suffered medical signs and
    symptoms [acute and subacute effects].
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. v, ¶ PREFACE'
  significance: Preface anchor case — three previously fit and active individuals experienced an anomalous aerospace-related event and within 72 hours suffered acute and subacute medical signs and symptoms
  statement_date: '2010-03-11'
- id: q8
  added_date: '2026-05-23'
  text: |-
    Extensive, but controversial investigations revealed the three had been
    subjected to an accidental exposure in the near-field [meters] to a broad-band
    ultrahigh radiofrequency mixed radiation of RF (radio frequency), NIEMR
    (non-ionizing electromagnetic radiation) & microwave energies [including
    non-specific and un-measured  induced ionizing effects, probably mixed UVA,
    UVB and UVC (Ultra Violet A, B, C)] centered at about 785 MHz.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. v, ¶ PREFACE'
  significance: Exposure characterization — the three were subjected to a near-field accidental exposure to a broad-band ultrahigh radiofrequency mixed radiation of RF, NIEMR, and microwave energies centered at about 785 MHz
  statement_date: '2010-03-11'
- id: q9
  added_date: '2026-05-23'
  text: |-
    An extensive review of the medical literature and a compilation of a database
    has revealed an additional relevant but less dramatic 42 cases from the peer-
    reviewed medical literature, and an additional un-published similar 300 cases,
    primarily when fields were measured or emitters were known of mixed
    exposures of from 1 –10 GHz at power densities of above 100 mW/cm².
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. v, ¶ PREFACE'
  significance: Case base — a medical-literature review added 42 peer-reviewed cases and an additional un-published 300 cases of mixed exposures of 1–10 GHz at power densities above 100 mW/cm²
  statement_date: '2010-03-11'
- id: q10
  added_date: '2026-05-23'
  text: |-
    This paper relates, summarizes, and analyzes evidence of unintended injury to
    human observers by anomalous advanced aerospace systems. Additionally, an
    argument is made that the subsequent work can inform (e.g., reverse
    engineer), through clinical diagnoses, certain physical characteristics of
    possible future advanced aerospace systems from unknown provenance that
    may be a threat to United States interests.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. v, ¶ SUMMARY'
  significance: Summary thesis — the work can inform (e.g., reverse engineer), through clinical diagnoses, physical characteristics of possible future advanced aerospace systems from unknown provenance
  statement_date: '2010-03-11'
- id: q11
  added_date: '2026-05-23'
  text: |-
    Sufficient incidents/accidents have been accurately reported, and medical
    data acquired, as to support a hypothesis that some advanced systems are
    already deployed, and opaque to full US understanding.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. vi, ¶ Summary bullet'
  significance: Deployment hypothesis — incidents and medical data support a hypothesis that some advanced systems are already deployed and opaque to full US understanding
  statement_date: '2010-03-11'
- id: q12
  added_date: '2026-05-23'
  text: |-
    The medical analyses while not requiring the invention of an alternative
    biophysics, do indicate the use of (to us) unconventional and advanced
    energy systems.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. vii, ¶ Summary final bullet'
  significance: Concluding summary claim — the medical analyses indicate the use of (to us) unconventional and advanced energy systems, without requiring an alternative biophysics
  statement_date: '2010-03-11'
- id: q13
  added_date: '2026-05-23'
  text: |-
    The most important bandwidth of interest is the range with tissue effects
    on humans: from about 300 kHz to 300 GHz; that is, from about 1 km to 1 mm wave
    lengths.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 1, ¶ A'
  significance: Scope of study — the most important bandwidth of interest, for tissue effects on humans, is from about 300 kHz to 300 GHz
  statement_date: '2010-03-11'
- id: q14
  added_date: '2026-05-23'
  text: |-
    The use of very high intensity RF pulses at, for example, 915 MHz will
    cause an elevation in brain temperature of 8 °C, resulting in petit mal or grand mal
    seizures after one minute exposure, followed by 5 minutes of unconsciousness.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 7'
  significance: Injury mechanism — very high intensity RF pulses at 915 MHz raise brain temperature 8 °C, causing petit mal or grand mal seizures and 5 minutes of unconsciousness
  statement_date: '2010-03-11'
- id: q15
  added_date: '2026-05-23'
  text: |-
    The
    threshold for this stun effect is 680 J, regardless of peak power, pulse width, and
    equates to about 28 kJ in terms of expressed peak absorption. This adverse effect is
    about 1,000 times higher than the auditory threshold, and in humans is near
    16mJ/kg as reported above. No adverse effects, in any event have been found at SARs
    (Specific Absorbed Rate is a measure of the rate at which energy is absorbed by the
    body when exposed to radio-frequency electromagnetic field. It is defined as the power
    absorbed per mass of tissue and has units of watts per kilogram) in the head of 0.2
    W/kg (950 MHz) up to 1.0 W/kg (936 & 90 MHz) [13,14].
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 7'
  significance: Stun-effect threshold — the stun-effect threshold is 680 J; no adverse effects have been found at head SARs of 0.2–1.0 W/kg ("Specific Absorbed Rate" and "16mJ/kg" are the document's forms)
  statement_date: '2010-03-11'
- id: q16
  added_date: '2026-05-23'
  text: |-
    The term radiofrequency when applied to the electromagnetic spectrum covers the
    frequency range 100 kHz-300 GHz; the term microwave is applied to the frequency
    range 300 MHz-300 GHz.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 8, ¶ Ch. Three'
  significance: Terminology — radiofrequency covers 100 kHz–300 GHz and microwave covers 300 MHz–300 GHz of the electromagnetic spectrum
  statement_date: '2010-03-11'
- id: q17
  added_date: '2026-05-23'
  text: |-
    Tissues such
    as blood, skin, brain, and peripheral nerves will absorb much more energy than
    fat and bone.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 8'
  significance: Absorption physics — blood, skin, brain, and peripheral nerves absorb much more radiofrequency energy than fat and bone
  statement_date: '2010-03-11'
- id: q18
  added_date: '2026-05-23'
  text: |-
    The threshold of heat perception is near 0.7 mW/cm², with power densities of about 9.0
    mW/cm² causing sensations of pain within one second of exposure. It is notable, that
    the non-liner effects apply; e.g. for 3 GHz {decimeter, not millimeter wave lengths},
    the thresholds are on the order of 30 times less.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 9, ¶ A'
  significance: Heat-perception thresholds — heat perception near 0.7 mW/cm² and pain at about 9.0 mW/cm² within one second ("non-liner" is the document's form for non-linear)
  statement_date: '2010-03-11'
- id: q19
  added_date: '2026-05-23'
  text: |-
    For example, in the cases this reviewer has studied, the directionality and the times of
    the known RF / EM exposures and the injury severity and patterns are highly
    consistent: There are no significant differences in either the reported acute effects
    (symptoms) or the physician-observed (signs) between the case of three antenna
    engineers and the Cash-Landrum cases.
  source:
    path: government/dird-26-field-effects-human-biological-tissues-2010.pdf
    location: 'p. 12, ¶ C'
  significance: Cross-case consistency — injury severity and patterns are highly consistent, with no significant differences between the three antenna engineers and the Cash-Landrum cases
  statement_date: '2010-03-11'
