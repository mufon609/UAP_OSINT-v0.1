  text: |-
    This product is one in a series of advanced technology reports produced in FY 2009
    under the Defense Intelligence Agency, [(b)(3):10 USC 424] Advanced Aerospace
    Weapon System Applications (AAWSA) Program. Comments or questions pertaining to
    this document should be addressed to [(b)(3):10 USC 424;(b)(6)], AAWSA Program
    Manager, Defense Intelligence Agency, ATTN: [(b)(3):10 USC 424] Bldg 6000, Washington,
    DC 20340-5100.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'Administrative Note (AAWSA Program paragraph)'
  significance: AAWSA Program provenance — names the FY 2009 AAWSA Program series; the document writes "AAWSA" (not the common "AAWSAP"), and the AAWSA Program Manager identity is withheld under FOIA exemption markers
  statement_date: '2009-12-14'
- id: q7
  added_date: '2026-05-23'
  text: |-
    However, when sensors, filters, emitters, and photovoltaic solar panels are
    made of Programmable Matter smart materials, the solution to a component
    failure or new mission requirement might be as simple as a software update.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Introduction" (paragraph beginning "However, when sensors, filters, emitters")'
  significance: Core premise — when components are made of Programmable Matter smart materials, the solution to a component failure or new mission requirement might be as simple as a software update
  statement_date: '2009-12-14'
- id: q8
  added_date: '2026-05-23'
  text: |-
    Other advantages of dynamic materials include advanced energy management
    and energy scavenging from a variety of sources. Smart materials can even
    create new defensive capabilities, such as chameleon-style camouflage,
    deflection of laser beams, and even outright invisibility.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Introduction" (paragraph beginning "Other advantages of dynamic materials")'
  significance: Defensive framing — smart materials can create new defensive capabilities such as chameleon-style camouflage, deflection of laser beams, and even outright invisibility
  statement_date: '2009-12-14'
- id: q9
  added_date: '2026-05-23'
  text: |-
    If it becomes possible to change the properties of certain materials on demand,
    based on remotely triggered instructions, the benefits for spacecraft—both
    crewed and autonomous—will be considerable. This white paper—by no means
    an exhaustive reference—is intended to serve as a primer on the principles
    behind smart materials and their possible aerospace applications over the next
    50 years.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Introduction" (paragraph beginning "If it becomes possible to change")'
  significance: Scope statement — a white paper intended as a primer on the principles behind smart materials and their possible aerospace applications over the next 50 years
  statement_date: '2009-12-14'
- id: q10
  added_date: '2026-05-23'
  text: |-
    Second, it is possible to pump electrons in and out of a quantum dot using electric
    fields. Thus, instead of a single designer material, it is possible to create a
    programmable material whose "atoms" can be changed on demand, allowing a bounded
    but infinite variety of material properties that can be summoned or dismissed at will.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Four Kinds of Atoms", subsection "QUANTUM DOTS"'
  significance: Mechanism — pumping electrons in and out of a quantum dot with electric fields creates a programmable material whose "atoms" can be changed on demand
  statement_date: '2009-12-14'
- id: q11
  added_date: '2026-05-23'
  text: |-
    In theory, a block of true Programmable Matter should be able to select any point on
    any of these axes at any time. Other effects may be desired as well, including
    magnetoresistivity, photo-/thermo-/piezoelectric effects, superconductivity, and the
    ability to perform computations (a truly "smart" smart material).
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Advantages of Dynamic Materials" (paragraph beginning "In theory, a block of true Programmable Matter")'
  significance: Definition of true Programmable Matter — a block able to select any point on any property axis at any time, including the ability to perform computations
  statement_date: '2009-12-14'
- id: q12
  added_date: '2026-05-23'
  text: |-
    In addition, there is the threat of hackers. As our society turns over
    the control of more and more infrastructure to computers, we add not only new
    strengths but also new vulnerabilities. We must be extremely cautious about handing
    malicious hackers the keys to matter itself!
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Advantages of Dynamic Materials" (paragraph beginning "Although the smart matter of 2050", on the threat of hackers)'
  significance: Threat framing — the threat of hackers; the paper warns about handing malicious hackers the keys to matter itself
  statement_date: '2009-12-14'
- id: q13
  added_date: '2026-05-23'
  text: |-
    Programmable materials can assume novel, unnatural configurations, but their primary
    advantage is that their properties can be changed on demand. Thus, it becomes
    possible, for example, to reconfigure a single spacecraft attitude sensor to operate as a
    sun sensor, horizon sensor, or star sensor, as required.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Advanced Concepts in Programmable Materials" (opening paragraph, on reconfiguring a single attitude sensor)'
  significance: Primary advantage — properties changed on demand, e.g. reconfiguring a single spacecraft attitude sensor to operate as a sun, horizon, or star sensor as required
  statement_date: '2009-12-14'
- id: q14
  added_date: '2026-05-23'
  text: |-
    In a pinch, the station can even turn "invisible," taking light and heat from one side and emitting a matching signal on the other side.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Scenario for Possible Applications"'
  significance: Scenario detail — in a pinch the station can turn "invisible," taking light and heat from one side and emitting a matching signal on the other
  statement_date: '2009-12-14'
- id: q15
  added_date: '2026-05-23'
  text: |-
    Therefore, near-term applications such as smart windows and energy-saving
    metapolarizers, which offer direct and immediate economic advantages (namely energy
    savings) and which dovetail neatly with existing infrastructure, should be considered
    the most promising for research over the next 5 years.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Directions for Future Research" (paragraph beginning "Therefore, near-term applications such as smart windows")'
  significance: Near-term research direction — smart windows and energy-saving metapolarizers, with immediate economic advantages, are the most promising for research over the next 5 years
  statement_date: '2009-12-14'
- id: q16
  added_date: '2026-05-23'
  text: |-
    However, the vast potential of programmable materials and devices, as well as the
    clear advantages they hold in certain earthly and aerospace applications where
    traditional material limitations clearly constrain functionality, should not be
    underestimated. Building and vehicle skins, sensors, and windows are three areas that
    particularly lend themselves to enhancement with multifunctional materials, and the
    commercial advantages of developing these will be considerable.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Directions for Future Research" (paragraph beginning "However, the vast potential of programmable materials")'
  significance: Long-term potential — building and vehicle skins, sensors, and windows are three areas that particularly lend themselves to enhancement with multifunctional materials
  statement_date: '2009-12-14'
- id: q17
  added_date: '2026-05-23'
  text: |-
    Many elements of the preceding scenario are based on current and emerging
    technologies; others are speculative. However, if even a fraction of these possibilities
    were to become reality in crewed and crewless spacecraft, the gains in energy
    efficiency, mass reduction, safety, comfort, and mission flexibility could be extremely
    significant and well worth pursuing. All that is needed is a commitment to develop the
    underlying technologies.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Conclusions"'
  significance: Conclusions — if even a fraction of these possibilities became reality, the gains in energy efficiency, mass reduction, safety, comfort, and mission flexibility could be extremely significant and well worth pursuing
  statement_date: '2009-12-14'
- id: q18
  added_date: '2026-06-07'
  text: |-
    One such "impossible" material hypothesized is the nanostructured "metapolarizer." Where classical polarizers either reflect or absorb half the light that hits them (typically resulting in energy wastage of 50 percent or higher), a metapolarizer simply ignores one polarity of light and converts or rotates or "retards" the other. This principle can be harnessed, for example, to double the battery life of a laptop display or to double the brightness of a flat-screen TV.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "\"Impossible\" Materials" (paragraph beginning "One such \"impossible\" material hypothesized")'
  significance: '"Impossible" materials — defines the nanostructured "metapolarizer," which ignores one polarity of light instead of absorbing half, and could double a laptop display battery life or a flat-screen TV brightness'
  statement_date: '2009-12-14'
- id: q19
  added_date: '2026-06-07'
  text: |-
    A notional "Wellstone" fiber uses careful arrangements of conductors, semiconductors, and insulators to produce a long, flexible cylinder whose surface is studded with artificial atoms. When woven together, these fibers create a bulk material whose properties are programmable via external signals.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Advantages of Dynamic Materials", Figure 4 caption (Wellstone Fiber)'
  significance: Wellstone fiber — a notional "Wellstone" fiber of conductors, semiconductors, and insulators studded with artificial atoms; woven together they create a bulk material whose properties are programmable via external signals
  statement_date: '2009-12-14'
- id: q20
  added_date: '2026-06-07'
  text: |-
    Buildings account for 40 percent of all energy consumed in the United States, including 71 percent of all electricity and 38 percent of all carbon dioxide emissions. Managing solar heat gain and controlling the building's thermal envelope are the most effective ways of reducing energy use.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Advantages of Dynamic Materials" (paragraph beginning "Although thermochromic building materials were very rare", on building energy consumption)'
  significance: Building-energy framing — buildings account for 40 percent of all energy consumed in the United States, 71 percent of all electricity, and 38 percent of all carbon dioxide emissions
  statement_date: '2009-12-14'
- id: q21
  added_date: '2026-06-07'
  text: |-
    RavenWindow film is transparent when cold and partially reflective when hot, allowing an SHGC range between 0.12 and 0.43—more than twice the range studied by LBNL. Studies performed by RavenBrick using LBNL tools show energy savings up to three times those of low-E glass alone.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Early Commercialization of Smart Materials" (paragraph beginning "RavenWindow film is transparent when cold")'
  significance: RavenWindow performance — the film allows an SHGC range between 0.12 and 0.43 (more than twice the range studied by LBNL), with RavenBrick studies showing energy savings up to three times those of low-E glass alone
  statement_date: '2009-12-14'
- id: q22
  added_date: '2026-06-07'
  text: |-
    Assuming a retail cost of $25 per square foot, for large buildings across multiple climate zones, the payback period is 5-10 years. Even faster return on investment is possible if the retail cost can be reduced, which seems likely given the relative simplicity of the technology.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Early Commercialization of Smart Materials" (paragraph beginning "Assuming a retail cost of $25 per square foot")'
  significance: RavenWindow economics — at an assumed retail cost of $25 per square foot, the payback period for large buildings across multiple climate zones is 5-10 years
  statement_date: '2009-12-14'
- id: q23
  added_date: '2026-06-07'
  text: |-
    Fortunately, in 2001, scientists at the Research Triangle Institute in North Carolina used semiconductor superlattices to create a Peltier junction that operated at 2.5 times the efficiency and 23,000 times the speed of all previous designs. The electrically semiconductive superlattice materials were unusually good radiators—and unusually poor conductors—of heat.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Thermal Management of Spacecraft" (paragraph beginning "Fortunately, in 2001, scientists at the Research Triangle Institute")'
  significance: Thermal management — in 2001 the Research Triangle Institute used semiconductor superlattices to build a Peltier junction operating at 2.5 times the efficiency and 23,000 times the speed of all previous designs
  statement_date: '2009-12-14'
- id: q24
  added_date: '2026-06-07'
  text: |-
    Quantum computing is another possibility. Qbits were first demonstrated in 1995 by the National Institute of Standards and Technology in Boulder, Colorado, and by the California Institute of Technology in Pasadena. Because computing power increases exponentially with the number of qbits (versus linearly with the number of binary bits), a 64-qbit computer is roughly 18 billion billion times as powerful as a 64-bit binary one.
  source:
    path: government/dird-02-programmable-matter-20091214.pdf
    location: 'section "Advanced Concepts in Programmable Materials" (paragraph beginning "Quantum computing is another possibility")'
  significance: Quantum computing — qbits were first demonstrated in 1995 by NIST Boulder and Caltech; a 64-qbit computer is roughly 18 billion billion times as powerful as a 64-bit binary one
  statement_date: '2009-12-14'
