    location: 'Metamaterials for Energy Harvesting'
  significance: The wide-angle-absorber claim — success in designing a true impedance-matched optical metamaterial (Reference 20, the WAPAMIR). Preserves the in-document typo "if course" (for "of course") verbatim per no-correction discipline.
