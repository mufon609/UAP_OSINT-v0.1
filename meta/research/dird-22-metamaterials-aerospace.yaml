  significance: 'Program-provenance: FY 2009 DIA Advanced Aerospace Weapon System Applications (AAWSA) Program series; Program Manager withheld [REDACTED: (b)(3):10 USC 424;(b)(6)]. Anchors the document to the AAWSAP DIRD corpus. Bracketed redaction markers preserved verbatim.'
  statement_date: '2010-04-06'
- id: q8
  added_date: '2026-06-07'
  text: >-
    A metamaterial is defined as an artificial medium whose properties (mechanical, optical, magnetic, or other) cannot be found in naturally-occurring materials. The emphasis of this study will be on electromagnetic and optical metamaterials.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Operative definition of metamaterial — an artificial medium with properties not found in natural materials — and the study's scope (electromagnetic and optical metamaterials).
  statement_date: '2010-04-06'
- id: q9
  added_date: '2026-06-07'
  text: >-
    Such metamaterials can exhibit rather extreme properties, such as negative refractive index, which implies that both electric permittivity and magnetic permeability must be negative (ε < 0, μ < 0) (Reference 1). Such metamaterials used to be called "left-handed" because of the unusual phase relationship between the electric and magnetic fields.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Core physics — negative refractive index requires both negative permittivity and negative permeability (ε < 0, μ < 0), the "left-handed" media at the heart of the field.
  statement_date: '2010-04-06'
- id: q10
  added_date: '2026-06-07'
  text: >-
    A typical metamaterial consists of resonant elements such as Split Ring Resonators (SRR). An example of an SRR is shown in Figure 1. The main function of the SRR is to enable strong magnetic response of the structure.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Building-block element — the Split Ring Resonator (SRR), the canonical resonant unit cell providing a metamaterial's strong magnetic response.
  statement_date: '2010-04-06'
- id: q11
  added_date: '2026-06-07'
  text: >-
    In fact, the sub-wavelength size of the metamaterial is what distinguishes them from their close cousins: photonic crystals. By properly designing magnetic SRRs, it is possible to achieve any value of μ for any given frequency.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Distinguishing property — sub-wavelength unit cells set metamaterials apart from photonic crystals and allow any value of magnetic permeability μ to be engineered at a given frequency.
  statement_date: '2010-04-06'
- id: q12
  added_date: '2026-06-07'
  text: >-
    Several new concepts such as Indefinite Permittivity Metamaterials (IPM) (References 3, 4) and Epsilon-Near-Zero (ENZ) metamaterials (Reference 5) have recently emerged and found some exciting applications that will be reviewed below.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Beyond negative-index media — Indefinite Permittivity Metamaterials (IPM) and Epsilon-Near-Zero (ENZ) metamaterials as the newer classes the report surveys.
  statement_date: '2010-04-06'
- id: q13
  added_date: '2026-06-07'
  text: >-
    Yet another class of planar metamaterials, complementary metamaterials (CMMs), has recently emerged (Reference 7). Instead of using metallic structures deposited on a substrate (left panel of Figure 3), CMMs consist of slits in the continuous metal screen (right panel of Figure 3).
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Defines complementary metamaterials (CMMs) — slits in a continuous metal screen rather than deposited metal structures — the class later proposed for energy-harvesting absorbers.
  statement_date: '2010-04-06'
- id: q14
  added_date: '2026-06-07'
  text: >-
    In many instances, metamaterials enable us to considerably minimize sizes of resonators, transmission lines, and so forth. Such miniaturization is possible due to the resonant nature of the individual unit cells.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: The miniaturization principle — metamaterials shrink resonators and transmission lines because the individual unit cells are resonant and sub-wavelength.
  statement_date: '2010-04-06'
- id: q15
  added_date: '2026-06-07'
  text: >-
    It is this miniaturization that makes metamaterials interesting for aerospace application where small weight and size are essential.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: The report's central aerospace thesis — metamaterial miniaturization matters for aerospace because weight and size are at a premium.
  statement_date: '2010-04-06'
- id: q16
  added_date: '2026-06-07'
  text: >-
    Electromagnetic metamaterials have a tremendous potential for revolutionizing propagation, storage, and conversion of electromagnetic waves across the entire Electromagnetic Spectrum.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Scope-of-promise claim — metamaterials could revolutionize propagation, storage, and conversion of EM waves across the entire spectrum.
  statement_date: '2010-04-06'
- id: q17
  added_date: '2026-06-07'
  text: >-
    In our opinion, the most exciting applications that are relevant for aerospace applications include energy harvesting, developing novel optical devices with unusual yet practically important capabilities (for example, non-reciprocal devices), enhancing the efficiency of nonlinear optical devices, developing novel imaging modalities capable of breaking the diffraction limit (for example, super-lenses, hyper-lenses, far field super-lenses), and developing novel lithographic techniques.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Enumerates the report's aerospace-relevant application set — energy harvesting, non-reciprocal devices, nonlinear-optics enhancement, diffraction-breaking imaging (super-/hyper-/far-field super-lenses), and lithography.
  statement_date: '2010-04-06'
- id: q18
  added_date: '2026-06-07'
  text: >-
    The author's research group at UT-Austin, has designed the first Plasmonic Negative Index Metamaterials (P-NIM) super-lens (Reference 14), developed novel techniques for analyzing optical properties of plasmonic nanostructures, (including band-structure calculations of periodic nanostructures) (Reference 15) and quasi-static calculations of plasmonic resonances (Reference 16).
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: In-document attribution to the author's own group — "The author's research group at UT-Austin" designed the first Plasmonic Negative Index Metamaterials (P-NIM) super-lens; corroborates the extrinsic Shvets / UT-Austin authorship.
  statement_date: '2010-04-06'
- id: q19
  added_date: '2026-06-07'
  text: >-
    Also developed is a Wide-Angle "Perfect" Absorber of Mid-Infrared Radiation (WAPAMIR) (Reference 20) based on the negative index metamaterial whose impedance is perfectly matched to vacuum.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Names the group's WAPAMIR (Wide-Angle "Perfect" Absorber of Mid-Infrared Radiation) — an impedance-matched negative-index absorber, the energy-harvesting centerpiece referenced throughout the report.
  statement_date: '2010-04-06'
- id: q20
  added_date: '2026-06-07'
  text: >-
    Applications of metamaterials to photon harvesting is especially fitting for advanced aerospace platforms because of the necessity to collect electromagnetic energy for battery recharging, diagnostic spectroscopy, and other vital functions of a space vehicle.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials'
  significance: Aerospace-platform framing — metamaterial photon harvesting fits advanced aerospace platforms (battery recharging, diagnostic spectroscopy, "vital functions of a space vehicle").
  statement_date: '2010-04-06'
- id: q21
  added_date: '2026-06-07'
  text: >-
    Complementary Metamaterials for Energy Harvesting. Development of ultra-thin photovoltaic and thermo-photovoltaic cells is hampered by weak photon absorption in semiconductors. Metamaterials can modify absorption making it wavelength-selective (tunable), highly efficient, and, if desired, wide-angle.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials (summary bullet — Complementary Metamaterials for Energy Harvesting)'
  significance: Summary-bullet statement of the energy-harvesting case — metamaterials make photon absorption wavelength-selective (tunable), highly efficient, and wide-angle, overcoming weak semiconductor absorption.
  statement_date: '2010-04-06'
- id: q22
  added_date: '2026-06-07'
  text: >-
    Metamaterials enable new imaging modalities: super-lenses, hyper-lenses, and far-field super-lenses.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials (summary bullet — Far Field Super-Lens)'
  significance: Summary-bullet statement of the imaging case — super-lenses, hyper-lenses, and far-field super-lenses as the new diffraction-breaking imaging modalities metamaterials enable.
  statement_date: '2010-04-06'
- id: q23
  added_date: '2026-06-07'
  text: >-
    Metamaterials offer an exciting opportunity to slow down light. This has two major implications: (a) light can be stored/manipulated in smaller volumes, and (b) nonlinear effects are strongly enhanced by the resulting energy compression.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Definition of Metamaterials (summary bullet — Slowing Down Light)'
  significance: Summary-bullet statement of the slow-light case — slowing light lets components shrink (storage in smaller volumes) and strongly enhances nonlinear effects via energy compression.
  statement_date: '2010-04-06'
- id: q24
  added_date: '2026-06-07'
  text: >-
    The super-lens is one of the earliest applications of metamaterials (Reference 21), and its principle is shown in Figure 5. Without the super-lens, all information about sub-diffraction (or sub-wavelengths, which is equivalent) features of the periodic object would have been lost.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Introduces the super-lens as one of the earliest metamaterial applications and its purpose — recovering sub-diffraction (sub-wavelength) information that would otherwise be lost.
  statement_date: '2010-04-06'
- id: q25
  added_date: '2026-06-07'
  text: >-
    By inserting a super-lens between the object and the imaging plane, evanescent waves may be amplified and the image transferred forward.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Mechanism of the super-lens — amplifying evanescent waves to transfer a sub-wavelength image forward, the core trick behind sub-diffraction imaging.
  statement_date: '2010-04-06'
- id: q26
  added_date: '2026-06-07'
  text: >-
    One can envision space expeditions to other planets that could, potentially, result in finding some evidence of primitive cellular-level life. It would then be highly desirable to examine the structure of the living cell in its natural environment.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: The report's most striking aerospace use case — super-lens imaging on space expeditions to examine primitive cellular-level life found on other planets in its natural environment.
  statement_date: '2010-04-06'
- id: q27
  added_date: '2026-06-07'
  text: >-
    One such idea, the hyper-lens, has been proposed recently by two groups (References 22-24), and already experimentally tested by another group (Reference 25). The principle of the hyper-lens is very simple: to use an indefinite permittivity medium (sometimes referred to as the hyperbolic medium because the relationship between the propagation wavenumbers and the frequency, also known as the constant frequency contour, has a hyperbolic nature) in a tapered format.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Defines the hyper-lens — a tapered indefinite-permittivity (hyperbolic) medium, proposed by two groups and experimentally tested by a third — the imaging concept that needs no near-field scanning microscope.
  statement_date: '2010-04-06'
- id: q28
  added_date: '2026-06-07'
  text: >-
    One recent experimental implementation of the hyper-lens in UV is shown in the right panel of Figure 7. The hyper-lens is made of 16 layers of Ag/Al2O3.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Concrete realization — a UV hyper-lens built from 16 layers of Ag/Al2O3, demonstrating magnification and projection of a sub-diffraction image into the far field.
  statement_date: '2010-04-06'
- id: q29
  added_date: '2026-06-07'
  text: >-
    Another concept for sub-wavelength imaging employing metamaterials is the so-called Far-Field Super-Lens (FSL). The concept is pioneered in Reference 27.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Introduces the Far-Field Super-Lens (FSL) — the third sub-wavelength imaging concept, in which a sub-wavelength grating converts propagated sub-diffraction waves into far-field radiation, eliminating the NSOM.
  statement_date: '2010-04-06'
- id: q30
  added_date: '2026-06-07'
  text: >-
    We have already fabricated such IPMs using SiO2-SiC-SiO2 multi-layer, and are investigating other approaches involving selectively-doped semiconductor multi-layers similar to the ones used by Gmachl's group at Princeton. SiO2-SiC-SiO2 multi-layers are produced in-house (with SiC films shipped by Professor Ferro from University of Lyons, France).
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Names the collaborators behind the fabricated IPMs — selectively-doped multi-layers like Gmachl's group at Princeton, and SiC films shipped by Professor Ferro from University of Lyons, France; the report's in-document research network.
  statement_date: '2010-04-06'
- id: q31
  added_date: '2026-06-07'
  text: >-
    This confirms the recently predicted effect that for IPMs one can indeed observe a very counterintuitive effect: sub-diffraction waves can indeed propagate with less loss than the diffraction-limited ones.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: Experimental result (first milestone) — in an indefinite-permittivity medium, sub-diffraction waves propagate with less loss than the radiation-zone (diffraction-limited) waves, a counterintuitive confirmation.
  statement_date: '2010-04-06'
- id: q32
  added_date: '2026-06-07'
  text: >-
    With these two milestones established, it is now possible to conduct true sub-wavelength imaging experiments using two (or more) far-field detectors and jointly processing their inputs.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Sub-Diffraction Imaging: Super-Lens and Hyper-Lens'
  significance: The pay-off statement — having shown propagation of sub-diffraction waves and their interference, true sub-wavelength imaging with two or more far-field detectors becomes possible.
  statement_date: '2010-04-06'
- id: q33
  added_date: '2026-06-07'
  text: >-
    Any structure capable of processing EMPs (be those optical, THz, or microwave) of temporal duration τ must be at least L = cτ long. For example, a 1 ns microwave pulse can be manipulated inside a device that is at least 1 ft long.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Circuits and Waveguide Miniaturization: Slowing Down and Manipulating Electromagnetic Pulses (EMP)'
  significance: The size-limit physics — a pulse-processing device must be at least L = cτ long (a 1 ns microwave pulse needs ~1 ft), the constraint slow-light metamaterials are meant to circumvent.
  statement_date: '2010-04-06'
- id: q34
  added_date: '2026-06-07'
  text: >-
    For aerospace communications systems, it may be very desirable to have the ability to manipulate the format of EMPs, (that is, to change their frequency, duration, and repetition rate).
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Circuits and Waveguide Miniaturization: Slowing Down and Manipulating Electromagnetic Pulses (EMP)'
  significance: Aerospace-communications motivation — manipulating the format of electromagnetic pulses (frequency, duration, repetition rate) for aerospace communications systems.
  statement_date: '2010-04-06'
- id: q35
  added_date: '2026-06-07'
  text: >-
    Specifically, the authors have theoretically demonstrated that an axially varying heterostructure with a metamaterial core of negative refractive index can be used to efficiently and coherently bring light to a complete standstill.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Circuits and Waveguide Miniaturization: Slowing Down and Manipulating Electromagnetic Pulses (EMP)'
  significance: Slow-light mechanism — an axially varying heterostructure with a negative-index metamaterial core can bring light to a complete standstill, the report's headline light-stopping result.
  statement_date: '2010-04-06'
- id: q36
  added_date: '2026-06-07'
  text: >-
    Due to tapering, each frequency component of the wave packet is stopped at a different guide thickness, leading to the spatial separation of its spectrum and the formation of a 'trapped rainbow'.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Circuits and Waveguide Miniaturization: Slowing Down and Manipulating Electromagnetic Pulses (EMP)'
  significance: The "trapped rainbow" effect — waveguide tapering stops each frequency component at a different thickness, spatially separating the spectrum, the broadband light-stopping signature.
  statement_date: '2010-04-06'
- id: q37
  added_date: '2026-06-07'
  text: >-
    Remarkably, at least one group has demonstrated in the past year that EIT can be achieved using plasmonic metamaterials (Reference 32). The idea is to create a plasmonic "molecule" consisting of a radiative element coupled with a subradiant (dark) element.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Circuits and Waveguide Miniaturization: Slowing Down and Manipulating Electromagnetic Pulses (EMP)'
  significance: Plasmonic-EIT route to slow light — a plasmonic "molecule" pairing a radiative element with a subradiant (dark) element reproduces electromagnetically induced transparency in a metamaterial.
  statement_date: '2010-04-06'
- id: q38
  added_date: '2026-06-07'
  text: >-
    If multiple layers of dark/bright antennas are employed as shown in Figure 16, then one can achieve one of the most important manifestations of EIT; "slow" light.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Applications to Circuits and Waveguide Miniaturization: Slowing Down and Manipulating Electromagnetic Pulses (EMP)'
  significance: Stacking dark/bright antenna layers yields "slow" light — one of the most important manifestations of EIT — the practical multi-layer slow-light metamaterial.
  statement_date: '2010-04-06'
- id: q39
  added_date: '2026-06-07'
  text: >-
    One of the most important applications of metamaterials is related to developing "perfect absorbers" of infrared electromagnetic radiation, be it in the mid-to-long infrared part of the spectrum (making it relevant for night vision, harvesting of the Earth glow mid-infrared radiation, and so forth) or in the near-to-mid-IR spectrum (making it relevant for day-time infrared photography of the earth terrain).
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Metamaterials for Energy Harvesting'
  significance: Opens the energy-harvesting section — "perfect absorbers" of infrared radiation for night vision, Earth-glow harvesting, and day-time infrared terrain photography.
  statement_date: '2010-04-06'
- id: q40
  added_date: '2026-06-07'
  text: >-
    In fact, the Earth glow maximum is around λ>10 μm, with most of the energy contained in the 3 μm < λ < 14 μm range. This longer wavelength (mid-to-far IR) spectral range is also very important. It can be used for night-time energy scavenging by high-altitude satellites and other aerospace platforms.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Metamaterials for Energy Harvesting'
  significance: Quantifies the harvestable band — Earth-glow maximum at λ>10 μm, most energy in 3 μm < λ < 14 μm — enabling night-time energy scavenging by high-altitude satellites and aerospace platforms.
  statement_date: '2010-04-06'
- id: q41
  added_date: '2026-06-07'
  text: >-
    The concept of narrow-band metamaterials-based absorbers introduced in Reference 33 has the potential for developing highly efficient bolometer arrays. When applied to the infrared part of the spectrum, it can be used for space navigation, especially when weak infrared signals from specific stellar objects need to be picked up and discriminated from other radiation sources.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Metamaterials for Energy Harvesting'
  significance: Narrow-band absorbers as bolometer arrays for space navigation — picking out weak infrared signals from specific stellar objects, a navigation/ISR application.
  statement_date: '2010-04-06'
- id: q42
  added_date: '2026-06-07'
  text: >-
    This is accomplished by choosing metamaterials parameters such that ε_eff(ω_r) = μ_eff(ω_r) at the resonant frequency ω_r.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Metamaterials for Energy Harvesting'
  significance: The impedance-matching condition for a perfect absorber — effective permittivity equals effective permeability at resonance (ε_eff(ω_r) = μ_eff(ω_r)), driving reflection to zero.
  statement_date: '2010-04-06'
- id: q43
  added_date: '2026-06-07'
  text: >-
    The metamaterial presented here has a 6 micron thick film (that is, λ/50 thickness for THz radiation) and 70 percent absorptivity, which yields an absorption coefficient of 2000 cm^-1.
  source:
    path: government/dird-22-metamaterials-aerospace-20100406.pdf
    location: 'Metamaterials for Energy Harvesting'
  significance: Concrete THz-absorber figures — a 6-micron (λ/50) film with 70 percent absorptivity, giving an absorption coefficient of 2000 cm⁻¹, demonstrating compact thermal-detector absorbers.
  statement_date: '2010-04-06'
- id: q44
