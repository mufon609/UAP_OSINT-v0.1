type: research-artifact
target_node: organizations/aaro
status: active
description: 'The All-domain Anomaly Resolution Office ([`/organizations/aaro`]) is a [`/organizations/dod`] office established on July 15, 2022 by Deputy Secretary of Defense Kathleen Hicks, following the enactment of Section 1683 of the National Defense Authorization Act for Fiscal Year 2022. Per the Hicks establishment memorandum ([`/documents/hicks-aaro-establishment-memo-2022`]), AARO was established "to carry out the duties that were to be fulfi lled by the AOIMSG" [sic — source PDF text reads "fulfi lled"]; upon AARO''s establishment, the Secretary of the [`/organizations/us-navy`] was directed to disestablish the Unidentified Aerial Phenomena Task Force ([`/organizations/uaptf`]).


  The Hicks memorandum states AARO "will serve as the authoritative office of the Unidentified Aerial Phenomena (UAP) and UAP-related activities for the DoD" and "is the DoD focal point for all UAP and UAP-related activities". Its mission is to "synchronize efforts across the Department and with other Federal departments and agencies to detect, identify, and attribute objects of interest in, on, or near military installations, operating areas, training areas, special use airspace, and other areas of interest, and, as necessary, to mitigate any associated threats to safety of operations and national security." Scope includes "anomalous, unidentified space, airborne, submerged, and transmedium objects."


  The Unidentified Aerial Phenomena Task Force was established on August 4, 2020 by Deputy Secretary of Defense David L. Norquist ([`/people/david-norquist`]); the Airborne Object Identification and Management Synchronization Group ([`/organizations/aoimsg`]) was directed by Hicks on November 23, 2021 as the successor to the U.S. Navy''s UAPTF. Following the enactment of Section 1683 of the NDAA for Fiscal Year 2022, Hicks''s July 15, 2022 memorandum issued amendments to her original November 23, 2021 direction: AARO would be established to carry out the duties originally assigned to the AOIMSG. AARO operates in coordination with the Office of the Director of National Intelligence ([`/organizations/odni`]). Per the May 15, 2023 Federal Register notice, the National Aeronautics and Space Administration''s ([`/organizations/nasa`]) UAP Independent Study Team (UAPIST) is a Subcommittee of NASA''s Earth Science Advisory Committee; per AARO Historical Record Report Volume I, UAPIST examined UAP from a scientific perspective from June 2022 to September 2023.


  Dr. Sean M. Kirkpatrick ([`/people/sean-kirkpatrick`]) was asked by USD(I&S) to stand-up and lead AARO in early 2022; he led the office through December 2023. Timothy A. Phillips ([`/people/tim-phillips`]) assumed the duties of the Deputy Director in October 2023 and additionally took on Acting Director duties in December 2023 following Kirkpatrick''s departure; his Acting Director duties ended when Kosloski arrived on August 26, 2024, while his Deputy Director departure date is not documented in archived primary sources. Dr. Jon T. Kosloski ([`/people/jonathan-kosloski`]) arrived on detail from the National Security Agency ([`/organizations/nsa`]) to be appointed the director in 2024. AARO published its [`/documents/aaro-historical-record-report-vol-i`] in March 2024. The Hicks establishment memorandum also renamed the predecessor AOIMEXEC ([`/organizations/aaroexec`]) to the AARO Executive Council — its mission, per the memorandum, is "to provide oversight and direction to the AARO."


  AARO is established under the Under Secretary of Defense for Intelligence and Security (USD(I&S); see [`/organizations/ousd-is`]) per the Hicks establishment memorandum, which directs the USD(I&S) to establish the AARO in coordination with the Director of Administration and Management ([`/organizations/da-m`]). Per the Organization page of the OUSD(I&S) website (ousdi.defense.gov), in the September 12, 2025 capture and the April 20, 2026 capture, AARO is listed under "Direct Report Offices", alongside the OSW Red Team ([`/organizations/osd-red-team`]). Sancorp Consulting, LLC ([`/organizations/sancorp-consulting`]) was awarded prime contracts HQ003422C0094 ("AARO Support Services"; period of performance from August 22, 2022; signed September 1, 2022) and HQ003424C0096 (signed August 23, 2024), both awarded by Washington Headquarters Services ([`/organizations/whs`]). The HQ003422C0094 Performance Work Statement defines task areas including Executive Administrative Support, Strategy, Plans, and Policy Support, Congressional Affairs, Public Affairs, and FOIA Support, Data Architecture Support, Planning, Programming, Budgeting and Executive Support, Reporting Support, and Operations Support; the HQ003422C0094 Routing Data Table identifies AARO as the Service Approver and Service Acceptor at DoDAAC HQ0208. Kirkpatrick''s April 19, 2023 testimony ([`/transcripts/2023-04-19-sasc-kirkpatrick`]) to the Senate Armed Services Subcommittee on Emerging Threats and Capabilities described AARO as currently operating under Title 10 authorities and requested additional authorities including counter-intelligence.


  The HQ003424C0096 award record describes the work as "EXEC. ADMIN, OPS, POLICY & PPBE SPPT SVC". Its transaction records carry the description "OUSDIS ALL-DOMAIN ANOMALY RESOLUTION OFFICE (AARO)" from modification P00005 (July 10, 2025) forward; the base award and the P00001 through P00004 descriptions do not carry that label. The HQ003424C0096 period of performance ended on January 31, 2026. No retrieved award record names a Sancorp AARO support contract after HQ003424C0096 as of September 25, 2026; HQ003426FE050 is not confirmed as AARO support. Modification P00007 (May 6, 2026) records a federal action obligation of -$56454.61; the September 25, 2026 award record reports a total obligation of $3415374.79 with the period of performance ending January 31, 2026, and the April 30, 2026 capture of the same record had reported $3471829.4. The funding agency on the record is the Immediate Office of the Secretary of Defense ([`/organizations/osd`]), funding office "OSD OUSD(I)".


  HQ003426FE050, signed January 28, 2026, is a BPA CALL to Sancorp under HQ003425A0001 for "ADMINISTRATIVE, ANALYTIC, SCIENTIFIC, INFORMATION TECHNOLOGY AND SUBJECT MATTER EXPERTISE SUPPORT SERVICES", funding office "OSD OUSD(I)", place of performance Washington, DC ([`/locations/washington-dc`]), recipient address Falls Church, Virginia ([`/locations/falls-church-virginia`]). Sancorp''s own job requisition 1258 for a Staff Officer III, posted August 10, 2026, uses the same services phrase "in direct support to Research, Development, Test & Evaluation Activities within Office of the Under Secretary of War for Intelligence and Security (OUSW(I&S)) All-Domain Anomaly Resolution Office (AARO)"; the posting names no contract number. Its listed responsibilities include assisting "AARO leadership in the development and promulgation of strategy, plans, and policy", approximately six OSD staff packages a week, and reports and briefings on AARO-related operations for Congressional and Senior Executive Branch officials; its location is the National Capital Region ([`/locations/national-capital-region`]), with requisition location Arlington, VA ([`/locations/arlington-virginia`]), and it describes Sancorp as "an SDVOSB and SBA 8(a) company", SBA being the Small Business Administration ([`/organizations/sba`]). Any link between HQ003426FE050 and AARO is not confirmed: it is based only on the requisition 1258 services phrase. Neither the HQ003426FE050 award record nor any of its five transaction records names AARO. The "OSD OUSD(I)" funding office is not specific to AARO: it appears on the HQ003424C0096 record and also on the HQ003422C0064 record, whose award description is "IPMO SUPPORT SERVICES" ([`/organizations/ipmo`]).


  Arlo Solutions LLC ([`/organizations/arlo-solutions`]) posted positions that it described as supporting AARO on its Greenhouse job board. Its "(617) Staff Officer V" posting, in archived copies captured December 17, 2025 and January 19, 2026, states "The Staff Officer V will support the All-Domain Anomaly Resolution Office (AARO) under the Office of the Under Secretary of War for Intelligence and Security (OUSD(I&S))" and "This key personnel position serves as a senior-level SME"; its listed responsibilities include reports and briefings on AARO operations for Congress ([`/organizations/congress`]), working relationships with the Office of the Director of National Intelligence, analysis of intelligence related activities against the National Defense Strategy ([`/documents/national-defense-strategy`]), and support for development of DOW and Intelligence Community ([`/organizations/intelligence-community`])-wide processes and procedures to enable operational and intelligence reporting of airborne objects of interest including UAP. Its "(619) Security Officer IV" posting, in an archived copy captured January 19, 2026, describes "comprehensive security support for the All-Domain Anomaly Resolution Office (AARO) within the Office of the Under Secretary of War for Intelligence and Security (OUSW(I&S))", including coordination with the Defense Counterintelligence & Security Agency ([`/organizations/dcsa`]) and compliance with DoD Manual 5205.07 ([`/documents/dod-manual-5205-07`]) and DoD Manual 5105.21 ([`/documents/dod-manual-5105-21`]). Both positions are located in Arlington, VA. These dates are capture dates of the archived copies; the rendered page text displays no posting date. Neither posting names a contract, and no award record in these sources names Arlo for AARO work.


  The FY 2024 OSD OP-5 budget submission (released March 20, 2023) named the OUSD(I&S) subordinate office "All-domain Anomaly Resolution Office (AARO)" with mission language drawn from the Hicks establishment memorandum; the FY 2025 OSD OP-5 (released March 11, 2024) is the first budget submission to name an OUSD(I&S) subordinate office "Advanced Intelligence Capabilities (AIC)" with mission language and statutory reporting line that match AARO''s per the Hicks memorandum and 50 U.S.C. § 3373 (reporting to the Deputy Secretary of Defense and the Principal Deputy Director of National Intelligence). The FY 2026 OSD OP-5 (released July 7, 2025) retains the AIC name. The public-facing aaro.mil website and subsequent DoD press releases continue to use the AARO name; no public DoD announcement of an AARO renaming has been issued.


  Per the FY 2026 OSD OP-5 budget submission, in addition to AARO, the OUSD(I&S) operating budget provides funding for the Influence and Perception Management Office ([`/organizations/ipmo`]), the Defense Military Deception Program Office ([`/organizations/dmdpo`]), the OSD Red Team ([`/organizations/osd-red-team`]), the Strategy Coordination Program Office ([`/organizations/scpo`]), the Counterproliferation of Weapons of Mass Destruction Office ([`/organizations/cp-wmd`]), and the Law Enforcement Oversight and Compliance Directorate ([`/organizations/le-oversight-compliance-directorate`]). Sancorp Consulting ([`/organizations/sancorp-consulting`]) also holds a prime contract at IPMO (HQ003422C0064, PWS dated April 25, 2022), issued by Washington Headquarters Services Acquisition Directorate as an 8(a) sole-source procurement.


  In late July 2023, Deputy Secretary of Defense Hicks ([`/people/kathleen-hicks`]) moved to personally oversee AARO and repositioned Director Kirkpatrick ([`/people/sean-kirkpatrick`]) to report directly to her — per DefenseScoop reporting (Brandi Vincent ([`/people/brandi-vincent`]), August 30, 2023). Hicks took action late that month, partly to help speed up AARO''s launch of the congressionally mandated public website (subsequently launched on August 31, 2023). Per the same reporting, between November 2022 and April 2023, the AARO website launch package had moved back and forth between the OUSD(I&S) Front Office and AARO at least every other week under USD(I&S) Moultrie''s ([`/people/ronald-moultrie`]) request, with AARO regularly coordinating the memo and Kirkpatrick attending several in-person meetings with the under secretary. Hicks''s late-July reorganization placed AARO''s operational reporting line under the Deputy Secretary of Defense — one of the two reporting lines required by 50 U.S.C. § 3373 (under which Director, AARO reports to both the Deputy Secretary of Defense and the Principal Deputy Director of National Intelligence) — and followed within days of the July 26, 2023 House Oversight UAP hearing. There is no public evidence that the PDDNI reporting line was given operational effect in parallel with the DEPSECDEF line; the FOIA 24-F-0894 Gough/ODNI exchange documented below shows that ODNI Public Affairs and OSD PA agreed to omit any ODNI reference from the March 2024 Historical Record Report Volume I public rollout despite Gough flagging the PDDNI reporting line.


  AARO Historical Record Report Volume I documents KONA BLUE — a proposed UAP recovery and reverse-engineering program brought to AARO''s attention by interviewees who claimed it was a sensitive Department of Homeland Security ([`/organizations/dhs`]) compartment to cover up the retrieval and exploitation of "non-human biologics." Per the report, KONA BLUE traces its origins to the DIA-managed ([`/organizations/dia`]) AAWSAP/AATIP program (cancelled by DIA in 2012); after cancellation, supporters proposed to DHS that they create and fund a new version under a Special Access Program covering UAP investigations, paranormal research and reverse-engineering of "any recovered off-world spacecraft that they hoped to acquire." A Prospective Special Access Program (PSAP) was officially requested but eventually rejected by DHS leadership for lacking merit. The report''s finding: "no extraterrestrial craft or bodies were ever collected" and the SAP "was never approved or stood up, and no data or material was transferred to DHS."


  Historical Record Report Volume I describes itself as "provided by DoD in response to a requirement established in the National Defense Authorization Act (NDAA) for FY 2023, Section 6802(j)", which requires the Director of the Office to submit to the congressional defense committees, the congressional intelligence committees and the congressional leadership "a written report detailing the historical record of the United States Government relating to unidentified anomalous phenomena" "Not later than 540 days after the date of the enactment of the Intelligence Authorization Act for Fiscal Year 2023" (i.e., approximately June 15, 2024). Historical Record Report Volume I (March 8, 2024) was published before that statutory deadline, satisfying the Section 6802(j) "a written report" requirement; the same Volume I §III states that "AARO will provide its findings to Congress in two volumes" — Volume I containing AARO''s findings "from 1945 to 31 October 2023" and Volume II ("any findings resulting from interviews and research completed from 1 November 2023 to 15 April 2024") — and states that "AARO will publish Volume II in accordance with the date established in Section 6802 of the National Defense Authorization Act for Fiscal Year 2023", applying the same June 15, 2024 date Volume I had already satisfied. As of February 25, 2026 (per archived DefenseScoop coverage), AARO has not published Volume II — approximately 20 months past the June 15, 2024 date AARO drew from Section 6802 for its Vol II commitment.


  Beyond § 3373''s section text, three additional statutory notes codified AARO obligations. P.L. 117-263 § 6803 (IAA FY 2023, Div F, December 23, 2022) — as amended by P.L. 118-159 § 6802 (IAA FY 2025, Div F, December 23, 2024) — directs the Comptroller General of the United States to identify Government Accountability Office ([`/organizations/gao`]) personnel to audit the historical record report process and to verbally brief the congressional intelligence committees, the congressional defense committees, and congressional leadership semiannually until 180 days after the final volume of the Historical Record Report. P.L. 118-159 § 1089 (NDAA FY 2025, Div A, December 23, 2024) directs the Director of the All-domain Anomaly Resolution Office to designate one or more employees to act as a liaison with the Counter Unmanned Aerial Systems Task Force ([`/organizations/c-uas-task-force`]) for information sharing on identified or suspected Unmanned Aerial Systems events, joint development of sensing and response capabilities, and coordinated tactics, techniques, and procedures. P.L. 119-60 §§ 1671(b) and 1673(a) (NDAA FY 2026, Div A, December 18, 2025) require — for the first briefing under § 3373(l)(5) after enactment — inclusion of unidentified anomalous phenomena intercepts conducted by the North American Aerospace Defense Command ([`/organizations/norad`]) or the United States Northern Command ([`/organizations/northcom`]) not previously provided that occurred during the period beginning on January 1, 2004, and an accounting by the Director of security classification guides that apply to information used for reports and investigations of unidentified anomalous phenomena.


  FOIA case 24-F-0894 ([`/documents/blackvault-foia-24-f-0894-aaro-vol-i-rollout-emails`]) (released August 26, 2025; 14 pages responsive across five Initial Denial Authorities — Plescow, Lane, Morrison, Rose, and Shockley, drawn from Intelligence and Security, Legislative Affairs, the Office of the Director of National Intelligence, Public Affairs, and the Under Secretary of Defense for Policy) documents Pentagon internal coordination on the March 8, 2024 AARO Historical Record Report Volume I rollout. On March 5, 2024, Pentagon spokesperson Sue Gough ([`/people/sue-gough`]) emailed her ODNI counterpart asking whether DNI/ODNI should be referenced in the press release given that "Dir, AARO reports to PDDNI, too" per 50 U.S.C. § 3373; the ODNI counterpart replied "Confirming that we''re good without any ODNI mention" — the public rollout omitted any ODNI reference, with the omission agreed by both Pentagon and ODNI Public Affairs offices.


  On March 6, 2024, AARO Acting Director Phillips delivered two classified Hill briefings on the Historical Record Report (Compartmented Annex Brief 1300-1400; TS//SCI Brief 1400-1530), joined in both sessions by Dr. Sean Kirkpatrick ([`/people/sean-kirkpatrick`]) — three months after his December 1, 2023 official AARO departure — and a third (b)(6)-redacted attendee; Hill staff at the Compartmented Annex session asked AARO leadership for "perspectives and recommendations for countering inaccurate or misleading narratives related to UAP based on the review". The same day, PTDO ASD Becky Zimmerman ([`/people/becky-zimmerman`]) briefed 14 senators (Reed ([`/people/jack-reed`]), Wicker ([`/people/roger-wicker`]), Shaheen ([`/people/jeanne-shaheen`]), Gillibrand ([`/people/kirsten-gillibrand`]), Ernst ([`/people/joni-ernst`]), Cramer ([`/people/kevin-cramer`]), Tuberville ([`/people/tommy-tuberville`]), Rounds ([`/people/mike-rounds`]), Schmitt ([`/people/eric-schmitt`]), Cotton ([`/people/tom-cotton`]), Manchin ([`/people/joe-manchin`]), Peters ([`/people/gary-peters`]), Kaine ([`/people/tim-kaine`]), and Kelly ([`/people/mark-kelly`])) on the December events at JBLE; per Lane Bodian''s ([`/people/lane-bodian`]) OSD OASD LA read-out, Sen. Gillibrand ([`/people/kirsten-gillibrand`]) had an "animated response" indicating "sUAS should be catalogued by AARO".


  Heather King ([`/people/heather-king`]), of the Secretary of Defense office, separately emailed the OSD PA chain at 10:19 AM that "the Deputy asked us to flag for you that the Langley topic re: Breaking Defense may be connected to the AARO rollout that occurred this week" — the Deputy Secretary of Defense office linked the JBLE drone story to the AARO Historical Record Report rollout in DoD''s own internal correspondence on the day of the rollout briefings.


  Following Gillibrand''s "animated response" earlier the same day, Sue Gough emailed David A. Kozik ([`/people/david-kozik`]) (OUSD(I&S) Director Congressional Activities) at 1:45 PM with subject "FW: Following up from Unders" and Importance: High flag: "Flagging for you in case you haven''t heard. We do not want to see sUAS added to AARO''s portfolio!" Kozik replied the next morning that AARO "absolutely should be involved in cUAS efforts in a *coordinating* role, but they should not/not be the lead", explaining the Gillibrand "lead role" characterization as "a prep failure on our part for ASD HD&HA".


  Christopher Mellon''s ([`/people/christopher-mellon`]) April 12, 2024 Debrief article "The Pentagon''s New UAP Report is Seriously Flawed" ([`/documents/thedebrief-mellon-aaro-report-flawed-2024`]) provides the most extensive critique of the Historical Record Report. Mellon — former Deputy Assistant Secretary of Defense for Intelligence — noted institutional observations about the report: "submitted months before it was due"; the first AARO report submitted to Congress that the Director of National Intelligence (DNI) did not sign off on (Avril Haines ([`/people/avril-haines`]) and her Office "were quite right not to in this case, having spared themselves considerable embarrassment"); and DoD Public Affairs "sponsored a closed-door pre-brief on the report''s findings for a select group of press outlets on an invitation-only basis. Outlets like The Debrief, which closely follow the UAP issue, were excluded." Mellon also noted that AARO "inexplicably and unbelievably chooses not to mention the Nimitz anywhere in its Historical Report" — the 2004 USS Nimitz UAP encounter ([`/events/2004-nimitz-encounter`]) being "the primary events that led to the current sea change in attitude to UFOs and UAP, leading to the establishment of AARO itself." On statistics, Mellon noted that AARO''s August 2022 figures worked out to 62% unexplained (314 of 510 cases — 143 UAPTF cases plus 171 new AARO cases), and that Kirkpatrick had told CNN in October 2023 that 2–4% of cases are "truly anomalous and require further investigation" — figures absent from the report.


  At the November 13, 2024 House Oversight + Cybersecurity/IT subcommittee hearing "Unidentified Anomalous Phenomena: Exposing the Truth", Subcommittee Chairwoman Nancy Mace ([`/people/nancy-mace`]) (R-S.C.) and Subcommittee Chairman Glenn Grothman ([`/people/glenn-grothman`]) (R-Wis.) delivered opening statements at the joint subcommittee hearing. Mace stated, "We will also hear from the witnesses today allegations of UAP-related misinformation and disinformation by government officials of which they are personally aware and directly experienced." Witnesses submitted written testimony characterizing AARO''s analytic and historical work as flawed. Michael Shellenberger ([`/people/michael-shellenberger`]) wrote that "critics say that AARO''s 63-page history of the US government''s investigation into UAPs since the end of World War II was riddled with factual errors and poor referencing, including to Wikipedia." Shellenberger also wrote that Christopher Mellon ([`/people/christopher-mellon`]) (former Deputy Assistant Secretary of Defense) called the historical records report "the most error-ridden and unsatisfactory government report I can recall reading during or after decades of government service." Tim Gallaudet ([`/people/tim-gallaudet`]) (former NOAA Administrator and Navy Rear Admiral) wrote that "AARO needs to explain the inaccuracies and incompleteness31 of AARO''s first historical records report32 so that the Congress can understand: (a) if AARO is failing to meet its Congressional mandate, and (b) under what authority AARO has conducted this and other examples of disinformation." Gallaudet also wrote that during a meeting with "the then acting AARO director and his senior staff" he "was the object of an hours-long influence operation" attempting to disparage well-known UAP reports including the USS Nimitz tic-tac encounter.


  AARO''s FY 2024 Consolidated Annual Report on Unidentified Anomalous Phenomena ([`/documents/aaro-fy24-consolidated-annual-report-uap-2024`]), dated November 14, 2024, documents 757 UAP reports received during the May 1, 2023 – June 1, 2024 reporting period (485 occurred during the reporting period; 272 occurred outside of the reporting period between 2021 and 2022 and were not included in previous annual UAP reports). 49 cases were resolved during the reporting period (all to prosaic objects); 243 additional cases were recommended for closure pending peer review; 444 cases lacked sufficient data and were placed in the Active Archive. AARO determined 21 cases merit further analysis by its IC and S&T partners "based on reported anomalous characteristics and/or behaviors." The same report documents the GREMLIN prototype sensor system, developed by Georgia Tech Research Institute ([`/organizations/gtri`]), for detecting, tracking, and characterizing UAP — first test event March 2024 with a 90-day pattern-of-life collection scheduled at a site of national security.


  On November 19, 2024 Kosloski appeared before the Senate Armed Services Subcommittee on Emerging Threats and Capabilities — his first hearing as AARO Director. His Statement for the Record reported AARO has "over 1,600 UAP reports in its holdings from across the U.S. government" to date and stated, "to date, AARO has discovered no verifiable evidence of extraterrestrial beings, activity, or technology." Kosloski presented three case resolutions: the 2013 Puerto Rico ([`/locations/puerto-rico`]) transmedium case (assessed as a pair of balloons or sky lanterns floating at 7 knots over an airport, descending to 200 meters), the 2017 GOFAST video (assessed as an object closer to 13,000 feet rather than near the water, with apparent fast movement explained by parallax), and a 2018 Mt. Etna UAV case (a balloon drifting with the wind, with the slide deck stating "approximately 170 kilometers from the volcano" and the stenographic transcript of Kosloski''s oral testimony stating "170 meters away from the plume"). All three case resolutions were presented at high or moderate confidence with the support of IC and S&T partners.


  AARO officially reached Full Operational Capability (FOC) as of October 1, 2024 — the start of Fiscal Year 2025. DefenseScoop exclusively confirmed the FOC status on Thursday, December 5, 2024; DOD spokesperson Sue Gough stated AARO "now has the requisite personnel, expertise, facilities and tools to carry out its core mission". The DefenseScoop article comes as Director Kosloski prepares to participate in a classified briefing with the House Oversight and Accountability Committee on Friday, December 6, 2024 — Subcommittee on National Security, the Border, and Foreign Affairs Chairman Glenn Grothman (R-Wis.) requested the briefing.


  On June 6, 2025, the Wall Street Journal published "The Pentagon Disinformation That Fueled America''s UFO Mythology" ([`/documents/wsj-pentagon-disinformation-ufo-mythology-2025`]) by Joel Schectman ([`/people/joel-schectman`]) and Aruna Viswanatha ([`/people/aruna-viswanatha`]), drawing on extensive interviews with Kirkpatrick. The article documents two AARO Volume II findings. First, a 1980s Air Force colonel near Area 51 had given the owner of a local bar doctored photos of what might be flying saucers, as a ruse to protect testing of the F-117 stealth fighter; the now-retired officer confessed the disinformation to AARO investigators in 2023. Second, a long-running induction briefing ritual, dubbed "Yankee Blue", in which certain new commanders of the Air Force''s most classified programs were handed a piece of paper with a photo of what looked like a flying saucer described as an "antigravity maneuvering vehicle" and told the program they were joining was an effort to reverse-engineer the technology on the craft; many never learned the briefing was fake. Per the WSJ, Kirkpatrick found the practice had begun decades before and appeared to continue still, and the defense secretary''s office sent a memo out across the service in the spring of 2023 ordering the practice to stop.


  On September 5, 2025, President Donald J. Trump ([`/people/donald-trump`]) signed Executive Order 14347 ([`/documents/eo-14347-restoring-department-of-war`]) — "Restoring the United States Department of War" — authorizing "Department of War" and "Secretary of War" as additional secondary titles in non-statutory contexts (Sec. 2(a), Sec. 2(b)); statutory references to Department of Defense remain controlling (Sec. 2(e)). AARO''s parent department naming is affected at the secondary title layer; statutory authority citations on the AARO node continue to use Department of Defense per Sec. 2(e).


  On September 9, 2025, the House Oversight and Government Reform Task Force on the Declassification of Federal Secrets ([`/organizations/oversight-task-force-declassification`]) held a hearing — "Restoring Public Trust Through UAP Transparency and Whistleblower Protection" — at HVC-210 (119th Congress). Per the Task Force''s March 31, 2026 letter to Secretary of War Hegseth, "Whistleblowers informed the Task Force" at the September 9, 2025 hearing that AARO possesses additional video records of potential UAP sightings.


  On February 19, 2026, President Donald J. Trump posted to TRUTH Social directing the Secretary of War "and other relevant Departments and Agencies, to begin the process of identifying and releasing Government files related to alien and extraterrestrial life, unidentified aerial phenomena (UAP), and unidentified flying objects (UFOs), and any and all other information connected to these highly complex, but extremely interesting and important, matters." DefenseScoop''s February 25, 2026 coverage referenced this as Trump''s "UAP disclosure promise" — the forthcoming executive order with which Secretary of War Pete Hegseth ([`/people/pete-hegseth`]) stated AARO would be in "full compliance"; in the same coverage, Jordan Flowers ([`/people/jordan-flowers`]), executive director of the Disclosure Foundation ([`/organizations/disclosure-foundation`]), encouraged the Pentagon to move quickly, pointing to AARO''s "long-overdue" annual and historical reports, anticipated UAP classification guide, and vacant deputy director role.


  On March 31, 2026, the House Oversight and Government Reform Task Force on the Declassification of Federal Secrets ([`/organizations/oversight-task-force-declassification`]), Chairwoman Anna Paulina Luna ([`/people/anna-paulina-luna`]) (R-Fla.), wrote to Secretary of War Hegseth ([`/documents/oversight-house-uap-request-letter-luna-2026`]) requesting delivery of 46 UAP video files "as soon as possible but no later than April 14, 2026". The letter states that "Whistleblowers informed the Task Force that AARO possesses additional video records of potential UAP sightings" and that "The Task Force has found responses from AARO, when questioned about UAP sightings and provided data, less than adequate." The list includes UAP clips referenced by callsign and date — spherical UAP, transmedium UAP, MQ-9 sightings, and the February 12, 2023 USAF ANG F-16C "shoots down UAP over Lake Huron". Cc: the Honorable Jasmine Crockett ([`/people/jasmine-crockett`]), Ranking Member of the Task Force.


  The April 14 deadline passed without delivery of the requested videos. On April 16, 2026, Luna told NewsNation she is prepared to compel production of the footage if "institutional resistance continues" and to work with House Oversight Committee Chairman James Comer ([`/people/james-comer`]) to exercise the committee''s subpoena authority. Luna described Hegseth as a close working partner aligned with President Donald Trump''s directive on UAP disclosure and said she intends to work directly with him to secure the footage; she also called for the removal of the unelected official she said was responsible for failing to route her March 31 letter to the appropriate authorities within the department. On April 18, 2026, a Defense Department spokesperson stated to NBC News that AARO is "working in close coordination with the White House and across federal agencies to consolidate existing UAP records collections and facilitate the expeditious release of never-before-seen UAP information." The statement added "We welcome the president''s initiative to supercharge these efforts and make more UAP information available to the public as soon as possible."


  AARO''s Fiscal Year 2025 Consolidated Annual Report on Unidentified Anomalous Phenomena ([`/documents/aaro-fy25-consolidated-annual-report-uap`]) carries "DEPARTMENT OF WAR" above "ALL-DOMAIN ANOMALY RESOLUTION OFFICE" on its title page, with an information cut off of May 30, 2025; the report does not state a publication date. It covers UAP-related events from June 2, 2024, to May 30, 2025, and states that AARO drafted it in coordination with the Military Services, DoW, and Intelligence Community partners. AARO received 319 reports of UAP-related events during that period, and as of May 30, 2025, AARO''s case holdings contain 1,870 reports. AARO resolved 114 of the 319 UAP reports and 256 cases reported in a previous period, for 370 resolved cases during the reporting period; the report assesses that all resolved cases are attributable to prosaic objects and that none indicate advanced foreign adversarial capabilities or breakthrough technologies. It gives 238 reported UAP resolved as satellite flaring with a new analytic capability, and in a separate section 44 UAP-related events resolved as satellite flaring during the reporting period; the report does not explain the difference between the two figures. Civilian pilot estimates of phenomenon altitudes tended to range from 45,000 to 60,000 feet, and AARO resolved many of these reports as satellite flaring based on their reported characteristics. AARO transferred 191 of the 319 cases to its active archive and identified nine reports meriting further analysis by its IC and science and technology partners. Of the 44 space-domain reports, 42 originated from civilian pilot reports via the Federal Aviation Administration ([`/organizations/faa`]) and two from ground-based U.S. Space Command ([`/organizations/usspacecom`]) sensors. The single maritime domain case involved a report from U.S. Navy ([`/organizations/us-navy`]) assets operating off the coast of Virginia ([`/locations/virginia`]) describing approximately 100 airborne UAP, which AARO is actively investigating. AARO received 50 reports from the Administrator for Nuclear Security ([`/organizations/national-nuclear-security-administration`]) and Chairman of the Nuclear Regulatory Commission ([`/organizations/nuclear-regulatory-commission`]) regarding unmanned aerial systems (UAS) incidents near U.S. nuclear infrastructure, weapons, and launch sites; none of these incidents were reported as UAP. The report states that, to date, no evidence suggests that a USG or private entity has ever captured or exploited UAP-derived materials.


  The FY 2025 report also states that AARO, as the DoW''s mission manager for UAP response, aims to fully implement the Joint Staff''s ([`/organizations/joint-staff`]) classified UAP GENADMIN from February 2025 ([`/documents/joint-staff-uap-genadmin-2025`]), and that AARO''s deputy director, who is not named, presented a mission briefing to the Defense Geospatial Intelligence conference ([`/events/defense-geospatial-intelligence-conference`]) in London ([`/locations/london`]), United Kingdom ([`/locations/united-kingdom`]). Between June 2, 2024, and May 30, 2025, 262 individuals contacted AARO via the secure reporting mechanism on its website; AARO determined that 255 were out-of-scope and identified 7 whose claims warranted a request for a follow-on interview. The report names Dr. Jon Kosloski as AARO Director. It states that AARO has published case resolutions for the case known to the public as "Go Fast" ([`/media/go-fast`]) and for a UAP event occurring in Aguadilla, Puerto Rico, in 2013 ([`/events/aguadilla-incident`]), and that AARO launched an Electronic Freedom of Information Act (E-FOIA) Reading Room ([`/documents/aaro-e-foia-reading-room`]).


  On July 22, 2026, per the Congressional Record ([`/documents/crec-20260722-house-hr8800-ndaa-fy2027`]), the House of Representatives ([`/organizations/united-states-house-of-representatives`]), in the Committee of the Whole House on the state of the Union, agreed to amendments en bloc No. 5 ([`/events/2026-07-22-house-ndaa-fy2027-en-bloc-5`]) to H.R. 8800 ([`/documents/ndaa-fy2027`]), the National Defense Authorization Act for Fiscal Year 2027. The package, offered by Mr. Rogers of Alabama ([`/people/mike-rogers`]) and printed in part A of House Report 119-755 ([`/documents/house-report-119-755`]), included Amendment No. 315 offered by Mr. Burlison of Missouri ([`/people/eric-burlison`]) ([`/documents/ndaa-fy2027-amendment-315-burlison`]), a new subtitle for an Unidentified Anomalous Phenomena Records Collection at the National Archives and Records Administration ([`/organizations/nara`]). Two of its provisions name the All-domain Anomaly Resolution Office, identified as established pursuant to section 1683 of the National Defense Authorization Act for Fiscal Year 2022 ([`/documents/ndaa-fy2022`]). Under SEC. 1746(f)(6), the Unidentified Anomalous Phenomena Records Review Board ([`/organizations/uap-records-review-board`]) shall brief the Office, or any successor Office established by law, on the Controlled Disclosure Campaign Plan ([`/documents/controlled-disclosure-campaign-plan`]), classified appendix, and postponed disclosures. Under SEC. 1750(b)(2), the Office, or its successor as subsequently designated by Act of Congress ([`/organizations/congress`]), shall develop standardized unidentified anomalous phenomena declassification guidance for records generated by originating bodies subsequent to termination of the Review Board. The Committee rose that day having come to no resolution on H.R. 8800; the Record does not show passage of the bill.


  On July 31, 2026, Washington Headquarters Services ([`/organizations/whs`]), on behalf of AARO, posted a notice of intent to sole source ([`/documents/samgov-nufohrc-20260731-notice`]; solicitation NUFOHRC_20260731) for a multi-year subscription service for digital access to data, metadata, and analytical products from the National Unidentified Flying Object Historic Records Center (NUFOHRC; [`/organizations/nufohrc`]) of Rio Rancho, NM ([`/locations/rio-rancho-new-mexico`]). The proposed contract structure is a one-year base period with four one-year option periods, and the stated purpose is to gain insights into UAP through the analysis of historical cases (pre-1990). The notice cites 10 U.S.C. 3204(a)(1) ([`/documents/10-usc-3204`]) as implemented by FAR 6.302-1 ([`/documents/far-6-302-1`]), states that NUFOHRC is considered the only source capable of satisfying the requirement, and lists Tiffany Reddick ([`/people/tiffany-reddick`]) and Jacqueline Patierno ([`/people/jacqueline-patierno`]) as primary and secondary contacts; responses were due August 17, 2026. It is a notice of intent to award, not an award, and no award is confirmed in these sources. DefenseScoop (Brandi Vincent ([`/people/brandi-vincent`]), September 2, 2026) reported the plan and quoted a source who asked to be referred to as a War Department official, who declined to disclose the DOD''s estimated total cost. Per the article, NUFOHRC was founded and is led by David Marler ([`/people/david-marler`]), and its holdings include rare personal files once belonging to Dr. J. Allen Hynek ([`/people/j-hynek`]), who worked for the Air Force''s Project Blue Book ([`/organizations/project-blue-book`]). The article also ties the purchase to congressional requirements, including the fiscal 2023 NDAA ([`/documents/ndaa-fy2023`]), which it says directed AARO to compile a comprehensive historical record report on the U.S. government''s UAP-related intelligence and military engagements and assets from 1945 onward, and the fiscal 2024 NDAA ([`/documents/ndaa-fy2024`]) mandate for the UAP Records Collection at the National Archives and Records Administration ([`/organizations/nara`]).


  In TIME''s August 6, 2026 article by Jeffrey Kluger ([`/people/jeffrey-kluger`]), which states that AARO was established in 2022 "to detect, identify and attribute objects of interest," Jon Kosloski, "director of AARO", says "Great claims require great evidence". The same article reports that the White House ([`/organizations/white-house`]) established the UAP Science Advisory Council ([`/organizations/uap-science-advisory-council`]), a body led by Avi Loeb ([`/people/avi-loeb`]); Loeb told TIME he was tasked to create a panel for the White House, AARO, the Director of National Intelligence ([`/organizations/odni`]), the FBI ([`/organizations/fbi`]), and related agencies. A TIME image caption states that on April 19, 2023, Sean Kirkpatrick, director of AARO, shared a video ([`/media/aaro-metallic-orb-video-2023`]) that depicts an apparent silver, orblike object, and that Kirkpatrick said the "metallic orbs" are the most common type of UAP and are reported from "all over the world."


  On September 14, 2026, per DefenseScoop (Brandi Vincent), the Pentagon issued a formal waiver ([`/documents/dow-pursue-uap-disclosure-waiver-2026`]) that supersedes civil and administrative enforcement provisions contained within Non-Disclosure Agreements (NDAs) and Special Access Program Indoctrination Agreements (SAPIAs), strictly for communications with the PURSUE team — representatives authorized under the Trump administration''s Presidential Unsealing and Reporting System for UAP Encounters (PURSUE; [`/organizations/pursue`]) project, which President Donald Trump ([`/people/donald-trump`]) unveiled earlier in 2026. The article describes AARO as an information-gathering body that investigates the Pentagon''s ever-growing caseload of UAP incidents and synchronizes military data sharing with other parts of the federal government, and names no AARO role in PURSUE or in the waiver. In it, Disclosure Foundation ([`/organizations/disclosure-foundation`]) executive director Jordan Flowers ([`/people/jordan-flowers`]) said that binding law protects individuals who share information with AARO and now PURSUE against lawsuit, prosecution, and retaliation regardless of an NDA.

  '
