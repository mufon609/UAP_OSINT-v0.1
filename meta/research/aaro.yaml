document_intrinsic:
  full_name: All-domain Anomaly Resolution Office
  statutory_authority: '50 U.S.C. § 3373 — § 1683 of P.L. 117-81 (NDAA FY 2022); amended by P.L. 117-263 § 1673(c) (NDAA FY 2023 Div A) + § 6802(a) (IAA FY 2023 Div F); P.L. 118-31 § 7341 (NDAA FY 2024 — (k)(1) heading + (k)(1)(A) text); P.L. 119-60 §§ 1671(a)+1672(b) (NDAA FY 2026 — (f)(1)(A)+(l))'
  established_date: '2022-07-15'
  parent_organization_path: /organizations/ousd-is
  current_director_path: /people/jonathan-kosloski
  office_type: DoD office
context_extrinsic:
  display_title: AARO — All-domain Anomaly Resolution Office
quotes:
- id: q1
  added_date: '2026-04-20'
  text: 'The mission of the AARO will be to "synchronize efforts across the Department and with other Federal departments and agencies to detect, identify, and attribute objects of interest in, on, or near military installations, operating areas, training areas, special use airspace, and other areas of interest, and, as necessary, to mitigate any associated threats to safety of operations and national security."

    '
  source:
    path: government/media-defense-gov-hicks-aaro-establishment-memo-20220715.pdf
    location: p. 1
  significance: Mission statement (Hicks establishment memo)
  context: Hicks memo establishing AARO, July 15, 2022
  statement_date: '2022-07-15'
- id: q2
  added_date: '2026-04-20'
  text: This includes anomalous, unidentified space, airborne, submerged, and transmedium objects.
  source:
    path: government/media-defense-gov-hicks-aaro-establishment-memo-20220715.pdf
    location: p. 1
  significance: Scope — domains covered (Hicks memo)
  context: Hicks memo establishing AARO, July 15, 2022
  statement_date: '2022-07-15'
- id: q3
  added_date: '2026-04-20'
  text: The AARO will serve as the authoritative office of the Unidentified Aerial Phenomena (UAP) and UAP-related activities for the DoD.
  source:
    path: government/media-defense-gov-hicks-aaro-establishment-memo-20220715.pdf
    location: p. 2
  significance: Authoritative office designation (Hicks memo)
  context: Hicks memo establishing AARO, July 15, 2022
  statement_date: '2022-07-15'
- id: q4
  added_date: '2026-04-20'
  text: The AARO is the DoD focal point for all UAP and UAP-related activities and may represent the Department for such activities to the interagency, Congress, media, and public, in coordination with the Assistant Secretary of Defense for Legislative Affairs and Assistant to the Secretary of Defense for Public Affairs.
  source:
    path: government/media-defense-gov-hicks-aaro-establishment-memo-20220715.pdf
    location: p. 2
  significance: DoD focal point role + external-representation authority (Hicks memo)
  context: Hicks memo establishing AARO, July 15, 2022
  statement_date: '2022-07-15'
- id: q5
  added_date: '2026-04-20'
  text: by renaming and expanding the scope of the Airborne Object Identification and Management Group (AOIMSG) to the All-domain Anomaly Resolution Office (AARO), due to the enactment of the National Defense Authorization Act for fiscal 2022, which included a provision to establish an office, in coordination with DNI, with responsibilities that were broader than those originally assigned to the AOIMSG.
  source:
    path: government/defense-gov-aaro-establishment-20220720.html
    location: article body ¶1
  significance: Establishment context — AOIMSG renaming and scope expansion per NDAA FY2022
  context: DoD press release announcing AARO establishment, July 20, 2022
  statement_date: '2022-07-20'
- id: q6
  added_date: '2026-04-20'
  text: During his tenure, Dr. Kirkpatrick stood up the office and its operations, investigated more than 800 unidentified anomalous phenomena (UAP) cases, led an extensive search for U.S. Government and contractor programs associated with UAP, and established the department's first public-facing website
  source:
    path: government/defense-gov-kirkpatrick-departure-20231120.html
    location: article body ¶3
  significance: Kirkpatrick tenure accomplishments — 800+ UAP cases investigated, aaro.mil launched
  context: DoD statement on Kirkpatrick's upcoming departure, November 20, 2023
  statement_date: '2023-11-20'
- id: q7
  added_date: '2026-04-20'
  text: Today, Dr. Jon T. Kosloski arrived on detail from the National Security Agency to be appointed as the director of the All-domain Anomaly Resolution Office.
  source:
    path: government/defense-gov-kosloski-appointment-20240826.html
    location: article body ¶1
  significance: Kosloski director appointment — NSA detail
  context: DoD announcement of Kosloski appointment, August 26, 2024
  statement_date: '2024-08-26'
- id: q8
  added_date: '2026-04-20'
  text: As the AARO director, Dr. Kosloski will head DoD's efforts, in coordination with the Intelligence Community, to minimize technical and intelligence surprise by synchronizing scientific, intelligence, and operational detection, identification, attribution, and mitigation of unidentified anomalous phenomena (UAP) in the vicinity of national security areas.
  source:
    path: government/defense-gov-kosloski-appointment-20240826.html
    location: article body ¶3
  significance: Director-level mission framing per Kosloski appointment
  context: DoD announcement of Kosloski appointment, August 26, 2024
  statement_date: '2024-08-26'
- id: q9
  added_date: '2026-04-20'
  text: AARO found no evidence that any USG investigation, academic-sponsored research, or official review panel has confirmed that any sighting of a UAP represented extraterrestrial technology.
  source:
    path: government/aaro-hrr-volume-1-20240308.pdf
    location: Executive Summary, p. 7
  significance: HRR Vol I top-line finding — no confirmed extraterrestrial UAP sightings in prior USG investigations
  context: AARO Historical Record Report Volume I Executive Summary, March 2024
  statement_date: '2024-03-08'
- id: q10
  added_date: '2026-04-20'
  text: AARO found no empirical evidence for claims that the USG and private companies have been reverse-engineering extraterrestrial technology.
  source:
    path: government/aaro-hrr-volume-1-20240308.pdf
    location: Executive Summary, p. 7
  significance: HRR Vol I top-line finding — no empirical evidence for USG reverse-engineering claims
  context: AARO Historical Record Report Volume I Executive Summary, March 2024
  statement_date: '2024-03-08'
- id: q11
  added_date: '2026-04-30'
  text: |
    I direct the USD(I&S) to establish the AARO, in coordination with the Director of
    Administration and Management.
  source:
    path: government/media-defense-gov-hicks-aaro-establishment-memo-20220715.pdf
    location: 'p. 1, ¶3 (third bullet of amendments)'
  significance: Hicks AARO establishment memo (July 15, 2022) — directive to the USD(I&S) to establish AARO, in coordination with the Director of Administration and Management.
  context: Hicks AARO establishment memo, July 15, 2022
  statement_date: '2022-07-15'
- id: q11a
  added_date: '2026-05-22'
  text: |
    Consistent with section 1683 of the NDAA for FY
    2022, I also direct the Secretary of the Navy to disestablish the Unidentified Aerial
    Phenomena Task Force (UAPTF) no later than the date the AARO is established, and
    to support the orderly transition of the UAPTF, including the transfer of any data,
    analysis, or other relevant material, to the AARO.
  source:
    path: government/media-defense-gov-hicks-aaro-establishment-memo-20220715.pdf
    location: 'p. 1, ¶3 (third bullet of amendments)'
  significance: 'Hicks AARO establishment memo (July 15, 2022): the Secretary of the Navy is directed to disestablish the UAPTF and transfer its data, analysis, and other relevant material to the AARO.'
  analysis: 'The directive is to disestablish the UAPTF no later than the date the AARO is established, and to support the orderly transition of the UAPTF, including the transfer of any data, analysis, or other relevant material, to the AARO.'
  context: Hicks AARO establishment memo, July 15, 2022
  statement_date: '2022-07-15'
- id: q12
  added_date: '2026-04-30'
  text: |
    The contractor shall provide Congressional Affairs, Public Affairs. and FOIA
    SuppOI1 Services in accordance with Section 5.4 of the Performance Work
    Statement (PWS), the attached documents and all other requirements listed in this
    document.
  source:
