- id: q186
  added_date: '2026-09-26'
  text: 'In 2022, the All-domain Anomaly Resolution Office (AARO) was established “to detect, identify and attribute objects of interest.”'
  source:
    path: news/time-america-taking-extraterrestrials-seriously-20260806.html
    location: '¶ Congressional hearings into the origins of the sightings'
  significance: 'TIME narration giving AARO''s 2022 establishment and its mission phrase ("to detect, identify and attribute objects of interest"), which the article puts in quotation marks without attributing it to a speaker or document.'
  context: 'TIME news feature by Jeffrey Kluger (published Aug 6, 2026, updated Aug 7, 2026). The sentence sits in the article''s government-response paragraph, between "Congressional hearings into the origins of the sightings were held in 2022 and 2023." and the December 2023 signing of the Unidentified Anomalous Phenomena Disclosure Act. The quoted mission phrase has no named source in the article.'
  claim_group: aaro-establishment-and-mission
  statement_date: '2026-08-06'
- id: q187
  added_date: '2026-09-26'
  text: 'At about the same time, the White House established the UAP Science Advisory Council, a body led by Harvard astrophysicist and cosmologist Avi Loeb to study the national-security risks posed by UAPs.'
  source:
    path: news/time-america-taking-extraterrestrials-seriously-20260806.html
    location: '¶ On June 12, capturing the global hunger'
  significance: 'TIME (August 6, 2026): TIME narration reports that the White House set up the UAP Science Advisory Council, led by Avi Loeb.'
  analysis: 'This is TIME''s own reporting, not a quote. This is the body that, in Loeb''s quote in the next paragraph, he was "tasked to create" for the White House, AARO, the DNI, the FBI, and related agencies.'
  context: '"At about the same time" refers to the June 12 (2026) release of Steven Spielberg''s film Disclosure Day, named in the same paragraph. TIME news feature by Jeffrey Kluger (Aug 6, 2026).'
  claim_group: uap-science-advisory-council-interagency-panel
  statement_date: '2026-08-06'
- id: q188
  added_date: '2026-09-26'
  text: '“I was tasked to create a panel for the White House, AARO, the Director of National Intelligence, the FBI, and related agencies, so that all of these organizations are in contact [about UAPs],” says Loeb.'
  source:
    path: news/time-america-taking-extraterrestrials-seriously-20260806.html
    location: '¶ “I was tasked to create a panel'
  significance: 'TIME (August 6, 2026): Avi Loeb, chair of the White House UAP Science Advisory Council, names AARO as one of the agencies his panel was set up to connect.'
  analysis: 'Loeb names AARO alongside the White House, the Director of National Intelligence, and the FBI. This is Loeb''s voice as quoted by TIME, not AARO''s. It supports the claim that Loeb "was tasked to create a panel for the White House, AARO, the Director of National Intelligence, the FBI".'
  context: 'Loeb speaking to TIME (Jeffrey Kluger, Aug 6, 2026), in the paragraph right after the one reporting the White House''s establishment of the UAP Science Advisory Council. The bracketed "[about UAPs]" is TIME''s editorial insertion and is kept verbatim. The same paragraph goes on to a second Loeb quote ("It’s clear, based on much better sensors...") that does not name AARO and is not part of this span.'
  claim_group: uap-science-advisory-council-interagency-panel
  statement_date: '2026-08-06'
- id: q189
  added_date: '2026-09-26'
  text: 'On April 19, 2023, Sean Kirkpatrick, director of the All-domain Anomaly Resolution Office (AARO), shared a video that depicts an apparent silver, orblike object crossing a video sensor’s field of view. Kirkpatrick said the “metallic orbs” are the most common type of UAP and are reported from “all over the world.”'
  source:
    path: news/time-america-taking-extraterrestrials-seriously-20260806.html
    location: '¶ On April 19, 2023, Sean Kirkpatrick (image caption)'
  significance: 'TIME image caption (August 6, 2026): as relayed by TIME, AARO director Sean Kirkpatrick shared an orb video on April 19, 2023 and called "metallic orbs" the most common UAP type.'
  analysis: 'A TIME image caption identifying Sean Kirkpatrick as AARO director on April 19, 2023. It reports that he shared a video of a silver, orb-like object and that he described "metallic orbs" as the most common UAP type, reported "all over the world". It is AARO''s characterization as relayed by TIME.'
  context: 'Photo/video caption in the TIME feature (Jeffrey Kluger, Aug 6, 2026), followed by the credit line "U.S. Department of War (DOW)—The appearance of U.S. DOW visual information does not imply or constitute DOW endorsement." The span is TIME''s caption narration. Only the two quoted fragments ("metallic orbs", "all over the world.") are Kirkpatrick''s words, so neither sentence is a direct Kirkpatrick quote. The caption gives the date but does not name where the video was shown.'
  claim_group: aaro-metallic-orb-characterization-2023
  statement_date: '2026-08-06'
- id: q190
  added_date: '2026-09-26'
  text: 'Civilian pilot estimates of phenomenon altitudes tended to range from 45,000 to 60,000 feet. However, AARO resolved many of these reports as satellite flaring based on their reported characteristics.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 8, ¶2'
  significance: 'AARO FY2025 annual UAP report (information cut-off May 30, 2025): civilian pilot altitude estimates ran 45,000 to 60,000 feet, and AARO resolved many of these reports as satellite flaring.'
  analysis: 'These are the closing sentences of the altitude paragraph (continuing the preceding passage from the same paragraph). Context for the satellite-flaring figures reported elsewhere in the report (238 resolved via the new modeling capability, pp. 3 and 12; 44 UAP-related events in the reporting period, p. 9); the report itself does not reconcile the two counts.'
  context: "Section IV.B, Reported Altitudes for Airborne UAP; immediately follows the collection-bias sentence about FAA-derived higher-altitude reports."
  claim_group: morphology-and-altitude-trends
- id: q191
  added_date: '2026-09-26'
  text: 'It operates as an information-gathering body that investigates the Pentagon’s ever-growing caseload of UAP incidents and synchronizes military data sharing with other parts of the federal government.'
  source:
    path: news/defensescoop-pursue-waiver-legal-relief-20260914.html
    location: '¶ It operates as an information-gathering body'
  significance: 'DefenseScoop (September 14, 2026): the article''s only description of AARO is an information-gathering body that investigates the Pentagon''s UAP caseload and synchronizes military data sharing with other parts of the federal government.'
  analysis: 'The article assigns AARO no role in the PURSUE disclosure pathway or the waiver, and this sentence is its whole account of AARO''s function. It backs the timeline''s "names no AARO role in PURSUE" framing.'
  context: 'DefenseScoop narration (article by Brandi Vincent, September 14, 2026, on the Pentagon PURSUE NDA/SAPIA waiver), directly following the sentence that says Congress''s mandate led the Biden administration to set up AARO in 2022, and directly before the paragraph that introduces the broader PURSUE effort. This is the publication''s own characterization of AARO, not a statement by AARO.'
  claim_group: pursue-waiver-aaro-whistleblower-protection
  statement_date: '2026-09-14'
- id: q192
  added_date: '2026-09-27'
  text: 'Direct Report Offices All-domain Anomaly Resolution Office OSW Red Team'
  source:
