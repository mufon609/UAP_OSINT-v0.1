- id: q33
  added_date: '2026-05-01'
  text: 'AARO is working closely with its IC and S&T partners to understand and attribute the 21 cases received this reporting period that merit further analysis based on reported anomalous characteristics and/or behaviors.'
  source:
    path: government/aaro-fy24-consolidated-annual-report-uap-20241114.pdf
