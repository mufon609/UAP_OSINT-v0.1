- id: q37
  added_date: '2026-05-01'
  text: 'AARO will publish Volume II in accordance with the date established in Section 6802 of the National Defense Authorization Act for Fiscal Year 2023 (FY23); Volume II will provide analysis of information acquired by AARO after the date of the publication of Volume I.'
  source:
    path: government/aaro-hrr-volume-1-20240308.pdf
    location: 'HRR Vol I, p. 7, Executive Summary'
  significance: 'AARO HRR Vol I (March 8, 2024): AARO commits to publish Volume II by the date established in Section 6802 of the FY 2023 NDAA, analyzing information acquired after Volume I.'
  analysis: 'The commitment is to publish Vol II "in accordance with the date established in Section 6802 of the National Defense Authorization Act for Fiscal Year 2023" (codified in IAA FY 2023, Section 6802(j), with a 540-day deadline from December 23 2022 enactment, i.e., approximately June 15, 2024 — the deadline that HRR Vol I (March 8, 2024) had already satisfied for the Section 6802(j) "a written report" requirement). As of February 25, 2026 DefenseScoop coverage attests Vol II remains unpublished — approximately 20 months past the June 15, 2024 date AARO drew from Section 6802 for the Vol II commitment.'
  context: 'AARO Historical Record Report Volume I (March 8, 2024), Executive Summary statement on Volume II'
  statement_date: '2024-03-08'
- id: q38
  added_date: '2026-05-01'
  text: |-
    This HR2 is provided by DoD in response to a requirement established in the National
    Defense Authorization Act (NDAA) for FY 2023, Section 6802(j), which states: “Not later than
    540 days after the date of the enactment of the Intelligence Authorization Act for Fiscal Year
    2023, the Director of the Office shall submit to the congressional defense committees, the
    congressional intelligence committees and the congressional leadership a written report detailing
    the historical record of the United States Government relating to unidentified anomalous
    phenomena.”
  source:
    path: government/aaro-hrr-volume-1-20240308.pdf
    location: 'HRR Vol I, Scope section'
  significance: 'AARO HRR Vol I Scope section (March 8, 2024): the report quotes Section 6802(j) of the FY 2023 NDAA verbatim, setting a 540-day statutory deadline for the Historical Record Report.'
  analysis: 'HRR Vol I quotes Section 6802(j) of NDAA FY 2023 verbatim. The IAA FY 2023 was enacted as part of P.L. 117-263 (NDAA FY2023) on December 23, 2022, making the Section 6802(j) deadline approximately mid-June 2024.'
  context: 'AARO Historical Record Report Volume I (March 8, 2024), Scope section'
  statement_date: '2024-03-08'
- id: q39
  added_date: '2026-05-01'
  text: |-
    But critics say that AARO’s 63-page history of the US government’s
    investigation into UAPs since the end of World War II was riddled with factual errors
    and poor referencing, including to Wikipedia.
  source:
    path: government/oversight-house-gov-shellenberger-written-testimony-20241113.pdf
    location: 'p. 4'
  significance: 'Shellenberger written testimony — disclosure-side critique characterization of HRR Vol I as "riddled with factual errors and poor referencing, including to Wikipedia"; representative public-record critique posture opposing AARO''s historical analysis.'
  context: 'Michael Shellenberger written testimony for the November 13, 2024 House Oversight + Cybersecurity/IT subcommittee hearing "Unidentified Anomalous Phenomena: Exposing the Truth"'
  statement_date: '2024-11-13'
- id: q40
  added_date: '2026-05-01'
  text: |-
    Christopher Mellon, a former Deputy Assistant Secretary of Defense, wrote a
    lengthy rebuttal, concluding, “this is the most error-ridden and unsatisfactory
    government report I can recall reading during or after decades of government
    service.”
  source:
    path: government/oversight-house-gov-shellenberger-written-testimony-20241113.pdf
    location: 'p. 4'
  significance: 'Shellenberger written testimony — Christopher Mellon (former DASD(I)) rebuttal of HRR Vol I, "the most error-ridden and unsatisfactory government report I can recall reading during or after decades of government service"; substantive disclosure-side critique attributed to a former DoD official.'
  context: Shellenberger written testimony, November 13 2024 House Oversight hearing
  statement_date: '2024-11-13'
- id: q41
  added_date: '2026-05-01'
  text: |-
    AARO needs to explain the inaccuracies and incompleteness31 of AARO’s first
    historical records report32 so that the Congress can understand: (a) if AARO is failing to meet its
    Congressional mandate, and (b) under what authority AARO has conducted this and other
    examples of disinformation.
  source:
    path: government/oversight-house-gov-gallaudet-written-testimony-20241113.pdf
    location: 'p. 5, recommended-action item 1'
  significance: 'Gallaudet written testimony — calls for AARO to explain "inaccuracies and incompleteness" of HRR Vol I and questions whether AARO is failing its Congressional mandate or conducting "disinformation"; recommended Congressional action.'
  context: 'Tim Gallaudet (former NOAA Administrator and Navy Rear Admiral) written testimony for the November 13, 2024 House Oversight + Cybersecurity/IT subcommittee hearing'
  statement_date: '2024-11-13'
- id: q42
  added_date: '2026-05-01'
  text: |-
    I say this as a first-hand witness to such disinformation. During a meeting with the then
    acting AARO director and his senior staff earlier this year, I was the object of an hours-long
    influence operation which attempted to convince me of the validity of the severely flawed
    historical records report, question well known UAP reports such as the U.S.S. Nimitz “tic tac”
    encounter, and disparage several former government authorities who have published and
    spoken publicly about their knowledge of U.S. government UAP programs.
  source:
