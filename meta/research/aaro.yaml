  statement_date: '2024-11-14'
- id: q34
  added_date: '2026-05-01'
  text: 'AARO has begun collections using a prototype sensor system, GREMLIN, for detecting, tracking, and characterizing UAP. GREMLIN demonstrated functionality and successfully collected data during a test event in March of 2024. The next step for GREMLIN is a 90-day pattern of life collection at a site of national security.'
