- id: q135
  added_date: '2026-09-26'
  text: 'DEPARTMENT OF WAR ALL-DOMAIN ANOMALY RESOLUTION OFFICE Fiscal Year 2025 Consolidated Annual Report on Unidentified Anomalous Phenomena Information Cut Off: May 30, 2025'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 1, title block'
  significance: "Title-page provenance: AARO's FY2025 consolidated annual UAP report, issued under the Department of War masthead, information cut-off May 30, 2025."
  claim_group: fy25-report-provenance
- id: q136
  added_date: '2026-09-26'
  text: 'The Department of War (DoW) provides this report pursuant to a requirement established under section 3373k of Title 50, United States Code. This document contains all reported unidentified anomalous phenomena (UAP)-related events occurring from June 2, 2024, to May 30, 2025, and UAP-related events occurring within any previous period not covered in a previous report.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶1'
  significance: "Statutory basis (50 U.S.C. 3373) and reporting window (June 2, 2024 to May 30, 2025) of the FY2025 report."
  claim_group: fy25-report-provenance
- id: q137
  added_date: '2026-09-26'
  text: 'The DoW provides this report pursuant to a requirement established under section 3373(k)(1)(A) of Title 50, United States Code'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶10'
  significance: "Scope section's fuller statutory citation, 3373(k)(1)(A), for the annual report requirement."
  claim_group: fy25-report-provenance
- id: q138
  added_date: '2026-09-26'
  text: 'AARO drafted this report in coordination with the Military Services, DoW, and Intelligence Community (IC) partners across the United States Government (USG).'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 5, ¶6'
  significance: "Authorship and coordination statement: AARO drafted the report with Military Services, DoW, and IC partners."
  claim_group: fy25-report-provenance
- id: q139
  added_date: '2026-09-26'
  text: 'The All-domain Anomaly Resolution Office (AARO) received 319 reports of UAP-related events. Of those, 284 feature UAP-related events occurring during the reporting period and 35 reports feature UAP-related events occurring outside the reporting period. AARO resolved 114 of the 319 UAP reports. In addition, AARO resolved 256 cases reported in a previous period, bringing the total number of resolved cases during the reporting period to 370.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶2'
  significance: "Headline FY2025 case statistics: 319 reports received, 114 resolved, plus 256 prior-period resolutions for 370 total."
  claim_group: fy25-case-statistics
- id: q140
  added_date: '2026-09-26'
  text: 'As of May 30, 2025, AARO’s case holdings contain 1,870 reports. From June 2, 2024, to May 30, 2025, AARO received 319 UAP reports, of which 284 featured UAP-related events occurring during the reporting period and 35 featured UAP-related events that occurred between 2010 and 2024. Of these, AARO assesses that 274 UAP reports occurred in the air domain, 44 in the space domain, and one in the maritime domain.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 5, ¶7'
  significance: "Cumulative case holdings (1,870) and domain breakdown of the 319 FY2025 reports (274 air, 44 space, 1 maritime)."
  claim_group: fy25-case-statistics
- id: q141
  added_date: '2026-09-26'
  text: 'AARO assesses that all resolved cases are attributable to prosaic objects such as balloons, satellites, birds, aircraft, and unmanned aerial systems (UAS). AARO also assesses that one case is attributable to a commercial rocket launch and one to a manned jet pack.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶3'
  significance: "AARO's assessment that every resolved case was prosaic, including one rocket launch and one manned jet pack."
  claim_group: fy25-case-resolution-prosaic
- id: q142
  added_date: '2026-09-26'
  text: 'AARO resolved 114 of the 319 UAP reports, each attributable to various prosaic objects such as balloons, birds, satellites, aircraft, UAS, and a single instance each of a rocket launch and a manned jet pack. Pending review and director authorization, AARO’s analytic team recommends the closure of three additional cases.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶4'
  significance: "Section-level restatement of the 114 prosaic resolutions, plus three further closures pending director authorization."
  claim_group: fy25-case-resolution-prosaic
- id: q143
  added_date: '2026-09-26'
  text: 'AARO continues to resolve many UAP-related events as balloons of various kinds, ranging from latex or reflective foil “party balloons” to large research balloons carrying tethered payloads.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 9, ¶2'
  significance: "Balloons remain a major category of prosaic resolution."
  claim_group: fy25-case-resolution-prosaic
- id: q144
  added_date: '2026-09-26'
  text: 'None of the cases AARO resolved indicate advanced foreign adversarial capabilities or breakthrough technologies in any domain.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶8'
  significance: "AARO's finding that no resolved case indicated foreign adversary capabilities or breakthrough technology."
  claim_group: no-foreign-adversary-breakthrough
- id: q145
  added_date: '2026-09-26'
  text: 'None of AARO’s space-domain case assessments originated from space-based sensors. Forty-two UAP reports originated from civilian pilot reports via the Federal Aviation Administration (FAA), and two originated from ground-based U.S. Space Command sensors.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 5, ¶8'
  significance: "Sourcing of the 44 space-domain reports: 42 civilian-pilot reports via FAA and two from U.S. Space Command ground-based sensors."
  claim_group: satellite-flaring-resolutions
- id: q146
  added_date: '2026-09-26'
  text: 'AARO applied all-source analysis 1 techniques and three-dimensional modeling to render a high-confidence assessment for each of these cases as being attributable to satellite flaring.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶1 (continues p. 5, ¶8 across the page break)'
  significance: "The space-domain cases were each assessed with high confidence as satellite flaring (the '1' is an inline footnote marker, preserved verbatim)."
  claim_group: satellite-flaring-resolutions
- id: q147
  added_date: '2026-09-26'
  text: 'The flaring phenomenon is responsible for a growing number of AARO’s total case resolutions as the office’s modeling techniques improve and reports increase.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶2'
  claim_group: satellite-flaring-resolutions
- id: q148
  added_date: '2026-09-26'
  text: 'AARO resolved 44 UAP-related events as attributable to satellite flaring during the reporting period.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 9, ¶1'
  significance: "Section IV.C figure of 44 satellite-flaring resolutions, which sits alongside the 238 figure given on p. 3 and p. 12."
  claim_group: satellite-flaring-resolutions
- id: q149
  added_date: '2026-09-26'
  text: 'During this reporting period, AARO onboarded a new analytic capability that has significantly improved the office’s ability to efficiently determine when UAP reports are attributable to satellite flaring. This capability, consisting of advanced three-dimensional modeling and simulation applications, enabled analysts to resolve 238 reported UAP as satellite flaring.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 12, ¶1'
  significance: "New 3-D modeling and simulation capability credited with resolving 238 reported UAP as satellite flaring."
  claim_group: satellite-flaring-resolutions
- id: q150
  added_date: '2026-09-26'
  text: 'The single maritime domain UAP case AARO received involved a report from U.S. Navy assets operating off the coast of Virginia. The report described approximately 100 airborne UAP and two, likely uncrewed, surface systems. AARO is actively investigating this event in coordination with the reporting unit.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶3'
  significance: "The sole maritime-domain case: a U.S. Navy report off Virginia describing about 100 airborne UAP and two likely uncrewed surface systems, still under active investigation."
  claim_group: maritime-virginia-case
- id: q151
  added_date: '2026-09-26'
  text: 'AARO identified nine reports meriting further analysis by its IC and science and technology (S&T) partners with relevant technical and domain expertise.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶5'
  significance: "Nine reports referred to IC and S&T partners for further analysis."
  claim_group: fy25-case-statistics
- id: q152
  added_date: '2026-09-26'
  text: 'AARO transferred 191 of the 319 UAP cases to its active archive pending the future discovery of corroborating data sources. The active archive is a category of UAP reports with insufficient data to assess whether the performance characteristics of the underlying event are consistent with those of natural phenomena or exceed the known state-of-the-art for technological systems.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 6, ¶6'
  significance: "191 of 319 FY2025 cases moved to the active archive for insufficient data."
  claim_group: active-archive
- id: q153
  added_date: '2026-09-26'
  text: 'As previously reported, a collection bias favoring the continental United States, its littoral waters, and global U.S. military operational areas, influences AARO’s UAP case holdings. Locations with a higher density of U.S. military sensors and assets tend to submit more UAP reports.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶8'
  claim_group: collection-bias-and-data-constraints
- id: q154
  added_date: '2026-09-26'
  text: 'A lack of timely and actionable sensor data continues to constrain AARO’s ability to resolve cases. AARO has worked alongside its military and technical partners to mitigate these constraints by clearly articulating optimal sensor requirements, information-sharing processes, and the essential elements of information that inform high-quality UAP reporting. AARO also continues to expand engagement, information-sharing, and collaboration with foreign partners.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶9'
  significance: "AARO's statement that a lack of timely, actionable sensor data continues to constrain case resolution."
  claim_group: collection-bias-and-data-constraints
- id: q155
  added_date: '2026-09-26'
  text: 'FAA UAP reports from civilian aviators constituted 21 percent of AARO’s incoming reporting. These reports, although less data-rich on an individual basis than most DoW reporting, provide AARO invaluable access to a much broader pool of reporting for potentially anomalous incidents over the continental United States and its littoral waters.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 7, ¶1'
  significance: "FAA civilian-aviator reports made up 21 percent of incoming reporting."
  claim_group: faa-reporting
- id: q156
  added_date: '2026-09-26'
  text: 'Reporting trends for UAP morphologies remain consistent with historical patterns. In incidents where reporters provided a description of the phenomenon’s distinct visual characteristics, lights (33 percent) and spheroidal objects (40 percent) were the most reported morphologies (Figure 3).'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 7, ¶2'
  significance: 'AARO FY2025 annual UAP report (information cut-off May 30, 2025): spheroidal objects (40 percent) and lights (33 percent) were the most reported UAP morphologies.'
  analysis: 'This is the morphology distribution. The in-text figure reference (Figure 3) does not match the morphology chart, which is captioned Figure 2 on p. 8.'
  claim_group: morphology-and-altitude-trends
- id: q157
  added_date: '2026-09-26'
  text: 'Of the reports AARO analyzed, 77 of the 319 UAP reports (24.13 percent) contained insufficient information to render an analytic conclusion on the phenomenon’s morphological characteristics.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 8, ¶1'
  claim_group: morphology-and-altitude-trends
- id: q158
  added_date: '2026-09-26'
  text: 'Airborne UAP-related events were predominately reported between 10,000 and 35,000 feet. UAP-related events reported above 45,000 feet fell from 27 percent of reports to 4 percent since AARO’s FY 2024 annual report. AARO assesses that this notable difference in reported altitudes stems from a collection bias in the previous reporting period having favored a batch of FAA-derived reports of higher-altitude phenomena.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 8, ¶2'
  significance: "Altitude trend compared with the FY2024 annual report: reports above 45,000 feet fell from 27 to 4 percent, which AARO attributes to a prior FAA-derived collection bias."
  claim_group: morphology-and-altitude-trends
- id: q159
  added_date: '2026-09-26'
  text: 'No reports indicated a flight safety concern during this reporting period.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 9, ¶3'
  claim_group: health-and-flight-safety
- id: q160
  added_date: '2026-09-26'
  text: 'To date, AARO has not received a UAP report in which a reporter described sustaining adverse health effects associated with their experience.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 10, ¶6'
  claim_group: health-and-flight-safety
- id: q161
  added_date: '2026-09-26'
  text: 'Two UAP reports described electronic or avionic interference as attributable to UAP in proximity to an operational aircraft. AARO has not yet rendered a determination on whether, and to what extent, the reported effects are attributable to UAP.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 3, ¶6'
  significance: 'AARO FY2025 annual UAP report (information cut-off May 30, 2025): two reports attributed electronic or avionic interference to UAP near an operational aircraft, with no determination yet.'
  analysis: 'The report describes two reports of electronic/avionic interference attributed to UAP near an operational aircraft. Section IV.E (p. 10, ¶2) restates this in near-identical words.'
  claim_group: electronic-interference-reports
- id: q162
  added_date: '2026-09-26'
  text: 'AARO received and analyzed several reports describing UAP in or near national security sites or critical infrastructure. Some narrative reports were suggestive of phenomena whose performance characteristics exceed the known state-of-the-art within a given domain. No technical data accompanied these reports. If validated, the attendant phenomena underlying these reports may represent a currently unmitigated threat vector.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 10, ¶1'
  significance: 'AARO FY2025 annual UAP report (information cut-off May 30, 2025): AARO acknowledges narrative reports near national-security sites that suggest performance beyond the known state of the art.'
  analysis: 'It says they would be a ''currently unmitigated threat vector'' if validated, though no technical data accompanied them.'
  claim_group: restricted-airspace-critical-infrastructure
- id: q163
  added_date: '2026-09-26'
  text: 'AARO received 50 reports from the Administrator for Nuclear Security and Chairman of the Nuclear Regulatory Commission regarding unmanned aerial systems (UAS) incidents near U.S. nuclear infrastructure, weapons, and launch sites, a 177.8 percent increase over the 18 reported in AARO’s FY 2024 annual report. None of these incidents were reported as UAP.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 10, ¶3'
  significance: 'AARO FY2025 annual UAP report (information cut-off May 30, 2025): 50 UAS incidents near nuclear sites were reported through the Administrator for Nuclear Security and NRC Chairman, up from 18 in FY2024.'
  analysis: 'None were reported as UAP.'
  claim_group: nuclear-site-uas
- id: q164
  added_date: '2026-09-26'
  text: 'During the reporting period, 33 of 50 (66 percent) incidents occurring near nuclear infrastructure involved one UAS, with the other 17 involving between 2 and 7 UAS. Most cases – 47 of the 50 – occurred between 1700 and 0500 local time.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 10, ¶4'
  claim_group: nuclear-site-uas
- id: q165
  added_date: '2026-09-26'
  text: 'To date, no evidence suggests that a USG or private entity has ever captured or exploited UAP-derived materials. AARO is currently developing a formalized process for handling UAP-derived materials by an appropriate line organization, should such materials ever come into the possession of the USG. AARO’s development process draws on established USG capabilities and operating procedures governing the recovery of foreign materiel.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 10, ¶5'
  significance: 'AARO FY2025 annual UAP report (information cut-off May 30, 2025): no evidence suggests any USG or private entity has captured or exploited UAP-derived materials.'
  analysis: 'This is AARO''s FY2025 position. It is also developing a formal handling process for such materials.'
  claim_group: capture-exploitation-no-evidence
- id: q166
  added_date: '2026-09-26'
  text: 'During the reporting period, AARO continued to engage with international partners to exchange information and best practices for UAP reporting, analysis, and response. AARO’s deputy director presented a mission briefing to the Defense Geospatial Intelligence conference in London, United Kingdom.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 11, ¶1–¶2'
  significance: "Foreign-partner engagement, including the (unnamed) AARO deputy director's mission briefing at the Defense Geospatial Intelligence conference in London."
  claim_group: foreign-partner-engagement
- id: q167
  added_date: '2026-09-26'
  text: 'AARO works closely with the military Services, Combatant Commands, and the relevant cognizant authorities in each operational area or domain to develop coordinated UAP mitigation and response plans, including robust reporting processes. As the DoW’s mission manager for UAP response, AARO aims to fully implement the Joint Staff’s classified UAP GENADMIN from February 2025.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 11, ¶3'
  significance: "AARO describes itself as the DoW's mission manager for UAP response and names the Joint Staff's classified February 2025 UAP GENADMIN."
  claim_group: roles-responsibilities-genadmin
- id: q168
  added_date: '2026-09-26'
  text: 'The military Services’ counterintelligence, law enforcement, and security agencies are the cognizant authorities responsible for responding to UAP incidents and incursions on all DoW installations and ranges.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 11, ¶4'
  claim_group: roles-responsibilities-genadmin
- id: q169
  added_date: '2026-09-26'
  text: 'AARO hosts a secure reporting mechanism on its public website, www.aaro.mil. This mechanism enables and encourages individuals claiming first-hand knowledge of a USG UAP-related program or activity dating back to 1945 to report information to AARO.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 11, ¶5'
  claim_group: authorized-reporting-mechanism
- id: q170
  added_date: '2026-09-26'
  text: 'AARO is authorized by law to receive all UAP-related information, including any classified national security information involving military or intelligence related activities, at any level of classification, regardless of any restrictive access controls, special access controls, or compartmented access programs. Generally, no restrictions, including non-disclosure agreements, prevent AARO from receiving UAP-related information, regardless of the organizational affiliation of the original classification authority within the DoW, the IC, or any other USG department or agency.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 11, ¶6'
  significance: "AARO's statement of its legal authority to receive UAP information at any classification level, and that non-disclosure agreements generally do not bar disclosure to AARO."
  claim_group: authorized-reporting-mechanism
- id: q171
  added_date: '2026-09-26'
  text: 'Between June 2, 2024, and May 30, 2025, 262 individuals contacted AARO via the secure reporting mechanism on its website. AARO determined that 255 were out-of-scope and identified 7 individuals whose claims warranted a request for a follow-on interview. AARO prioritizes interviewing current or former USG employees, contractors, or service members claiming to have first-hand knowledge of a USG UAP-related program per the eligibility requirement for a report to qualify as an authorized disclosure.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 11, ¶7'
  significance: "Authorized-disclosure statistics: 262 contacts, 255 out of scope, 7 warranting follow-on interview requests."
  claim_group: authorized-reporting-mechanism
- id: q172
  added_date: '2026-09-26'
  text: 'In FY2025, AARO launched several multi-domain, multi-modal sensor and algorithmic prototyping initiatives to detect, track, characterize, identify and potentially attribute anomalous detections.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 12, ¶2'
  claim_group: prototyping-and-investment-strategy
- id: q173
  added_date: '2026-09-26'
  text: 'AARO Director Dr. Jon Kosloski participated in several on-camera interviews with national-level audiences, including both traditional television and new media formats. AARO’s effort to engage with a broad audience supports the office’s objectives to destigmatize UAP reporting, emphasize the national security implications associated with domain awareness gaps, and inform the public on what information is most valuable when making a UAP report.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 12, ¶3'
  significance: "Names Dr. Jon Kosloski as AARO Director and describes his on-camera media engagement in the FY2025 period."
  claim_group: public-engagement-and-case-releases
- id: q174
  added_date: '2026-09-26'
  text: 'AARO has published case resolutions, imagery, calculations, and modeling associated with some of the UAP cases best known to the public. These include the case known to the public as “Go Fast,” originally released via unauthorized disclosure in 2017, and a well-known UAP event occurring in Aguadilla, Puerto Rico, in 2013. Responding to public interest, AARO also published newly declassified imagery associated with unresolved UAP reports that lack sufficient technical data for analysis.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 12, ¶5'
  significance: "AARO names its published resolutions of the 'Go Fast' case, which it characterizes as originally released via unauthorized disclosure in 2017, and of the 2013 Aguadilla, Puerto Rico event."
  claim_group: public-engagement-and-case-releases
- id: q175
  added_date: '2026-09-26'
  text: 'AARO launched an “Electronic Freedom of Information Act (E-FOIA) Reading Room” containing responsive documents to FOIA requests relating to AARO since its establishment.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 12, ¶6'
  claim_group: public-engagement-and-case-releases
- id: q176
  added_date: '2026-09-26'
  text: 'AARO will continue to develop partnerships across the USG, academia, and commercial communities. AARO seeks to capitalize on a diverse set of sensor technology capabilities and intelligence analytic tradecraft through these partnerships to improve the USG’s effort to investigate and respond to UAP in the air, maritime, and space domains at scale and speed.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 12, ¶7'
  claim_group: prototyping-and-investment-strategy
- id: q177
  added_date: '2026-09-26'
  text: 'AARO is implementing a multi-year investment strategy to improve awareness across the space, air, and maritime domains. These investments focus on augmenting existing USG sensor architectures, prototyping and field-testing new technologies, and developing novel analytic techniques using proven technologies and methodologies. Collectively, these initiatives aim to deliver real-time UAP detection and identification capabilities (i.e. domain awareness), thereby enabling USG organizations to more effectively respond to UAP, tactically and nationally.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 13, ¶1'
  significance: "Way Forward: a multi-year investment strategy toward real-time UAP detection and identification."
  claim_group: prototyping-and-investment-strategy
- id: q178
  added_date: '2026-09-26'
  text: 'Unidentified Anomalous Phenomenon (UAP): Sources of anomalous detections in one or more domain (i.e., airborne, maritime, spaceborne, and/or transmedium) that are not attributable to known actors and that demonstrate behaviors that are not readily understood by sensors or observers. “Anomalous detections” include but are not limited to phenomena that demonstrate apparent capabilities or material that exceed known performance envelopes.'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 14, ¶2'
  significance: "AARO's glossary definition of UAP in the FY2025 report."
  claim_group: uap-definitions
- id: q179
  added_date: '2026-09-26'
  text: 'UAP Incursion: Any UAP incident occurring in, on, or near U.S. military installations, operating areas, training areas, special use airspace, proximity operations, or other national security areas of interest such as U.S. critical infrastructure, IC equities, or the national defense equities of U.S. defense partners, military allies, and intelligence coalitions (e.g., FVEY).'
  source:
    path: government/aaro-fy25-consolidated-annual-report-uap.pdf
    location: 'p. 14, ¶9'
  claim_group: uap-definitions
- id: q180
  added_date: '2026-09-26'
  text: '“Great claims require great evidence,” says Jon Kosloski, director of AARO, “and the evidence just isn’t there yet.”'
  source:
    path: news/time-america-taking-extraterrestrials-seriously-20260806.html
    location: '¶ Not everyone is persuaded by the reports.'
  significance: 'The sitting AARO director, speaking to TIME in the office''s official capacity, states AARO''s evidentiary position on the extraordinary-origin reading of UAP reports as of the article''s August 2026 publication.'
  context: 'TIME news feature by Jeffrey Kluger (published Aug 6, 2026, updated Aug 7, 2026); the quote opens the article''s skeptics passage ("Not everyone is persuaded by the reports.") and is followed by former astronaut Scott Kelly''s skepticism. The contiguous span includes TIME''s attribution clause identifying Kosloski as "director of AARO".'
  claim_group: aaro-director-evidentiary-position-2026
  statement_date: '2026-08-06'
- id: q181
  added_date: '2026-09-26'
  text: 'Binding law protects individuals who share information with AARO and now PURSUE against lawsuit, prosecution, and retaliation regardless of an NDA — or any other restraint'
  source:
    path: news/defensescoop-pursue-waiver-legal-relief-20260914.html
    location: '¶ “Binding law protects individuals who share information with AARO'
  significance: 'DefenseScoop (September 14, 2026): Disclosure Foundation Executive Director Jordan Flowers says "binding law" protects individuals who share information with AARO and now PURSUE "regardless of an NDA".'
  analysis: 'Flowers, to DefenseScoop, says the protection is against lawsuit, prosecution, and retaliation. The protection attaches to the individuals who share information, not to AARO or PURSUE; this is the one passage in the article that names AARO alongside the new PURSUE pathway as a place individuals share information.'
  context: 'Flowers statement to DefenseScoop ("he told DefenseScoop"), DefenseScoop article by Brandi Vincent, September 14, 2026, on the Pentagon PURSUE NDA/SAPIA waiver'
  claim_group: pursue-waiver-aaro-whistleblower-protection
  statement_date: '2026-09-14'
- id: q182
  added_date: '2026-09-26'
  text: '(6) Briefing the all-domain anomaly resolution office.--Coincident with the provision in paragraph (5), if not accomplished earlier under paragraph (4), the Review Board shall brief the All-domain Anomaly Resolution Office established pursuant to section 1683 of the National Defense Authorization Act for Fiscal Year 2022 (50 U.S.C. 3373), or any successor Office established by law, on the Controlled Disclosure Campaign Plan, classified appendix, and postponed disclosures.'
  source:
    path: government/crec-20260722-house-hr8800-ndaa-fy2027.htm
    location: '¶ "Briefing the all-domain anomaly resolution office" (Amendment No. 315, SEC. 1746(f)(6); Record page H5120)'
  significance: 'Congressional Record, House (July 22, 2026): House-adopted Amendment No. 315 to H.R. 8800 directs the proposed UAP Records Review Board to brief AARO, or any successor office, on the Controlled Disclosure Campaign Plan.'
  analysis: 'This is House-adopted statutory text (carried in amendments en bloc No. 5) directing the Review Board to brief AARO, or any successor office established by law, on the Controlled Disclosure Campaign Plan, its classified appendix, and postponed disclosures; identifies AARO by its establishment authority, sec. 1683 of the FY2022 NDAA (50 U.S.C. 3373).'
  context: 'Amendment No. 315 offered by Mr. Burlison of Missouri to H.R. 8800 (FY2027 NDAA), one of the amendments comprising amendments en bloc No. 5 offered by Mr. Rogers of Alabama and agreed to in the Committee of the Whole, Congressional Record (House), July 22, 2026. Paragraph (5) is the Review Board''s 90-day advance written notice of termination; paragraph (4) is its periodic copies-and-briefs duty to the President, the Archivist, congressional leadership and committees.'
  claim_group: ndaa-fy2027-amdt-315-review-board-briefing
  statement_date: '2026-07-22'
- id: q183
  added_date: '2026-09-26'
  text: '(b) Other Provisions.--(1) The remaining provisions of this subtitle shall continue in effect until such time as the Archivist certifies to the President and Congress that all unidentified anomalous phenomena records have been made available to the public in accordance with this subtitle. (2) In facilitation of the provision in paragraph (1), the All-domain Anomaly Resolution Office established pursuant to section 1683 of the National Defense Authorization Act for Fiscal Year 2022 (50 U.S.C. 3373), or its successor as subsequently designated by Act of Congress, shall develop standardized unidentified anomalous phenomena declassification guidance applicable to any and all unidentified anomalous phenomena records generated by originating bodies subsequent to termination of the Review Board consistent with the requirements and intent of the Controlled Disclosure Campaign Plan with respect to unidentified anomalous phenomena records originated prior to Review Board termination.'
  source:
    path: government/crec-20260722-house-hr8800-ndaa-fy2027.htm
    location: '¶ "(b) Other Provisions" (Amendment No. 315, SEC. 1750(b); Record page H5121)'
  significance: 'Congressional Record, House (July 22, 2026): House-adopted Amendment No. 315 assigns AARO, or its successor designated by Act of Congress, to develop standardized UAP declassification guidance for records generated after the Review Board terminates.'
  analysis: 'This is House-adopted statutory text assigning AARO a continuing post-Review-Board role: develop standardized UAP declassification guidance for all UAP records generated after the Review Board terminates, consistent with the Controlled Disclosure Campaign Plan; paragraph (1) keeps the non-Review-Board provisions in force until the Archivist certifies all UAP records public.'
  context: 'Amendment No. 315 offered by Mr. Burlison of Missouri to H.R. 8800 (FY2027 NDAA), one of the amendments comprising amendments en bloc No. 5 offered by Mr. Rogers of Alabama and agreed to in the Committee of the Whole, Congressional Record (House), July 22, 2026. Under SEC. 1744(l)(1) the Review Board terminates on September 30, 2030.'
  claim_group: ndaa-fy2027-amdt-315-declassification-guidance
  statement_date: '2026-07-22'
- id: q184
  added_date: '2026-09-26'
  text: 'Amendments en bloc No. 5 consisting of amendment Nos. 266, 267, 268, 269, 270, 271, 272, 273, 274, 275, 276, 277, 278, 279, 280, 281, 282, 283, 284, 285, 286, 287, 288, 289, 290, 291, 292, 293, 294, 295, 296, 297, 298, 299, 300, 301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 317, 318, 319, and 320 printed in part A of House Report 119-755, offered by Mr. Rogers of Alabama:'
  source:
    path: government/crec-20260722-house-hr8800-ndaa-fy2027.htm
    location: '¶ "Amendments en bloc No. 5 consisting of" (Clerk''s designation under heading "Amendments En Bloc No. 5 Offered by Mr. Rogers of Alabama"; Record page H5077)'
  significance: 'The Clerk''s designation of amendments en bloc No. 5 lists amendment No. 315 (the UAP records amendment containing both AARO provisions) among its components, tying the AARO text to the en bloc package whose disposition is recorded below.'
  context: 'Designated by the Clerk after Mr. Rogers of Alabama offered the amendments en bloc pursuant to House Resolution 1438, in the Committee of the Whole House on the state of the Union, Congressional Record (House), July 22, 2026. Amendment No. 316 is not in the package; it was considered separately afterwards.'
