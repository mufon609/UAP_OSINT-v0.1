- id: q185
  added_date: '2026-09-26'
  text: 'The Acting CHAIR. The question is on the amendments en bloc offered by the gentleman from Alabama (Mr. Rogers). The en bloc amendments were agreed to.'
  source:
    path: government/crec-20260722-house-hr8800-ndaa-fy2027.htm
    location: 'disposition of amendments en bloc No. 5 — the Acting CHAIR''s question and result immediately following ¶ "I urge my collegues to support this amendment" (Mr. WALKINSHAW''s closing sentence, the last en bloc No. 5 debate remark) and immediately before heading "Amendment No. 316 Offered by Mr. Grothman"; Record page H5123'
  significance: 'Congressional Record, House (July 22, 2026): amendments en bloc No. 5, including Amendment No. 315 with its two AARO provisions, were agreed to in the Committee of the Whole.'
