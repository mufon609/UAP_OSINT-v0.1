    location: 'p. 14, Sensor Architecture'
  significance: 'AARO FY24 — GREMLIN prototype sensor system disclosure: detecting / tracking / characterizing UAP, March 2024 test event, 90-day pattern-of-life collection scheduled at a site of national security'
  context: 'AARO FY24 Consolidated Annual Report on UAP, November 14, 2024'
  statement_date: '2024-11-14'
- id: q35
  added_date: '2026-05-01'
  text: 'Georgia Tech Research Institute (GTRI) developed the GREMLIN sensor architecture (described in additional detail on page 13) which will be deployed in 1Q FY 2025 to support pattern-of-life analysis.'
  source:
