- id: q17
  added_date: '2026-04-30'
  text: |
    More recently, this latest resurgence in anticipation for government-led UAP disclosure comes at a time when AARO officials have been noticeably tight-lipped recently about their ongoing projects and existing investigations. The office has not published its 2025 annual report or second volume of reports on government involvement with UAP.
  source:
    path: news/defensescoop-aaro-hegseth-disclosure-20260225.html
    location: 'article body, ¶ following caseload-figure paragraph'
  significance: DefenseScoop reporter observation (Brandi Vincent, Feb 25, 2026) — AARO communications posture characterized as "noticeably tight-lipped"; no 2025 annual report and no second volume of reports on government involvement with UAP published as of publication date.
  context: DefenseScoop, "Hegseth doubles-down on Trump's UAP disclosure promise as AARO's caseload exceeds 2,000," Feb 25, 2026
  statement_date: '2026-02-25'
- id: q18
  added_date: '2026-04-30'
  text: |
    In response to questions from DefenseScoop Wednesday, Pentagon spokesperson Sue Gough said that "AARO has been examining over 2,000 UAP cases."

    "AARO has approximately 1,000 reports that lack sufficient data for analysis and are retained in AARO's Active Archive that may be reopened and resolved should additional information emerge to support analysis," she noted.
  source:
    path: news/defensescoop-aaro-hegseth-disclosure-20260225.html
    location: 'article body, Sue Gough caseload paragraphs'
  significance: Pentagon spokesperson Sue Gough caseload statement to DefenseScoop (Feb 25, 2026) — AARO examining over 2,000 UAP cases; ~1,000 reports retained in the AARO Active Archive pending sufficient data. Caseload grew by at least 400 since the late-2024 public update of more than 1,600 reports.
  context: DefenseScoop Feb 25, 2026 article, Pentagon spokesperson reply to inquiry
  statement_date: '2026-02-25'
- id: q19
  added_date: '2026-04-30'
  text: |
    "We're going to be in full compliance with that executive order, [and we're] eager to provide that for the president. So, there'll be more coming on that, as far as the process of what we'll do," Hegseth said.
  source:
    path: news/defensescoop-aaro-hegseth-disclosure-20260225.html
    location: 'article body, Hegseth direct-quote paragraph'
  significance: Defense Secretary Pete Hegseth statement to DefenseScoop (Feb 25, 2026) — Pentagon will be "in full compliance" with a forthcoming Trump executive order directing disclosure of U.S. government records about UAP and aliens.
  context: DefenseScoop Feb 25, 2026 article, Hegseth remarks during Arsenal of Freedom Tour, Louisville CO Feb 23, 2026
  statement_date: '2026-02-25'
- id: q20
  added_date: '2026-04-30'
  text: |
    A spokesperson for the Defense Department said in a statement to NBC News Saturday that its All-domain Anomaly Resolution Office (AARO) is "working in close coordination with the White House and across federal agencies to consolidate existing UAP records collections and facilitate the expeditious release of never-before-seen UAP information."

    "AARO has made progress to make UAP information available and transfer those records to the National Archives in accordance with federal law," the statement continued. "We welcome the president's initiative to supercharge these efforts and make more UAP information available to the public as soon as possible."
  source:
    path: news/nbcnews-trump-ufo-files-interesting-documents-20260418.html
    location: 'article body, AARO statement paragraphs'
  significance: 'Defense Department spokesperson statement to NBC News (Apr 18, 2026) — AARO disclosure-coordination statement: working with the White House and federal agencies to consolidate existing UAP records collections and facilitate the expeditious release of never-before-seen UAP information; transferring records to the National Archives in accordance with federal law.'
  context: NBC News article reporting Trump's Phoenix Turning Point USA remarks plus the formal Defense Department spokesperson statement to NBC News Saturday Apr 18, 2026
  statement_date: '2026-04-18'
- id: q21
  added_date: '2026-05-01'
  text: 'A case that we thought would be a transmedium case as it was reported, is well-known on the outside, known as the Puerto Rico case. It was data collected in 2013, when a Customs and Border Patrol aircraft observed an object flying near an airport in Puerto Rico.'
  source:
    path: government/armed-services-senate-gov-sasc-aaro-transcript-20241119.pdf
    location: '¶ "A case that we thought would"'
  significance: Kosloski Nov 19 2024 SASC testimony — frames the Puerto Rico case (2013 Customs and Border Patrol observation near airport)
  context: AARO Director Jonathan Kosloski first SASC Subcommittee on Emerging Threats and Capabilities hearing testimony, November 19, 2024
  statement_date: '2024-11-19'
- id: q22
  added_date: '2026-05-01'
  text: 'So we assessed that the object, likely a pair of balloons or sky lanterns, was floating at about 7 knots over the airport and descending to about 200 meters.'
  source:
    path: government/armed-services-senate-gov-sasc-aaro-transcript-20241119.pdf
    location: '¶ "So we assessed that the object,"'
  significance: Kosloski case resolution — Puerto Rico 2013 transmedium case assessed as a pair of balloons or sky lanterns floating over the airport at 7 knots, descending to 200 meters; the apparent transmedium behavior was an infrared-imaging artifact when water temperature matched object temperature
  context: AARO Director Kosloski Nov 19 2024 SASC testimony, Puerto Rico case-resolution explanation
  statement_date: '2024-11-19'
- id: q23
  added_date: '2026-05-01'
  text: 'The GOFAST captured the public attention and congressional attention when it was made public in 2017. It looks like an object flying very fast over the water, very close to the water. Through a very careful geospatial intelligence analysis, using trigonometry, we assessed with high confidence that the object is not actually close to the water but is rather closer to 13,000 feet.'
  source:
    path: government/armed-services-senate-gov-sasc-aaro-transcript-20241119.pdf
    location: '¶ "The GOFAST captured the public attention"'
  significance: Kosloski case resolution — GOFAST (2017 publicly released video) assessed with high confidence as an object at approximately 13,000 feet altitude rather than close to the water; apparent fast motion is parallax / a trick of the eye when a high-altitude object is imaged from a closer-altitude platform
  context: AARO Director Kosloski Nov 19 2024 SASC testimony, GOFAST case-resolution explanation
  statement_date: '2024-11-19'
- id: q24
  added_date: '2026-05-01'
  text: 'An interesting case, which I do not believe the public is familiar with, is captured in 2018 from a UAV flying in the Mediterranean, watching Mt. Etna as it was erupting. And it appears that that object is flying through the plume of superheated gas and ash.'
  source:
    path: government/armed-services-senate-gov-sasc-aaro-transcript-20241119.pdf
    location: '¶ "An interesting case, which I do"'
  significance: Kosloski introduces the 2018 Mt. Etna UAV case — AARO captured object that appeared to be flying through the plume of an erupting volcano in the Mediterranean
  context: AARO Director Kosloski Nov 19 2024 SASC testimony, Mt. Etna case-resolution introduction
  statement_date: '2024-11-19'
- id: q25
  added_date: '2026-05-01'
  text: 'This was a rather difficult case to resolve. We had to pull in support from a number of IC and S&T partners, and even reach out to a volcanologist. And through very detailed 3D modeling and pixel-by-pixel analysis of the object as it is traversing across the clouds, they assessed that the object was actually 170 meters away from the plume and not flying through it.'
  source:
    path: government/armed-services-senate-gov-sasc-aaro-transcript-20241119.pdf
    location: '¶ "This was a rather difficult case"'
  significance: Kosloski case resolution — Mt. Etna 2018 case resolved through 3D modeling and pixel-by-pixel analysis with IC, S&T, and volcanologist support; object was 170 meters away from the plume, not flying through it
  context: AARO Director Kosloski Nov 19 2024 SASC testimony, Mt. Etna case-resolution
  statement_date: '2024-11-19'
- id: q26
  added_date: '2026-05-01'
  text: 'And to be clear, AARO does not believe every object is a bird, a balloon, or a UAV. We do have some very anomalous objects.'
  source:
    path: government/armed-services-senate-gov-sasc-aaro-transcript-20241119.pdf
    location: '¶ "And to be clear, AARO does"'
  significance: Kosloski clarifying that AARO acknowledges genuinely anomalous cases remain in the corpus — case resolutions reflect what AARO can presently resolve, not a categorical denial of unexplained phenomena
  context: AARO Director Kosloski Nov 19 2024 SASC testimony, framing remarks following the Mt. Etna case-resolution
  statement_date: '2024-11-19'
- id: q27
  added_date: '2026-05-01'
  text: |-
    KONA BLUE was brought to AARO’s attention by interviewees who claimed that it was
    a sensitive DHS compartment to cover up the retrieval and exploitation of “non-human
    biologics.”114 KONA BLUE traces its origins to the DIA-managed AAWSAP/AATIP program,
