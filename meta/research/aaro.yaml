- id: q125
  added_date: '2026-09-26'
  text: 'The Washington Headquarters Services, on behalf of the All-Domain Anomaly Resolution Office (AARO), requires a multi-year subscription service for digital access to unique, proprietary data, metadata, and analytical products from NUFOHRC. The proposed contract structure consists of a one-year base period with four (4) subsequent one-year option periods.'
  source:
    path: government/samgov-nufohrc-20260731-notice.json
    location: '"description" body, ¶ "The Washington Headquarters Services, on behalf of"'
  significance: 'WHS acting on behalf of AARO; multi-year NUFOHRC subscription, one base year plus four option years'
  claim_group: nufohrc-sole-source-data-subscription
  statement_date: '2026-07-31'
- id: q126
  added_date: '2026-09-26'
  text: 'The purpose of this action is to acquire a commercial data subscription to gain unique insights into Unidentified Anomalous Phenomena (UAP) through the analysis of historical cases (pre-1990). The subscription service will provide AARO with access to a pre-existing, proprietary commercial data subscription and is not for professional labor or advisory services.'
  source:
    path: government/samgov-nufohrc-20260731-notice.json
    location: '"description" body, ¶ "The purpose of this action is to acquire"'
  significance: 'Stated purpose: historical (pre-1990) UAP case analysis; a data subscription, not labor or advisory services'
  claim_group: nufohrc-sole-source-data-subscription
  statement_date: '2026-07-31'
  corroborated_by:
  - q130
- id: q127
  added_date: '2026-09-26'
  text: 'The statutory authority permitting other than full and open competition is 10 U.S.C. 3204(a)(1) as implemented by FAR 6.302-1, &quot;Only one responsible source and no other supplies or services will satisfy agency requirements.&quot;'
  source:
    path: government/samgov-nufohrc-20260731-notice.json
    location: '"description" body, "Authority and Justification:" block, ¶ "The statutory authority permitting"'
  significance: 'Cited sole-source authority: 10 U.S.C. 3204(a)(1) / FAR 6.302-1'
  claim_group: nufohrc-sole-source-justification
  statement_date: '2026-07-31'
- id: q128
  added_date: '2026-09-26'
  text: 'NUFOHRC is considered the only source capable of satisfying this requirement. The vendor possesses the world&rsquo;s largest private collection of UAP-related historical records, including hundreds of thousands of unique case files that exist exclusively within its archives and are not available in any other public or private repository. Furthermore, NUFOHRC has unparalleled, specialized expertise in analyzing this specific data, demonstrated by its staff&#39;s proven ability to generate the high-quality, science-driven analytical studies required by the government.'
  source:
    path: government/samgov-nufohrc-20260731-notice.json
    location: '"description" body, ¶ "NUFOHRC is considered the only source"'
  significance: 'Sole-source justification as stated in the notice: collection size and analytic expertise attributed to NUFOHRC'
  claim_group: nufohrc-sole-source-justification
  statement_date: '2026-07-31'
  corroborated_by:
  - q132
  - q133
- id: q129
  added_date: '2026-09-26'
  text: 'Market research conducted to date indicates that no other organization possesses the historical depth, volume of unique records, and specialized analytical expertise to meet the government&#39;s minimum needs. Consequently, NUFOHRC is currently identified as the only source capable of satisfying this requirement.'
  source:
    path: government/samgov-nufohrc-20260731-notice.json
    location: '"description" body, ¶ "Market research conducted to date"'
  significance: 'Market-research basis for the only-one-source determination'
  claim_group: nufohrc-sole-source-justification
  statement_date: '2026-07-31'
  corroborated_by:
  - q131
