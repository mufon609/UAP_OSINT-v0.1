- id: q36a
  added_date: '2026-05-01'
  text: 'It is important to underscore that, to date, AARO has discovered no verifiable evidence of extraterrestrial beings, activity, or technology.'
  source:
    path: government/aaro-kosloski-sfr-sasc-20241119.pdf
    location: 'p. 2, ¶5 of statement body'
  significance: 'Kosloski SASC Statement for the Record (November 19, 2024): the new Director states that AARO has discovered no verifiable evidence of extraterrestrial beings, activity, or technology.'
  analysis: 'This is a load-bearing positional claim from the new Director in the Kosloski Nov 19 2024 SASC SFR. Parallels and reaffirms HRR Vol I findings under Kosloski tenure.'
  context: 'AARO Director Dr. Jon Kosloski Statement for the Record, Senate Armed Services Subcommittee on Emerging Threats and Capabilities, November 19, 2024'
