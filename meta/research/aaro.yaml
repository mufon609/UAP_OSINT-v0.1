- id: q72
  added_date: '2026-05-02'
  text: |
    The photos were doctored, the now-retired officer confessed to the Pentagon investigators in 2023. The whole exercise was a ruse to protect what was really going on at Area 51: The Air Force was using the site to develop top-secret stealth fighters, viewed as a critical edge against the Soviet Union.
  source:
    path: news/tovima-wsj-pentagon-disinformation-ufo-mythology-20250606.html
    location: 'main article body, F-117 / Area 51 disinformation paragraph'
  significance: 'Wall Street Journal (June 6, 2025): AARO Volume II preview reporting says a now-retired officer confessed to Pentagon investigators in 2023 that photos were doctored as a ruse to protect Area 51 stealth-fighter development.'
  analysis: 'The article gives a verbatim attestation that a now-retired Air Force colonel confessed to AARO investigators in 2023 that he had doctored flying-saucer photos in the 1980s as a cover for F-117 stealth-fighter testing at Area 51. Documents an AARO investigative-interview output: a primary-source disinformation confession.'
  context: 'Wall Street Journal article "The Pentagon Disinformation That Fueled America''s UFO Mythology" by Joel Schectman and Aruna Viswanatha; previews AARO Volume II findings drawn from extensive interviews with Kirkpatrick'
  statement_date: '2025-06-06'
- id: q73
  added_date: '2026-05-02'
  text: |
    For decades, certain new commanders of the Air Force's most classified programs, as part of their induction briefings, would be handed a piece of paper with a photo of what looked like a flying saucer. The craft was described as an antigravity maneuvering vehicle. The officers were told that the program they were joining, dubbed Yankee Blue, was part of an effort to reverse-engineer the technology on the craft. They were told never to mention it again. Many never learned it was fake. Kirkpatrick found the practice had begun decades before, and appeared to continue still. The defense secretary's office sent a memo out across the service in the spring of 2023 ordering the practice to stop immediately, but the damage was done.
  source:
    path: news/tovima-wsj-pentagon-disinformation-ufo-mythology-20250606.html
    location: 'main article body, Yankee Blue induction-briefing ritual paragraph'
  significance: 'Wall Street Journal (June 6, 2025): AARO Volume II preview reporting describes the "Yankee Blue" induction briefings, in which new Air Force classified-program commanders were shown a fake flying-saucer photo.'
  analysis: 'The WSJ gives a verbatim description of the "Yankee Blue" induction briefings at Air Force classified programs, in which new commanders were handed a doctored "antigravity maneuvering vehicle" photo and told the program was reverse-engineering the craft. Per the WSJ, Kirkpatrick found the practice had begun decades before, prompting a defense-secretary''s-office memo across the service in spring 2023 ordering the practice to stop. Documents an AARO Volume II finding that connects historical Air Force disinformation practice to the public UFO mythology AARO is statutorily charged with investigating.'
  context: 'Wall Street Journal article "The Pentagon Disinformation That Fueled America''s UFO Mythology" by Joel Schectman and Aruna Viswanatha; previews AARO Volume II findings drawn from extensive interviews with Kirkpatrick — Yankee Blue / induction-briefing ritual section'
  statement_date: '2025-06-06'
- id: q74
  added_date: '2026-05-02'
  text: |
    (III) any efforts to obfuscate, manipulate public opinion, hide, or otherwise provide incorrect unclassified or classified information about unidentified anomalous phenomena or related activities.
  source:
    path: government/uscode-title50-section3373-20260501.html
    location: '50 U.S.C. § 3373(j)(2)(B)(ii)(III) — Historical Record Report mandate, "Other requirements" subparagraph'
  significance: '50 U.S.C. § 3373(j)(2)(B)(ii)(III) (December 23, 2022): the statute directs AARO''s Historical Record Report to itemize "any efforts to obfuscate, manipulate public opinion, hide" or give incorrect UAP information.'
  analysis: 'This is the statutory mandate (codifying NDAA FY23 § 6802 / IAA FY23 § 6802) directing the report to itemize "any efforts to obfuscate, manipulate public opinion, hide, or otherwise provide incorrect unclassified or classified information about unidentified anomalous phenomena or related activities."'
  context: 'U.S. Code Title 50 § 3373(j)(2)(B)(ii)(III), Historical Record Report mandate provision — Other requirements subparagraph governing the scope of the historical record AARO must compile'
  statement_date: '2022-12-23'
- id: q75
  added_date: '2026-05-02'
  text: |
    Third, this is the most error-ridden and unsatisfactory government report I can recall reading during or after decades of government service. We all make mistakes, but this report is an outlier in terms of inaccuracies and errors. Were I reviewing this as a graduate student's thesis it would receive a failing grade for failing to understand the assignment, sloppy and inadequate research, and flawed interpretation of the data.
  source:
    path: news/thedebrief-mellon-aaro-report-flawed-20240412.html
    location: '"The Pentagon''s New UAP Report is Seriously Flawed", numbered-points section, point Third'
  significance: 'Christopher Mellon in The Debrief (April 12, 2024): Mellon calls HRR Vol I "the most error-ridden and unsatisfactory government report" he can recall, one that would fail as a graduate thesis.'
  analysis: 'This is Mellon''s verbatim critique of HRR Vol I in his own ~16,500-word April 12, 2024 Debrief essay — the primary source for the "most error-ridden and unsatisfactory government report" rebuttal that Shellenberger''s November 13, 2024 House Oversight written testimony quotes secondhand. Carries Mellon''s full graduate-thesis-failing-grade framing of the report''s research and interpretation quality. Mellon''s authority rests on his prior service as Deputy Assistant Secretary of Defense for Intelligence.'
  context: Christopher Mellon ([`/people/christopher-mellon`]) Debrief essay "The Pentagon's New UAP Report is Seriously Flawed", April 12, 2024 (modified April 15, 2024)
  statement_date: '2024-04-12'
- id: q76
  added_date: '2026-05-02'
  text: |
    AARO certainly knows about the 2004 Nimitz UAP incidents, which were the primary events that led to the current sea change in attitude to UFOs and UAP, leading to the establishment of AARO itself. AARO just inexplicably and unbelievably chooses not to mention the Nimitz anywhere in its Historical Report.
  source:
    path: news/thedebrief-mellon-aaro-report-flawed-20240412.html
    location: '"The Pentagon''s New UAP Report is Seriously Flawed", section "Alleged ''40-Year Gap'' in Official Investigations of UAP is Due to AARO''s Failure to Properly Document their History from 1969-2009 – Not Even a Mention of the Pivotal 2004 Nimitz Case"'
  significance: 'Christopher Mellon in The Debrief (April 12, 2024): Mellon says HRR Vol I omits the 2004 Nimitz UAP incidents, the events that led to AARO''s own establishment.'
  analysis: 'This is Mellon''s most consequential single observation about HRR Vol I — that AARO''s founding catalyst event (the 2004 USS Nimitz UAP encounter ([`/events/2004-nimitz-encounter`])) is omitted entirely from AARO''s own historical record of US Government UAP involvement. The Nimitz incidents were the primary trigger for the legislative chain that led to AARO''s establishment via NDAA FY22 § 1683; their absence from the HRR is structurally significant.'
  context: Christopher Mellon ([`/people/christopher-mellon`]) Debrief essay critique of AARO HRR Vol I "40-year gap" claim
  statement_date: '2024-04-12'
- id: q77
  added_date: '2026-05-02'
  text: |
    Department of Defense (DoD) Public Affairs sponsored a closed-door pre-brief on the report's findings for a select group of press outlets on an invitation-only basis. Outlets like The Debrief, which closely follow the UAP issue, were excluded. Following the report's release, most of the news agencies that had participated in the pre-brief went on to publish articles that uncritically parroted the report's findings.
  source:
    path: news/thedebrief-mellon-aaro-report-flawed-20240412.html
    location: '"The Pentagon''s New UAP Report is Seriously Flawed", introductory section on "irregularities" of the report rollout'
  significance: 'Christopher Mellon in The Debrief (April 12, 2024): Mellon says DoD Public Affairs held a closed-door, invitation-only press pre-brief on HRR Vol I that excluded The Debrief.'
  analysis: 'This is Mellon''s account of the HRR Vol I pre-brief mechanism — closed-door, invitation-only press outreach two days before public release on March 8, 2024, with disclosure-attentive outlets like The Debrief excluded. Pairs with the FOIA 24-F-0894 rollout emails (Sue Gough''s standardized "small group" reply to journalist requests) documenting the same invite-only press posture from inside the OSD Public Affairs chain.'
  context: Christopher Mellon ([`/people/christopher-mellon`]) Debrief essay introductory critique of HRR Vol I rollout
  statement_date: '2024-04-12'
- id: q78
  added_date: '2026-05-02'
  text: |
    this appears to be the first AARO report submitted to Congress that the Director of National Intelligence (DNI) did not sign off on. I don't know why, but Avril Haines and her Office were quite right not to in this case, having spared themselves considerable embarrassment in the process.
  source:
    path: news/thedebrief-mellon-aaro-report-flawed-20240412.html
    location: '"The Pentagon''s New UAP Report is Seriously Flawed", numbered-points section, point Second'
  significance: 'Christopher Mellon in The Debrief (April 12, 2024): Mellon observes that HRR Vol I appears to be the first AARO report to Congress without DNI sign-off.'
  analysis: 'Mellon''s institutional observation: HRR Vol I was the first AARO report to Congress without ODNI/DNI sign-off — Avril Haines''s Office withheld signature. Pairs with FOIA 24-F-0894 documentation of the bilateral DoD/ODNI Public Affairs agreement to omit ODNI mention from the public rollout press release (the FOIA 24-F-0894 rollout emails — "Confirming that we''re good without any ODNI mention"). Two distinct ODNI-omission patterns at the formal-sign-off level and the public-framing level.'
  context: Christopher Mellon ([`/people/christopher-mellon`]) Debrief essay numbered-points critique of HRR Vol I irregularities
  statement_date: '2024-04-12'
