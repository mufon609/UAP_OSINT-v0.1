    location: 'p. 13, Notable AARO Partnerships'
  significance: 'AARO FY24 — Georgia Tech Research Institute (GTRI) named as the GREMLIN sensor architecture developer; deployment scheduled 1Q FY 2025'
  context: 'AARO FY24 Consolidated Annual Report on UAP, November 14, 2024'
  statement_date: '2024-11-14'
- id: q36
  added_date: '2026-05-01'
  text: 'To date, AARO has over 1,600 UAP reports in its holdings from across the U.S. government.'
  source:
    path: government/aaro-kosloski-sfr-sasc-20241119.pdf
    location: 'p. 2, ¶5 of statement body'
  significance: Kosloski Nov 19 2024 SASC Statement for the Record — AARO's cumulative holdings exceed 1,600 UAP reports across the U.S. government
  context: 'AARO Director Dr. Jon Kosloski Statement for the Record, Senate Armed Services Subcommittee on Emerging Threats and Capabilities, November 19, 2024'
