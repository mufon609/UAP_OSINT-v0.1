- id: q-preface-thesis-scope
  added_date: '2026-05-26'
  text: |-
    This report is intended to provide the reader with an overview of the basics,
    current experimental status, supporting theory, and potential applications of
    inertial electrostatic confinement (IEC) fusion. Emphasis is placed on work in
    these areas at the University of Illinois Urbana-Champaign, although some
    other research is brought in.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 8, Preface, ¶1'
  significance: Thesis and scope — the report overviews the basics, experimental status, theory, and potential applications of IEC fusion, emphasizing work at the University of Illinois Urbana-Champaign
  statement_date: '2010-03-10'
- id: q-preface-aneutronic-claim
  added_date: '2026-05-26'
  text: |-
    The report further shows that
    IEC is one of the few potential fusion approaches that can potentially burn
    aneutronic fuels like p-¹¹B (hydrogen – Boron 11). In aneutronic fusion,
    neutrons carry no more than 1% of the total released energy, greatly reducing
    problems associated with neutron radiation.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 8, Preface, ¶2'
  significance: Aneutronic claim — the report argues IEC is one of the few fusion approaches that can potentially burn aneutronic fuels like p-¹¹B, in which neutrons carry no more than 1% of the total released energy
  statement_date: '2010-03-10'
- id: q-iec-basic-mechanism
  added_date: '2026-05-26'
  text: |-
    As shown, this
    "gridded" type IEC has a spherical mesh grid suspended on a high voltage feed-through
    in the center of a metal vacuum vessel. The fusion "fuel", e.g. deuterium gas, is first
    fed into the chamber originally prepared at high vacuum, e.g. 10⁻⁷ Torr.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 9, Section I, ¶'
  significance: IEC basic mechanism — a gridded IEC has a spherical mesh grid suspended on a high voltage feed-through in the center of a metal vacuum vessel, with fusion fuel such as deuterium gas fed into a chamber prepared at high vacuum
  statement_date: '2010-03-10'
- id: q-lawson-criterion
  added_date: '2026-05-26'
  text: |-
    Also the ion energy (or temperature T) must be in the 20 or more keV range assuming
    D-T fuel. For breakeven, J. Lawson developed his famous "criterion" nτ = 10¹⁴ cm⁻³-sec
    at T > 15 keV for DT fusion. Here τ = energy confinement time, sec; n = ion density,
    cm⁻³ and T = ion "temperature" or average energy.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 10, Section I, ¶'
  significance: Lawson criterion — for breakeven, J. Lawson developed the criterion nτ = 10¹⁴ cm⁻³-sec at T > 15 keV for DT fusion
  statement_date: '2010-03-10'
- id: q-farnsworth-origin
  added_date: '2026-05-26'
  text: |-
    Inertial Electrostatic Confinement (IEC) was conceived of by Philo Farnsworth, the
    inventor of electronic television, as an approach to fusion power using electrostatic
    fields for confinement (Reference 1.2). When he did this in 1955, the prime approaches
    being pursued worldwide were magnetic confinement or inertial (laser compression of
    targets) confinement.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 11, Section I (IEC Background), ¶1'
  significance: IEC origin — inertial electrostatic confinement was conceived of by Philo Farnsworth, the inventor of electronic television, as an approach to fusion power using electrostatic fields for confinement, in 1955
  statement_date: '2010-03-10'
- id: q-miley-bussard-involvement
  added_date: '2026-05-26'
  text: |-
    Then in the late 1990s R. W. Bussard
    revived the concept with the hybrid IEC magnetic approach (Reference 1.6-1.7). In this
    approach the electrons were confined in the magnetic field, forming a potentials trap for
    ions. [Note the similarity to the original conceptual potential well discussed by Elmore,
    et al. (Reference 1.1)]. Upon invitation by R.W. Bussard to join this effort, the author,
    George Miley, undertook supporting experiments that were a variation of the original
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 11, Section I (IEC Background), ¶3'
  significance: 'Authorship self-identification — the document self-identifies the author as George Miley, invited by R. W. Bussard to join the IEC effort, undertaking supporting experiments that were a variation of the original Hirsch approach'
  statement_date: '2010-03-10'
- id: q-bussard-military-funding-youtube
  added_date: '2026-05-26'
  text: |-
    Meanwhile Bussard's
    work continued with strong funding from the military. However, little was published or
    known about this until 2008 when he made public appeals on "YouTube" to regain
    funding stopped just when the experiment achieved a major success.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 12, Section I (IEC Background), ¶1'
  significance: Bussard military funding — Bussard's Polywell work continued with strong funding from the military, with little published until his 2008 YouTube appeals to regain funding stopped just as the experiment achieved a major success
  statement_date: '2010-03-10'
- id: q-doe-no-funding-tokamak
  added_date: '2026-05-26'
  text: |-
    At this point the IEC still receives no funding from DOE which remains focused on the
    Tokomak route to fusion power. Thus, with little funding, slow progress has been made
    in answering the key question of whether or not the IEC can be developed for fusion
    power. If it can, the device would be simpler and smaller than a Tokomak, making it an
    extremely attractive option.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 12, Section I (IEC Background), ¶2'
  significance: 'Funding status — the IEC receives no funding from DOE, which remains focused on the Tokomak route; if developed, the IEC device would be simpler and smaller than a Tokomak'
  statement_date: '2010-03-10'
- id: q-emc2-other-labs-scope-limit
  added_date: '2026-05-26'
  text: |-
    One other limitation of this report is that it largely provides details based on the
    author's work on IECs over the last decade. Thus it will not do justice to the ongoing
    work by others, notably at EMC² on the Bussard Polywell device or the advanced
    gridded IEC neutron/proton source development work at the U of Wisconsin, Kyoto
    University, and Tokyo Institute of Technology.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 12, Section I (IEC Background), ¶5'
  significance: Scope limitation — the report largely provides details based on the author's own IEC work over the last decade, and will not do justice to ongoing work at EMC² on the Bussard Polywell or gridded IEC source work at Wisconsin, Kyoto, and Tokyo Institute of Technology
  statement_date: '2010-03-10'
- id: q-star-mode-modes
  added_date: '2026-05-26'
  text: |-
    "Glow discharge operation of the IECGD is categorized by three distinct discharge
    "modes": Star, Central Spot, and Halo (illustrated in Figure 1.3). These names are quite
    descriptive of the visual appearances of the visible light emitted from the discharges. All
    three modes are reproducible and stable; each is associated with a different potential
    well structure, hence neutron production rate. The star mode was used extensively in
    recent experiments. It is distinguished by microchannels or "spokes" radiating outward
    from a bright center spot (Figure 1.4).
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 16, Section I (IEC Basics), ¶'
  significance: 'Discharge modes — glow-discharge IEC operation is categorized by three distinct modes, Star, Central Spot, and Halo, each associated with a different potential well structure and neutron production rate; the star mode is distinguished by microchannels or "spokes" radiating from a bright center spot'
  statement_date: '2010-03-10'
- id: q-miley-ion-injected-q-value
  added_date: '2026-05-26'
  text: |-
    These studies did include differential pumping so that
    number of recirculating passes, β, by an ion was very low, roughly 2. The injected ion
    current, I, was about 50 mA. Still, based on measurements of neutrons emitted using
    deuterium fuel, the Q (fusion energy gain/energy in) was remarkable for such a small
    device, order of 10⁻⁶. Based on these results, an aggressive p-¹¹B breakeven
    experiment using this type of IEC is discussed in Section VI.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 20, Section I (Miley''s "Ion Injected" Device), ¶'
  significance: 'UIUC ion-injected device result — with a recirculation number of roughly 2 and ~50 mA injected current, the measured Q (fusion energy gain/energy in) using deuterium fuel was order of 10⁻⁶, the basis for the proposed p-¹¹B breakeven experiment of Section VI'
  statement_date: '2010-03-10'
- id: q-hirsch-record-neutron-rate
  added_date: '2026-05-26'
  text: |-
    In Reference 2.1, Robert Hirsh disclosed experimental results with very high D-T
    neutron rates from an ion-injected IEC shown if Figure 2.1.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 22, Section II, ¶2'
  significance: Hirsch experiment — Robert Hirsh disclosed experimental results with very high D-T neutron rates from an ion-injected IEC
  statement_date: '2010-03-10'
- id: q-hirsch-fig22-neutron-yield
  added_date: '2026-05-26'
  text: |-
    Figure 2.2. Neutron Rates Measured With the IEC of
    Figure 2.1 Exceeded 10^9 DT n/s at 150 kV. For
    perspective, note that, as discussed later, UIUC IEC gridded
    devices routinely produce 10^8 DD n/s at ~ 80 kV. This is
    slightly above Hirsch's result but uses higher ion currents.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 22, Section II, Figure 2.2 caption'
  significance: 'Hirsch neutron yield — neutron rates measured with the Hirsch IEC exceeded 10⁹ DT n/s at 150 kV, while UIUC gridded devices routinely produce 10⁸ DD n/s at ~80 kV using higher ion currents'
  statement_date: '2010-03-10'
- id: q-daimler-chrysler-naa
  added_date: '2026-05-26'
  text: |-
    Daimler-Chrysler licensed use of this IEC
    neutron technology through the UIUC and used this approach for their NAA quality
    control units.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 25, Section II, ¶'
  significance: Daimler-Chrysler NAA — Daimler-Chrysler licensed the IEC neutron technology through the UIUC and used it for their neutron-activation-analysis quality-control units
  statement_date: '2010-03-10'
- id: q-section3-other-geometries-thesis
  added_date: '2026-05-26'
  text: |-
    A unique feature of the IEC is the ability to vary its geometry to adapt to a number of
    important near term and future applications. Here we consider cylindrical IEC
    geometries, the IEC Jet extraction geometry, dipole assisted, and magnetically-coupled
    IEC unit which add flexibility for use in some power applications.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 29, Section III, ¶1'
  significance: 'Other geometries thesis — a unique feature of the IEC is the ability to vary its geometry, considered here as cylindrical, jet-extraction, dipole-assisted, and magnetically-coupled IEC configurations'
  statement_date: '2010-03-10'
- id: q-cylindrical-iec-yields
  added_date: '2026-05-26'
  text: |-
    This configuration is used to initiate a plasma discharge,
    resulting in electrostatic confinement of fusion fuel ions in both the axial and radial
    directions (Reference 3.4). Present operation produces about 10^7 n/s (D-D) steady
    state while for pulsed output 10^9 n/s (D-D) is obtained.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 30, Section III (Cylindrical IECs), ¶'
  significance: 'Cylindrical IEC yields — the hollow-cathode C-Device produces about 10⁷ n/s (D-D) steady state and 10⁹ n/s (D-D) for pulsed output'
  statement_date: '2010-03-10'
- id: q-jet-thruster-purpose
  added_date: '2026-05-26'
  text: |-
    The IEC jet thruster is intended as an ultra-maneuverable space thruster for satellite
    and small probe thrust operations. The IEC Jet design potential offers a unique
    capability to cover a wide range of powers (few Watts to Kilowatts) with good efficiency
    while providing a plasma jet that can start with a large diameter but be narrowed
    directionally to focus on targets.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 30, Section III (Electrically-Driven IEC Jet Thruster), ¶'
  significance: IEC jet thruster purpose — the IEC jet thruster is intended as an ultra-maneuverable space thruster for satellite and small probe operations, providing a plasma jet that can start large but be narrowed directionally to focus on targets
  statement_date: '2010-03-10'
- id: q-jet-thruster-target-interrogation
  added_date: '2026-05-26'
  text: |-
    In addition to maneuverable thrusting, the jet channel extraction technique
    enables directing and focusing the plasma stream down on an asteroid or other object
    for interrogation of it. Analysis of the plasma emission spectra would provide an
    identification of the materials and surface features of the object.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 31, Section III (Electrically-Driven IEC Jet Thruster), ¶'
  significance: Jet thruster target interrogation — the jet channel extraction technique enables directing and focusing the plasma stream onto an asteroid or other object for interrogation, with plasma-emission-spectra analysis identifying the materials and surface features of the object
  statement_date: '2010-03-10'
- id: q-jet-thruster-disable-target
  added_date: '2026-05-26'
  text: |-
    This becomes especially important when considering how
    long it may take to disable a defensive target (the platform's impulse time to disable).
    The use of an intense pulsed jet could disable the target before it has time to maneuver
    or apply defensive layers.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 31, Section III (Relation to Other Prior Thrusters), ¶'
  significance: 'Jet thruster disable concept — the IEC jet operated as a pulsed device could disable a defensive target before it has time to maneuver or apply defensive layers'
  statement_date: '2010-03-10'
- id: q-jet-power-conversion
  added_date: '2026-05-26'
  text: |-
    For example, with the device of Figure 3.2b, the input power is about 2
    kW with over 1.5 kW being carried out by the jet flow. Consequently, this configuration
    provides a way to efficiently convert the energy stored by accelerated ions in the
    symmetric microchannels into a directed beam or jet.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 33, Section III (Description of the IEC Jet Thruster), ¶'
  significance: 'Jet power conversion — over half the energy imparted to the ions by the accelerating grid is funneled into the jet; in the example device the input power is about 2 kW with over 1.5 kW carried out by the jet flow'
  statement_date: '2010-03-10'
- id: q-daiec-description
  added_date: '2026-05-26'
  text: |-
    The dipole assisted IEC DaIEC is similar to the IEC concept discussed above except a
    dipole magnet is located in the center of two hemispherical grids (Reference 3.9). The
    DaIEC was first proposed by G. Miley at the UIUC and has been under investigation
    there.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 37, Section III (The Dipole Assisted IEC (DaIEC)), ¶1'
  significance: 'DaIEC description — the dipole assisted IEC places a dipole magnet in the center of two hemispherical grids, first proposed by G. Miley at the UIUC and under investigation there'
  statement_date: '2010-03-10'
- id: q-daiec-density-result
  added_date: '2026-05-26'
  text: |-
    Experiments have confirmed that an order of magnitude density increase (vs. no
    dipole present) can be achieved in the center region.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 38, Section III (DAIEC Experiments), ¶'
  significance: DaIEC density result — experiments confirmed an order-of-magnitude density increase in the center region versus no dipole present
  statement_date: '2010-03-10'
- id: q-khachan-sydney-thruster
  added_date: '2026-05-26'
  text: |-
    Based on this observation,
    Khachan has engineered the collimated beam of exiting neutrals from the cathode to
    make a simple electric propulsion thruster where a unidirectional micro-channel
    emerges from a conical cathode (Reference 3.14). He claims that the specific impulse of
    the thruster and its efficiency greatly exceed existing electric propulsion thrusters.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 40, Section III (Khachan''s Studies at U of Sydney), ¶'
  significance: 'Khachan thruster — at the University of Sydney, Khachan engineered the collimated beam of exiting neutrals from a conical cathode into a simple electric propulsion thruster, claiming its specific impulse and efficiency greatly exceed existing electric propulsion thrusters'
  statement_date: '2010-03-10'
- id: q-nevins-pessimistic-q-021
  added_date: '2026-05-26'
  text: |-
    Accordingly, he predicted that the Q-value (defined the ratio of fusion power out to ion input power) of an IEC device operating with a 50/50 percent deuterium−tritium (D-T) mixture would be ~0.21 for a 50-kV square well. This conclusion would rule out the possibility of a fusion reactor, but would leave open the development of driven neutron sources.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 43, Section IV, ¶'
  significance: 'Nevins pessimistic result — Nevins predicted the Q-value of an IEC operating with a 50/50 D-T mixture would be ~0.21 for a 50-kV square well, ruling out a fusion reactor but leaving open driven neutron sources'
  statement_date: '2010-03-10'
- id: q-nevins-thorough-subtle-assumptions
  added_date: '2026-05-26'
  text: |-
    Nevin's analysis appears to be very thorough, however, as discussed next, it suffers from several key, but subtle assumptions that may force the pessimistic results.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 42, Section IV, ¶1'
  significance: 'Nevins critique — the report holds that Nevins''s analysis, while very thorough, suffers from several key but subtle assumptions that may force the pessimistic results'
  statement_date: '2010-03-10'
- id: q-chacon-bafp-large-gains
  added_date: '2026-05-26'
  text: |-
    are possible in Penning IEC devices provided that: 1) The electrostatic well is deep enough (E0 > 100 kV); 2) Ion confinement time is long enough ( θ > 0.01); and 3) Ion source strength is moderate (Ŝmax < 300).
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 44, Section IV, ¶ (continues the page-43 sentence "When these restrictive assumptions are removed, it is found that large energy gains (Qs of hundreds) for beam-like solutions in square wells")'
  significance: 'Chacon BAFP large gains — when Nevins''s restrictive assumptions are removed, the bounce-averaged Fokker-Planck model finds large energy gains (Qs of hundreds) for beam-like solutions in square wells in Penning IEC devices'
  statement_date: '2010-03-10'
- id: q-chacon-bafp-conditions
  added_date: '2026-05-26'
  text: |-
    These conditions include that the electrostatic well is deep enough (E0 ~ 100 kV); Ion confinement time is long enough (θ ~ 0.01); the ion source strength is moderate (Ŝmax < 300), while the ion injection energy is slightly below the potential-well maximum.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 44, Section IV, ¶'
  significance: 'Chacon BAFP conditions — promising Q values require a deep electrostatic well (E0 ~ 100 kV), long enough ion confinement time (θ ~ 0.01), and moderate ion source strength (Ŝmax < 300), with ion injection energy slightly below the potential-well maximum'
  statement_date: '2010-03-10'
- id: q-parabolic-well-larger-q
  added_date: '2026-05-26'
  text: |-
    Thus, parabolic wells result in larger density peaks at the center, yielding Q-values 3 to 5 times larger (for E0 ~ 150 kV) than those obtained with square wells.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 44, Section IV, ¶'
  significance: 'Parabolic well advantage — parabolic wells yield larger central density peaks and Q-values 3 to 5 times larger (for E0 ~ 150 kV) than square wells'
  statement_date: '2010-03-10'
- id: q-tzonev-deep-double-wells
  added_date: '2026-05-26'
  text: |-
    Tzonev et al. found that deep double electrostatic potential wells can occur at high ion and electron currents (30 A-60 A); high perpendicular ion energy spread (3 keV-14 keV); low perpendicular electron energy spread (3 eV), and low radial ion energy spread (0.l eV-0.5 eV).
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 47, Section IV (Tzonev et al. – Deep Well Study), ¶'
  significance: 'Tzonev deep wells — Tzonev et al. found deep double electrostatic potential wells can occur at high ion and electron currents (30 A-60 A), high perpendicular ion energy spread (3 keV-14 keV), low perpendicular electron energy spread (3 eV), and low radial ion energy spread'
  statement_date: '2010-03-10'
- id: q-tzonev-summary-encouraging
  added_date: '2026-05-26'
  text: |-
    In summary, this study by Tzonev et al. is very encouraging for formation of deep wells in IEC devices designed for reactors using beam-beam dominated fusion. However, much more work needs to be done along these lines to fully identify the optimal ion injection strategy for deep wells with minimum power input.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 49, Section IV (Tzonev et al. – Deep Well Study), ¶'
  significance: 'Tzonev summary — the study is very encouraging for formation of deep wells in IEC reactors using beam-beam dominated fusion, though much more work is needed to identify the optimal ion injection strategy'
  statement_date: '2010-03-10'
- id: q-kim-window-of-stability
  added_date: '2026-05-26'
  text: |-
    More recently, H. J. Kim, in his thesis done with G. Miley, did an in-depth study of two stream-like instabilities in the ion-injected type IEC (see Reference 4.6). His work is very encouraging in that he identifies a possible "window of stability" which depends on the injected energy distribution and angular velocity spread.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 49, Section IV (Kim – Stability Analysis), ¶'
  significance: 'Kim stability window — H. J. Kim''s thesis study of two-stream-like instabilities in the ion-injected IEC identifies a possible "window of stability" depending on the injected energy distribution and angular velocity spread'
  statement_date: '2010-03-10'
- id: q-kim-two-stream-stabilized
  added_date: '2026-05-26'
  text: |-
    The results summarized in Figure 4.10 indicated that the two-stream instability is stabilized if the angular momentum spread of the beam ions is small enough, due to enhanced ion densification at the center of the device. This is very encouraging for future IEC development. However, an experimental study should be performed to verify this result.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 51, Section IV (Kim – Stability Analysis), ¶'
  significance: 'Kim two-stream result — the two-stream instability is stabilized if the angular momentum spread of the beam ions is small enough, due to enhanced ion densification at the center, though an experimental study is needed to verify it'
  statement_date: '2010-03-10'
- id: q-rider-bremsstrahlung-prohibitive
  added_date: '2026-05-26'
  text: |-
    Using the Maxwellian average values, he found that Bremsstrahlung losses would be prohibitively large for 3He-3He, p-11B, and p-6Li reactors and will be a considerable fraction of the fusion power for D-3He and D-D reactors.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 52, Section IV (Rider – Energy Balance Study), ¶'
  significance: 'Rider Bremsstrahlung critique — using Maxwellian average values, Rider found Bremsstrahlung losses would be prohibitively large for 3He-3He, p-11B, and p-6Li reactors and a considerable fraction of the fusion power for D-3He and D-D reactors'
  statement_date: '2010-03-10'
- id: q-rider-response-maxwellian-bias
  added_date: '2026-05-26'
  text: |-
    The problem with Rider's analysis is his not using reaction and scattering rates averaged over the non-Maxwellian distribution characteristic of an IEC reactor. This includes both the beam-like ion distribution and the large ion-electron temperature ratio.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 52, Section IV (Rider – Energy Balance Study), ¶'
  significance: 'Rider rebuttal — the report holds the problem with Rider''s analysis is his not using reaction and scattering rates averaged over the non-Maxwellian distribution characteristic of an IEC reactor'
  statement_date: '2010-03-10'
- id: q-neutron-source-vs-power-design
  added_date: '2026-05-26'
  text: |-
    In summary, the design of an optimal IEC neutron source is seen to be quite different from a power-producing IEC. In the source design, the grid parameters, grid/vessel diameter ratio, chamber diameter, surface conditions, background pressure, current, and voltage all become important parameters.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 53, Section IV (Neutron Source Simulations), ¶'
  significance: 'Source vs. power design — the design of an optimal IEC neutron source differs from a power-producing IEC, with grid parameters, diameter ratios, surface conditions, pressure, current, and voltage all important in the source design'
  statement_date: '2010-03-10'
- id: q-integrated-inspection-concept
  added_date: '2026-05-26'
  text: |-
    This integrated inspection system was proposed by G. Miley, et al., in Reference 5.1. It incorporates combined 2.5-and 14-MeV IEC neutron sources and an IEC x-ray source.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 55, Section V (Integrated X-Ray/Neutron Sources), ¶'
  significance: 'Integrated inspection concept — an integrated inspection system proposed by G. Miley et al. incorporates combined 2.5- and 14-MeV IEC neutron sources and an IEC x-ray source'
  statement_date: '2010-03-10'
- id: q-inspection-detection-targets
  added_date: '2026-05-26'
  text: |-
    Basic elements such as oxygen, carbon, and chlorine present in the explosives can be identified through the (n, n'γ) reaction initiated by fast neutrons. The gamma rays produced in the reaction are characteristic of elements being interrogated. Another basic element in many explosives, nitrogen, is usually measured through (n, γ) reactions initiated by thermal neutrons.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 55, Section V (Nuclear and Chemical Explosive Detection Techniques), ¶'
  significance: 'Detection technique — basic elements such as oxygen, carbon, and chlorine in explosives are identified through the (n, n''γ) reaction initiated by fast neutrons, and nitrogen through (n, γ) reactions initiated by thermal neutrons'
  statement_date: '2010-03-10'
- id: q-inspection-detection-categories
  added_date: '2026-05-26'
  text: |-
    B. Nuclear Materials such as natural uranium (U-238) and weapon grade with enriched (U-235). Testing can be done with this natural uranium which can be obtained without special restrictions.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 57, Section V (Overview for Weapons/Nuclear Material Simulation Articles), ¶'
  significance: 'Detection categories — the simulation-article overview lists nuclear materials such as natural uranium (U-238) and weapon-grade enriched (U-235) among items of interest for detection in inspection stations'
  statement_date: '2010-03-10'
- id: q-fusion-ship-ii-config
  added_date: '2026-05-26'
  text: |-
    The overall spaceship length is 300 meters and the initial mass at mission start is 500 metric tons. Crew and avionics/computers are located in the central compartment at the forward end of the vehicle.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 62, Section V (Space Propulsion), ¶'
  significance: 'Fusion Ship II configuration — the IEC fusion-powered spaceship "Fusion Ship II" has an overall length of 300 meters and an initial mass at mission start of 500 metric tons, with crew and avionics in the central forward compartment'
  statement_date: '2010-03-10'
- id: q-fusion-ship-ii-jupiter
  added_date: '2026-05-26'
  text: |-
    A typical trip time for an out-and-back mission to Jupiter is 210 days out and 153 days to return. This is comparable to or faster than that predicted in prior fusion studies.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 63, Section V (Space Propulsion), ¶'
  significance: 'Fusion Ship II Jupiter mission — a typical out-and-back mission to Jupiter is 210 days out and 153 days to return, comparable to or faster than prior fusion studies'
  statement_date: '2010-03-10'
- id: q-mcsa-concept
  added_date: '2026-05-26'
  text: |-
    The Magnetically-Channeled Spherical IEC Array (MCSA) concept for a hybrid magnetic assisted spherical IEC configuration maintains the basic ion-injected spherical IEC reactor configuration but adds magnetic channels for coupling exhaust plasma and reaction products.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 64, Section V (Magnetically-Channeled Spherical IEC Array (MCSA) Concept), ¶'
  significance: 'MCSA concept — the Magnetically-Channeled Spherical IEC Array maintains the basic ion-injected spherical IEC reactor configuration but adds magnetic channels for coupling exhaust plasma and reaction products'
  statement_date: '2010-03-10'
- id: q-section-v-concluding-remarks
  added_date: '2026-05-26'
  text: |-
    Space propulsion and related space power seems quite far term due to the large size powers demanded for such applications. However, the possibility of using magnetic coupling of smaller unit provides a modular approach that has many advantages, plus expediting development by allowing concentration on the smaller modules.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 67, Section V (Concluding Remarks), ¶'
  significance: 'Section V conclusion — space propulsion seems far term due to the large powers demanded, but magnetic coupling of smaller units provides a modular approach with many advantages that expedites development'
  statement_date: '2010-03-10'
- id: q-section-vi-orders-below-breakeven
  added_date: '2026-05-26'
  text: |-
    However best current device results are 5 or 6 orders of magnitude down in energy gain Q (energy out/ in) from breakeven. Thus it may appear that such a hope is many years off. Fortunately, the IEC can be scaled up in energy gain while keeping a small size since the losses are in velocity space (i.e. via ion upscattering out of the potential well trap).
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 68, Section VI, ¶1'
  significance: 'Breakeven gap — best current device results are 5 or 6 orders of magnitude below breakeven energy gain Q, but the IEC can be scaled up in energy gain while keeping a small size because the losses are in velocity space'
  statement_date: '2010-03-10'
- id: q-vi-breakeven-small-core
  added_date: '2026-05-26'
  text: |-
    Thus in principle, energy breakeven could be demonstrated in the IEC in a very dense plasma "core" occupying only a few cc volume with only a few 100's of watts in and out. This extreme is not currently possible, but use of the new gun injected technology to obtain breakeven in a dense plasma core in the IEC of 100's of cc volume and with 20-25 kW input power seems practical.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 69, Section VI (Demonstration of Net Energy Gain), ¶'
  significance: 'Breakeven core scale — in principle energy breakeven could be demonstrated in a dense plasma core of a few cc with a few hundred watts in and out; breakeven in a 100''s-of-cc core with 20-25 kW input power using new gun-injected technology seems practical'
  statement_date: '2010-03-10'
- id: q-vi-p11b-lawson-requirement
  added_date: '2026-05-26'
  text: |-
    This trapped plasma must meet the Lawson criterion for energy to break-even with p-¹¹B, nτ ~ 10¹⁶ cm⁻³-sec (two orders of magnitude above the requirement for D-T fusion). Here n is the ion density and τ is the ion confinement time.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 69, Section VI (Vision of a Future p-¹¹B Fusion Plant), ¶'
  significance: 'p-¹¹B Lawson requirement — break-even with p-¹¹B requires the trapped plasma to meet a Lawson criterion of nτ ~ 10¹⁶ cm⁻³-sec, two orders of magnitude above the D-T fusion requirement'
  statement_date: '2010-03-10'
- id: q-vi-12-gun-q-scaling
  added_date: '2026-05-26'
  text: |-
    The 12 gun breakeven design will provide an increase in β to ~ 1000 due to differential pumping effects, I will increase to 6000 mA (due to multiple pulsed guns), and a will be cut down by 10 due to improvements in focusing both and reduced collisionality. This predicts an increase in Q (compared to prior gun experiment) of ~10⁸, giving Q=1 ("breakeven") as required for a p-¹¹B plasma
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 72, Section VI (Proposed Breakeven Experiment), ¶'
  significance: '12-gun Q scaling — the 12-gun breakeven design increases β to ~1000, I to 6000 mA, and reduces core radius a by 10, predicting a ~10⁸ increase in Q over the prior gun experiment to give Q=1 ("breakeven") for a p-¹¹B plasma'
  statement_date: '2010-03-10'
- id: q-vi-hydrogen-simulation
  added_date: '2026-05-26'
  text: |-
    Thus we propose to confirm the achievement of breakeven conditions using a hydrogen plasma and diagnostics to show that the nτ and T corresponding to Q = 1 (p-¹¹B) are obtained.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 72, Section VI (Proposed Breakeven Experiment), ¶'
  significance: 'Hydrogen simulation — the proposal is to confirm breakeven conditions using a hydrogen plasma and diagnostics showing that the nτ and T corresponding to Q = 1 (p-¹¹B) are obtained'
  statement_date: '2010-03-10'
- id: q-vi-no-show-stoppers
  added_date: '2026-05-26'
  text: |-
    There are no "show stoppers" however, so the road map to IEC fusion power seems clear. The main challenge is to find funding sources with the "will" to proceed.
  source:
    path: government/dird-09-iec-fusion-20100310.pdf
    location: 'p. 73, Section VI (Concluding Remarks), ¶'
  significance: 'Conclusion — the report states there are no "show stoppers," so the road map to IEC fusion power seems clear, with the main challenge being to find funding sources with the "will" to proceed'
  statement_date: '2010-03-10'
