description: 'Metallic Glasses: Status and Prospects for Aerospace Applications. The Defense Intelligence Reference Document is 14 December 2009, with an ICOD of 1 December 2009 and control number DIA-08-0911-012, UNCLASSIFIED//FOR OFFICIAL USE ONLY. Where the Prepared by and Author appear, the document gives [(b)(3):10 USC 424] and Defense Intelligence Agency ([`/organizations/dia`]) and [(b)(6)]. An Administrative Note states the product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, [(b)(3):10 USC 424] Advanced Aerospace Weapon System Applications (AAWSA) Program [`/organizations/aawsap`], and that comments or questions should be addressed to the AAWSA Program Manager. The document is one of a series of FY 2009 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]); the author ([`/people/t-hufnagel`]) appears there, not on the document, where the Author is [(b)(6)].


  The Summary characterized metallic glasses as materials that combine some of the advantageous mechanical properties of metals — strength, stiffness, and in some cases toughness — with the processing flexibility usually associated with thermoplastic polymers. The absence of crystalline defects allows them to be much stronger than conventional alloys but also means they have near-zero tensile ductility and poor fatigue resistance. In structural applications metallic glasses are most likely to be useful as composites consisting of ductile crystalline dendrites in a metallic glass matrix; these dendritic composites sacrifice some strength but can have exceptionally high fracture toughness and good fatigue resistance and could replace high-strength steels in certain load-limited structural components in aerospace vehicles where space is limited. Because they are true glasses, thermoplastic forming near the glass transition temperature affords tremendous flexibility in processing — components can be formed in a single step (for example, by injection molding) in complex geometries, metallic glass foams can be made with relative ease, and the lack of a crystalline grain structure allows nanoscale features to be formed with high fidelity, which may make them useful in micro-electromechanical systems (MEMS) applications.


  The document also discussed the significant limitations for aerospace applications. Foremost is a lack of good glass-forming alloys: there are no good aluminum-rich glass-forming alloys, the known titanium-based alloys are either relatively dense or contain beryllium, and the known magnesium- and iron-based alloys are all quite brittle, with low fracture toughness. The number of good composite systems known at present is also quite limited. For metallic glasses and their composites to be of broad utility, progress is required in alloy design (preferably by computational and/or combinatorial approaches rather than trial and error), in understanding mechanical behavior, and in processing techniques including production of metallic glass foams. The Summary and Recommendations states it is highly likely continued work over the next 20-50 years will result in significant advances and increasing acceptance of metallic glasses and metallic glass matrix composites as structural materials, but that whether they achieve widespread use in aerospace applications depends critically on the development of new, lightweight alloys.

  '
