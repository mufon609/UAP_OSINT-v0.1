- id: q4
  added_date: '2026-05-21'
  text: |-
    Metallic glasses combine some of the advantageous mechanical properties of metals—strength, stiffness, and in some cases toughness—with the processing flexibility usually associated with thermoplastic polymers. The absence of crystalline defects allows metallic glasses to be much stronger than conventional alloys but also means they have near-zero tensile ductility and poor fatigue resistance. In structural applications, therefore, metallic glasses are most likely to be useful in the form of composites consisting of ductile crystalline dendrites in a metallic glass matrix. These dendritic composites sacrifice some strength but can have exceptionally high fracture toughness, as well as good fatigue resistance, and could replace high-strength steels in certain load-limited structural components in aerospace vehicles where space is limited.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. v, ¶1 (Summary)'
  significance: Summary thesis — metallic glasses combine metallic strength with thermoplastic processing flexibility but lack tensile ductility; dendritic composites are the most likely structural route, potentially replacing high-strength steels where space is limited
  statement_date: '2009-12-14'
- id: q5
  added_date: '2026-05-21'
  text: |-
    Because they are true glasses, thermoplastic forming near the glass transition temperature affords metallic glasses tremendous flexibility in processing. For instance, metallic glass components can be formed in a single step (for example, by injection molding) in complex geometries that would be difficult or impossible to produce with conventional alloys. In addition, metallic glass foams can be made with relative ease, raising the possibility of making structural foams with high strength and stiffness. Finally, because they lack a crystalline grain structure, metallic glasses can be used to form nanoscale features with high fidelity. This may make metallic glasses useful in a variety of micro-electromechanical systems (MEMS) applications.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. v, ¶2 (Summary)'
  significance: Summary — thermoplastic processing flexibility (single-step injection molding, foams, nanoscale features) is the distinctive advantage of metallic glasses over conventional alloys
  statement_date: '2009-12-14'
- id: q6
  added_date: '2026-05-21'
  text: |-
    Metallic glasses also have significant limitations for aerospace applications, however. Foremost among these is a lack of good glass-forming alloys; in particular, there are no good aluminum-rich glass-forming alloys, the known titanium-based alloys are either relatively dense (owing to high concentrations of alloying elements) or contain beryllium, and the known magnesium-and iron-based alloys are all quite brittle, with low fracture toughness. Although metallic glass matrix composites can have outstanding properties (particularly strength and fracture toughness), the number of good composite systems known at present is also quite limited.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. v, ¶3 (Summary)'
  significance: Summary — the foremost limitation is the lack of good glass-forming alloys (no aluminum-rich systems; titanium alloys dense or contain beryllium; magnesium/iron alloys brittle)
  statement_date: '2009-12-14'
- id: q7
  added_date: '2026-05-21'
  text: |-
    The atomic-scale structure of most metals and alloys is crystalline; that is, the atoms are arranged in a highly ordered manner on a lattice that is periodic in three dimensions, as depicted in Figure 1(a). In contrast to this crystalline structure, metallic glasses lack the long-range order of a lattice and are therefore said to be amorphous, as depicted in Figure 1(b). Although the word "amorphous" implies a complete lack of structural order, in fact the atomic structure of metallic glasses is not truly random. Constraints on atomic packing provide strong short-range order; for instance, on average the atoms have a particular number of nearest atomic neighbors at a well-defined distance. But this short-range order persists only over distances of a few atoms; there is no long-range order as there is in a crystalline alloy. In many ways, the atomic-scale structure of metallic glasses more closely resembles the highly disordered structure of a liquid than the structure of a crystalline alloy.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 1, ¶1 (Structure)'
  significance: Structural definition — metallic glasses lack the long-range crystalline lattice order and are amorphous, with short-range order resembling a liquid
  statement_date: '2009-12-14'
- id: q8
  added_date: '2026-05-21'
  text: |-
    Common practice in the field is to refer to any alloy capable of being cast into a section at least 1-mm thick as a "bulk" metallic glass. These alloys may be cast or molded into forms suitable for structural applications.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 3, ¶2 (Glass-Forming Alloys)'
  significance: Definition of bulk metallic glass — any alloy castable to at least 1-mm section thickness, suitable for structural applications
  statement_date: '2009-12-14'
- id: q9
  added_date: '2026-05-21'
  text: |-
    As shown in Table 2, the strength of aluminum-based metallic glasses can be two or three times greater than those of conventional (crystalline) high-strength aluminum alloys. Similarly high strengths are seen for other amorphous alloys; for instance, the best iron-based alloys have a strength of approximately 4 GPa—again, two or three times greater than those of conventional high-strength steels.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 6, ¶1 (Strength and Ductility)'
  significance: Strength claim — amorphous aluminum-based glasses are two to three times stronger than conventional high-strength aluminum alloys; iron-based alloys reach ~4 GPa
  statement_date: '2009-12-14'
- id: q10
  added_date: '2026-05-21'
  text: |-
    Metallic glasses, lacking dislocations, do not strain harden and in fact strain soften in response to plastic deformation. This means that as soon as any one region yields, any further deformation will occur in the same region. This process, known as shear localization, leads to the formation of shear bands (Figure 4). In any loading geometry where the metallic glass experiences significant tensile loading, fracture occurs on a single dominant shear band with essentially zero tensile ductility.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 7, ¶1 (Strength and Ductility)'
  significance: Failure mechanism — the lack of dislocations causes shear localization into shear bands and essentially zero tensile ductility under tensile loading
  statement_date: '2009-12-14'
- id: q11
  added_date: '2026-05-21'
  text: |-
    Up to 90 percent of failures of structural components in service are estimated to be caused by fatigue, making fatigue resistance of obvious importance to designers.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 9, ¶1 (Fatigue)'
  significance: Fatigue framing — up to 90 percent of in-service structural component failures are attributed to fatigue, making fatigue resistance critical for aerospace use
  statement_date: '2009-12-14'
- id: q12
  added_date: '2026-05-21'
  text: |-
    The fatigue limit for high-strength crystalline alloys is typically about 40 percent of the tensile strength, but for metallic glasses, it is only about 5 percent of the tensile strength (Figure 5).
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 9, ¶2 (Fatigue)'
  significance: Fatigue limitation — single-phase metallic glasses have a fatigue limit of only ~5 percent of tensile strength versus ~40 percent for high-strength crystalline alloys
  statement_date: '2009-12-14'
- id: q13
  added_date: '2026-05-21'
  text: |-
    For instance, the plane-strain fracture toughness of some zirconium-based in situ composites can exceed 170 MPa·m^1/2—7 times greater than that of single-phase glasses and greater than that of virtually any other metallic alloy.^36 This resistance to crack propagation is also manifested as improved fatigue performance. The fatigue strength of the zirconium-based in situ composites is 20-30 percent of the tensile strength; in comparison, monolithic metallic glasses have a fatigue strength of only ~ 5 percent of the tensile strength.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 15, ¶2 (Fracture and Fatigue)'
  significance: Composite payoff — zirconium-based in situ dendritic composites reach plane-strain fracture toughness exceeding 170 MPa·m^1/2 (7x single-phase glass) and fatigue strength of 20-30 percent of tensile strength
  statement_date: '2009-12-14'
- id: q14
  added_date: '2026-05-21'
  text: |-
    These considerations suggest the dendritic metallic glass matrix composites might indeed find applications as structural materials in aircraft and/or spacecraft. The most obvious applications would be to replace steel in certain components where strength is critical but space is limited. These might include pylon structures and landing gear,^38 although it has yet to be demonstrated that the composites can be fabricated in the sizes necessary. Furthermore, the corrosion and stress-corrosion cracking resistance of these materials has not been fully evaluated.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 17, ¶3 (Structural Applications)'
  significance: Aerospace application thesis — dendritic composites might replace steel in strength-critical, space-limited aircraft/spacecraft components (pylon structures, landing gear), though fabrication at necessary sizes is undemonstrated
  statement_date: '2009-12-14'
- id: q15
  added_date: '2026-05-21'
  text: |-
    Such structural foams could be useful in applications requiring strength and stiffness under compressive loads, such as structural panels for extraterrestrial buildings. Conceivably, such structural foams might even be produced on site (from raw feedstock), reducing the volume of material that needs to be launched.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 19, ¶1 (Structural Applications)'
  significance: Speculative space application — metallic glass structural foams could serve as panels for extraterrestrial buildings, conceivably produced on site to reduce launch mass
  statement_date: '2009-12-14'
- id: q16
  added_date: '2026-05-21'
  text: |-
    For aerospace applications, the most glaring lack is that, despite significant alloy design efforts in the United States (through the DARPA Structural Amorphous Metals program), Japan, China, and elsewhere, there are no good glass-forming alloys based on aluminum.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 20, ¶1 (Alloy Design)'
  significance: Alloy-design gap — despite DARPA Structural Amorphous Metals program efforts in the US, Japan, China and elsewhere, no good aluminum-based glass-forming alloys exist
  statement_date: '2009-12-14'
- id: q17
  added_date: '2026-05-21'
  text: |-
    It is highly likely that continued work over the next 20-50 years will result in significant advances in all these areas, and that metallic glasses and metallic glass matrix composites will see increasing acceptance as structural materials. Whether or not they achieve widespread use in aerospace applications, however, depends critically on the development of new, lightweight alloys.
  source:
    path: government/dird-01-metallic-glasses-20091214.pdf
    location: 'p. 22, ¶ closing (Summary and Recommendations)'
  significance: Concluding forecast — over the next 20-50 years metallic glasses and composites will see increasing acceptance as structural materials, but widespread aerospace use depends critically on developing new lightweight alloys
  statement_date: '2009-12-14'
