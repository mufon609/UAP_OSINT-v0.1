- id: q5
  added_date: '2026-06-06'
  text: >-
    Biomedical sensors and implantable devices employing
    micro-electromechanical technology will be important to the future of
    biomedicine. Once just science fiction, the notion of a bionic man is now
    becoming a reality through the application of microscale technologies.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'Introduction, ¶1'
  significance: Thesis statement — biomedical micro-electromechanical implantables as the future of biomedicine; the "bionic man" framing.
  statement_date: '2010-03-31'
- id: q6
  added_date: '2026-06-06'
  text: >-
    With the rapid pace of development, it is probable that within the next two
    decades we will have as many medical treatments based on microdevices as
    there are pharmaceutical solutions today. This paper examines some of the
    most recent advances in the field, as well as the technologies that are
    likely to appear in the next few years.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'Introduction, ¶2'
  significance: Scope statement — the survey's framing as a review of recent and near-future BioMEMS/biosensor advances.
  statement_date: '2010-03-31'
- id: q7
  added_date: '2026-06-06'
  text: >-
    BioMEMS stands for biomedical micro-electro-mechanical systems. It is a name
    applied to biological and medical devices that are created using advanced
    fabrication processes that allow the devices to be very small relative to
    comparable devices produced by traditional techniques. BioMEMS devices can
    also exploit the microscale to provide new functions that are not practical
    or possible in large-scale devices.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "What is BioMEMS?"'
  significance: Core definition of BioMEMS — the document's central term.
  statement_date: '2010-03-31'
- id: q8
  added_date: '2026-06-06'
  text: >-
    The field of BioMEMS encompasses micro devices that are often but not
    exclusively made by the same photolithographic techniques used to make
    computer chips. Their applications include neuroprosthetics, sensors and
    actuators, and microchemistry systems.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "What is BioMEMS?"'
  significance: Maps the BioMEMS application space — neuroprosthetics, sensors/actuators, microchemistry (lab-on-a-chip).
  statement_date: '2010-03-31'
- id: q9
  added_date: '2026-06-06'
  text: >-
    These devices can operate on principles such as capillary force, van der
    Waals forces, and electric-field forces. These forces become relatively
    strong when the size scale reaches very small dimensions. In the realm of
    the very small, the force of gravity is far less important than electrical
    charge and viscosity.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Characteristics of BioMEMS"'
  significance: Characterizes the microscale physics regime where surface/van-der-Waals/electric forces dominate over gravity.
  statement_date: '2010-03-31'
- id: q10
  added_date: '2026-06-06'
  text: >-
    Another promising field of research is directed towards integration of the
    human brain with microelectrical components. For example implants are being
    developed which allow volitional (thought) control of machines. Most of this
    effort is targeted towards rehabilitation of individuals who are
    quadriplegics in order to allow them some control over their environment.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Categories of BioMEMS"'
  significance: Introduces the brain-machine-integration / thought-control-of-machines research direction (the neuroengineering thread).
  statement_date: '2010-03-31'
- id: q11
  added_date: '2026-06-06'
  text: Several of these technologies have been the subject of research by the present author and by colleagues at Arizona State University.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Categories of BioMEMS"'
  significance: First-person authorial voice ("the present author") + Arizona State University affiliation — anchors the extrinsic Dr. Bruce Towe (University of Arizona) attribution; author identity itself redacted on the document.
  statement_date: '2010-03-31'
- id: q12
  added_date: '2026-06-06'
  text: >-
    There are applications in biomedicine and research where very small
    electrodes are implanted into the brain. These microelectrodes are used in
    the cortex (surface layer) to detect electrical activity associated with the
    volitional desire to move some part of the body.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Brain-Implanted BioMEMS Micromachine Neuroelectrodes"'
  significance: Defines the brain-implanted microelectrode use case — detecting volitional motor intent in the cortex.
  statement_date: '2010-03-31'
- id: q13
  added_date: '2026-06-06'
  text: >-
    Thus in principle there is an ability to electrically record from the brain
    and determine a person's intent to move. Monitoring of the brain is
    accomplished by using an array of implanted microelectrodes whose signals
    anticipate movement of specific limbs. These signals can in turn be used to
    control machines.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Brain-Implanted BioMEMS Micromachine Neuroelectrodes"'
  significance: Core claim — recording motor intent from implanted electrode arrays to control machines (the BMI premise).
  statement_date: '2010-03-31'
- id: q14
  added_date: '2026-06-06'
  text: >-
    Figure 2 shows a photomicrograph of a gear-driven micromachine that was made
    through collaboration between ASU and Sandia National Laboratories. The
    device is driven by an electrostatic vibrating comb motor.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Brain-Implanted BioMEMS Micromachine Neuroelectrodes"'
  significance: Documents an ASU–Sandia National Laboratories collaboration on a gear-driven MEMS micromachine.
  statement_date: '2010-03-31'
- id: q15
  added_date: '2026-06-06'
  text: The device is fabricated by using Sandia's Ultraplanar Multi-level MEMS Technology (SUMMiTV) process, a 5-layer polysilicon micromachining technology.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "BioMEMS Micromachines"'
  significance: Names the specific Sandia SUMMiT V fabrication process underlying the micromachine.
  statement_date: '2010-03-31'
- id: q16
  added_date: '2026-06-06'
  text: >-
    Although the implantable MEMS pump was developed for diabetes, the pump has
    application to the slow measured delivery of many other drugs including
    5-fluoruracil used for cancer therapy and theophyline for treatment of
    asthma.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Drug-Delivery Pumps"'
  significance: Drug-delivery-pump application breadth (diabetes, cancer, asthma); preserves source misspellings "5-fluoruracil" and "theophyline" verbatim (no-correction discipline).
  statement_date: '2010-03-31'
- id: q17
  added_date: '2026-06-06'
  text: 'A primary application of BioMEMS is in the creation of sensors for blood chemistry and other biophysical parameters of the human body.'
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "What is a Biosensor?"'
  significance: States biosensing of blood chemistry as a primary BioMEMS application — pivots the survey into its biosensor half.
  statement_date: '2010-03-31'
- id: q18
  added_date: '2026-06-06'
  text: >-
    Since the early days of the space program NASA has been interested in ways
    of noninvasively monitoring these blood parameters in astronauts for the
    instant assessment of their physiological condition. Until recently, blood
    withdrawal was the only accurate and reliable way to obtain such information.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "BioMEMS Implantable Sensors"'
  significance: NASA / astronaut-physiology motivation for noninvasive implantable biosensors — a space-application relevance thread.
  statement_date: '2010-03-31'
- id: q19
  added_date: '2026-06-06'
  text: >-
    The military has also been interested in the assessment of the state of
    readiness of a soldier which is reflected in his blood chemistry. An
    exhausted solider will show a highly acidic blood pH (less than about 7.3).
    Remote electronic readout of biosensor information of a soldier to a central
    command center is presently the stuff of science fiction movies but reflects
    real desires of the military.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "BioMEMS Implantable Sensors"'
  significance: Explicit defense-relevance passage — military interest in biosensor-based soldier readiness assessment and remote readout (preserves "solider" sic).
  statement_date: '2010-03-31'
- id: q20
  added_date: '2026-06-06'
  text: >-
    So far, despite decades of work, no continuous monitoring sensor that is
    self contained and implantable has been successful for long term usage. The
    human body is an exceptionally hostile environment for foreign materials.
    Even our most advanced biosensors fail over a period of days or weeks if
    continuously exposed to the body environment.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "BioMEMS Implantable Sensors"'
  significance: Candid limitation assessment — no implantable continuous-monitoring biosensor yet succeeds long-term; the body as a hostile environment.
  statement_date: '2010-03-31'
- id: q21
  added_date: '2026-06-06'
  text: >-
    Towe et al. at Arizona State University have been working on an improved
    approach to blood glucose sensing. It depends on the fact that the glucose
    oxidase reaction generates a small amount of heat as indicated in the above
    chemical reaction.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Thermopile Implantable Glucose Sensors"'
  significance: Names "Towe et al." (ASU) thermopile glucose-sensing work in body prose — the author's own group's research, in third person despite the redacted authorship.
  statement_date: '2010-03-31'
- id: q22
  added_date: '2026-06-06'
  text: 'This sensor employs what is known as the Seebeck Effect whereby dissimilar metals heated at their junction produce a voltage that is proportional to temperature.'
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Thermopile Implantable Glucose Sensors"'
  significance: Operating principle of the ASU thermopile glucose sensor (Seebeck effect / thermoelectric).
  statement_date: '2010-03-31'
- id: q23
  added_date: '2026-06-06'
  text: >-
    Crude forms of these thought-controlled devices have been shown in research
    laboratories to be feasible, even if they are at present not practical.
    Among other things, the electrode interface to the brain is not yet
    sufficiently developed to provide large numbers of functioning electrodes
    that can work over prolonged periods of time.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Microelectrode Array Fabrication"'
  significance: Make-or-break assessment of thought-controlled (BMI) devices — feasible in the lab but not yet practical; the electrode-interface bottleneck.
  statement_date: '2010-03-31'
- id: q24
  added_date: '2026-06-06'
  text: >-
    A specific development in MEMS based neuroengineering has been the
    brain-machine interface (BMI). These devices use computers to interpret
    brain signals from implanted neural arrays and then use the information to
    control machines and setup an automated environment.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Brain-Machine Interfaces"'
  significance: Defines the brain-machine interface (BMI) — the survey's most defense/augmentation-relevant capability.
  statement_date: '2010-03-31'
- id: q25
  added_date: '2026-06-06'
  text: >-
    For example, a visual prosthesis could potentially restore partial vision to
    a blind patient by stimulating neurons in the visual cortex using an input
    BMI. Signals could be recorded from the motor cortex using an output BMI in
    order to bypass a neural injury and restore some movement to a paralyzed
    patient.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Brain-Machine Interfaces"'
  significance: Illustrates input/output BMI modalities — visual-cortex stimulation and motor-cortex recording.
  statement_date: '2010-03-31'
- id: q26
  added_date: '2026-06-06'
  text: >-
    Research at Arizona State University has been directed towards overcoming the
    problems of bulk and need for battery replacement through an approach where
    the implanted neurostimulation devices are made exceptionally small and where
    they derive their power by a process of induction from the outside of the
    body.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Microscale in Therapeutic Neurostimulation"'
  significance: ASU ultrasound-powered miniature neurostimulator research (Towe et al., Figure 28/29) — wireless-powered implant the size of a syringe lumen.
  statement_date: '2010-03-31'
- id: q27
  added_date: '2026-06-06'
  text: >-
    NASA has supported at Arizona State University, the development of new types
    of microfluidic systems directed towards growing cell cultures on a chip.
    The specific application is detecting the effects of space flight and
    microgravity on living things at the cellular scale.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "NASA Space Applications for Microfluidic Systems"'
  significance: NASA-funded ASU microfluidic cell-culture-on-a-chip for studying spaceflight/microgravity effects — the explicit space-application section.
  statement_date: '2010-03-31'
- id: q28
  added_date: '2026-06-06'
  text: >-
    Biomolecular sensors with the ability to "multiplex," or to detect a large
    number of different molecular species at the same time, are being developed
    for cancer diagnostics and therapy monitoring.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Microcantilever MEMs Sensors"'
  significance: Microcantilever multiplexed biomolecular sensing for cancer diagnostics — the cancer-diagnostics application thread.
  statement_date: '2010-03-31'
- id: q29
  added_date: '2026-06-06'
  text: >-
    MEMs are characterized by small dimensions, enabling new applications of
    physical principles to make sensors and actuators of superior
    characteristics.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Conclusion"'
  significance: Opening conclusion statement (preserves "MEMs" casing variant verbatim).
  statement_date: '2010-03-31'
- id: q30
  added_date: '2026-06-06'
  text: >-
    Advanced fabrication processes are still being discovered to further
    miniaturize electromechanical systems and to bring us into the realm of
    nanomechanical systems (NEMS). The new class of NEMS devices are expected to
    provide a higher performance in applications such as sensors, medical
    diagnostics and in the electronics industry.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Conclusion"'
  significance: Closing forward-look — the trajectory toward NEMS (nanomechanical systems) as the next miniaturization frontier.
  statement_date: '2010-03-31'
- id: q31
  added_date: '2026-06-06'
  text: >-
    This field is expanding rapidly. Searches of the scientific literature show
    new ideas being developed in a number of laboratories throughout the world.
  source:
    path: government/dird-20-biosensors-biomems-20100331.pdf
    location: 'section "Conclusion"'
  significance: Final assessment sentence — the field as rapidly expanding worldwide.
  statement_date: '2010-03-31'
