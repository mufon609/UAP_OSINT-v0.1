  statement_date: '2010-03-11'
- id: q10
  added_date: '2026-06-07'
  text: |-
    We derive the relevant probability density function, apparently previously unknown and dubbed "Maccone distribution" by Paul Davies.
  source:
    path: government/dird-25-statistical-drake-equation-2010.pdf
    location: 'p. 29, ¶ Abstract item 3 (Appendix B)'
  significance: Records that the new ET-distance probability density was named the 'Maccone distribution' by physicist Paul Davies — grounds the Paul Davies and authorship cross-references
  statement_date: '2010-03-11'
