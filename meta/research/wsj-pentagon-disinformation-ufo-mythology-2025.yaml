description: 'Wall Street Journal investigation by Joel Schectman ([`/people/joel-schectman`]) and Aruna Viswanatha ([`/people/aruna-viswanatha`]); the full text is reported at tovima.com ([`/organizations/tovima`]). The All-domain Anomaly Resolution Office ([`/organizations/aaro`]), set up under Sean Kirkpatrick ([`/people/sean-kirkpatrick`]) to review the historical record back to 1945, found that the Pentagon itself had sometimes fabricated evidence of alien technology and allowed rumors to fester to cover up real secret-weapons programs. The account is based on interviews with two dozen current and former U.S. officials, scientists and military contractors involved in the inquiry, as well as thousands of pages of documents, recordings, emails and text messages.


  The investigation documents a series of discoveries. In the 1980s an Air Force colonel visited a bar near Area 51 and gave the owner doctored photos of what might be flying saucers — a ruse to protect testing of the F-117 stealth fighter; the now-retired officer confessed the disinformation to the Pentagon investigators in 2023. For decades, certain new commanders of the Air Force''s most classified programs were handed, as part of their induction briefings, a piece of paper with a photo of what looked like a flying saucer described as an antigravity maneuvering vehicle, and were told the program they were joining, dubbed Yankee Blue, was an effort to reverse-engineer the technology on the craft; many never learned it was fake. Kirkpatrick found the practice had begun decades before and appeared to continue still, and the defense secretary''s office sent a memo out across the service in the spring of 2023 ordering the practice to stop immediately. After that 2023 discovery, Kirkpatrick''s deputy briefed director of national intelligence Avril Haines ([`/people/avril-haines`]). The account also describes the 1967 Robert Salas ([`/people/robert-salas`]) episode in a Montana missile bunker, which Kirkpatrick''s team dug into and discovered a terrestrial explanation for — an Air Force electromagnetic pulse generator test.


  In a statement, Defense Department spokeswoman Sue Gough ([`/people/sue-gough`]) acknowledged that AARO had uncovered evidence of fake classified program materials relating to extraterrestrials and had briefed lawmakers and intelligence officials; she said the department didn’t include that information in its report last year because the investigation wasn’t completed, but expects to provide it in another report scheduled for later this year, and that the department is committed to releasing a second volume of its Historical Record Report to include AARO''s findings on reports of potential pranks and inauthentic materials.

  '
