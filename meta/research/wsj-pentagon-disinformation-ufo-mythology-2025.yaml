    location: ¶ Kirkpatrick’s team dug into the story
  significance: 'The terrestrial explanation Kirkpatrick''s team found for the Montana missile-silo events — an Air Force electromagnetic-pulse-generator test on a portable platform 60 feet above the facility, glowing orange and disabling the guidance systems'
