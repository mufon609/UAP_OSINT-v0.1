    location: ¶ In fact, a Wall Street Journal investigation reveals
  significance: 'The article''s central thesis — the 2024 public report left out that the Pentagon itself sometimes deliberately spread disinformation targeting its own citizens, while embedded-secret-program opacity bred the myths'
  statement_date: '2025-06-06'
