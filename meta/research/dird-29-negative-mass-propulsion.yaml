description: 'Negative Mass Propulsion. The Defense Intelligence Reference Document, 03 January 2011, shows an ICOD of 30 August 2010 and the number DIA-08-1101-023, UNCLASSIFIED//FOR OFFICIAL USE ONLY. Where the document shows Prepared by and Author, it shows (b)(3):10 USC 424 and Defense Intelligence Agency ([`/organizations/dia`]) and (b)(6). The Administrative Notes place the product as one in a series of advanced technology reports produced in FY 2010 under the Defense Intelligence Agency, (b)(3):10 USC 424 Advanced Aerospace Weapon System Applications (AAWSA) Program ([`/organizations/aawsap`]), with a COPYRIGHT WARNING that further dissemination of the photographs in this publication is not authorized, and that comments or questions pertaining to this document should be addressed to the AAWSA Program Manager. The document is made available through the declassification efforts and research of John Greenewald, Jr., creator of The Black Vault ([`/organizations/the-black-vault`]). It is one of the FY 2010 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]).


  The purpose of this study is the question as to whether negative mass might exist, and if negative mass propulsion is possible at all. It is easy to prove that there are negative masses all around us, hidden behind positive masses, but their use for propulsion by reducing the inertia of matter — for example in the limit of macroscopic bodies with zero rest mass — depends on a technical solution to free them from their imprisonment by positive masses. It appears that there are basically two ways this might be achieved: by the application of strong electromagnetic or gravitational fields or by high particle energies, or by searching for places in the universe where nature has already done this separation, and from which the negative masses can be mined. The first of these two possibilities is for all practical means excluded. With a positive and a negative mass forming a mass dipole, the system becomes self-accelerating, and under its self-acceleration the mass dipole would eventually reach the velocity of light; it is this property of self-acceleration without expenditure of energy that has intrigued many researchers and raised the prospect of a propulsion system without limits. No matter how strange the properties associated with negative masses appear to be, there can be little doubt that they can be incorporated into Einstein''s gravitational field theory as long as they do not violate the principle of equivalence.


  Non-baryonic cold dark matter tends to accumulate near the center of galaxies, places which have a large gravitational potential well, and large amounts of negative masses might over billions of years have been trapped in these gravitational potential wells. Now it just happens that the center of the moon is a potential well, not too deep that it cannot be reached by making a tunnel through the moon, not possible for the deeper potential well of the earth, where the temperature and pressure are too high. Making a tunnel through the moon, provided there is a good supply of negative mass, could revolutionize interstellar space flight, and a sequence of thermonuclear shape charges would be required to make such a tunnel technically feasible. In the Conclusion, negative mass propulsion is unlikely to be possible in the fashion speculated by Forward, where a negative mass is chasing a positive mass without the expenditure of any energy. Rather, it might perhaps be possible through the existence of an ultra-light form of matter with the tensile strength of ordinary matter on a macroscopic scale, where positive matter is bound to negative matter, as happens with Dirac spinor particles on a microscopic scale — the speculative existence of macroscopic bodies approaching zero rest mass, of importance for space flight because such matter would greatly reduce its energy requirements.

  '
