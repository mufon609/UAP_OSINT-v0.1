  extrinsic_authorship: 'No author is named on the document itself — the Author line is redacted under FOIA exemption (b)(6) and the Prepared by line under (b)(3):10 USC 424, which shows only "Defense Intelligence Agency." The DIA-to-Congress AAWSAP products list attributes the report to Dr. F. Winterberg of the University of Nevada – Reno (attachment #36). The document''s own body does not carry the name on its face, but it intrinsically echoes that attribution: the References repeatedly cite "F. Winterberg" (entries [7], [8], [15], [17]); the Conclusion self-cites "(but also see Winterberg [17])"; and a first-person footnote in section 2 recounts the author personally meeting Prof. Bondi on a flight from Graz in 1993, consistent with single-author authorship while the byline stays FOIA-redacted. Cross-reference [`/documents/dia-aatip-products-list-2018`]. Nothing about specific reference co-authorship is asserted beyond what is visible in the body.'
quotes:
- id: q1
  added_date: '2026-06-08'
  text: |-
    It is easy to prove that there are negative masses all around us, albeit
    hidden behind positive masses. But their use for propulsion by reducing the
    inertia of matter, for example in the limit of macroscopic bodies with zero rest
    mass, depends on a technical solution to free them from their imprisonment by
    positive masses.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'Summary'
  significance: "The document's thesis statement — asserts negative masses exist and are ubiquitous but \"imprisoned\" by positive masses, and that propulsion use turns on a technical means of freeing them. Frames the whole monograph's propulsion claim."
  context: 'Opening sentences of the Summary section preceding the numbered chapters.'
  statement_date: '2011-01-03'
  claim_group: negative-mass-thesis
- id: q2
  added_date: '2026-06-08'
  text: |-
    It appears that there are basically two ways this might be
    achieved: 1. By the application of strong electromagnetic or gravitational
    fields or by high particle energies; 2. By searching for places in the universe
    where nature has already done this separation, and from which the negative
    masses can be mined.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'Summary'
  significance: 'States the two proposed routes to liberating negative mass for propulsion; route 2 (mining) is the route the document develops (the lunar-tunnel proposal).'
  context: 'Summary section, immediately following the thesis statement.'
  statement_date: '2011-01-03'
  claim_group: negative-mass-thesis
- id: q3
  added_date: '2026-06-08'
  text: |-
    Now it just happens that the center of the moon is a potential well, not
    too deep that it cannot be reached by making a tunnel through the moon, not
    possible for the deeper potential well of the earth, where the temperature and
    pressure are too high. Making a tunnel through the moon, provided there is a
    good supply of negative mass, could revolutionize interstellar space flight. A
    sequence of thermonuclear shape charges would be required to make such a
    tunnel technically feasible.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'Summary'
  significance: "The document's central operational proposal — boring a tunnel through the Moon with thermonuclear shape charges to mine accumulated negative matter, asserted to \"revolutionize interstellar space flight.\" The load-bearing applied claim."
  context: 'Closing paragraph of the Summary.'
  statement_date: '2011-01-03'
  claim_group: lunar-tunnel-mining
- id: q4
  added_date: '2026-06-08'
  text: |-
    Under its self-acceleration, the mass
    dipole would eventually reach the velocity of light. It is this property of self-acceleration
    without expenditure of energy that has intrigued many researchers and raised the
    prospect of a propulsion system without limits.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'section "1. Introduction"'
  significance: 'States the core physics intrigue motivating negative-mass propulsion research — a self-accelerating mass dipole reaching light speed without energy expenditure, the "propulsion system without limits."'
  context: 'Introduction section, discussing the positive-negative mass dipole.'
  statement_date: '2011-01-03'
  claim_group: self-accelerating-dipole
- id: q5
  added_date: '2026-06-08'
  text: |-
    No matter how strange the properties associated with negative masses appear to be,
    there can be little doubt that they can be incorporated into Einstein's gravitational field
    theory as long as they do not violate the principle of equivalence.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'section "1. Introduction"'
  significance: "The document's assertion that negative masses are compatible with general relativity, the theoretical-legitimacy claim underpinning the whole study."
  context: 'Introduction section.'
  statement_date: '2011-01-03'
  claim_group: gr-compatibility
- id: q6
  added_date: '2026-06-08'
  text: |-
    The author had the pleasure to meet Prof. Bondi on a common flight from Graz,
    Austria in 1993 (we both are members of an academy which had a meeting in that
    year in Graz), and ask him how his solution can be correct since it does not include
    the field of the positive gravitational field mass of a mass dipole.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'section "2. The Theory of Bondi", footnote 1'
  significance: "First-person authorial footnote — the author recounts personally meeting Hermann Bondi in 1993 and challenging Bondi's negative-mass dipole solution. Establishes the author's voice and his direct engagement with Bondi's work (the byline is redacted (b)(6); this footnote is the author speaking in first person)."
  context: 'Footnote attached to "It is here that we must disagree with Bondi" in section 2.'
  statement_date: '2011-01-03'
  claim_group: author-bondi-encounter
- id: q7
  added_date: '2026-06-08'
  text: |-
    The purpose of this study is the question as to whether negative mass might exist, and
    if negative mass propulsion is possible at all. It is unlikely to be possible in the
    fashion speculated by Forward [13] (but also see Winterberg [17]), where a negative
    mass is chasing a positive mass without the expenditure of any energy.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'section "13. Conclusion"'
  significance: "The document's bottom-line conclusion — rejects the Forward-style runaway mass-dipole drive as unlikely, redirecting to the ultra-light-matter route. The self-citation \"(but also see Winterberg [17])\" reveals authorship."
  context: 'Opening of the Conclusion section.'
  statement_date: '2011-01-03'
  claim_group: conclusion-feasibility
- id: q8
  added_date: '2026-06-08'
  text: |-
    Rather, it might perhaps be possible through the existence of an ultra-light form of
    matter with the tensile strength of ordinary matter on a macroscopic scale where
    positive matter is bound to negative matter, as happens with Dirac spinor particles
    on a microscopic scale.
  source:
    path: government/dird-29-negative-mass-propulsion-2010.pdf
    location: 'section "13. Conclusion"'
  significance: "States the document's preferred propulsion mechanism — macroscopic ultra-light matter (positive bound to negative) approaching zero rest mass, drastically reducing spacecraft energy requirements."
  context: 'Conclusion section, immediately following q7.'
  statement_date: '2011-01-03'
  claim_group: conclusion-feasibility
