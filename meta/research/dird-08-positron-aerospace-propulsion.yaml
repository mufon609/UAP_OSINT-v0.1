  extrinsic_authorship: 'No author is named on the document — the Author line is redacted under FOIA (b)(6). The DIA-to-Congress products list attributes the report to Dr. Gerald Smith, Positronics Research (attachment 13, short title "Positron Aerospace Propulsion"). The attribution is independently corroborated within the document''s own body: the endnotes self-cite "G. A. Smith" densely (notes 8, 20, 27, 42, 67, 69, and 70), the figure credits read "courtesy Positronics Research LLC", and the first-person "this author collaborated" appears on p. 23.'
description: 'Positron Aerospace Propulsion. The Defense Intelligence Reference Document is 2 March 2010, with an ICOD of 1 December 2009 and control DIA-08-1003-002, UNCLASSIFIED//FOR OFFICIAL USE ONLY. Where the Prepared by and Author lines are shown, the document gives [redacted: (b)(3):10 USC 424] and Defense Intelligence Agency ([`/organizations/dia`]) and [redacted: (b)(6)]. An Administrative Note describes the product as one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, [redacted: (b)(3):10 USC 424] Advanced Aerospace Weapon System Applications (AAWSA) Program [`/organizations/aawsap`], and that comments or questions should be addressed to the AAWSA Program Manager. The document is one of a series of FY 2009 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]); the author ([`/people/gerald-smith`]) appears there, not on the document, where the Author line shows [redacted: (b)(6)]. The figures within are courtesy of Positronics Research LLC ([`/organizations/positronics-research`]).


  The paper considers antimatter as a fuel for aerospace propulsion, because its specific energy by annihilation is 180 MJ/µg, 10 orders of magnitude larger than chemical energy. Two reasons positrons have yet to be used are set out: it has not been possible to produce them in the numbers required, and methods for storing positrons do not hold enough of them long enough for propulsion. The paper considers the prospects for the first, modest demonstration of positron propulsive flight within the next 10 years. Unlike nuclear fission and antiprotons, positrons present no radiation or environmental safety problems.


  The paper describes a positron turbojet/ramjet engine (PTRE) in which tungsten shells are heated by gamma rays, with heat transferred to air by convection — the volume used for combustion heating in a combustion turbo-ramjet is used by PTREs for convection heating. Three air-breathing uses are investigated: a 60-kg UAV with lift/drag of four that can circumnavigate Earth on 150 µg of positrons (modeled after the LOCASS turbojet at the Air Force Research Laboratory, Eglin Air Force Base); a ramjet-assisted missile; and a single-stage reusable vehicle (SSRV) whose gross liftoff weight is 43 percent less than a chemical SSRV, requiring a positron budget of 86.9 mg for a 60,500-kg dry mass to low Earth orbit.


  Three positron-powered rockets are investigated for a manned Mars mission: a solid-core rocket with a specific impulse of 920 seconds at 3,000 Kelvin, three 72-kN engines requiring 6-9 mg of positrons per mission; a gas-core rocket of 130 kN with 25 mg consumed and the limit near a specific impulse of 2,500 seconds; and a modified Sänger ([`/people/eugen-sanger`]) photon rocket with a specific impulse of 1,200-3,000 seconds and 15-40 mg consumed for a one-way trip to Mars. An independent study reports that positrons cost less than antiprotons by a factor of 1,000-100,000 per joule of annihilation energy; the projected cost of positrons is $720K/µg, against a 2000 NASA study that placed antiprotons at $64T/g. The Positron Costs section states the 150 µg for the globe-encircling flight could be made in 6 months for $96 million; the Conclusions instead state the figure as $69 million within 10 years, equivalent to Lindbergh''s ([`/people/charles-lindbergh`]) 1927 Spirit of St. Louis flight. On storage, the limit is tens of picograms, 7-8 orders of magnitude short of 100 micrograms; proprietary experiments at Positronics Research LLC show positronium atoms in crossed magnetic and electric fields in silica aerogel that live up to 10 µs, and the paper states that with stabilization in crossed fields settled, very long lifetimes are a matter of engineering.

  '
