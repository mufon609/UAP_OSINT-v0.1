- id: q-intro-antimatter-energy-density
  added_date: '2026-05-26'
  text: |-
    Antimatter is considered an extremely attractive fuel for aerospace propulsion because of its enormous advantage in energy density over all other known sources of energy. However, because antimatter does not occur naturally and is unstable in the presence of matter, no vehicles have ever flown using it.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 6, Introduction'
  significance: Antimatter energy-density advantage — antimatter is an extremely attractive fuel because of its energy-density advantage, but no vehicle has flown using it because it does not occur naturally and is unstable in the presence of matter
  statement_date: '2010-03-02'
- id: q-intro-10-year-demonstration-scope
  added_date: '2026-05-26'
  text: |-
    Finally, the paper considers the prospects for the first, modest demonstration of positron propulsive flight within the next 10 years. Interplanetary missions on positron-propelled spaceships are described in detail, with estimates of positron requirements for each mission.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 6, Introduction'
  significance: Scope — the paper considers prospects for the first modest demonstration of positron propulsive flight within the next 10 years, with positron requirements estimated for each interplanetary mission
  statement_date: '2010-03-02'
- id: q-intro-positron-no-radiation-advantage
  added_date: '2026-05-26'
  text: |-
    To their advantage, positrons, unlike nuclear fission and antiprotons, present no radiation or environmental safety problems.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 6, Introduction'
  significance: Safety advantage — positrons, unlike nuclear fission and antiprotons, present no radiation or environmental safety problems
  statement_date: '2010-03-02'
- id: q-antimatter-specific-energy
  added_date: '2026-05-26'
  text: |-
    Antimatter is appealing for aerospace uses because its specific energy by annihilation is 180 MJ/µg, or 10 orders of magnitude larger than chemical energy, as shown in Figure 1.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 7, Antimatter'
  significance: Energy density — antimatter''s specific energy by annihilation is 180 MJ/µg, 10 orders of magnitude larger than chemical energy
  statement_date: '2010-03-02'
- id: q-antimatter-two-barriers
  added_date: '2026-05-26'
  text: |-
    There are two reasons why positrons have yet to be used for aerospace applications. First, it has not been possible to produce them in the numbers required. However, recent developments in high-energy physics research are resulting in expanding levels of positron production. Second, methods for storing positrons for basic research do not hold enough positrons long enough for propulsion applications. Recent developments in storage techniques may significantly improve the situation, with lifetimes up to months and possibly years.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 8, Antimatter'
  significance: The two barriers — positrons cannot yet be produced in the numbers required, and storage methods do not hold enough positrons long enough for propulsion applications
  statement_date: '2010-03-02'
- id: q-ptre-concept
  added_date: '2026-05-26'
  text: |-
    In a positron turbojet/ramjet engine (PTRE),⁸ tungsten shells are heated by gamma rays, with heat transferred to air by convection.⁹, ¹⁰
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 9, Positron Air-Breathing Propulsion'
  significance: PTRE concept — in a positron turbojet/ramjet engine, tungsten shells are heated by gamma rays, with heat transferred to air by convection
  statement_date: '2010-03-02'
- id: q-ptre-vs-combustion-turboramjet
  added_date: '2026-05-26'
  text: |-
    A comparison with the combustion turbo-ramjet engine (Figure 5) shows that volume used for combustion heating is used by PTREs for convection heating.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 10, Positron Air-Breathing Propulsion'
  significance: PTRE vs. combustion turbo-ramjet — the volume used for combustion heating in a combustion turbo-ramjet is used by PTREs for convection heating
  statement_date: '2010-03-02'
- id: q-uav-globe-circling-150ug
  added_date: '2026-05-26'
  text: |-
    Figure 6 shows range versus positron mass for a 60-kg UAV with lift/drag of four that can circumnavigate Earth on 150 µg of positrons.¹⁴ It is modeled after the LOCASS turbojet (Figure 7) at the Air Force Research Laboratory (AFRL), Eglin Air Force Base, Florida.¹⁵
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 11, PTRE Applications — Unmanned Aerial Vehicle (UAV)'
  significance: UAV application — a 60-kg UAV with lift/drag of four can circumnavigate Earth on 150 µg of positrons, modeled after the LOCASS turbojet at the Air Force Research Laboratory, Eglin Air Force Base
  statement_date: '2010-03-02'
- id: q-ssrv-glow-43-percent
  added_date: '2026-05-26'
  text: |-
    The GLOW of the positron SSRV is 43 percent less than that of the chemical SSRV owing to reduced propellant mass. The PTRE will dramatically increase the affordability of space transportation by increasing the useful payload.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 15, Single-Stage Reusable Vehicle (SSRV)'
  significance: SSRV result — the gross liftoff weight of the positron SSRV is 43 percent less than that of the chemical SSRV owing to reduced propellant mass
  statement_date: '2010-03-02'
- id: q-ssrv-positron-budget-86mg
  added_date: '2026-05-26'
  text: |-
    The SSRV takes off horizontally (Figure 9) from Edwards Air Force Base, accelerates to mach 1.8 as a turbojet, and then goes to the ramjet mode. At mach 8 the rocket is ignited and takes the vehicle into LEO.²⁴ The positron mass budget for a 60,500-kg dry mass for ascension to LEO is 86.9 mg (Table 3).
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 16, Single-Stage Reusable Vehicle (SSRV)'
  significance: SSRV positron budget — the positron mass budget for a 60,500-kg dry mass for ascension to low Earth orbit is 86.9 mg
  statement_date: '2010-03-02'
- id: q-solid-core-isp-920
  added_date: '2026-05-26'
  text: |-
    A thermal-fluids analysis was conducted to predict performance. A specific impulse of 920 seconds is attainable with chamber temperatures at 3,000 Kelvin.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 18, The Solid-Core Positron Rocket'
  significance: Solid-core performance — a specific impulse of 920 seconds is attainable with chamber temperatures at 3,000 Kelvin
  statement_date: '2010-03-02'
- id: q-solid-core-mars-burn-positrons
  added_date: '2026-05-26'
  text: |-
    the order of 30 minutes, indicating that a spacecraft employing three 72-kN solid-core engines would require 6-9 mg of positrons per mission.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 19, The Solid-Core Positron Rocket'
  significance: Solid-core Mars requirement — a spacecraft employing three 72-kN solid-core engines would require 6-9 mg of positrons per Mars mission (Mars trip burn times on the order of 30 minutes)
  statement_date: '2010-03-02'
- id: q-gas-core-thrust-positrons
  added_date: '2026-05-26'
  text: |-
    Thrusts of 130 kN (1,000 atmospheres) are predicted for a single-engine system with an efficiency of 85 percent. Burn times are 30 minutes for ΔV = 3.7 km/second (sec) with 25 mg of positrons consumed for a 50,000-kg burnout mass. The limit of the gas-core concept occurs near the thresholds for ionization of hydrogen, corresponding to Isp of ~ 2,500 sec.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 20, The Gas-Core Positron Rocket'
  significance: Gas-core performance — thrusts of 130 kN with 25 mg of positrons consumed for a 50,000-kg burnout mass, with the specific-impulse limit near 2,500 seconds at the threshold for hydrogen ionization
  statement_date: '2010-03-02'
- id: q-sanger-photon-performance
  added_date: '2026-05-26'
  text: |-
    Performance depends primarily on the energy of the WLS photons and the energy per pellet. At 8 keV, Isp is in the range 1,200-3,000 sec. Thrust is 40-145 kN, the latter at a pellet injection rate of 1 hertz. The total quantity of positrons consumed for a one-way trip to Mars over this range of Isp is 15-40 mg with 50 percent of gamma rays striking the plate and a 85 percent WLS efficiency.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 23, The Sänger Photon Positron Rocket'
  significance: Sänger photon-rocket performance — specific impulse of 1,200-3,000 seconds, thrust 40-145 kN, with 15-40 mg of positrons consumed for a one-way trip to Mars
  statement_date: '2010-03-02'
- id: q-rocket-comparison-table-mars
  added_date: '2026-05-26'
  text: |-
    A side-by-side comparison of three positron rocket propulsion concepts is presented in Table 5 for a one-way transit to Mars using ΔV = 3.7 km/sec.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 23, Positron Rocket System Comparison'
  significance: Three-concept Mars comparison — a side-by-side comparison of the solid-core, gas-core, and Sänger positron rocket propulsion concepts for a one-way Mars transit (the document labels the comparison "Table 5")
  statement_date: '2010-03-02'
- id: q-positron-production-150ug-6-months
  added_date: '2026-05-26'
  text: |-
    Assuming that 10¹⁶ positrons/sec can be realized in the next 10 years, then 150 micrograms could be produced in 6 months to enable a globe-encircling flight of a small air-breathing turbojet UAV as discussed earlier.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 29, Positron Production'
  significance: Production projection — assuming 10^16 positrons/sec within 10 years, 150 micrograms could be produced in 6 months to enable a globe-encircling UAV flight
  statement_date: '2010-03-02'
- id: q-cost-positron-vs-antiproton-factor
  added_date: '2026-05-26'
  text: |-
    First, measured on a scale of dollars per joule of annihilation energy, positrons cost less than antiprotons by a factor of 1,000-100,000.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 29, Positron Costs'
  significance: Cost comparison — measured per joule of annihilation energy, positrons cost less than antiprotons by a factor of 1,000-100,000
  statement_date: '2010-03-02'
- id: q-cost-positron-per-microgram
  added_date: '2026-05-26'
  text: |-
    Second, the cost of positrons is projected to be $0.004/J x 180 MJ/µg = $720K/µg. Hence, the cost of 1 gram is $0.72T, or 5 percent of the 2008 U.S. gross domestic product (GDP). A 2000 NASA study⁶³ on which this author collaborated placed the cost of antiprotons at $64T/g, consistent with the $333/J figure in the second line of Table 5, and roughly six times the 2000 GDP.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 29, Positron Costs'
  significance: Positron unit cost — the cost of positrons is projected at $720K/µg, against a 2000 NASA study (on which this author collaborated) placing antiprotons at $64T/g (the document cites the $333/J figure to "Table 5")
  statement_date: '2010-03-02'
- id: q-cost-150ug-flight-96-million
  added_date: '2026-05-26'
  text: |-
    Table 5, the required 150 µg for this epic flight could be manufactured in 6 months for $96 million, or 0.0007 percent of U.S. GDP.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 30, Positron Costs'
  significance: Globe-encircling flight cost (p. 30) — the required 150 µg could be manufactured in 6 months for $96 million; the Conclusions instead state $69 million (intra-document contradiction; the document cites "Table 5")
  statement_date: '2010-03-02'
- id: q-storage-limit-picograms
  added_date: '2026-05-26'
  text: |-
    either space charge or magnetic energy considerations, the storage limit is tens of picograms, 7-8 orders of magnitude short of 100 micrograms, where practical uses of positrons begin to emerge, as illustrated earlier.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 30, Positron Storage'
  significance: Storage limit — by space-charge or magnetic-energy considerations the charged-trap storage limit is tens of picograms, 7-8 orders of magnitude short of the 100 micrograms where practical uses emerge
  statement_date: '2010-03-02'
- id: q-storage-positronium-lifetime-results
  added_date: '2026-05-26'
  text: |-
    Proprietary experiments at Positronics Research LLC show that Ps atoms in crossed magnetic and electric fields in silica aerogel with 20-nm voids live up to 10 µs.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 32, Long-Term Storage of Positronium'
  significance: Positronium storage result — proprietary experiments at Positronics Research LLC show positronium atoms in crossed magnetic and electric fields in silica aerogel with 20-nm voids living up to 10 µs
  statement_date: '2010-03-02'
- id: q-conclusions-requirements-range
  added_date: '2026-05-26'
  text: |-
    Positron requirements range from 150 micrograms for a globe-encircling UAV flight to 100 milligrams for a mission to Mars. A positron-powered SSRV could take off from Earth horizontally, go to LEO, launch to Mars for a 1-year exploration of the Red Planet, and return to LEO and then Earth with a horizontal landing without refueling.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 33, Conclusions'
  significance: Requirements range — positron requirements span 150 micrograms for a globe-encircling UAV flight to 100 milligrams for a Mars mission; an SSRV could fly Earth–LEO–Mars and return without refueling
  statement_date: '2010-03-02'
- id: q-conclusions-cost-timeline
  added_date: '2026-05-26'
  text: |-
    Within 10 years, the 150 µg of positrons required for a globe-encircling, nonstop turbojet flight could be made in 6 months at a cost of $69 million. This first-ever antimatter voyage, approximately 90 years after Lindbergh's 1927 Spirit of St. Louis transatlantic flight, would stir the public's imagination and eventually lead to positron-powered exploration of the solar system in the 21st century.
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 33, Conclusions'
  significance: 'Cost and timeline (Conclusions) — within 10 years the 150 µg could be made in 6 months at a cost of $69 million; the Positron Costs section instead states $96 million (intra-document contradiction); likened to Lindbergh''s 1927 Spirit of St. Louis flight'
  statement_date: '2010-03-02'
- id: q-conclusions-storage-engineering
  added_date: '2026-05-26'
  text: |-
    Lifetimes of 10 µs have been achieved, and tens-of-millisecond lifetimes are expected in the next round of experiments. Present limits are due to interactions with the walls of the trap container. Application of oscillating gradient electric fields to the huge electric dipole moment of the stable Ps atom should mitigate this problem. With the issue of stabilization in crossed fields now settled, very long lifetimes are but a matter of engineering!
  source:
    path: government/dird-08-positron-aerospace-propulsion-20100302.pdf
    location: 'p. 34, Conclusions'
  significance: Storage conclusion — positronium lifetimes of 10 µs have been achieved and the paper concludes that, with stabilization in crossed fields settled, very long lifetimes are a matter of engineering
  statement_date: '2010-03-02'
