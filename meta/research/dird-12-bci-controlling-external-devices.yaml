    This product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, [(b)(3):10 USC 424] Advanced Aerospace Weapon System Applications (AAWSA) Program. Comments or questions pertaining to this document should be addressed to [(b)(3):10 USC 424;(b)(6)], AAWSA Program Manager, Defense Intelligence Agency, ATTN: [(b)(3):10 USC 424] Bldg 6000, Washington, DC 20340-5100.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'Administrative Note (AAWSA Program paragraph)'
  significance: The defining provenance paragraph — places the report in the FY 2009 DIA Advanced Aerospace Weapon System Applications (AAWSA/AAWSAP) Program series, program-manager contact and DIA Bldg 6000 address with names redacted
  statement_date: '2010-03-23'
- id: q6
  added_date: '2026-05-27'
  text: |-
    The technology endpoint this paper seeks is thought-based operation of remote machinery during normal human activities without mechanical device interaction—that is, control of external devices without the need to go to a specified location, such as a shielded room; without the need to remain perfectly motionless to reduce signal noise; and without the need for interaction with a normal electro-mechanical device, such as an i-Phone or other handheld device with buttons and trackballs. Data transfer rates are sought to exceed 5-10 bits/second to be useful for operation of complex devices; this rate range and above is referred to as high-bandwidth BMIs. Response time for a 1-of-N selection of commands is targeted at 300 milliseconds or less.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'Introduction, technology-endpoint paragraph'
  significance: The document's stated technology endpoint and the operational parameters assumed throughout — thought-based remote-device control, data transfer above 5-10 bits/second (high-bandwidth BMIs), 1-of-N command response targeted at 300 milliseconds or less
  statement_date: '2010-03-23'
- id: q7
  added_date: '2026-05-27'
  text: |-
    The paper concludes that noninvasive electrical monitoring of neural activity, primarily reading combined action of muscles and neurons, is the most promising commercial technology in the near term. Inherent limitations in the noninvasive electrical approach require future development of different research paths. The paper argues, mainly by eliminating other approaches, that the most probable technology in the long term involves invasive single-neuron-based direct cortical connections to form a network of high-bandwidth duplex communication pathways.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'Introduction, thesis-of-conclusions paragraph'
  significance: The up-front thesis statement of the document's two headline conclusions — noninvasive electrical monitoring (reading combined muscle and neuron action) is the most promising near-term commercial technology, and invasive single-neuron direct cortical connections are the most probable long-term high-bandwidth path
  statement_date: '2010-03-23'
- id: q8
  added_date: '2026-05-27'
  text: |-
    Furthermore, all technologies directly measuring human neuronal action rely on detecting or influencing electrical activity of these cells; no current in situ research selectively affects neurotransmitter activity between local cells for the purpose of information exchange. Therefore, the focus for the foreseeable future will be on the electrical activity of neurons as the primary target of BMI.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Direct Neural Signals", signal-source paragraph'
  significance: Core finding of the Direct Neural Signals section — BMI signal sources are confined to electrical neuronal activity; no in situ research yet selectively affects neurotransmitter activity for information exchange, so electrical activity of neurons is the foreseeable primary target
  statement_date: '2010-03-23'
- id: q9
  added_date: '2026-05-27'
  text: |-
    The signal transmission down the axon of a neuron is an all-or-nothing process. When the cell body is stimulated above threshold, the axon transmits the same action potential at the same speed and in the same direction, regardless of the extent above threshold or duration of the input. Action potentials have durations of 1-10 milliseconds.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Direct Neural Signals", action-potential primer'
  significance: Establishes the all-or-nothing action-potential physics and the 1-10 millisecond action-potential duration that set the sampling requirements for any direct-detection BMI
  statement_date: '2010-03-23'
- id: q10
  added_date: '2026-05-27'
  text: |-
    P300 is a term used to indicate a pulse signal from a large group of neurons that appears about 300 milliseconds after a stimulus event. Peaks that occur between 200 and 400 milliseconds are commonly grouped into the P300 category. The "P" stands for a positive measured voltage, while "N" signals are negative.³ The P300 signal has been shown to be influenced by top-down executive function and is therefore a prime candidate for a trainable interface (Reference 5).
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Direct Neural Signals", P300 paragraph'
  significance: Defines the P300 evoked signal — a pulse from a large group of neurons about 300 milliseconds after a stimulus, influenced by top-down executive function and therefore a prime candidate for a trainable interface
  statement_date: '2010-03-23'
- id: q11
  added_date: '2026-05-27'
  text: |-
    This complex chain reaction is called the Blood Oxygen Level Dependent, or BOLD effect (Reference 8). The BOLD effect leads to a method to indirectly measure the local brain activity by monitoring the hemodynamic response using Magnetic Resonance Imaging (MRI) or Near Infrared Spectroscopy (NIRS).
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Indirect Neuronal Signals – The BOLD Effect", BOLD-definition paragraph'
  significance: Defines the BOLD effect — the indirect, hemodynamic signal source measured by Magnetic Resonance Imaging or Near Infrared Spectroscopy, the second branch of the signal taxonomy contrasted with direct electrical signals
  statement_date: '2010-03-23'
- id: q12
  added_date: '2026-05-27'
  text: |-
    The BOLD response to any event peaks about 4-6 seconds after the event occurs, limiting the applications for which monitoring these signals and their associated delay may be useful, given the BMI operating parameters defined above
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Indirect Neuronal Signals – The BOLD Effect", temporal-limitation sentence'
  significance: Key limitation of all BOLD-based BMI — the 4-6 second hemodynamic delay limits the applications for which the signal is useful given the BMI operating parameters; the source sentence omits its terminal period
  statement_date: '2010-03-23'
- id: q13
  added_date: '2026-05-27'
  text: |-
    In general, there are two types of BMI design called open-loop and closed-loop. Open loop designs, those either detecting activity or providing stimulation, are important for BMI research and application other than the practical control of an external device. Closed-loop systems include both output signals from the brain to the current state of a device, and a stimulation channel, which can be used as feedback.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Control of External Devices", open-loop/closed-loop paragraph'
  significance: Establishes the open-loop versus closed-loop BMI design taxonomy that structures the survey's invasive-technologies discussion — closed-loop systems include both brain output and a stimulation feedback channel
  statement_date: '2010-03-23'
- id: q14
  added_date: '2026-05-27'
  text: |-
    The bulk of research in direct neural interfaces is toward the goal of restoring mechanical capabilities to those individuals who have either lost limbs or lost control of limbs through central nervous system injury or disease. In these cases it is of obvious utility to produce a system that moves a cursor across screen to select an item over the course of several seconds; however, for a healthy individual, it is far more practical to execute a hand movement to control a mechanical device⁴ to achieve the same goal.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Control of External Devices", application-utility paragraph'
  significance: Frames the utility problem central to the document — the bulk of direct-neural-interface research aims to restore lost limb function, while for a healthy individual a hand movement to control a mechanical device is far more practical, the gap the whole survey assesses
  statement_date: '2010-03-23'
- id: q15
  added_date: '2026-05-27'
  text: |-
    There are four noninvasive technologies currently in widespread use in monitoring brain activity. The two direct-measure technologies involve detecting surface currents from the relative voltage changes at or just below the scalp, electroencephalography (EEG), and detection of near scalp magnetic fields associated with neural pathway current flow, magnetoencephalography (MEG). The remaining two indirect measures involve monitoring BOLD response through rapid successions of whole brain MRI (functional MRI or fMRI), and near-infrared spectroscopy (NIRS).⁶
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Noninvasive Technologies", four-technologies overview'
  significance: Enumerates the four noninvasive brain-monitoring technologies — electroencephalography (EEG) and magnetoencephalography (MEG) as direct measures, functional MRI (fMRI) and near-infrared spectroscopy (NIRS) as indirect BOLD measures — the organizing list for the noninvasive section
  statement_date: '2010-03-23'
- id: q16
  added_date: '2026-05-27'
  text: |-
    Commercial versions of dry-electrode devices are being released on the market from companies such as Neurosky, OCZ Technology, and Emotiv.⁸ The Neurosky and Emotive systems claim proprietary processing algorithms, lack peer-reviewed literature supporting their claims, and even discuss using facial muscle movement to send signals (References 26, 27), raising doubt about whether neural signals are being measured at all.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "EEG", commercial dry-electrode paragraph'
  significance: EEG-section finding on commercial dry-electrode consumer devices — the document casts doubt that the Neurosky and Emotiv products measure neural signals at all, given their reliance on facial muscle movement and lack of peer-reviewed support; the source renders the company name both "Emotiv" and "Emotive"
  statement_date: '2010-03-23'
- id: q17
  added_date: '2026-05-27'
  text: |-
    The magnetic fields from neural activity are detected with very sensitive devices called superconducting quantum interference devices, or SQUIDs. These detectors are sensitive to the neural activity induced 100 fT (femtoTesla) changes near the scalp. SQUIDs only operate at very low temperatures thus requiring a cryogenic system as well significant detection and amplification electronics.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "MEG", SQUID-detection paragraph'
  significance: MEG-section finding — magnetic fields from neural activity are detected by superconducting quantum interference devices (SQUIDs) sensitive to 100 femtoTesla changes, requiring a cryogenic system, the core technological barrier limiting MEG to shielded environments
  statement_date: '2010-03-23'
- id: q18
  added_date: '2026-05-27'
  text: |-
    Even if future detector development like atomic magnetometers would solve the equipment overhead issue for Earthbound application, the fact that 100 fT is about 100 million times smaller than the Earth's magnetic field will prove an insurmountable barrier to sifting signal from noise in anything but a heavily-shielded, metal-free environment.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "MEG", signal-to-noise-barrier sentence'
  significance: States MEG's decisive limitation — even with future detector advances, the 100 femtoTesla signal is about 100 million times smaller than Earth's magnetic field, an insurmountable barrier to sifting signal from noise outside a heavily-shielded, metal-free environment
  statement_date: '2010-03-23'
- id: q19a
  added_date: '2026-05-27'
  text: |-
    Instead of measuring nerve impulses and amplifying them, one can design a system that monitors muscle movement in a hands-free approach to a mechanical interface, essentially using the muscles as a biological amplifier of neural signals.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "EMG", muscle-amplification paragraph'
  significance: EMG-section finding — a system that monitors muscle movement in a hands-free approach uses the muscles as a biological amplifier of neural signals, the near-term commercial favorite
  statement_date: '2010-03-23'
- id: q19b
  added_date: '2026-05-27'
  text: |-
    Such a system could be used to untie a pilot from the cockpit. Recent work has shown that performance of 1-2 bits/s is possible with minimal training, about four times the current performance of a comparison EEG forehead sensor (Reference 14).
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "EMG", muscle-amplification paragraph (continued, after the feedback-loop sentence)'
  significance: EMG-section finding (continued) — such a system could untie a pilot from the cockpit, and recent work shows performance of 1-2 bits per second is possible with minimal training, about four times a comparison EEG forehead sensor
  statement_date: '2010-03-23'
- id: q20
  added_date: '2026-05-27'
  text: |-
    The major advantages of fMRI are unmatched 3D spatial resolution, compared to other noninvasive imaging methods, and complete skull penetration, making it the only imaging modality to unambiguously detect limbic activations important for determining emotionally-laden neuropsychological states. The main disadvantage for BMI is that the BOLD signal is detected several seconds after the neuronal firing takes place, making fMRI inappropriate for many naturalistic applications.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "MRI and fMRI", advantages/disadvantage paragraph'
  significance: fMRI-section finding — unmatched 3D spatial resolution and complete skull penetration make fMRI the only modality to detect limbic activations for emotional-state determination, but the several-second BOLD delay makes it inappropriate for many naturalistic applications
  statement_date: '2010-03-23'
- id: q21
  added_date: '2026-05-27'
  text: |-
    Near-infrared spectroscopy is an additional technology to monitor the BOLD effect noninvasively. Studies have shown it correlates well with the fMRI signal in animal models, although with reduced coverage and lower resolution (Reference 34). This lowered resolution greatly affects the accuracy of the technique, with recent work involving single trials and a decision attaining only 80 percent accuracy (Reference 35).
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "NIRS", correlation-and-accuracy paragraph'
  significance: NIRS-section finding — near-infrared spectroscopy monitors the BOLD effect noninvasively and correlates well with the fMRI signal in animal models, but at reduced coverage and lower resolution, with single-trial decision accuracy attaining only 80 percent
  statement_date: '2010-03-23'
- id: q22a
  added_date: '2026-05-27'
  text: |-
    The most prolific invasive BMI for use in humans is the cochlear implant (Reference 36), a sensory neuroprosthesis designed to aid in hearing for deaf individuals.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Invasive Technologies", cochlear-implant paragraph'
  significance: Invasive-section anchor — the cochlear implant is the most prolific human invasive BMI, a sensory neuroprosthesis to aid hearing for deaf individuals, the benchmark the survey repeatedly returns to
  statement_date: '2010-03-23'
- id: q22b
  added_date: '2026-05-27'
  text: |-
    It has been estimated that 100,000 cochlear implants provide sound to users worldwide (Reference 37). The cochlear implant is an open loop stimulation system that provides complex signals to the nervous system through a peripheral connection.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Invasive Technologies", cochlear-implant paragraph (continued, after the device-construction description)'
  significance: Invasive-section anchor (continued) — an estimated 100,000 cochlear implants provide sound to users worldwide; the cochlear implant is an open-loop stimulation system providing complex signals through a peripheral connection
  statement_date: '2010-03-23'
- id: q23
  added_date: '2026-05-27'
  text: |-
    The primary device that has emerged leading this technological transformation is the direct cortical array containing either surface or neocortex penetrating electrodes. The direct cortical array is implanted on the surface of the brain near the functional area of interest, and then the connection is reverse-engineered: individual electrodes are tested to determine if they should be assigned as input, output, or neither.¹²
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Invasive Technologies", direct-cortical-array paragraph'
  significance: Defines the direct cortical array — the central invasive BMI device class, implanted on the brain surface near the functional area of interest, its connection reverse-engineered by testing individual electrodes for input, output, or neither
  statement_date: '2010-03-23'
- id: q24a
  added_date: '2026-05-27'
  text: |-
    An additional device is the penetrating cortical electrode. These electrodes contain a ladder of input/output probes and can be selected to transmit or receive signals in any layer of the neocortex.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Invasive Technologies", penetrating-electrode paragraph'
  significance: Introduces the penetrating cortical electrode — a ladder of input/output probes that can transmit or receive signals in any layer of the neocortex
  statement_date: '2010-03-23'
- id: q24b
  added_date: '2026-05-27'
  text: |-
    When using penetrating electrodes, tissue response is an additional challenge as these devices frequently cause scarring. Animal studies are in progress to quantify this effect.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Invasive Technologies", penetrating-electrode paragraph (continued, after the optimal-layer research sentence)'
  significance: Flags the central biocompatibility problem of chronic invasive probes — tissue response and scarring from penetrating electrodes, quantified by ongoing animal studies, recurring throughout the invasive sections
  statement_date: '2010-03-23'
- id: q25
  added_date: '2026-05-27'
  text: |-
    One advantage of these devices is that the fusing of biological to physical circuitry is performed external to the body and the interface connection of the implants is thus biological to biological. This avoids a natural reaction of the nervous system to form scar tissue around penetrating chronic physical probes.¹⁸ Scar tissue leads to degradation of proximal signal transfer over time. These neural-tissue encapsulated chips offer significant advantages over other technologies because of their ability to be rapidly integrated into the biological environment.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "MEMS, ECoG, and PSoC Circuitry", tissue-encapsulated-chip paragraph'
  significance: Key MEMS/ECoG finding — fusing biological to physical circuitry external to the body makes the implant connection biological-to-biological, avoiding the scar-tissue degradation that plagues penetrating chronic probes; one of the two headline far-term paths
  statement_date: '2010-03-23'
- id: q26a
  added_date: '2026-05-27'
  text: |-
    In 2006, Fetz et al. illustrated an intracranial operated neural implant that could function as an autonomous battery operated device.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "MEMS, ECoG, and PSoC Circuitry", Fetz-neurochip paragraph'
  significance: Identifies the Fetz et al. (2006) intracranial neural implant that could function as an autonomous battery-operated device, the lead example of self-contained chronic implant design
  statement_date: '2010-03-23'
- id: q26b
  added_date: '2026-05-27'
  text: |-
    Figure 5 illustrates the schematic flow chart of the Fetz MEMS neurochip, also called a programmable system-on-chip (PSoC) architecture.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "MEMS, ECoG, and PSoC Circuitry", Fetz-neurochip paragraph (continued, after the autonomous-device commentary)'
  significance: Names the Fetz MEMS neurochip, also called a programmable system-on-chip (PSoC) architecture, the self-contained chronic-implant design the section elevates
  statement_date: '2010-03-23'
- id: q27
  added_date: '2026-05-27'
  text: |-
    With this information the researchers discovered that the lower layers of the cortex are more likely to encode directional information as compared to units in the upper layers. This understanding has prompted the use of prosthetic neural implants as critical instruments for developing accurate BMI models and the mapping all neurological (brain triggered) responses.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Chronic Neural Implants and fMRI", layer-encoding paragraph'
  significance: Chronic-implant-section finding — the lower layers of the cortex are more likely to encode directional information than upper layers, prompting use of prosthetic neural implants as critical instruments for developing accurate BMI models
  statement_date: '2010-03-23'
- id: q28a
  added_date: '2026-05-27'
  text: |-
    With this system, the authors successfully recorded spontaneous extracellular multiunit neural activity in 16 electrodes (four in each animal) for 6 weeks post-implant.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "New Electrode Designs", MR-compatible-microwire paragraph'
  significance: New-electrode-designs finding — an MR-compatible microwire array recorded spontaneous extracellular multiunit neural activity in 16 electrodes for 6 weeks post-implant, evidence on chronic-implant biocompatibility and fMRI co-use
  statement_date: '2010-03-23'
- id: q28b
  added_date: '2026-05-27'
  text: |-
    Thorough examination of the electrode location and resultant tissue survivability revealed little damage from the operation of the BMI.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "New Electrode Designs", MR-compatible-microwire paragraph (continued, after the 12-of-16 and tissue-damage-assessment detail)'
  significance: New-electrode-designs finding (continued) — examination of the electrode location and tissue survivability revealed little damage from the operation of the BMI
  statement_date: '2010-03-23'
- id: q29
  added_date: '2026-05-27'
  text: |-
    In one study, Mussa-Ivaldi et al. (References 28, 29) investigated the possibility of using the feedback from a BMI for inducing controlled plastic changes at specific synapses. Figure 12 shows the bidirectional connections between a mobile robotic device and a lamprey brain stem that has been used to investigate the repertoire of operations carried out by neurons in the reticular formation.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Hybrid Neuro-Robotic Systems for True Closed-Loop BMI", lamprey paragraph'
  significance: Lead finding of the hybrid neuro-robotic section — the lamprey-brain-stem / mobile-robot closed loop demonstrating bidirectional BMI plasticity at specific synapses; the in-source "(References 28, 29)" points to the dry-EEG and alpha-modulation papers rather than the work described, an apparent source mis-citation preserved verbatim
  statement_date: '2010-03-23'
- id: q30
  added_date: '2026-05-27'
  text: |-
    The results of this lamprey study hints that cerebellar connections in mammals could provide excellent plastic interface points for full closed loop technologies.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Hybrid Neuro-Robotic Systems for True Closed-Loop BMI", cerebellar-interface sentence'
  significance: Connects the lamprey closed-loop result to the recurring cerebellar-interface hypothesis — that cerebellar connections in mammals could provide excellent plastic interface points for full closed-loop technologies; the source grammar "study hints" is preserved
  statement_date: '2010-03-23'
- id: q31
  added_date: '2026-05-27'
  text: |-
    Testing BMIs on normal human subjects presents ethical dilemma since any volunteer outside of the research team itself would likely have difficulty understanding all of the risks involved in neural implantation. Even well-known volunteers such as Jans Naumann now admit they truly did not understand the risks involved and are considering having chronic implants removed.¹⁹
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Trials Using Human Subjects", ethical-dilemma paragraph'
  significance: Human-trials framing finding — testing BMIs on normal human subjects presents an ethical dilemma, exemplified by an artificial-vision recipient who now admits not understanding the risks; the source renders the given name "Jans Naumann" (the subject is Jens Naumann), preserved verbatim
  statement_date: '2010-03-23'
- id: q32
  added_date: '2026-05-27'
  text: |-
    Finally, one trial utilizing a normal, healthy human self-experimenter in 2002 showed that sensation and control is possible through a peripheral array implant in the median nerve of the left arm. This trial lasted 3 months before the physical connection between the nerve and the microarray deteriorated beyond use. Subsequent examination and testing has revealed no long-term damage at the implant site (Reference 58).
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Trials Using Human Subjects", median-nerve self-experimenter paragraph'
  significance: The single normal-healthy-human peripheral-implant trial (2002) — sensation and control achieved through a peripheral array implant in the median nerve, but the nerve-microarray connection lasted 3 months before it deteriorated beyond use, a load-bearing data point for the survey's pessimism on durable invasive interfaces
  statement_date: '2010-03-23'
- id: q33
  added_date: '2026-05-27'
  text: |-
    A final invasive technology that utilizes light to gate action potentials shows promise (Reference 59). In this technology, the biological switch is controlled by a locally inserted LED and possibly guided using optical fibers, but there is no contact between the physical circuits and neurons, thus avoiding the issue of scar tissue caused by operation of invasive probes.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Optical Stimulation of Action Potentials", light-gating paragraph'
  significance: Optical-stimulation finding — light-gated control of action potentials via a locally inserted LED and optical fibers is a noncontact invasive path that avoids scar tissue, the other of the two headline far-term promising technologies
  statement_date: '2010-03-23'
- id: q34
  added_date: '2026-05-27'
  text: |-
    Any successful BMI hardware technology relies on at least one, and in most cases all, of the following three essential elements: brain plasticity through user training, neural decoding by a machine learning algorithm, and neuroscience knowledge.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Discussion", three-essential-elements opening'
  significance: The Discussion's organizing thesis — every successful BMI hardware technology rests on the triad of brain plasticity through user training, neural decoding by a machine learning algorithm, and neuroscience knowledge
  statement_date: '2010-03-23'
- id: q35a
  added_date: '2026-05-27'
  text: |-
    The current state-of-the-art BMI devices that have shown the most promise in the near term utilize muscle amplification of the neural signal. This is the result of commercial investment in development. These primarily EMG based systems are noninvasive connections to existing or constructed nerve-muscle pairs.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Discussion" > "Noninvasive Electrical Devices", near-term front-runner paragraph'
  significance: Discussion finding (noninvasive electrical) — the most promising near-term BMI devices utilize muscle amplification of the neural signal, primarily EMG-based noninvasive connections to nerve-muscle pairs, the result of commercial investment
  statement_date: '2010-03-23'
- id: q35b
  added_date: '2026-05-27'
  text: |-
    The gaming market will drive this noninvasive technology in the next 5 years with advances in signal processing from current sensors.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Discussion" > "Noninvasive Electrical Devices", near-term front-runner paragraph (continued, after the decoding-algorithm sentences)'
  significance: Discussion finding (noninvasive electrical, continued) — the gaming market will drive this noninvasive technology over the next 5 years with advances in signal processing from current sensors
  statement_date: '2010-03-23'
- id: q36
  added_date: '2026-05-27'
  text: |-
    Detection of magnetic fields arising from neural activity using MEG or a future technology have the same inherent limitations as EEG-only noninvasive sensors. Resolving these signals from background in any naturalistic environment will not occur without the development of a disruptive technology in shielding that is portable and lightweight enough to be worn comfortably on the head, and will attenuate background amplitude nearly 10 orders of magnitude across the entire range of neural signal frequencies
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Discussion" > "Noninvasive Magnetic Devices", shielding-breakthrough paragraph'
  significance: Discussion finding (magnetic) — MEG and future magnetic methods share EEG's inherent limitations; resolving the signals in any naturalistic environment requires a disruptive, portable, head-worn shielding technology attenuating background nearly 10 orders of magnitude, effectively shelving these methods
  statement_date: '2010-03-23'
- id: q37
  added_date: '2026-05-27'
  text: |-
    Proximal electrode interfaces do not appear to be the answer for high bandwidth BMI, and further development in the machine-biology contact is required. If the 30-year advancement of cochlear is a realistic guide to innovation, the proximal electrical technology path to success is 30-40 years off save for a disruptive advance in the development of penetrating electrodes.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Discussion" > "Invasive Technologies", timeline-assessment paragraph'
  significance: Discussion finding (invasive general) — proximal electrode interfaces are not the answer for high-bandwidth BMI; benchmarked against the cochlear implant's 30-year arc, the proximal electrical path to success is 30-40 years off absent a disruptive advance in penetrating electrodes
  statement_date: '2010-03-23'
- id: q38
  added_date: '2026-05-27'
  text: |-
    Two invasive research paths that are promising are optical stimulation and gating, and ex-vivo growth of neural cells on physical circuits.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Discussion" > "Invasive Technologies", promising-paths sentence'
  significance: Names the two promising invasive research paths the document elevates — optical stimulation and gating, and ex-vivo growth of neural cells on physical circuits
  statement_date: '2010-03-23'
- id: q39
  added_date: '2026-05-27'
  text: |-
    In the near term, noninvasive electrical sensors that primarily rely on EMG signals, but also include those weaker signals directly from neuronal firing, are expected to dominate real-world applications. The decoding of these signals from just a handful of dry sensors can produce a large combination of on-off and variable strength control commands that should surpass the information capability of traditional electro-mechanical interfaces in the next 5 years.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Conclusions", near-term conclusion'
  significance: First headline conclusion — in the near term noninvasive electrical sensors relying primarily on EMG signals are expected to dominate real-world applications and surpass the information capability of traditional electro-mechanical interfaces within the next 5 years
  statement_date: '2010-03-23'
- id: q40a
  added_date: '2026-05-27'
  text: |-
    In the far term, an invasive approach to establish high-bandwidth duplex communication networks, 5-20 bits/second, using interfaces with single neurons
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Conclusions", far-term conclusion (sentence opening; the source breaks across a page boundary mid-sentence)'
  significance: Second headline conclusion (opening) — in the far term an invasive approach using interfaces with single neurons to establish high-bandwidth duplex communication networks of 5-20 bits per second
  statement_date: '2010-03-23'
- id: q40b
  added_date: '2026-05-27'
  text: |-
    directly in the cortex or cerebellum can take the fullest advantage of neural training and processing capability. Two research paths currently showing the most promise are optical interfaces and ex-vivo preparation of electrode arrays encased in engineered neural tissue.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Conclusions", far-term conclusion (sentence continuation after the page boundary)'
  significance: Second headline conclusion (continuation) — single-neuron interfaces directly in the cortex or cerebellum take fullest advantage of neural training, with optical interfaces and ex-vivo electrode arrays encased in engineered neural tissue the two most promising research paths
  statement_date: '2010-03-23'
- id: q41
  added_date: '2026-05-27'
  text: |-
    The current state of the art using metal electrode arrays for proximal stimulation and sensing does not appear to be advancing toward long duration viability as a commercial BMI without some unforeseen advance in two-way communication. Peripheral connections show some theoretical promise, but an example of an implant in a human trial did not shown terrific success over several weeks it functioned.
  source:
    path: government/dird-12-bci-controlling-external-devices-20100323.pdf
    location: 'section "Conclusions", current-metal-electrode assessment'
  significance: Closing assessment of the dominant current technology — metal electrode arrays for proximal stimulation are not advancing toward long-duration commercial viability without an unforeseen advance in two-way communication, and the human peripheral-implant trial is judged a non-success; the source grammar "did not shown terrific success" is preserved verbatim
  statement_date: '2010-03-23'
