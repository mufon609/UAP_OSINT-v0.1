  text: 'The agency summarized the results of the reevaluation as follows:'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: '¶ The agency summarized the results of the reevaluation as follows: (BACKGROUND section, lead-in to the reevaluation results tables)'
  significance: 'Lead-in sentence introducing the two reevaluation results tables (Call Order 1 EXDIR: Sancorp vs. Premier; Call Order 2 SASP: Sancorp vs. Arlo). Attributes the tabulated ratings and prices to the agency (WHS) summary; the sentence that follows the tables cites AR, Tab 45, SSDD at 21, 36 as the record source.'
  context: 'Immediately precedes the Call Order 1 (EXDIR) table and then the Call Order 2 (SASP) table; the two tables sit between this sentence and the "AR, Tab 45, Source Selection Decision Document (SSDD) at 21, 36.[3]" paragraph (already quoted as q5). Not contiguous with the SASP table, because the EXDIR table intervenes.'
  claim_group: 'GAO B-422985.4/.5: WHS reevaluation results — SASP Call Order 2 (Arlo vs. Sancorp)'
  statement_date: '2025-06-11'
- id: q54
  added_date: '2026-09-26'
  text: 'Call Order 2 (SASP) Sancorp Arlo Technical Outstanding Outstanding Past performance Satisfactory Confidence Satisfactory Confidence Price $91,450,294 $87,748,037'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section — reevaluation results table, ¶ Call Order 2 (SASP) (second table, following the Call Order 1 (EXDIR) table)'
  significance: 'Reevaluation results for Call Order 2 (SASP), as the agency summarized them. The table has two columns, in the order Sancorp then Arlo. Technical: Sancorp Outstanding, Arlo Outstanding. Past performance: Sancorp Satisfactory Confidence, Arlo Satisfactory Confidence. Price: Sancorp $91,450,294, Arlo $87,748,037. Arlo tied Sancorp on both non-price factors and quoted the lower price. The SSA then found Arlo''s quotation the best value for the SASP call order (q5).'
  context: 'The HTML table cells appear on separate lines in the extracted scratch file, separated by tabs and blank lines. This quote is the same cell sequence with its whitespace collapsed; the verbatim check''s normalize_for_compare also collapses whitespace. The span begins at the table''s header cell "Call Order 2 (SASP)" and ends at Arlo''s price cell.'
  claim_group: 'GAO B-422985.4/.5: WHS reevaluation results — SASP Call Order 2 (Arlo vs. Sancorp)'
  statement_date: '2025-06-11'
- id: q55
  added_date: '2026-09-26'
  text: 'Olivia L. Lynch, Esq., Cherie J. Owen, Esq., and Emily P. Golchini, Esq., Crowell & Moring LLP, for Arlo Solutions, LLC; and Jonathan D. Perrone, Esq., Joshua M. Sather, Esq., and Timothy J. Turner, Esq., Whitcomb, Selinsky, P.C., and Sharon O. Steele, Esq., Steele Law Offices, LLC, for Premier Enterprise Solutions, LLC, the intervenors.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'Decision header — counsel-of-record block, ¶ Olivia L. Lynch, Esq., Cherie J. Owen, Esq., and Emily P. Golchini, Esq., Crowell & Moring LLP, for Arlo Solutions, LLC'
  significance: 'Establishes Arlo Solutions, LLC as an intervenor in B-422985.4 / B-422985.5, represented by Crowell & Moring LLP (Olivia L. Lynch, Cherie J. Owen, Emily P. Golchini). Premier Enterprise Solutions, LLC, the other intervenor, was represented by Whitcomb, Selinsky, P.C. (Jonathan D. Perrone, Joshua M. Sather, Timothy J. Turner) and Steele Law Offices, LLC (Sharon O. Steele).'
  context: 'Second line of the counsel block. The line before it names Fox Rothschild LLP (Douglas P. Hibshman, Keeley A. McCarty, Jane Jung Hyoun Han) as counsel for the protester, Sancorp. The lines after it name May Sena and Stephan Piel, Department of Defense, for the agency, and Samantha S. Lee and Peter H. Tran, Office of the General Counsel, GAO.'
  claim_group: 'GAO B-422985.4/.5: Arlo as intervenor — counsel of record'
  statement_date: '2025-06-11'
- id: q56
  added_date: '2026-09-26'
  text: 'Here, under the technical factor, the solicitation required offerors to propose individuals for nine key personnel positions including, as relevant here, staff officer (subject matter expert level IV).'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Call Order 2 (SASP), Key Personnel, ¶ Here, under the technical factor, the solicitation required offerors to propose individuals for nine key personnel positions'
  significance: 'The SASP solicitation required nine key personnel positions. The one at issue in Arlo''s dismissal request is "staff officer (subject matter expert level IV)".'
  claim_group: 'GAO B-422985.4/.5: Arlo dismissal request — Sancorp key person X unavailability'
  statement_date: '2025-06-11'
- id: q57
  added_date: '2026-09-26'
  text: 'Sancorp proposed an individual who we refer to as “X” for a staff officer key personnel position. AR, Tab 15, Sancorp Technical Quotations at 126. Sancorp submitted X’s resume, which explained that X had joined Sancorp in April 2024 and “currently supports OUSD(I&S)” under an incumbent effort.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Call Order 2 (SASP), Key Personnel, ¶ Sancorp proposed an individual who we refer to as “X” for a staff officer key personnel position'
  significance: 'Sancorp proposed the pseudonymized individual "X" for the staff officer key personnel position. According to X''s resume, X joined Sancorp in April 2024 and "currently supports OUSD(I&S)" under an incumbent effort.'
  context: 'Later in the same paragraph (not captured here): X signed a letter of commitment (AR, Tab 51, Sancorp BPA Quotation at 12); the evaluators assigned Sancorp''s quotation a strength for X''s qualifications (AR, Tab 26, Sancorp SASP TEB Report at 11); and Sancorp''s SASP technical rating was outstanding.'
  claim_group: 'GAO B-422985.4/.5: Arlo dismissal request — Sancorp key person X unavailability'
  statement_date: '2025-06-11'
- id: q58
  added_date: '2026-09-26'
  text: 'Citing “public information,” the intervenor asserts that in February 2025, X “left the employment of Sancorp and began working for another company . . . as an Operations Officer/Research Analyst, rendering X unavailable to fill the key position for which Sancorp proposed him.” Arlo Req. for Dismissal at 4.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Call Order 2 (SASP), Key Personnel, ¶ Citing “public information,” the intervenor asserts'
  significance: 'Arlo''s assertion, as the intervenor, quoted by GAO from Arlo''s Request for Dismissal at 4. Citing "public information," Arlo asserted that X left Sancorp in February 2025 to work for another company as an Operations Officer/Research Analyst, which left X unavailable for the key position. The ". . ." ellipsis is in the GAO text; the other company is not named in the source.'
  context: 'In the next sentence, GAO directed Sancorp to respond to the dismissal request (Electronic Protest Docketing System No. 38). Sancorp''s response is already captured as q6.'
  claim_group: 'GAO B-422985.4/.5: Arlo dismissal request — Sancorp key person X unavailability'
  statement_date: '2025-06-11'
- id: q59
  added_date: '2026-09-26'
  text: 'In this connection, the protester asserts that X had “left Sancorp amicably.”'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Call Order 2 (SASP), Key Personnel, ¶ Id. at 3 (citing DZSP 21, LLC … ) — sentence "In this connection, the protester asserts"'
  significance: 'This is Sancorp''s characterization (the protester), as GAO reports it: X "left Sancorp amicably." Sancorp relied on this to argue that it lacked actual knowledge of X''s unavailability. It is Sancorp''s claim, not GAO''s finding and not Arlo''s.'
  context: 'The next sentence reports Sancorp''s argument that because X "left Sancorp on good terms," Sancorp would have had actual knowledge only if X had withdrawn his letter of commitment.'
  claim_group: 'GAO B-422985.4/.5: Arlo dismissal request — Sancorp key person X unavailability'
  statement_date: '2025-06-11'
- id: q60
  added_date: '2026-09-26'
  text: 'Here, the record reflects that X submitted a letter of resignation on February 7 and subsequently left Sancorp’s employ later that month. Supp. Comments, exh. B at 1 (resignation letter of X stating, “my last official day will be 14 February 2025”).'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Call Order 2 (SASP), Key Personnel, ¶ By contrast, X was--as touted by Sancorp in its quotation--employed by Sancorp'
  significance: 'GAO''s record finding: X submitted a resignation letter on February 7 (2025) and left Sancorp later that month. The letter, Supp. Comments exh. B at 1, states "my last official day will be 14 February 2025." On that basis GAO found that Sancorp had actual knowledge of X''s unavailability, which rendered Sancorp''s SASP quotation unacceptable (see q7).'
  context: 'Earlier in the same paragraph, GAO notes that X had signed a letter of commitment in July 2024, when quotations were submitted.'
  claim_group: 'GAO B-422985.4/.5: Arlo dismissal request — Sancorp key person X unavailability'
  statement_date: '2025-06-11'
