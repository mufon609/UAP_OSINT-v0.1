type: research-artifact
target_node: organizations/arlo-solutions
status: active
description: 'Arlo Solutions, LLC is a small business of Washington, D.C. ([`/locations/washington-dc`]) founded in 2014 by Arlene Wube ([`/people/arlene-wube`]) and Lonye Ford ([`/people/lonye-ford`]). According to Arlo''s March 16, 2026 SASP press statement, Arlo is a service-disabled veteran owned small business, woman owned small business, and 8(a) small business based in Washington, DC; Lonye Ford is named CEO. According to USAspending ([`/organizations/usaspending-gov`]) records (recipient UEI JSRCFJVJM874; CAGE Code 72UJ9), Arlo''s business categories include 8(a) Program Participant, Black American Owned Business, Economically Disadvantaged Women Owned Small Business, Service Disabled Veteran Owned Business, Small Business, and Women Owned Small Business. The recipient address according to USAspending is 200 Massachusetts Ave NW Suite 700 Washington, DC 20001. The March 16, 2026 SASP press statement named Lonye Ford as CEO; Arlene Wube and broader Arlo staff do not appear in the SASP press statement. Arlo''s 2021 Company Overview also shows Arlo as Subcontractor on CDM Analytical & Technical Services, SITE III Solutions for IT Enterprise, and VECTOR Transformation & Operational Readiness.


  Arlo''s principal federal customer is the Office of the Under Secretary of Defense for Intelligence and Security ([`/organizations/ousd-is`]) — Arlo''s corporate marketing uses the form OUSW(I&S) (Office of the Under Secretary of War for Intelligence and Security), while the federal procurement record (USAspending, GAO B-422985) identified the customer using the OUSD(I&S) form. See Sancorp Consulting ([`/organizations/sancorp-consulting`]) for the Executive Order framework documenting this adoption. According to USAspending records, Arlo has held prime contracts issued by Washington Headquarters Services ([`/organizations/whs`]) to OUSD(I&S) since September 2019, including Personnel Security Policy Support (HQ003419C0172), Business Operations and Support Services (HQ003420C0104), Counterintelligence, Law Enforcement and Security Policy Support (HQ003421C0078, HQ003422F0271, HQ003423F0356), Cyberspace Oversight Support Services (HQ003422C0092), Admin Support Services (HQ003421C0090), Event Planning Support Services (HQ003423C0093), and Integrated Vetting Policy & Analytical Support (HQ003424F0190 — a $3.7 million contract with the OUSD(I&S) CL&S Integrated Vetting team announced by Arlo on April 18, 2024). On February 14, 2025, WHS established the OUSD(I&S) Enterprise BPA HQ003425A0004 under solicitation HQ003424R0178; the good faith estimate amount for all BPAs is $856 million across the four BPA vendors, not Arlo''s individual limit. The public GAO B-422985.4 / B-422985.5 decision named three of the four BPA vendors established after the reevaluation (Sancorp, Premier, Arlo); the remaining vendor is not named in the public decision. Comprehensive Approach LLC ([`/organizations/comprehensive-approach-solutions`]) held the September 2024 EXDIR Call Order 1 award before the corrective action; whether Comprehensive Approach is among the four BPA vendors established after the reevaluation is not stated in the public GAO decision. USAspending records four BPAs signed February 14, 2025: HQ003425A0001 to Sancorp, HQ003425A0002 to COMPREHENSIVE APPROACH LLC, HQ003425A0003 to PREMIER ENTERPRISE SOLUTIONS, LLC, and HQ003425A0004 to Arlo. Each is recorded as a MULTIPLE AWARD BPA; of the four BPA records, the solicitation number HQ003424R0178 is recorded only on the HQ003425A0004 record (the HQ003425F0104 call order record also records it). USAspending records base_and_all_options of 856000000.0 on HQ003425A0001, 956000000.0 on HQ003425A0002, and 1856000000.0 on HQ003425A0003. On February 21, 2025, WHS signed BPA Call Order HQ003425F0104 with Arlo for SASP support.


  The HQ003425A0004 BPA and HQ003425F0104 SASP Call Order were awarded after a reevaluation of solicitation HQ003424R0178. According to the Government Accountability Office decision Matter of Sancorp Consulting LLC, B-422985.4 / B-422985.5 (June 11, 2025), WHS issued the RFQ on May 23, 2024 under the General Services Administration Federal Supply Schedule Professional Services multiple award schedule contract; nine vendors submitted quotations; in September 2024, WHS established BPAs with, and issued Call Order 1 (EXDIR) to, Comprehensive Approach LLC and Call Order 2 (SASP) to Sancorp Consulting ([`/organizations/sancorp-consulting`]). Following protests by Arlo and Premier Enterprise Solutions ([`/organizations/premier-enterprise-solutions`]), the agency announced corrective action: stating it would terminate the BPAs and call orders, reevaluate quotations, and make new award decisions. The reevaluation awarded Call Order 1 (EXDIR) to Premier and Call Order 2 (SASP) to Arlo. The agency summarized the results of the reevaluation for Call Order 2 (SASP) as Technical Outstanding and Past performance Satisfactory Confidence for both Sancorp and Arlo, with a Price of $91,450,294 for Sancorp and $87,748,037 for Arlo; the Source Selection Decision Document ([`/documents/ssdd-hq003424r0178`]) is the record source for the reevaluation results. Sancorp filed a protest of the reevaluation. Arlo, as an intervenor represented by Crowell & Moring LLP ([`/organizations/crowell-moring`]), filed comments along with a request for dismissal of the protest arguments related to the SASP call order. The GAO dismissed Sancorp''s challenges to the SASP call order on the basis that Sancorp''s proposed staff officer key personnel had submitted a letter of resignation dated February 7, 2025 with a last official day of February 14, 2025 — before WHS issued the SASP call order — and that Sancorp had failed to advise the agency of the unavailability of the quoted key person, making Sancorp''s SASP quotation unacceptable and Sancorp ineligible to challenge the SASP call order. The GAO denied Sancorp''s challenges to the EXDIR call order. As of the public GAO record, only the EXDIR (Premier) and SASP (Arlo) call orders had been awarded under the four BPAs; additional call orders under those BPAs are not reflected in the decision. USAspending records a later BPA call under Sancorp''s HQ003425A0001: HQ003426FE050, signed January 28, 2026, with 4 offers received. No source cited here records who submitted the four offers on HQ003426FE050, and no source cited here states whether Arlo was an offeror.


  For HQ003425F0104, five transaction records are listed by USAspending. The base award (modification 0) obligated 6327156.07; modification P00001 and modification P00002 are recorded as OTHER ADMINISTRATIVE ACTION with no change in obligation; modification P00003, in July 2025, records a federal_action_obligation of -6327156.07; and modification P00004, in August 2025, is recorded as TERMINATE FOR CONVENIENCE (COMPLETE OR PARTIAL), the last transaction listed. From modification P00003 on, the transaction description field is "OFFICE OF THE UNDER SECRETARY OF DEFENSE FOR INTELLIGENCE AND SECURITY, PROFESSIONAL, TECHNICAL AND ADMINISTRATIVE SUPPORT TO THE EXECUTIVE DIRECTORATE" ([`/organizations/ousd-is-exdir`]) in place of the base award description, while under the GAO decision the Call Order 1 awardee is to provide services to the I&S Executive Directorate (EXDIR) and the Call Order 2 awardee to the SASP Office. The transaction records do not name the recipient and state no reason for any modification, and the TERMINATE FOR CONVENIENCE (COMPLETE OR PARTIAL) description does not state whether the action was complete or partial. The HQ003425F0104 award record shows the recipient as ARLO SOLUTIONS L.L.C. (UEI JSRCFJVJM874) and records total_obligation 0.0, base_exercised_options 7447926.22, and base_and_all_options 78512350.27. Its period_of_performance has a start_date of 2025-02-21 and an end_date of 2026-03-27, with a potential_end_date of 2029-09-27; the end_date is later than the August 2025 TERMINATE FOR CONVENIENCE (COMPLETE OR PARTIAL) action, and the record does not explain why. The award record records solicitation HQ003424R0178, number_of_offers_received 1, and type_set_aside NONE ("NO SET ASIDE USED."); according to the GAO decision, the RFQ was set aside for 8(a) small businesses. Its funding agency is the Immediate Office of the Secretary of Defense ([`/organizations/osd`]), funding office "OSD OUSD(I)", and its awarding agency is Washington Headquarters Services. Arlo''s March 16, 2026 SASP press statement, issued after the last transaction listed, announced a multi-year contract valued at more than $85 million; no contract number is named in the press statement.


  Solicitation HQ003424R0178 issued call orders for SASP and EXDIR support services.


  USAspending records a second BPA CALL under HQ003425A0004: HQ003426FE011, date_signed 2026-02-17, recipient ARLO SOLUTIONS L.L.C. (UEI JSRCFJVJM874), with the description "ADMINISTRATIVE, POLICY, OPERATIONS, AND ANALYTIC SUPPORT SERVICES OFFICE OF THE UNDER SECRETARY OF WAR FOR INTELLIGENCE AND SECURITY OUSW(IS)SENSITIVE ACTIVITIES AND SPECIAL PROGRAMS (SASP)" ([`/organizations/ousd-is-sasp`]). The HQ003426FE011 award record records solicitation HQ003424R0178, number_of_offers_received 4, type_set_aside 8A ("8A COMPETED"), base_and_all_options 59372513.73, and total_obligation 5694229.63; the two transaction records listed are the base award (federal_action_obligation 3500000.0) and modification P00001, a CHANGE ORDER on 2026-06-02 (federal_action_obligation 2194229.63). Its period_of_performance has a start_date of 2026-05-13 and an end_date of 2026-11-27, with a potential_end_date of 2030-11-27. Its awarding agency is Washington Headquarters Services and its funding office is "OSD OUSD(I)". Two BPA CALL records are listed by USAspending under HQ003425A0004, HQ003426FE011 and HQ003425F0104, on a single page (hasNext false). Arlo''s March 16, 2026 SASP press statement announced a contract valued at more than $85 million and named no contract number; the HQ003426FE011 base_and_all_options is 59372513.73. Both stand as recorded. No source cited here states a reason for the HQ003425F0104 TERMINATE FOR CONVENIENCE (COMPLETE OR PARTIAL) action, or states that HQ003426FE011 was issued in place of HQ003425F0104.


  In notice of intent TR011720251116 ([`/documents/samgov-tr011720251116-notice`]), dated March 11, 2025 (postedDate), Washington Headquarters Services, Acquisition Directorate ([`/organizations/whs-acquisition-directorate`]) states that the incumbent contractor, Booz Allen Hamilton Inc. ([`/organizations/booz-allen-hamilton`]) of McLean Virginia ([`/locations/mclean-virginia`]), is currently performing services under WHS-AD TEAMS BPA, HQ003415A0010, Task Order HQ003419F0506, with services concluding on March 27, 2025, and an anticipated bridge contract period of performance from March 28, 2025, to July 27, 2025. USAspending records the recipient of HQ003419F0506 as IAN EVAN & ALEXANDER CORP ([`/organizations/ian-evan-alexander`]), with parent recipient BOOZ ALLEN HAMILTON HOLDING CORPORATION; neither record refers to the other, and both stand as recorded. In the HQ003419F0506 transaction records, modification P00035 (2025-07-25, CHANGE ORDER, federal_action_obligation 1977626.47) is the first transaction whose description field is "SENSITIVE ACTIVITIES AND SPECIAL PROGRAMS", and every later transaction listed, through P00040 (2026-04-01), has the same description; two 2024 transaction records, P00023 (2024-05-24) and P00024 (2024-07-09), have descriptions beginning "SENSITIVE ACTIVITIES & SPECIAL PROGRAMS". The HQ003419F0506 award record records a period_of_performance end_date of 2026-05-27. Neither the notice nor the HQ003419F0506 records name Arlo.


  Arlo Solutions LLC Greenhouse job posting pages are cited here. The "(469) Commonwealth Partners Mission Integration Office – Allied Action Officer" posting, in the April 28, 2025 capture, states "This position is with the Office of the Under Secretary of Defense for Intelligence and Security - OUSD(I&S), in the Commonwealth & Partnership Engagement (C&PE) Branch" ([`/organizations/ousd-is-cpe`]) and that the position is to meet the needs of "four primary Commonwealth partner nations: Australia, Canada, New Zealand, and the United Kingdom"; its work location is Bolling AFB, Washington, D.C. No contract is named in the (469) posting. The "(617) Staff Officer V" posting, in the Dec. 17, 2025 capture and the January 19, 2026 capture, states "The Staff Officer V will support the All-Domain Anomaly Resolution Office (AARO) under the Office of the Under Secretary of War for Intelligence and Security (OUSD(I&S))" ([`/organizations/aaro`]) and "This key personnel position serves as a senior-level SME"; its listed responsibilities include reports and briefings on AARO operations for Congress ([`/organizations/congress`]), working relationships with the Office of the Director of National Intelligence ([`/organizations/odni`]), analysis of intelligence related activities against the National Defense Strategy ([`/documents/national-defense-strategy`]), and Intelligence Community ([`/organizations/intelligence-community`])-wide processes and procedures for reporting of airborne objects of interest including UAP. The "(619) Security Officer IV" posting, in the January 19, 2026 capture, states that the Security Officer IV is responsible for managing "comprehensive security support for the All-Domain Anomaly Resolution Office (AARO) within the Office of the Under Secretary of War for Intelligence and Security (OUSW(I&S))"; its listed responsibilities include coordination with the Defense Counterintelligence & Security Agency ([`/organizations/dcsa`]) and compliance with DoD Manual 5205.07 ([`/documents/dod-manual-5205-07`]) and DoD Manual 5105.21 ([`/documents/dod-manual-5105-21`]). Both positions are located in Arlington, VA ([`/locations/arlington-virginia`]). These dates are capture dates; the rendered page displays no posting date. No contract is named in the (617) or the (619) posting, and Arlo is not named for AARO work in any award record cited here. In the February 27, 2026 capture of the Arlo job board, "50 jobs" are listed, including the "OUSW (I&S) SASP Incumbent" job ([`/organizations/ousd-is-sasp`]); neither the (617) nor the (619) position is listed.


  Other Arlo Solutions LLC Greenhouse job posting pages cited here name positions supporting the Sensitive Activities & Special Programs (SASP) office ([`/organizations/ousd-is-sasp`]) of OUSD(I&S) ([`/organizations/ousd-is`]). The "(183) Budget Analyst IV" posting states "This opportunity is contingent upon award" and that the Budget Analyst will work as a contractor to support the Office of the Under Secretary of Defense for Intelligence and Security Sensitive Activities & Special Programs (SASP), with the OUSD(I&S) Financial Management and Accounting (FMA) office ([`/organizations/ousd-is-financial-management-and-accounting`]), to execute the SASP budget. The "OUSD(I&S) SASP Incumbent" posting states "Arlo Solutions has recently been awarded the Office of Under Secretary of Defense for Intelligence & Security (OUSD(I&S)) Sensitive Activities and Special Programs (SASP) contract" and that only current employees serving as incumbents on this contract are eligible to apply; no contract number is named in the posting. SASP is named in the (498), (504), (510), (514), and (516) posting pages: an Executive Assistant II supporting DoD Senior Executives in the SASP Front Office Directorate (498); an Operations Manager II supporting the Sensitive Activities & Special Programs (SASP) Office (504); a Counter-Weapons of Mass Destruction (C-WMD) Staff Officer I supporting the Counter Proliferation and Weapons of Mass Destruction Directorate ([`/organizations/ousd-is-sasp-cp-wmd-directorate`]) within the SASP Office, to provide recommendations on the appropriate Title authorities (e.g., Title 10 ([`/documents/title-10-us-code`]), Title 50 ([`/documents/title-50-us-code`])) (510); an Influence, Deception, and Perception Management Activities Staff Officer V supporting SASP, for DoW influence, deception, and perception management-related operations, activities, and investments, with reports and briefings for Congress ([`/organizations/congress`]) (514); and an Operations Manager III supporting SASP, to oversee and manage daily operations within the Influence and Perception Management Office ([`/organizations/ipmo`]) and to coordinate with the OUSW(I&S) Special Access Program Central Office ([`/organizations/ousd-is-sapco`]), Special Security Office, Joint Staff ([`/organizations/joint-staff`]), and Military Services security offices (516). The "(467) HUMINT Policy Staff Officer III" posting also supports SASP, with liaison to Defense HUMINT Executors (DHE) ([`/organizations/defense-humint-executors`]). The (495) Special Operations Support Policy Staff Officer I, (497) HUMINT Policy Staff Officer II, (499) Reports and Assessments Staff Officer I, (500) Sensitive Activities Policy Staff Officer II, and (506) Countering Adversary Defense Industry Staff Officer II posting pages name the HUMINT & Sensitive Activities Directorate ([`/organizations/ousd-is-humint-sensitive-activities-directorate`]) within the Office of the Under Secretary of War for Intelligence and Security (OUSW(I&S)), and SASP is not named in them; the Sensitive Activities Executive Council (SA-EXCON) ([`/organizations/sensitive-activities-executive-council`]) is named in the (499) posting. The (183), (467), (495), (497), (498), (499), (500), (504), (506), (510), (514), and (516) posting pages list the work location as Pentagon, Arlington, VA ([`/locations/pentagon`]). No contract number is named in any of these posting pages.

  '
