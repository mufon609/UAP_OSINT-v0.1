  text: 'Jacqueline previously served as the Director of Defense Department programs at the Federal Systems and Integration Center (FEDSIM), U.S. General Services Administration where she oversaw the annual sales, acquisition, and administration of $120 million of information technology contracts.  She also served as a Senior Account Manager for the GSA Office of Sales where she developed strategic relationships with Federal Departmental executives and Agency decision-makers.'
  source:
    path: news/premier-about-20260926.html
    location: '¶ "An Air Force veteran who advocates", sentence "Jacqueline previously served"'
  significance: President's prior GSA career — Director of Defense Department programs at FEDSIM ($120 million of IT contracts) and Senior Account Manager, GSA Office of Sales.
  claim_group: 'Leadership'
- id: q66
  added_date: '2026-09-26'
  text: 'Jacqueline served ten years as an officer with the U.S. Air Force.  One of her notable assignments included serving as the Branch Chief for the Pentagon’s Top Secret Air Force Operations Network and the technical manager for the $80 million command center upgrade.'
  source:
    path: news/premier-about-20260926.html
    location: '¶ "An Air Force veteran who advocates", sentence "Jacqueline served ten years"'
  significance: President's ten-year U.S. Air Force officer service, including Branch Chief for the Pentagon's Top Secret Air Force Operations Network.
  claim_group: 'Leadership'
- id: q67
  added_date: '2026-09-26'
  text: 'Jacqueline received the GSA Administrators Exceptional Service award and is an ACT-IAC Fellow. She is a 2015 graduate of Montgomery County’s Veterans Institute for Procurement Grow Program and a 2016 graduate of SBA’s Emerging Leaders Program.'
  source:
    path: news/premier-about-20260926.html
    location: '¶ "Jacqueline received the GSA"'
  significance: President's awards, ACT-IAC fellowship, and dated small-business program graduations (2015 VIP Grow; 2016 SBA Emerging Leaders).
  claim_group: 'Leadership'
- id: q68
  added_date: '2026-09-26'
  text: 'Jacqueline holds a Bachelors of Science in Computer Technology from the University of Southern Mississippi.'
