  significance: 'Company bio of its Vice President of Service Delivery (source form "Mike Chambers").'
  claim_group: 'Leadership'
- id: q74
  added_date: '2026-09-26'
  text: 'As a retired U.S. Army Colonel with over 25 years of distinguished service, Mike brings unparalleled expertise in executive management, information technology, and strategic program oversight—skills honed through roles such as Battalion Commander and Director for Combat Support Evaluations.'
