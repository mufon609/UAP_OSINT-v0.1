- id: q44
  added_date: '2026-09-26'
  text: 'Sancorp Consulting, LLC, a small business of Falls Church, Virginia, protests the issuance of orders to Premier Enterprise Solutions, LLC, a small business of Upper Marlboro, Maryland, and Arlo Solutions, LLC, a small business of Washington, D.C., under request for quotations (RFQ) No. HQ003424R0178, issued by the Department of Defense, Washington Headquarters Service (WHS), for technical, administrative, and professional support services.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DECISION section, ¶1 (same sentence also reproduced in the page''s Highlights summary)'
  significance: 'GAO identifies Premier Enterprise Solutions, LLC as a small business of Upper Marlboro, Maryland, and as a recipient of an order under DoD/WHS RFQ HQ003424R0178 that Sancorp protested.'
  claim_group: 'RFQ HQ003424R0178 orders and the Sancorp protest'
  statement_date: '2025-06-11'
- id: q45
  added_date: '2026-09-26'
  text: 'The RFQ, set aside for 8(a) small businesses and issued under Federal Acquisition Regulation (FAR) subpart 8.4, sought quotations to establish multiple award blanket purchase agreement (BPAs) with vendors to provide technical, administrative, and professional support services to the Office of the Under Secretary of Defense for Intelligent & Security (OUSD(I&S)) enterprise.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section, ¶ "The agency issued the RFQ on May 23, 2024"'
  significance: 'Scope of the solicitation under which Premier competed: an 8(a) set-aside for multiple-award BPAs supporting the OUSD(I&S) enterprise.'
  claim_group: 'RFQ HQ003424R0178 orders and the Sancorp protest'
  statement_date: '2025-06-11'
- id: q46
  added_date: '2026-09-26'
  text: 'The “good faith estimate amount” for all BPAs is $856 million.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section, ¶ "The agency issued the RFQ on May 23, 2024"'
  significance: 'Aggregate estimate across all BPAs under the RFQ, not a Premier-specific value. The USAspending record for Premier''s BPA HQ003425A0003 separately records base_and_all_options of 1856000000.0; the two figures carry different labels and neither source relates one to the other.'
  claim_group: 'RFQ HQ003424R0178 orders and the Sancorp protest'
  statement_date: '2025-06-11'
- id: q47
  added_date: '2026-09-26'
  text: 'Under call order 1, the awardee is to provide services to the I&S Executive Directorate (EXDIR).'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section, ¶ "The RFQ provided a performance work statement"'
  significance: 'Defines the EXDIR call order (call order 1) that the reevaluation awarded to Premier.'
  claim_group: 'Reevaluation and award of the EXDIR call order to Premier'
  statement_date: '2025-06-11'
- id: q48
  added_date: '2026-09-26'
  text: 'In September, WHS established a BPA with, and issued call order 1 (EXDIR) to, Comprehensive Approach LLC d/b/a Comprehensive Approach Solutions. COS/MOL at 5. At the same time, WHS established a BPA with, and issued call order 2 (SASP) to, Sancorp. Id. Following notification of the awards, Arlo and Premier filed protests with our Office, challenging the agency’s evaluation and award decisions. Arlo Sols., LLC, B‑422985, B-422985.2, Oct. 16, 2024 (unpublished decision); Premier Enter. Sols., LLC, B-422985.3, Oct. 16, 2024 (unpublished decision). In response, the agency advised our office that it intended to take corrective action; specifically, the agency stated that it would terminate the BPAs and call orders, reevaluate quotations, and make new award decisions. Id. We dismissed the protests as academic on October 16. Id.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section, ¶ "The agency received quotations from nine vendors"'
  significance: 'Premier protested the initial September 2024 awards (B-422985.3); WHS took corrective action and GAO dismissed the protest as academic on October 16, 2024.'
  claim_group: 'Premier protest B-422985.3 and WHS corrective action'
  statement_date: '2025-06-11'
- id: q49
  added_date: '2026-09-26'
  text: 'Call Order 1 (EXDIR) Sancorp Premier Technical Good Outstanding Past performance Satisfactory Confidence Satisfactory Confidence Price $99,312,935 $94,819,501'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section, reevaluation results table for Call Order 1 (EXDIR)'
  significance: 'Reevaluated ratings: Premier rated Outstanding (technical) and Satisfactory Confidence (past performance) at a price of $94,819,501 for the EXDIR call order, versus Sancorp Good / Satisfactory Confidence / $99,312,935.'
  claim_group: 'Reevaluation and award of the EXDIR call order to Premier'
  statement_date: '2025-06-11'
  contradicted_by: q20
- id: q50
  added_date: '2026-09-26'
  text: 'The contracting officer, who was the source selection authority (SSA), determined that WHS would establish BPAs with four vendors, including Sancorp, Premier, and Arlo. COS/MOL at 6. Relevant here, the SSA found that Premier’s quotation represented the best value for the EXDIR call order, and that Arlo’s quotation represented the best value for the SASP call order, and the agency issued the orders accordingly.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'BACKGROUND section, ¶ "AR, Tab 45, Source Selection Decision Document"'
  significance: 'Premier received one of four BPAs and was found to represent the best value for the EXDIR call order, which was issued to it.'
  claim_group: 'Reevaluation and award of the EXDIR call order to Premier'
  statement_date: '2025-06-11'
- id: q51
  added_date: '2026-09-26'
  text: 'Sancorp also challenges the agency’s evaluation of Premier’s technical quotation for the EXDIR call order. According to the protester, the agency “missed flaws”--failures to comply with material solicitation requirements--in the awardee’s quotation.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Premier’s Quotation, ¶ "Sancorp also challenges the agency’s evaluation of Premier’s"'
  significance: 'Sancorp''s allegation that WHS missed flaws in Premier''s technical quotation.'
  claim_group: 'Sancorp challenge to Premier''s EXDIR technical quotation'
  statement_date: '2025-06-11'
- id: q52
  added_date: '2026-09-26'
  text: 'Premier’s quotation addressed the administrative and human resources support task, identifying the following “four overarching needs” that shaped the firm’s approach for all work, including electronic records: technical expertise, systems thinking, emotional intelligence, and reality testing. AR, Tab 27, Premier Technical Quotations at 15-16. Specific to the executive secretariat support, Premier acknowledges the need for personnel to have “a holistic sense” of the organization and applicable policies and procedures and discusses how it will apply its approach to records management.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Premier’s Quotation, ¶ "Premier’s quotation addressed the administrative"'
  significance: 'GAO''s description of Premier''s technical approach, relaying phrases from Premier''s own technical quotation ("four overarching needs", "a holistic sense").'
  claim_group: 'Sancorp challenge to Premier''s EXDIR technical quotation'
  statement_date: '2025-06-11'
- id: q53
  added_date: '2026-09-26'
  text: 'The protester contends the awardee’s technical quotation fails to demonstrate “experience in maintaining and posting electronic archives” and does not specifically address National Archives and Records Administration (NARA) standards for such archives. Comments & Supp. Protest at 13. The agency responds that the evaluators reasonably found that Premier proposed a comprehensive technical approach to the executive secretariat support work, including electronic archives.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Premier’s Quotation, ¶ "The protester contends the awardee’s technical quotation"'
  significance: 'The representative example GAO discusses: the electronic-archives / NARA-standards challenge to Premier''s quotation and the agency''s response.'
  claim_group: 'Sancorp challenge to Premier''s EXDIR technical quotation'
  statement_date: '2025-06-11'
- id: q54
  added_date: '2026-09-26'
  text: 'Here, the record reflects that WHS found that Premier’s quotation met the requirements for this subtask. AR, Tab 36, Premier EXDIR TEB Report at 5. According to the evaluators, Premier’s quotation detailed an adequate approach to the work.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Premier’s Quotation, ¶ "Here, the record reflects that WHS found"'
  significance: 'The WHS technical evaluation board found Premier''s quotation met the executive secretariat subtask requirements.'
  claim_group: 'Sancorp challenge to Premier''s EXDIR technical quotation'
  statement_date: '2025-06-11'
- id: q55
  added_date: '2026-09-26'
  text: 'To the extent the protester’s objection is that the contemporaneous record includes a very limited examination of Premier’s approach to electronic records, our Office has consistently explained that agencies need not document all determinations of adequacy. Allied Tech. Grp., Inc., B-412434, B-412434.2, Feb. 10, 2016, 2016 CPD ¶ 74 at 13 (finding an agency is not required to document why a quotation did not receive a weakness for a particular item). This argument--and the similar arguments Sancorp raises about other elements of the awardee’s quotation--are therefore denied.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DISCUSSION section — Premier’s Quotation, ¶ "To the extent the protester’s objection"'
  significance: 'GAO notes the contemporaneous record contains only a very limited examination of Premier''s electronic-records approach, and denies the challenges to Premier''s quotation.'
  claim_group: 'Sancorp challenge to Premier''s EXDIR technical quotation'
  statement_date: '2025-06-11'
- id: q56
  added_date: '2026-09-26'
  text: '1. Protests challenging the technical evaluation of first call order are denied where the record shows that the evaluation was reasonable and consistent with the terms of the solicitation.'
  source:
    path: government/gao-b-422985-wayback-20250708.html
    location: 'DIGEST, ¶ "1. Protests challenging the technical evaluation"'
  significance: 'GAO holding on the first (EXDIR) call order awarded to Premier: protests denied.'
  claim_group: 'RFQ HQ003424R0178 orders and the Sancorp protest'
  statement_date: '2025-06-11'
- id: q57
  added_date: '2026-09-26'
  text: 'Jonathan D. Perrone, Esq., Joshua M. Sather, Esq., and Timothy J. Turner, Esq., Whitcomb, Selinsky, P.C., and Sharon O. Steele, Esq., Steele Law Offices, LLC, for Premier Enterprise Solutions, LLC, the intervenors.'
  source:
