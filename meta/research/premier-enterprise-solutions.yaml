- id: q79
  added_date: '2026-09-26'
  text: 'As a Service-Disabled Veteran-Owned Small Business, we are committed to ensuring Veteran-Owned Small Businesses have equal access to the information and resources necessary for growth and sustainability.    As an Air Force veteran, Premier’s President, Jackie Lopez is a leading advocate for VOSB and women veteran entrepreneurs and business leaders.'
