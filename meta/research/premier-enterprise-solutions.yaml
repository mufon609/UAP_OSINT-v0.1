- id: q69
  added_date: '2026-09-26'
  text: 'MICHAEL R. LOPEZ, Chief Operating Officer'
  source:
    path: news/premier-about-20260926.html
    location: '¶ "MICHAEL R. LOPEZ, Chief Operating Officer"'
  significance: Leadership-roster header naming the company's COO.
  context: '"Our Leadership" section, second entry.'
  claim_group: 'Leadership'
- id: q70
  added_date: '2026-09-26'
  text: 'As Chief Operating Officer of Premier Enterprise Solutions, he leads all aspects of operations—including financial strategy, contract execution, compliance, and program performance—ensuring mission-critical outcomes for defense and civilian government clients.'
  source:
    path: news/premier-about-20260926.html
    location: '¶ "As Chief Operating Officer of Premier"'
  significance: COO's remit, including contract execution and compliance for defense and civilian government clients.
  claim_group: 'Leadership'
- id: q71
  added_date: '2026-09-26'
  text: 'With more than 35 years of acquisition and program management experience at the U.S. General Services Administration (GSA), Michael brings unparalleled insight into federal contracting. He held several senior leadership roles, including Director of Network Services for GSA’s National Capital Region, where he managed the $1.8 billion Washington Interagency Telecommunications System, the largest local telecommunications network in the federal government. He also served as Director of Assisted Acquisition Services, overseeing $250 million in annual IT and commodity contracts, and was a longtime contracting officer with an unlimited warrant.'
  source:
    path: news/premier-about-20260926.html
    location: '¶ "With more than 35 years"'
  significance: COO's 35+ years at GSA — Director of Network Services (National Capital Region), Director of Assisted Acquisition Services, contracting officer with an unlimited warrant.
  claim_group: 'Leadership'
- id: q72
  added_date: '2026-09-26'
  text: 'Michael R. Chambers, Vice President of Service Delivery'
