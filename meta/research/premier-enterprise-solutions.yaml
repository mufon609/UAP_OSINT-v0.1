  claim_group: 'Leadership'
- id: q71
  added_date: '2026-09-26'
  text: 'With more than 35 years of acquisition and program management experience at the U.S. General Services Administration (GSA), Michael brings unparalleled insight into federal contracting. He held several senior leadership roles, including Director of Network Services for GSA’s National Capital Region, where he managed the $1.8 billion Washington Interagency Telecommunications System, the largest local telecommunications network in the federal government. He also served as Director of Assisted Acquisition Services, overseeing $250 million in annual IT and commodity contracts, and was a longtime contracting officer with an unlimited warrant.'
  source:
    path: news/premier-about-20260926.html
