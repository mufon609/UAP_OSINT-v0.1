  claim_group: 'Leadership'
- id: q78
  added_date: '2026-09-26'
  text: 'Over 30% of our growing team has served in the United States of America’s armed forces. We are committed to hiring veterans and providing support to a variety of non-profit organizations who assist veterans and their families.'
