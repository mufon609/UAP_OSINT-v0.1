  significance: 'Remit of the Vice President of Growth and Strategy: revenue growth, partnerships, and the company''s strategic plan.'
  claim_group: 'Leadership'
- id: q77
  added_date: '2026-09-26'
  text: 'Prior to Premier, he served as Senior Vice President of Business Development and Strategic Partnerships at Exiger Government Solutions, and VP of Service Delivery and Chief Operating Officer at ProSphere. Chris moved to the private sector following nine-years of military service in the U.S. Army as an Infantry and Special Forces Officer'
