- id: q76
  added_date: '2026-09-26'
  text: 'Christopher Miller is Vice President of Growth and Strategy at Premier, where he is responsible for driving revenue growth by increasing corporate capabilities, enhancing partnerships, and executing Premier’s strategic plan.'
