    location: 'Decision header — counsel-of-record block, ¶ "Olivia L. Lynch, Esq., Cherie J. Owen"'
  significance: 'Premier appeared as an intervenor in B-422985.4/.5, represented by Whitcomb, Selinsky, P.C. and Steele Law Offices, LLC.'
