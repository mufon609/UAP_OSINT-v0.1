description: 'Interview with Uri Geller ([`/people/uri-geller`]) by Tal Kra-Oz ([`/people/tal-kra-oz`]) in Tablet Magazine ([`/organizations/tablet-magazine`]) on June 03, 2015. The interview was at Geller''s home in the village of Sonning about an hour''s drive west of London. The article begins with Geller in Tel Aviv at age 5 (his first bent spoon), his military service as a paratrooper in the IDF, the house parties in Israel through which he climbed the social ladder from photographers to judges to army generals, the general''s house party where Golda Meir ([`/people/golda-meir`]) was at the party and gave him an Israeli radio interview the next day that he calls the beginning of his career, his most publicly humiliating moment on Johnny Carson''s ([`/people/johnny-carson`]) Tonight Show with James Randi ([`/people/james-randi`]), and the Stanford Research Institute ([`/organizations/stanford-research-institute`]) tests sponsored by the CIA in the 1970s.


  The article also has Geller on the Israeli intelligence record. Geller said his stepfather ran a bed-and-breakfast in Cyprus that he calls ''a Mossad ([`/organizations/mossad`]) safe house'', that as a 12 or 13 year old he confronted one of the agents Yoav Shaham ([`/people/yoav-shaham`]), that Shaham gave him a job as a courier whose letters would arrive at the hotel from Arab countries and that Geller would deliver them to the Israeli ambassador in Nicosia, and that after Shaham — a commander in the paratroopers — was killed in the West Bank, intelligence chiefs Meir Amit ([`/people/meir-amit`]) and Aharon Yariv ([`/people/aharon-yariv`]) summoned Geller to a meeting in Tel Aviv. Tal Kra-Oz notes that Geller''s recollections of private conversations with long-dead celebrities and CIA handlers are often impossible to confirm, though much of what Geller said seems true.


  Other things in the article: Geller''s role in knocking out radar stations ahead of the Israel Air Force''s flight to Entebbe; his role in influencing the Russians to sign the 1987 Nuclear Reduction Treaty; the FBI asked him to convince Russian diplomats to defect at parties in Long Island where he mingled and beamed his mind; his friend Michael Jackson ([`/people/michael-jackson`]) who agreed to be the best man when Geller renewed his wedding vows with Rabbi Shmuley Boteach ([`/people/shmuley-boteach`]); his charitable work flying terminally ill children from Israel to his home; his role in the 2005 agreement that got Magen David Adom into the International Red Cross; the BBC ([`/organizations/bbc`]) documentary ''The Secret Life of Uri Geller: Psychic Spy?'' directed by Vikram Jayanti ([`/people/vikram-jayanti`]) (2013); and a live spoon-bending and drawing demonstration during the interview.

  '
