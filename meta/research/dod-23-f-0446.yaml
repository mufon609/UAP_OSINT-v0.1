description: 'FOIA case 23-F-0446 is a request by John Greenewald ([`/people/john-greenewald`]) of The Black Vault, Inc. ([`/organizations/the-black-vault`]) for ALL emails to or from the DoD Office of the Inspector General ([`/organizations/dod-inspector-general`]) and Neill Tipton ([`/people/neill-tipton`]), Director for Defense Intelligence (Collection and Special Programs) ([`/organizations/ousd-is-ddi-csp`]). The records sought, the search scope and the date window come from the requester''s own request text, as it appears in the Request Description cell of the Freedom of Information Division ([`/organizations/dod-freedom-of-information-division`]) FOIA log for fiscal year 2023 ([`/documents/whs-foid-foia-log-fy23`]), log # 620. They are the requester''s description, not an agency finding. The requester requests a search of all classified and unclassified systems, and requests all emails rather than keywords, in the belief that the responsive material is likely not voluminous. The log shows the Final Disposition as Granted / Denied in Part.


  The Black Vault''s own timeline post on the case, by John Greenewald and filed under January 11, 2023 (a date earlier than the log''s Received Date), is the requester''s account of the release. It says the DoD Office of the Inspector General reached out to Tipton in an email sent by a person whose name was redacted, about the "Evaluation of the DoD''s Actions Regarding the Unidentified Aerial Phenomena" ([`/documents/dod-oig-evaluation-dod-actions-regarding-uap`]). It also says the DoD Office of the Inspector General had already reached out in 2021, and that it is unclear why there was a second reach-out and a likely classified teleconference.'
