quotes:
- id: q1
  added_date: '2026-05-20'
  claim_group: "IPMO Establishment and Influence Mandate"
  observation_type: relayed
  statement_date: '2022-05-27'
  text: |
    On 01 March 2022, per direction from the Secretary of Defense (SecDef) and Under
    Secretary of Defense for Intelligence and Security (USD(I&S)), the Influence and Perception
    Management Office (IPMO) was established. Among other things, the IPMO is tasked with
    the development of broad thematic messaging guidance and specific strategies for the
    execution of DoD activities designed to influence foreign defense-related decision-makers to
    behave in a manner beneficial to U.S. interests.
  source:
    path: government/notre-dame-ipmo-memo-20220527.pdf
    location: '¶1'
  significance: Holly's own attestation, as the office's Acting Director, of IPMO's establishment date (01 March 2022), its chartering authority (SecDef + USD(I&S)), and its influence/perception-management mandate over foreign defense decision-makers.
  context: Opening paragraph of a memorandum Holly authored and digitally signed (2022-05-27) addressed to the 2022 Notre Dame National Security Innovation Course students and faculty, framing the office on whose behalf he sets the course challenge.
- id: q2
  added_date: '2026-05-20'
  claim_group: "IPMO Establishment and Influence Mandate"
  observation_type: relayed
  statement_date: '2022-05-27'
  text: |
    My staff and I look forward to discussing these concepts and answering any questions
    students may have. Please note that IPMO personnel participating in any events associated
    with this course are expressing their personal thoughts, opinions, and observations, which do
    not necessarily represent the official positions of the DoD.
  source:
    path: government/notre-dame-ipmo-memo-20220527.pdf
    location: '¶4'
  significance: Holly's closing personal-views disclaimer — first-person ("My staff and I") confirmation that he leads IPMO staff, paired with the standard DoD non-attribution caveat distinguishing personnel's personal views from official DoD positions.
  context: Closing paragraph of the Holly-authored memo, immediately above the digital signature block "James A. Holly / Acting Director".
- id: q3
  added_date: '2026-05-20'
  claim_group: "State of the Influence Enterprise"
  observation_type: relayed
  statement_date: '2024-05'
  text: |
    I think the state of this enterprise is weak, quite frankly,
  source:
    path: news/defense-one-sof-week-oie-panel-20240524.html
    location: "¶ I think the state of this enterprise is weak"
  significance: The head of the year-old Influence and Perception Management Office assesses, on a public conference panel, that the U.S. influence/perception-management enterprise he leads is "weak" — a self-critical institutional appraisal from the office's own chief.
  context: Opening characterization of the panel's "unanimous verdict" on the U.S. influence enterprise vs. China and Russia, at the SOF Week conference in Tampa. The Defense One article attributes the line directly to "James Holly, who leads the defense secretary's year-old Influence and Perception Management Office".
- id: q4
  added_date: '2026-05-20'
  claim_group: "State of the Influence Enterprise"
  observation_type: relayed
  statement_date: '2024-05'
  text: |
    All of this [information operations activity] occurs at the two-star level and below in little stovepipes of excellence. [Military Information Support Operations] is in a pipeline. Public affairs is in another pipeline…and none of that rises above the two-star level for a single person in charge. Unity of command is a thing we talked about on the battlefield but in this supposedly No. 1 most important thing we're doing—at least our strategic documents, say that rhetorically—we're misaligned.
  source:
    path: news/defense-one-sof-week-oie-panel-20240524.html
    location: "¶ All of this [information operations activity] occurs at the two-star level"
  significance: Holly's prescription — U.S. influence/IO activity is fragmented at the two-star level and below with no single empowered leader; he argues for centralization, more funding, and a leader with authority recognized by DoD and the White House.
  context: Article frames the quote with "influence warfare needs centralization and a leader with the sufficient authority to be taken seriously, not just by the Department of Defense but also the White House." Editorial bracket insertions ([information operations activity], [Military Information Support Operations]) and the … ellipsis are preserved verbatim from the source.
credibility_notes: 'Holly is the first Acting Director of the Influence and Perception Management Office ([`/organizations/ipmo`]), an office within the Office of the Under Secretary of Defense for Intelligence and Security ([`/organizations/ousd-is`]). During the years of IPMO''s creation, three Secretaries of Defense, under two administrations, signed off on its establishment.


  Among other roles, Holly has previously served as Director of Special Programs for the U.S. Joint Special Operations Command, Intelligence Officer for a Combined Joint Task Force in Afghanistan, and Intelligence Chief for a paramilitary organization in Iraq. He is a certified Counterintelligence Officer/Agent, Interrogator, Immigration Officer, Fraud Detection and National Security Officer, Diplomatic Security Service graduate, Federal Law Enforcement Training Center graduate, SWAT Sergeant, Sniper, Paramilitary Officer, Signature Reduction Officer, and is a U.S. Army veteran. He holds a Master''s Degree from Penn State and is a Senior Executive Fellow at Harvard.

