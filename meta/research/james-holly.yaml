background: 'James A. Holly is the first Acting Director of the Influence and Perception Management Office ([`/organizations/ipmo`]) within the Office of the Secretary of Defense at the Pentagon. He leads a staff to oversee the development of strategy, policy, plans, and governance of influence, deception, perception management (reveal/conceal defense capabilities), and intel support to influence activities.


  Among other roles, Holly has previously served as Director of Special Programs for the U.S. Joint Special Operations Command, Intelligence Officer for a Combined Joint Task Force in Afghanistan, and Intelligence Chief for a paramilitary organization in Iraq. He is a certified Counterintelligence Officer/Agent, Interrogator, Immigration Officer, Fraud Detection and National Security Officer, Diplomatic Security Service graduate, Federal Law Enforcement Training Center graduate, SWAT Sergeant, Sniper, Paramilitary Officer, Signature Reduction Officer, Virginia Realtor, and is a U.S. Army veteran.


  Originally from Arizona, Holly currently lives in northern Virginia. He holds a Master''s Degree from Penn State, has been a lecturer at several colleges/universities, and is a Senior Executive Fellow at Harvard.

  '
top_relevance: 'Holly is the first Acting Director of the Influence and Perception Management Office ([`/organizations/ipmo`]), an office within the Office of the Under Secretary of Defense for Intelligence and Security ([`/organizations/ousd-is`]). Per direction from the Secretary of Defense and the Under Secretary of Defense for Intelligence and Security, the IPMO was established on 01 March 2022 and is tasked with the development of broad thematic messaging guidance and specific strategies for the execution of DoD activities designed to influence foreign defense-related decision-makers to behave in a manner beneficial to U.S. interests.


  Holly leads a staff to oversee the development of strategy, policy, plans, and governance of influence, deception, perception management, and intel support to influence activities. Among the IPMO Core Efforts is Perception Management — the development and execution of policy, oversight, and governance related to DoD perception management (reveal/conceal of defense capabilities) programs and activities — within OUSD(I&S).

  '
