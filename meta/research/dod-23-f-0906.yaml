  claim_group: 'processing-queue'
- id: q20
  added_date: '2026-09-26'
  text: 'If you have requested a fee waiver, please note that decisions to waive or reduce fees are made on a case-by-case basis, and we will make a determination concerning your fee waiver request at the conclusion of the search and assessment of responsive records, should they exist.'
  source:
    path: government/foia-23-f-0906-interim-response.pdf
    location: 'p. 1, ¶4'
  significance: 'Fee-waiver determination deferred to the conclusion of the search; no fee category assigned in this letter.'
  claim_group: 'fees'
- id: q21
  added_date: '2026-09-26'
  text: 'However, this office will only assess fees if we provide the final response to your FOIA request within the statutory time allotted by the FOIA or if the responsive records total more than 5,000 pages, even after a good faith effort on our part to limit the scope of your request.'
  source:
    path: government/foia-23-f-0906-interim-response.pdf
    location: 'p. 1, ¶4'
  significance: 'The two conditions under which this office will assess fees: a final response within the statutory time allotted by the FOIA, or responsive records totaling more than 5,000 pages.'
  claim_group: 'fees'
