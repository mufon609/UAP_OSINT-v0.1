    path: government/foia-23-f-0906-request-description.pdf
    location: 'p. 1, ¶2'
  significance: 'The scope of the request: records for contract HQ003422C0064 awarded to Sancorp Consulting, LLC, with the requester''s statement of the action date (June 10, 2022), the funding path (DoD through OUSD(I&S)), and the purpose (support services in the IPMO).'
