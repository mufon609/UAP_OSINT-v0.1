  added_date: '2026-09-26'
  text: 'Copies of records for a definitive contract (award ID: HQ003422C0064) awarded to Sancorp Consulting, LLC (UEI: GRYKNJ8BGFC8). This contract has an action date of June 10, 2022, and is funded by the Department of Defense through the Office of the Under Secretary of Defense For Intelligence and Security for support services in the Influence and Perception Management Office (IPMO). This request includes, but is not limited to:'
