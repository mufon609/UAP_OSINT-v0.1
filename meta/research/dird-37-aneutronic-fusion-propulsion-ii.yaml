- id: q4
  added_date: '2026-06-19'
  text: >-
    Such "aneutronic" fusion fuels, such as hydrogen fusing with Boron-11, have been studied
    extensively for space propulsion applications since the 1980s.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Summary'
  significance: >-
    States the document's central premise — aneutronic fuels (notably p-B11) avoid the fast-neutron
    shielding and tritium-breeding burdens of D-T fusion and have a long (since-1980s) space-propulsion
    research lineage.
  context: >-
    Opening Summary paragraph framing why aneutronic fusion is attractive for propulsion.
  claim_group: thesis-aneutronic-advantage
- id: q5
  added_date: '2026-06-19'
  text: >-
    This report reviews the basic fusion plasma physics, design concepts that
    apply aneutronic fusion for propulsion, and the requirements for transitioning
    to space. The predominant concepts studied include magnetic field reversed
    configuration, dense plasma focus and inertial electrostatic confinement.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Summary'
  significance: >-
    The report's scope statement, naming the three predominant aneutronic confinement concepts it
    assesses — field-reversed configuration (FRC), dense plasma focus (DPF), and inertial electrostatic
    confinement (IEC).
  context: >-
    Second Summary paragraph stating scope and the concepts reviewed.
  claim_group: thesis-scope
- id: q6
  added_date: '2026-06-19'
  text: >-
    The future technology development of aneutronic fusion propulsion will
    initially be motivated by the very large GEO satellites that will be developed in
    the next 20 years for commercial and military broadband communication.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Summary'
  significance: >-
    Identifies the near-term driver for the technology — large GEO broadband communication satellites
    (commercial and military) — tying a speculative propulsion concept to a concrete projected need.
  context: >-
    Closing Summary paragraph on the technology's motivating application.
  claim_group: applications-driver
- id: q7
  added_date: '2026-06-19'
  text: >-
    When Lyman Spitzer invented the Stellarator in 1951, it was expected to take
    only 5 years of concentrated plasma physics experiments to harness the fusion of
    hydrogen ions confined by magnetic fields.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 1: Concept Overview'
  significance: >-
    Historical framing crediting Lyman Spitzer with the 1951 invention of the Stellarator and the
    original (over-optimistic) 5-year timeline for controlled fusion.
  context: >-
    Opening of Chapter 1, recounting the 60-year history of controlled-fusion aspiration.
  claim_group: history-fusion-development
- id: q8
  added_date: '2026-06-19'
  text: >-
    In 1983, a rediscovery was made by Robert Bussard of a fusion device invented by
    Robert Hirsch in his 1966 Ph.D. thesis. The Fusor, as Hirsch named it with his thesis
    advisor and famous inventor Philo Farnsworth, simply used spherically concentric
    electrodes in a vacuum chamber.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 1: Concept Overview'
  significance: >-
    Traces the IEC lineage — Robert Hirsch's 1966 Ph.D.-thesis Fusor (named with advisor Philo
    Farnsworth), rediscovered by Robert Bussard in 1983 — the device family underpinning the report's
    aneutronic propulsion concepts.
  context: >-
    Chapter 1 historical narrative on the origin of inertial electrostatic confinement.
  claim_group: history-fusor-iec-lineage
- id: q9
  added_date: '2026-06-19'
  text: >-
    This resurgence of alternate confinement concepts was immediately applied to fusion space
    propulsion since it was recognized that there would be an advantage over nuclear
    fission propulsion with its costly safety requirements. For mitigating shielding mass and
    tritium fuel launch-safety concerns, non-neutron-generating "aneutronic" fusion fuels
    were also adopted.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 1: Concept Overview'
  significance: >-
    Articulates the rationale for aneutronic fusion propulsion over fission — avoiding shielding mass and
    tritium launch-safety burdens — the core argument motivating the whole report.
  context: >-
    Chapter 1 paragraph on why alternate-confinement aneutronic concepts were applied to space propulsion.
  claim_group: thesis-aneutronic-advantage
- id: q10
  added_date: '2026-06-19'
  text: >-
    Despite the attention propulsion has gotten from the scientific community, the problem
    has been insufficiently addressed by the space science community.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 1: Concept Overview'
  significance: >-
    The report's gap claim — fusion propulsion is studied by physicists but under-addressed by the space
    science community, motivating the report's call to introduce launch / assembly / operations concerns
    early in design.
  context: >-
    Chapter 1 closing argument on the need for space-application focus.
  claim_group: thesis-gap
- id: q11
  added_date: '2026-06-19'
  text: >-
    This concept is being pursued in the United States by the Office of Fusion Energy
    Sciences of the Department of Energy. Currently there are two classes: High-gain magneto-inertial fusion (MIF) and low-to-intermediate-gain magneto-inertial fusion.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 2, section "MAGNETO-INERTIAL CONFINEMENT"'
  significance: >-
    Attributes the U.S. magneto-inertial fusion (MIF) program to the DOE Office of Fusion Energy
    Sciences and distinguishes its two gain classes — load-bearing for the program-mapping dimension.
  context: >-
    Chapter 2 finding on magneto-inertial confinement, naming the sponsoring DOE office.
  claim_group: section-finding-magneto-inertial
- id: q12
  added_date: '2026-06-19'
  text: >-
    Such is the case for the Magnetized Target Fusion experiment being performed at LANL
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 2, section "MAGNETO-INERTIAL CONFINEMENT" (Low-to-Intermediate MIF)'
  significance: >-
    Names the Magnetized Target Fusion experiment at Los Alamos National Laboratory (LANL) as the
    low-to-intermediate-gain MIF exemplar — a concrete program / facility reference.
  context: >-
    Chapter 2 subsection on low-to-intermediate-gain MIF, referencing Figure 6.
  claim_group: section-finding-magneto-inertial
- id: q13
  added_date: '2026-06-19'
  text: >-
    Controlled nuclear fusion reactors have been seriously studied since the late 1960s after tokomaks demonstrated a very promising improvement in temperature and confinement time that had potential to become power-producing reactors.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "FUSION REACTORS FOR PROPULSION"'
  significance: >-
    Opens the fusion-propulsion history (note the recurring "tokomak" spelling), dating serious
    controlled-fusion-reactor study to the late 1960s.
  context: >-
    Chapter 3 lead paragraph framing the propulsion-reactor research history.
  claim_group: section-finding-fusion-propulsion
- id: q14
  added_date: '2026-06-19'
  text: >-
    Only (D,3He) (deuterium helium-3) and (p,11B) (hydrogen boron) fuels have been considered because of the higher specific powers achievable for air and space flight.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "FUSION REACTORS FOR PROPULSION"'
  significance: >-
    The key fuel-selection finding — only D-He3 and p-B11 are considered for propulsion, because of the
    higher specific powers and to avoid the 14-MeV-neutron shielding and tritium-breeding burdens of DT.
  context: >-
    Chapter 3 paragraph explaining why propulsion studies abandoned DT fuels.
  claim_group: section-finding-fusion-propulsion
- id: q15
  added_date: '2026-06-19'
  text: >-
    (U) The seminal study on fusion propulsion that developed specific design parameters was performed in 1993.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "Field-Reversed Configuration Reactors"'
  significance: >-
    Designates the 1993 study (endnote 10, Santarius and Logan) as the seminal fusion-propulsion design
    study — the (U) marking attests this sentence is portion-marked Unclassified.
  context: >-
    Chapter 3, opening the Field-Reversed Configuration Reactors subsection (cites endnote 10).
  claim_group: section-finding-frc-reactors
- id: q16
  added_date: '2026-06-19'
  text: >-
    Optimization of this conceptual design using the FRC plasma confinement using colliding beams has led to a much more compact configuration of 33 Mg producing 100 MW (shown in Figure 9).
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "Field-Reversed Configuration Reactors"'
  significance: >-
    Reports the colliding-beam FRC optimization result — a 33-metric-ton, 100-MW reactor (endnote 11,
    Wessel/Binderbauer/Rostoker et al.) — a quantitative design milestone the report builds on.
  context: >-
    Chapter 3 FRC reactor subsection (cites endnote 11; Figure 9).
  claim_group: section-finding-frc-reactors
- id: q17
  added_date: '2026-06-19'
  text: >-
    A parametric analysis by Knecht12 has shown that a system of 16 to 24 Mg can produce 400-900 MW of power with thrusts of 500-1000 kN at Isp of 1,500-2,000 seconds.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "Dense Plasma Focus Reactors"'
  significance: >-
    The DPF reactor performance finding (Knecht, endnote 12) — a 16-24 Mg p-B11 system producing
    400-900 MW and 500-1000 kN thrust — central to the report's claim that DPF is the lightest concept.
  context: >-
    Chapter 3 Dense Plasma Focus Reactors subsection (cites endnote 12; the marker "Knecht12" is the
    inline endnote-12 reference).
  claim_group: section-finding-dpf-reactors
- id: q18
  added_date: '2026-06-19'
  text: >-
    The DPF reactor is the lightest concept at 16 Mg (16 metric tons) and could
    produce 800 MW of power with thrust levels of 1000 kN for space propulsion through
    ejection of high-energy ions.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "AIR PROPULSION"'
  significance: >-
    States the headline comparative result — DPF is the lightest reactor concept (16 Mg, 800 MW,
    1000 kN) — while the same paragraph shows it is still far too heavy for ground-to-hypersonic aircraft lift.
  context: >-
    Chapter 3 Air Propulsion section, contrasting space-propulsion adequacy against aircraft-lift shortfall.
  claim_group: section-finding-air-propulsion
- id: q19
  added_date: '2026-06-19'
  text: >-
    The European Space Agency (ESA) has tested this design using argon
    gas and found that the double layer is stable enough to reliably accelerate ions. ESA is
    currently pursuing this technology for possible use in future missions.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "PLASMA THRUSTER" (Helicon Double Layer)'
  significance: >-
    Attributes helicon-double-layer thruster testing (argon gas) to the European Space Agency — an active
    international program reference.
  context: >-
    Chapter 3 Helicon Double Layer subsection.
  claim_group: section-finding-plasma-thruster
- id: q20
  added_date: '2026-06-19'
  text: >-
    AdAstra is currently testing the VX-200 engine (a
    200-kW engine).
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "PLASMA THRUSTER" (VASIMR Thruster)'
  significance: >-
    Names AdAstra (Ad Astra Rocket Company) as the developer testing the 200-kW VX-200 VASIMR engine
    — a privately funded program reference, with NASA's planned ISS test in the same passage.
  context: >-
    Chapter 3 VASIMR Thruster subsection.
  claim_group: section-finding-plasma-thruster
- id: q21
  added_date: '2026-06-19'
  text: >-
    NASA intends
    to test this engine on the International Space Station using a large battery to power it
    during the tests.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 3, section "PLASMA THRUSTER" (VASIMR Thruster)'
  significance: >-
    Reports NASA's stated intent to test the VX-200 VASIMR engine aboard the International Space Station
    — links the propulsion concept to a concrete planned NASA/ISS demonstration.
  context: >-
    Chapter 3 VASIMR Thruster subsection, immediately following the AdAstra / VX-200 description.
  claim_group: section-finding-plasma-thruster
- id: q22
  added_date: '2026-06-19'
  text: >-
    High-power Hall Current Thrusters
    (HCT) that electrostatically accelerate Xe ions have been developed by NASA with
    discharge power levels ranging from 6.4 kilowatts to 72.5 kilowatts.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 4, section "EARTH ORBIT"'
  significance: >-
    Attributes high-power Hall Current Thruster development (Xe ions, 6.4-72.5 kW) to NASA — the
    baseline technology aneutronic-fusion-enhanced ion thrusters would supersede.
  context: >-
    Chapter 4 Earth Orbit section (cites endnote 16, DeGrys et al.).
  claim_group: section-finding-earth-orbit
- id: q23
  added_date: '2026-06-19'
  text: >-
    More recently, AeroJet together with Lockheed Martin Space Systems
    Company have qualified a 4.5-kW Hall Thruster Propulsion System (HTPS) that
    demonstrated 244 mN of thrust with a specific impulse of 1,981 seconds incorporating
    a 400-volt acceleration potential. These thrusters were flown in 2010 on military
    communication and surveillance satellites.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 4, section "EARTH ORBIT"'
  significance: >-
    Names AeroJet and Lockheed Martin Space Systems Company as qualifiers of the 4.5-kW HTPS Hall
    thruster flown in 2010 on military communication and surveillance satellites — a contractor / fielded-system reference.
  context: >-
    Chapter 4 Earth Orbit section, on the current state of qualified Hall thrusters.
  claim_group: section-finding-earth-orbit
- id: q24
  added_date: '2026-06-19'
  text: >-
    However, in 1960 Robert Bussard
    proposed the use of magnetic fields to scoop interstellar hydrogen to fuel a fusion
    rocket to propel a spacecraft now know as the Bussard Ram Jet (shown in Figure 16).
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 4, section "INTERSTELLAR"'
  significance: >-
    Credits Robert Bussard's 1960 interstellar-ramjet proposal (endnote 20) — the namesake "Bussard Ram
    Jet" concept — while the report judges the scoop and power requirements make it unlikely to be realized.
  context: >-
    Chapter 4 Interstellar section (cites endnote 20). Note "now know as" sic in source.
  claim_group: section-finding-interstellar
- id: q25
  added_date: '2026-06-19'
  text: >-
    The current U.S. Department of Energy fusion program is administered by the Office of
    Fusion Energy Sciences (http://www.science.doe.gov/ofes/). The FY2010 budget was
    $421 million, with over half devoted to tokomak plasma physics and experimental
    facilities at Princeton Plasma Physics Lab, MIT, and General Atomics.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "U.S. DOE PROGRAMS"'
  significance: >-
    The DOE program-mapping finding — the $421M FY2010 fusion budget under the Office of Fusion Energy
    Sciences, concentrated at Princeton Plasma Physics Lab, MIT, and General Atomics. Names multiple institutions.
  context: >-
    Chapter 5 U.S. DOE Programs section, opening the recent-developments survey.
  claim_group: section-finding-doe-programs
- id: q26
  added_date: '2026-06-19'
  text: >-
    The Advanced
    Concepts and High-Energy-Density Laboratory Plasma Physics (HEDLPP) programs,
    which support plasma confinement theory and experiments for innovative fusion reactor
    concepts and fusion propulsion, are funded at ~$20 million.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "U.S. DOE PROGRAMS"'
  significance: >-
    Names the DOE Advanced Concepts and High-Energy-Density Laboratory Plasma Physics (HEDLPP)
    program (~$20M) as the funding line supporting innovative-concept and fusion-propulsion research.
  context: >-
    Chapter 5 U.S. DOE Programs section, identifying the relevant funding line.
  claim_group: section-finding-doe-programs
- id: q27
  added_date: '2026-06-19'
  text: >-
    Technology development funding is directed toward tokomak-related reactors with $135
    million contributed to ITER. The National Ignition Test Facility is funded by DOE's
    National Nuclear Security Administration and is dedicated for nuclear weapons
    simulation. The NNSA-funded research also includes Magneto Target Fusion
    experiments at Sandia and Lawrence Berkeley National Labs.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "U.S. DOE PROGRAMS"'
  significance: >-
    Maps the remaining DOE technology funding — $135M to ITER, the NIF funded by NNSA for nuclear-weapons simulation, and NNSA Magneto Target Fusion at Sandia and Lawrence Berkeley National Labs. Dense with institution references.
  context: >-
    Chapter 5 U.S. DOE Programs section, closing the program-funding breakdown.
  claim_group: section-finding-doe-programs
- id: q28
  added_date: '2026-06-19'
  text: >-
    The International Thermonuclear Experimental Reactor (ITER) is a joint undertaking of
    the European Union, China, India, Japan, Korea, Russia, and the United States.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "INTERNATIONAL PROGRAMS"'
  significance: >-
    Identifies ITER and its seven-party membership (EU, China, India, Japan, Korea, Russia, United States)
    — the principal international fusion undertaking the report tracks.
  context: >-
    Chapter 5 International Programs section, opening the ITER discussion.
  claim_group: section-finding-international-programs
- id: q29
  added_date: '2026-06-19'
  text: >-
    It has since been downscaled in
    operating requirements due to the cost and problems associated with tritium fuel and
    containment with a 2025 operating date and cost of $25B.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "INTERNATIONAL PROGRAMS"'
  significance: >-
    Reports ITER's schedule slip and cost growth — downscaled to a 2025 operating date at $25B because of
    tritium-fuel and containment problems — evidence in the report's argument against DT-tokamak power.
  context: >-
    Chapter 5 International Programs section, on ITER's revised schedule and budget.
  claim_group: section-finding-international-programs
- id: q30
  added_date: '2026-06-19'
  text: >-
    The issues of tokomaks as a potential source of fusion power are dramatized by the
    recent graphic (Figure 18) published in the American Nuclear Society's Fusion Energy
    Division Newsletter (Dec 2007) depicting the GE Next-Generation Boiling-Water Reactor
    (Economic Simplified BWR).
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "INTERNATIONAL PROGRAMS"'
  significance: >-
    Cites the American Nuclear Society Fusion Energy Division Newsletter (Dec 2007) and the GE ESBWR
    comparison to argue a tokamak power plant could not compete economically with fission.
  context: >-
    Chapter 5 International Programs section, introducing the tokamak-vs-BWR cost comparison (Figure 18).
  claim_group: section-finding-international-programs
- id: q31
  added_date: '2026-06-19'
  text: >-
    From 1995 until 2002, NASA had funded advanced space propulsion studies through
    Marshall Space Flight Center. These studies included the application of fusion and
    matter-antimatter propulsion for space exploration missions.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "NASA PROGRAMS"'
  significance: >-
    Records NASA's 1995-2002 advanced-propulsion funding through Marshall Space Flight Center (including
    fusion and matter-antimatter propulsion) — a historical NASA program reference.
  context: >-
    Chapter 5 NASA Programs section, opening the NASA-history paragraph.
  claim_group: section-finding-nasa-programs
- id: q32
  added_date: '2026-06-19'
  text: >-
    Recently, NASA has
    initiated a 5-year high-power electric propulsion demonstration program to develop the
    technologies for manned missions to Mars in a 20-plus-year timeframe.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "NASA PROGRAMS"'
  significance: >-
    Reports NASA's then-new 5-year high-power electric propulsion demonstration program targeting manned
    Mars missions — a program the report flags as a possible vehicle for p-B11 fusion-assisted propulsion.
  context: >-
    Chapter 5 NASA Programs section, on the current NASA program.
  claim_group: section-finding-nasa-programs
- id: q33
  added_date: '2026-06-19'
  text: >-
    Both Lawrenceville
    Plasma Physics (which uses DPF, dense plasma focus,  confinement) and TriAlpha
    (which uses beam-heated FRC, field reversed configuration) have been shown
    conceptually to have low-mass aneutronic fusion propulsion systems that could use
    direct conversion for power and plasma ion for propulsion.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 5, section "PRIVATELY FUNDED PROGRAMS"'
  significance: >-
    Singles out Lawrenceville Plasma Physics (DPF) and TriAlpha (beam-heated FRC) among the privately
    funded startups as the two with conceptually demonstrated low-mass aneutronic propulsion potential.
  context: >-
    Chapter 5 Privately Funded Programs section, highlighting two of the Table 4 companies.
  claim_group: section-finding-private-programs
- id: q34
  added_date: '2026-06-19'
  text: >-
    This
    transition, however, may depend upon the success of the developments of privately
    funded ventures attempting to develop terrestrial power.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 7: Conclusions'
  significance: >-
    Key conclusion — the transition of aneutronic fusion propulsion to space may hinge on privately funded
    terrestrial-power ventures, since military / space applications have a lower ROI threshold than terrestrial power.
  context: >-
    Chapter 7 Conclusions, on the dependence on private-sector progress.
  claim_group: conclusions
- id: q35
  added_date: '2026-06-19'
  text: >-
    Pulsed-powered DPF or IEC aneutronic fusion thrusters may have near-term
    applications to replace current satellite ion thrusters. This could be extended to the very
    high-power domain of beam-assisted FRC for manned interplanetary flight.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 7: Conclusions'
  significance: >-
    The headline conclusion on application sequencing — near-term DPF/IEC thrusters replacing satellite ion
    thrusters, extending to beam-assisted FRC for manned interplanetary flight.
  context: >-
    Chapter 7 Conclusions, summarizing the near-to-far application path.
  claim_group: conclusions
- id: q36
  added_date: '2026-06-19'
  text: >-
    Aneutronic fusion propulsion will not be
    practical beyond the solar system unless breakthrough propulsion physics is developed
    that can assist the flight to the next stellar system where fusion thrusters can then be
    used.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 7: Conclusions'
  significance: >-
    The report's interstellar limit — aneutronic fusion alone cannot reach beyond the solar system absent
    "breakthrough propulsion physics," echoing the Summary's bullet caveat.
  context: >-
    Chapter 7 Conclusions, on the interstellar boundary of the technology.
  claim_group: conclusions
- id: q37
  added_date: '2026-06-19'
  text: >-
    The future
    needs to be focused more on science and engineering and less on science fiction.
  source:
    path: government/dird-37-aneutronic-fusion-propulsion-ii-2010.pdf
    location: 'Chapter 7: Conclusions'
  significance: >-
    The closing exhortation — physicists who pioneered the technology must now work with space-systems
    companies, refocusing "less on science fiction" — the report's rhetorical capstone.
  context: >-
    Final sentence of Chapter 7 Conclusions.
  claim_group: conclusions
