  display_title: 'DIA Congressional Relations Division letter U-18-0001/OCC1 to SASC — list of all AATIP products produced under the contract (List of Attachments), 9 January 2018'
  primary_source_url: https://irp.fas.org/dia/aatip-list.pdf
  quote_attribution: 'DIA Congressional Relations Division letter U-18-0001/OCC1 to the Committee on Armed Services, United States Senate, 9 January 2018'
description: 'The Defense Intelligence Agency ([`/organizations/dia`]) Congressional Relations Division letter U-18-0001/OCC1, dated JAN 09 2018, over the signature of Christine Kapnisi ([`/people/christine-kapnisi`]), Chief, to The Honorable John McCain ([`/people/john-mccain`]), Chairman, and The Honorable Jack Reed ([`/people/jack-reed`]), Ranking Member, of the Committee on Armed Services, United States Senate. Based on interest from the Committee''s staff regarding DIA''s role in the Advanced Aerospace Threat and Identification Program (AATIP), the letter states: "please find attached a list of all products produced under the AATIP contract for DIA to publish." The purpose of AATIP was to investigate foreign advanced aerospace weapon threats from the present out to the next 40 years.


  There are 38 reports associated with DIA''s involvement in the program documented in the list. All are UNCLASSIFIED//FOR OFFICIAL USE ONLY except for attachment 37, which is a SECRET//NOFORN version of attachment 38, titled "State of the Art and Evolution of High Energy Laser Weapons." All are available for Congressional staff access on the Capitol Network (CapNet) except for attachments 12 and 15, respectively titled "Field Effects on Biological Tissues" and "An Introduction to the Statistical Drake Equation." The Enclosure "(U) List of Attachments" documented, under each attachment number, the product and the Dr. who produced it — among them Dr. George Miley ([`/people/george-miley`]), Univ. of Illinois (attachment 1, "Inertial Electrostatic Confinement Fusion" [`/documents/dird-09-iec-fusion`]); Dr. F. Winterberg ([`/people/f-winterberg`]), Univ. of Nevada – Reno (attachment 2, "Advanced Nuclear Propulsion for Manned Deep Space Missions" [`/documents/dird-11-advanced-nuclear-propulsion`], and attachment 36, "Negative Mass Propulsion" [`/documents/dird-29-negative-mass-propulsion`]); Dr. James Wells ([`/people/james-wells`]), JW Enterprises (attachment 3, "Pulsed High-Power Microwave Technology" [`/documents/dird-03-pulsed-hpm`]); Dr. P. Czysz ([`/people/paul-czysz`]), HyperTech (attachment 4, "Space Access" [`/documents/dird-06-space-access`]); Dr. Hal Puthoff ([`/people/hal-puthoff`]), EarthTech International ([`/organizations/earthtech-international`]) (attachment 5, "Advanced Space Propulsion Based on Vacuum (Spacetime Metric) Engineering" [`/documents/dird-15-advanced-space-propulsion`]); Dr. Bruce Towe ([`/people/bruce-towe`]), Univ. of Arizona (attachment 6, "BioSensors and BioMEMS" [`/documents/dird-20-biosensors-biomems`]); Dr. Ulf Leonhardt ([`/people/ulf-leonhardt`]), Univ. of St. Andrews (attachment 7, "Invisibility Cloaking" [`/documents/dird-07-invisibility-cloaking`]); Dr. Eric Davis ([`/people/eric-davis`]), EarthTech International (attachment 8, "Traversable Wormholes, Stargates, and Negative Energy" [`/documents/dird-18-traversable-wormholes`]); Dr. Robert Baker ([`/people/robert-baker`]), GravWave ([`/organizations/gravwave`]) (attachment 9, "High-Frequency Gravitational Wave Communications" [`/documents/dird-21-hfgw-communications`]); Dr. George Hathaway ([`/people/george-hathaway`]), Hathaway Consulting (attachment 10, "Role of Superconductors in Gravity Research" [`/documents/dird-14-superconductors-gravity`]); Dr. Eric Davis ([`/people/eric-davis`]), EarthTech International (attachment 11, "Antigravity for Aerospace Applications" [`/documents/dird-19-antigravity-aerospace`]); Dr. Gerald Smith ([`/people/gerald-smith`]), Positronics Research (attachment 13, "Positron Aerospace Propulsion" [`/documents/dird-08-positron-aerospace-propulsion`]); Dr. Eric Davis ([`/people/eric-davis`]), EarthTech International (attachment 14, "Concepts for Extracting Energy from the Quantum Vacuum" [`/documents/dird-24-quantum-vacuum-energy-extraction`]); Dr. Claudio Maccone ([`/people/claudio-maccone`]), International Academy of Astronautics ([`/organizations/international-academy-of-astronautics`]) (attachment 15, "An Introduction to the Statistical Drake Equation" [`/documents/dird-25-statistical-drake-equation`]); Dr. George Hathaway ([`/people/george-hathaway`]), Hathaway Consulting (attachment 16, "Maverick Inventor Versus Corporate Inventor" [`/documents/dird-17-maverick-inventor`]); Dr. Bruce Towe ([`/people/bruce-towe`]), Univ. of Arizona (attachment 17, "Biomaterials" [`/documents/dird-04-biomaterials`]); Dr. G. Shvets ([`/people/g-shvets`]), Univ. of Texas – Austin (attachment 18, "Metamaterials for Aerospace Applications" [`/documents/dird-22-metamaterials-aerospace`]); Dr. R. Obousy ([`/people/r-obousy`]), Obousy Consultants ([`/organizations/obousy-consultants`]) (attachment 19, "Warp Drive, Dark Energy, and the Manipulation of Extra Dimensions" [`/documents/dird-13-warp-drive-extra-dimensions`]); Dr. Kit Green ([`/people/kit-green`]), Wayne State Univ. (attachment 12, "Field Effects on Biological Tissues" [`/documents/dird-26-field-effects-biological-tissues`]); Dr. R. Genik ([`/people/richard-genik`]), Wayne State Univ. (attachment 20, "Technological Approaches to Controlling External Devices in the Absence of Limb-Operated Interfaces" [`/documents/dird-12-bci-controlling-external-devices`]); Dr. J. Williams ([`/people/j-williams`]), Ohio State Univ. (attachment 21, "Materials for Advanced Aerospace Platforms" [`/documents/dird-05-aerospace-platforms-materials`]); Dr. T. Hufnagel ([`/people/t-hufnagel`]), John Hopkins Univ. (attachment 22, "Metallic Glasses" [`/documents/dird-01-metallic-glasses`]); Dr. W. McCarthy ([`/people/w-mccarthy`]), Programmable Matter Corporation (attachment 23, "Aerospace Applications of Programmable Matter" [`/documents/dird-02-programmable-matter`]); Dr. M. Tsoi ([`/people/maxim-tsoi`]), Univ. of Texas - Austin (attachment 24, "Metallic Spintronics" [`/documents/dird-10-metallic-spintronics`]); Dr. J. Cramer ([`/people/john-cramer`]), Univ. of Washington (attachment 25, "Space-Communication Implications of Quantum Entanglement and Nonlocality" [`/documents/dird-16-quantum-entanglement-nonlocality`]); Lockheed Martin ([`/organizations/lockheed-martin`]) (attachment 26, "Aneutronic Fusion Propulsion I" [`/documents/dird-30-aneutronic-fusion-propulsion`], and attachments 32 and 35); and J. Albertine ([`/people/j-albertine`]), Directed Technologies ([`/organizations/directed-technologies`]) (attachment 38, "State of the Art and Evolution of High Energy Laser Weapons" [`/documents/dird-23-high-energy-laser-weapons`]).


  The list and letter are an Enclosure to a later FOIA response that DIA produced to Steven Aftergood of the Federation of American Scientists; that FOIA response is dated JAN 1 6 2019, while the letter is dated JAN 09 2018 (U-18-0001/OCC1).

  '
