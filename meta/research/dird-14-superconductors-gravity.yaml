description: 'The Role of Superconductors in Gravity Research is a historical survey of the role superconductors have played in the recent search for laboratory-scale manipulation of gravity. It is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency ([`/organizations/dia`]), Advanced Aerospace Weapon System Applications (AAWSA) Program ([`/organizations/aawsap`]); the program''s list of these reports ([`/documents/dia-aatip-products-list-2018`]) gives the author ([`/people/george-hathaway`], [`/organizations/hathaway-consulting`]), the document itself with no author given. References 9, 35, and 43 are works whose authorship is that of the same author. The reference date and the redacted author are given in the Document Summary above.

  The Introduction is a survey of how the invention of superconductors, and in particular the recent development of high-temperature ceramic superconductors, provided the impetus for pursuing a connection between gravity, electromagnetism, and magnetism and matter in the solid state. The discovery of yttrium-barium-copper oxide (YBCO) ceramics able to superconduct at liquid nitrogen temperatures allowed laboratories to fabricate these superconductors in experimentally useful sizes; for the theoretician the possibility of considering the superconductor being a macroscopic quantum object a reality rather than a fantasy suggested avenues for developing theories connecting gravity and gravity-like forces to engineerable matter, and for the experimentalist extrapolations from these theories suggested there might be gravitational disturbances in the laboratory amenable to measurement.

  In the Gravity Waves section a distinction is made between gravitational waves, the gravitational force, and anomalous forces, with gravitational wave work divided into low frequency and high frequency realms. Several researchers consider that high-frequency gravitational waves (HFGW) will be produced in the laboratory under certain conditions in the near future, with a considerably more ambitious view of the future than the low-frequency researchers, including the use of HFGW for communications, telescopy, microscopy, and possibly propulsion, possibly mediated or assisted by superconductors; current research on the link between HFGW and the manipulation of gravity for propulsion is at present only theoretical.

  The Gravitoelectromagnetism section is a review of novel explanations of gravitational attraction, including Puthoff''s ([`/people/hal-puthoff`]) development of an idea originally put forward by Sakharov ([`/people/andrei-sakharov`]) that posits gravity as a Casimir-like attraction arising within the universal sea of fluctuating electromagnetic interactions, the zero-point fluctuations. The attraction of modifying gravity for propulsive purposes lies in two categories of effect — modifying or negating the gravitational attraction of a nearby body, and providing propulsive force based on the same underlying phenomenon — and Braginski ([`/people/vladimir-braginski`]) et al. showed that ordinary matter cannot be used to generate measurable gravitational fields in the laboratory. It is possible to reformulate the tensor format of general relativity into a vector format valid in the weak field approximation, with the gravitomagnetic field and the gravitoelectric field as analogs of the magnetic and electrostatic fields of electromagnetic theory.

  The Historical Timeline is the bulk of the document, following the modern search for a link between electromagnetism, matter, and gravity. Podkletnov ([`/people/evgeny-podkletnov`]) and Nieminen ([`/people/risto-nieminen`]) published what is considered the first possible evidence for an experimental link between high-temperature liquid nitrogen (LN2) superconductor effects and gravity, allegedly in the form of a gravity shield, but many scientists have cast considerable doubt on their findings; the experiment has remained controversial, and most damning to Podkletnov''s case was the complete lack of any supporting evidence that the experiment had ever actually taken place. The theoretical work of Li ([`/people/ning-li`]) and Torr ([`/people/douglas-torr`]), which expanded on earlier work by DeWitt ([`/people/bryce-dewitt`]) and Ross ([`/people/dennis-k-ross`]), later saw the critique by Harris ([`/people/edward-harris`]), who argued that the correct estimation of the induced gravitoelectric field outside a superconductor is some 20 orders of magnitude smaller, with no rebuttal forthcoming from Li or Torr. The author''s own version of the Podkletnov spinning disk experiment, completed in late 2001 and published in 2003, showed a null result and represented the closest published replication of the original. Tajmar ([`/people/martin-tajmar`]) and De Matos ([`/people/clovis-de-matos`]) claimed to have found the expected large gravitomagnetic field matched to within a factor of 1.5 of their theoretical results, set against the concerns Eric Davis ([`/people/eric-davis`]) raised that the basis for calculating the Cooper pair mass is so fraught with uncertainties as to leave Tajmar''s mass anomaly unfounded; by 2007 Tajmar recognized that new data did not match their prior predictions while an unexplained residual signal persisted with a relatively large coupling constant between the observed acceleration effect and the applied angular velocity. As of the writing there had been no further pronouncements from Podkletnov, no published replication of his gravity beam experiment, and more and more scientists were coming to the conclusion that the experiment was never actually performed.

  The Conclusion: although the payoff of the discovery of a superconductor-mediated interaction between matter and gravity would be tremendous, only a few researchers are pursuing this goal, the main reason being the adherence to dogma concerning the impossibility of increasing the matter/electromagnetic coupling coefficients, reinforced by reputable physicists pointing out that the theoretical constructs presented so far are based on questionable foundations, and that the likelihood of scientific ridicule is extremely high in the search for laboratory-scale gravitational interactions.'
quotes:
  - id: q1
    added_date: '2026-06-03'
    text: This paper is a historical survey of the role superconductors have played in the recent search for laboratory-scale
      manipulation of gravity.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Introduction, opening sentence
    significance: Self-statement of the document's purpose and form — a historical survey of superconductors in laboratory-scale
      gravity-manipulation research, not an original experimental report.
    statement_date: '2010-03-23'
    claim_group: thesis_framing
  - id: q2
    added_date: '2026-06-03'
    text: For the theoretician, the possibility of considering the superconductor being a macroscopic quantum object as a reality
      rather than a fantasy suggested several avenues for developing theories connecting gravity and gravity-like forces to
      engineerable matter.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Introduction, theoretician/experimentalist paragraph
    significance: The conceptual premise the survey rests on — treating the superconductor as a macroscopic quantum object
      opens theoretical avenues connecting gravity-like forces to engineerable matter.
    statement_date: '2010-03-23'
    claim_group: thesis_framing
  - id: q3a
    added_date: '2026-06-03'
    text: Several researchers consider that high-frequency gravitational waves (HFGW) will be produced in the laboratory under
      certain conditions in the near future (Reference 1).
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Gravity Waves section, HFGW paragraph
    significance: Frames the high-frequency-gravitational-wave research program — distinct from the low-frequency (LIGO/LISA-class)
      detection effort — as the ambitious near-future laboratory branch.
    statement_date: '2010-03-23'
    claim_group: gravity_waves
  - id: q3b
    added_date: '2026-06-03'
    text: Current research on the link between HFGW and the manipulation of gravity for propulsion is at present only theoretical.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Gravity Waves section, HFGW paragraph (closing)
    significance: The document's own hedge on the HFGW-propulsion link — present research is only theoretical, not experimentally
      demonstrated.
    statement_date: '2010-03-23'
    claim_group: gravity_waves
  - id: q4
    added_date: '2026-06-03'
    text: 'The "attraction" of modifying gravity—whether your own, your spacecraft''s, or that of a nearby large mass—for propulsive
      purposes lies in two general categories of effect:'
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Gravitoelectromagnetism section, two-categories paragraph (lead-in to bullet list)
    significance: States the propulsion motivation of the survey — the two categories of gravity-modification effect (negating
      a nearby body's attraction; providing propulsive force) the paper organizes the field around.
    statement_date: '2010-03-23'
    claim_group: gravitoelectromagnetism
  - id: q5
    added_date: '2026-06-03'
    text: Braginski et al. (Reference 8) showed that ordinary matter cannot be used to generate measurable gravitational fields
      in the laboratory.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Gravitoelectromagnetism section, Braginski paragraph
    significance: The standard physics constraint the whole field works against — ordinary matter cannot generate measurable
      laboratory gravitational fields, which is why the search turns to the special form of matter constituting superconductors.
    statement_date: '2010-03-23'
    claim_group: gravitoelectromagnetism
  - id: q6
    added_date: '2026-06-03'
    text: Podkletnov and Nieminen (Reference 15) published what is considered the first possible evidence for an experimental
      link between high-temperature liquid nitrogen (LN2) superconductor effects and gravity, allegedly in the form of a gravity
      shield. Many scientists since then have cast considerable doubt on their findings.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, opening Podkletnov-Nieminen paragraph
    significance: Identifies the Podkletnov-Nieminen 1992 gravity-shield claim as the origin point of the modern experimental
      search — and immediately flags the widespread scientific doubt that frames the rest of the timeline.
    statement_date: '2010-03-23'
    claim_group: podkletnov
  - id: q7
    added_date: '2026-06-03'
    text: The experiment has remained controversial since its publication. Very few scientists put any stock into it at all.
      Most damning to Podkletnov's case was the complete lack of any supporting evidence that the experiment had ever actually
      taken place.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, post-cryostat-critique paragraph
    significance: The document's blunt assessment of the foundational Podkletnov claim — controversial, little-credited, and
      lacking any supporting evidence the experiment ever took place.
    statement_date: '2010-03-23'
    claim_group: podkletnov
  - id: q8
    added_date: '2026-06-03'
    text: In fact, Harris pointed out that the correct estimation of the induced gravitoelectric field outside a superconductor
      is some 20 orders of magnitude smaller! No evident rebuttal has been forthcoming from Li or Torr.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, Harris critique of Li and Torr
    significance: A pivotal theoretical critique — Harris's argument that Li and Torr overstated the induced gravitoelectric
      field by some 20 orders of magnitude, left unrebutted, undercutting the leading theoretical basis for the effect.
    statement_date: '2010-03-23'
    claim_group: li_torr
  - id: q9
    added_date: '2026-06-03'
    text: Our own version of the Podkletnov spinning disk experiment was completed in late 2001 and published in 2003 (Reference
      35) showing a null result. It represented—and still represents—the closest published replication of the original Podkletnov
      experiment.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, author's-own-replication paragraph
    significance: The author's first-person account of his own 2003 replication (Reference 35 = Hathaway, Cleveland, and Bao)
      — a null result, described as the closest published replication of the original. Anchors the extrinsic-authorship chain
      to Hathaway via the self-citation.
    statement_date: '2010-03-23'
    claim_group: authors_replication
  - id: q10
    added_date: '2026-06-03'
    text: They claimed to have found the expected large gravitomagnetic field as detected by nearby accelerometers that matched
      to within a factor of 1.5 of their theoretical results. Eric Davis at the Institute for Advanced Studies in Austin has
      raised serious concerns about the theoretical basis for the claim. Davis contends (Reference 45) that the basis for calculating
      the Cooper pair mass is still so fraught with uncertainties as to leave Tajmar's mass anomaly unfounded.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, Tajmar 2006 gravitomagnetic-London-moment paragraph
    significance: The Tajmar 2006 positive claim (gravitomagnetic field within a factor of 1.5 of prediction) set against
      Eric Davis's critique that the Cooper-pair-mass basis is too uncertain to support the mass anomaly — a clean statement
      of the experiment-vs-critique tension running through the timeline.
    statement_date: '2010-03-23'
    claim_group: tajmar
  - id: q11
    added_date: '2026-06-03'
    text: By 2007, Tajmar (Reference 46) recognized that new data from improved experiments did not match their prior predictions.
      Nevertheless, an unexplained residual signal persisted that exhibited several unexpected features, including a relatively
      large coupling constant of 10⁻⁸ between the observed acceleration effect and the applied angular velocity.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, Tajmar 2007 residual-signal paragraph
    significance: Tajmar's own 2007 retreat — improved data did not match prior predictions, yet an unexplained residual signal
      persisted with a large coupling constant; the document's example of an anomaly that neither confirms nor cleanly disposes
      of the effect.
    statement_date: '2010-03-23'
    claim_group: tajmar
  - id: q12
    added_date: '2026-06-03'
    text: As of this writing, there have been no further pronouncements from Podkletnov. No one has published a replication
      of his "gravity beam" experiment, and as time passes, more and more scientists are coming to the conclusion that the
      experiment was never actually performed.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, closing Podkletnov paragraph
    significance: The timeline's closing verdict on Podkletnov's gravity-beam claim — no replication, no further word, and
      a growing scientific consensus that the experiment was never actually performed.
    statement_date: '2010-03-23'
    claim_group: podkletnov
  - id: q13
    added_date: '2026-06-03'
    text: Although the payoff of the discovery of a superconductor-mediated interaction between matter and gravity would be
      tremendous, only a few researchers are pursuing this goal. The main reason for this is the adherence to dogma concerning
      the impossibility of increasing the matter/electromagnetic coupling coefficients. This adherence is reinforced by reputable
      physicists pointing out that the theoretical constructs presented so far are based on questionable foundations.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Conclusion, opening paragraph
    significance: The document's summary judgment — the field is small because the theoretical constructs presented so far
      rest on questionable foundations, despite the tremendous payoff a real effect would bring.
    statement_date: '2010-03-23'
    claim_group: conclusion
  - id: q14
    added_date: '2026-06-03'
    text: The likelihood of scientific ridicule is extremely high in the search for laboratory-scale gravitational interactions.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Conclusion, opening paragraph (closing sentence)
    significance: The author's candid characterization of the field's reputational risk — a notable line for a DIA-commissioned
      advanced-technology report to carry about its own subject.
    statement_date: '2010-03-23'
    claim_group: conclusion
  - id: q15
    added_date: '2026-06-03'
    text: 'This product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence
      Agency, [Redacted: (b)(3):10 USC 424] Advanced Aerospace Weapon System Applications (AAWSA) Program.'
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Administrative Note
    significance: Self-identifies the DIRD as one of the FY 2009 AAWSA Program advanced-technology reports — the DIA program
      (commonly referenced as AAWSAP) under which the DIRD series was commissioned.
    statement_date: '2010-03-23'
    claim_group: program_identity
  - id: q16
    added_date: '2026-06-03'
    text: According to Kettunen (Reference 21), the spinning disk experiment was not actually performed at the institute but
      rather was conducted by Podkletnov and others "after hours." Kettunen also confided that although he was aware of the
      existence of the gravity shielding experiment through "so many others" telling him about it, he never witnessed it himself.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, Kettunen-supervisor paragraph
    significance: The concrete evidentiary basis for the document's twice-stated "never actually performed" verdict — Podkletnov's
      doctoral supervisor's first-hand account that the experiment was conducted "after hours" and that he never witnessed
      it himself.
    statement_date: '2010-03-23'
    claim_group: podkletnov
  - id: q17
    added_date: '2026-06-03'
    text: When the static machine was operated, a light blue planar "discharge" was seen to pass from the superconductor array
      to the annulus. At this instant, a pencil standing upright on a table in an adjoining room and separated from the experiment
      by a thick concrete wall fell over.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, high-voltage gravity-beam apparatus paragraph
    significance: The document's single most extraordinary specific claim — the high-voltage YBCO "gravity beam" discharge
      allegedly toppling a pencil in an adjoining room behind a thick concrete wall. q12 names the "gravity beam" but the node
      otherwise never describes it.
    statement_date: '2010-03-23'
    claim_group: podkletnov
  - id: q18
    added_date: '2026-06-03'
    text: He weighed small, disk-shaped samples held in a specially made capsule while dipping it into LN2 and found a slight
      (~0.5 percent) weight increase of a high-temperature superconductor for which he was not able to offer a prosaic explanation.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, Reiss LN2 weight-anomaly paragraph
    significance: One of the few positive/unexplained residual results besides Tajmar — a ~0.5 percent weight increase the
      experimenter (Reiss) could not explain prosaically, with the author's own group supplying the YBCO disks for the experiments.
    statement_date: '2010-03-23'
    claim_group: reiss
  - id: q19
    added_date: '2026-06-03'
    text: Final analysis of the Gravity Probe B satellite data is also apparently in serious difficulty (Reference 48), adding
      weight to the conclusion that experimentation in this area is fraught with difficulty even for the most experienced researchers.
    source:
      path: government/dird-14-superconductors-gravity-20100323.pdf
      location: Historical Timeline, closing paragraph preceding the Conclusion
    significance: Even well-funded mainstream gravimetric work (Gravity Probe B) is in serious difficulty — the document's
      broadest credibility caveat, that the experimental difficulty in this area is "not confined to the fringe."
    statement_date: '2010-03-23'
    claim_group: conclusion
