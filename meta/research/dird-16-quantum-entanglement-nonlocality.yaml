description: 'The Space-Communication Implications of Quantum Entanglement and Nonlocality reviews quantum entanglement and nonlocality and considers the possibility that this phenomenon could be used for sending observer-to-observer signals. It is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency ([`/organizations/dia`]), Advanced Aerospace Weapon System Applications (AAWSA) Program ([`/organizations/aawsap`]); the author ([`/people/john-cramer`]) appears in the program''s series of these reports ([`/documents/dia-aatip-products-list-2018`]), while no author appears on the document itself.


  The paper''s thesis is that such a demonstration would break several quantum "no-signal theorems" in the physics literature, and that nonlocal quantum signaling would have far-reaching implications as an enabling technology for superluminal and retrocausal signaling. The Foreword and Introduction observe that communication in space at the scale of the solar system is severely limited by the speed of light, and that this time delay makes real-time control of remote space-based devices impossible. The paper holds that relativity prohibits only certain forms of superluminal communication, while quantum nonlocality — the quantum connectedness acting in entangled quantum systems — appears, at least superficially, to exhibit superluminal aspects while preserving compatibility with special relativity. The question investigated is whether quantum nonlocality is the private domain of nature or whether it can be used to send signals from one observer to another; the paper states there is at present no compelling answer.


  Section II reviews the no-signal theorems: a number of authors have presented "proofs" that nonlocal observer-to-observer communication is impossible within the formalism of standard quantum mechanics, but the paper points out a recent observation that at least some of these "proofs" are tautological, assuming the measurement process and its associated Hamiltonian are local and thereby building the no signaling conclusion into their starting assumptions. Section III holds there is no conflict between nonlocal signaling and the Lorentz invariance of special relativity, while the principle of causality appears very likely to be violated (or at least violate-able) if nonlocal signaling is possible.


  Section IV turns to the momentum domain of Einstein''s ([`/people/albert-einstein`]) original focus, where it appears nonlocal quantum communication may be more easily achieved. The Ghost Interference experiment of the Shih ([`/people/yanhua-shih`]) group demonstrates the nonlocal connection between entangled photons, but in the form reported does not demonstrate nonlocal communication because of its use of a classical communication link to impose the coincidence requirement between the detected photons. The paper describes a slit-imaging coincidence-free version: if the pattern observed by the camera can be changed by switching the optical fiber routing, this would constitute a direct demonstration of nonlocal communication and would falsify the no-signal theorems. Later in the paper, the applications are considered — by the introduction of delay paths the "send" instant could be made to occur well after the "receive" instant, constituting a direct demonstration of retrocausal signaling and a direct violation of the principle of causality, and a "rover" operated at interplanetary distances, where the nonlocal control signal sent backwards up the time stream would arrive at the probe at the instant its video and data were transmitted, so that an Earth-based operator could steer and control the probe on Mars in real time using virtual-reality techniques.


  Section XII describes another path, nonlinear quantum mechanics: the no-signal "proofs" become invalid if quantum mechanics is allowed to be slightly nonlinear, a technical term for a small cross-term not present in the standard formalism. Two years after Steven Weinberg''s ([`/people/steven-weinberg`]) nonlinear quantum mechanics theory was published, Joseph Polchinski ([`/people/joseph-polchinski`]) showed that the nonlinear corrections upset the balance preventing superluminal communication using EPR experiments. Earth-based experimental tests for the nonlinear effects have produced only very low upper limits, but work on quantum gravity offers a curved-space wave equation in which strong space curvature — for example, the vicinity of a neutron star or black hole — means sufficient quantum nonlinearity may exist to facilitate nonlocal communication. The Conclusion states that ultimately the question of whether nonlocal communication is possible is an experimental one, resolvable by testing for nonlocal communication and observing what experimental limits appear.'
quotes:
  - id: q1
    added_date: '2026-06-03'
    text: This product is one in a series of advanced technology reports produced in FY 2009
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: Administrative Note
    significance: Program provenance — self-identifies the document as one of the FY 2009 AAWSA Program series of advanced technology reports.
    statement_date: '2010-03-30'
    claim_group: program_provenance
  - id: q2
    added_date: '2026-06-03'
    text: |-
      This paper reviews quantum entanglement and nonlocality and considers the
      possibility that this phenomenon could be used for sending observer-to-observer signals. Such a demonstration would break several quantum “no-signal theorems” in the physics literature. Nonlocal quantum signaling would
      have far-reaching implications as an enabling technology for superluminal and
      retrocausal signaling.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: Foreword and Introduction, ¶1
    significance: Thesis — observer-to-observer signaling via entanglement/nonlocality would break several quantum no-signal theorems and would be an enabling technology for superluminal and retrocausal signaling.
    statement_date: '2010-03-30'
    claim_group: thesis_observer_to_observer_signaling
  - id: q3
    added_date: '2026-06-03'
    text: |-
      This time delay makes real-time control
      of remote space-based devices impossible and leads to the need for pre-programmed robotic devices with enough “intelligence” to perform limited
      operations with a minimum of remote control.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: Foreword and Introduction, ¶2
    significance: Space-communication problem — the light-speed time delay makes real-time control of remote space-based devices impossible, forcing reliance on pre-programmed robotic devices.
    statement_date: '2010-03-30'
    claim_group: space_communication_problem
  - id: q4
    added_date: '2026-06-03'
    text: |-
      However, as will be discussed in Section
      III, relativity prohibits only certain forms of superluminal communication,
      while other forms are not in conflict with relativity. One phenomenon that
      appears, at least superficially, to exhibit superluminal aspects while
      preserving compatibility with special relativity is quantum nonlocality
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: Foreword and Introduction, ¶3
    significance: Relativity compatibility — relativity prohibits only certain forms of superluminal communication; quantum nonlocality appears to exhibit superluminal aspects while preserving compatibility with special relativity.
    statement_date: '2010-03-30'
    claim_group: relativity_compatibility
  - id: q5
    added_date: '2026-06-03'
    text: |-
      This quantum connectedness acting in
      entangled quantum systems is called quantum nonlocality.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: Foreword and Introduction, ¶4
    significance: Definition — quantum nonlocality is the quantum connectedness acting in entangled quantum systems.
    statement_date: '2010-03-30'
    claim_group: definitions_entanglement_nonlocality
  - id: q6
    added_date: '2026-06-03'
    text: |-
      The question investigated in this paper is whether quantum nonlocality is the
      private domain of nature or whether it can be used in experimental situations
      to send signals from one observer to another. As we will see, there is at
      present no compelling answer to this question.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: Foreword and Introduction, ¶6
    significance: Thesis question — whether quantum nonlocality is the private domain of nature or can be used to send observer-to-observer signals; the paper states there is at present no compelling answer.
    statement_date: '2010-03-30'
    claim_group: thesis_observer_to_observer_signaling
  - id: q7
    added_date: '2026-06-03'
    text: |-
      However, a number of authors (Reference 13) have
      presented “proofs” that such nonlocal observer-to-observer communication is
      impossible within the formalism of standard quantum mechanics.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §II. The Quantum No-Signal Theorems, ¶1
    significance: No-signal theorems — a number of authors have presented "proofs" that nonlocal observer-to-observer communication is impossible within standard quantum mechanics.
    statement_date: '2010-03-30'
    claim_group: no_signal_theorems_tension
  - id: q8
    added_date: '2026-06-03'
    text: |-
      Recently it has been pointed out (Reference 14) that at least some of these
      “proofs” ruling out nonlocal signaling are tautological, assuming that the measurement
      process and its associated Hamiltonian are local, thereby building the final conclusion of
      no signaling into their starting assumptions.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §II. The Quantum No-Signal Theorems, ¶4
    significance: Tautology rebuttal — at least some of the no-signal "proofs" are tautological, assuming the measurement process and Hamiltonian are local and so building the no-signaling conclusion into their starting assumptions.
    statement_date: '2010-03-30'
    claim_group: no_signal_theorems_tension
  - id: q9
    added_date: '2026-06-03'
    text: |-
      If nonlocal communication is possible, would it be in conflict with special relativity, with
      its well-known prohibition against faster-than-light signals? The answer is no.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §III. Nonlocality Versus Special Relativity?, ¶1
    significance: Relativity compatibility — the paper answers no to whether nonlocal communication would conflict with special relativity's prohibition against faster-than-light signals.
    statement_date: '2010-03-30'
    claim_group: relativity_compatibility
  - id: q10
    added_date: '2026-06-03'
    text: |-
      Therefore, there is no conflict between nonlocal signaling and the Lorentz invariance of
      special relativity. On the other hand, the principle of causality (cause must precede
      effect in all reference frames) appears very likely to be violated (or at least violate-able) if nonlocal signaling is possible.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §III. Nonlocality Versus Special Relativity?, ¶4
    significance: Relativity compatibility / causality — no conflict with Lorentz invariance, but the principle of causality appears very likely to be violated if nonlocal signaling is possible.
    statement_date: '2010-03-30'
    claim_group: relativity_compatibility
  - id: q11
    added_date: '2026-06-03'
    text: |-
      Interestingly, it
      appears that if nonlocal quantum communication is possible at all, it may be more
      easily achieved in the momentum domain of Einstein’s original focus.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §IV. Momentum Domain Entanglement and EPR Experiments, ¶1
    significance: Momentum-domain route — if nonlocal quantum communication is possible at all, it may be more easily achieved in the momentum domain of Einstein's original focus.
    statement_date: '2010-03-30'
    claim_group: momentum_domain_route
  - id: q12
    added_date: '2026-06-03'
    text: |-
      However, the Ghost Interference experiment does not, in
      the form reported, demonstrate nonlocal communication, because of its use of a
      classical communication link in imposing the coincidence requirement between the
      detected photons.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§IV. Momentum Domain Entanglement and EPR Experiments, ¶ "From the viewpoint of nonlocal communication"'
    significance: Ghost-Interference coincidence problem — the Ghost Interference experiment as reported does not demonstrate nonlocal communication because of its use of a classical communication link to impose the coincidence requirement.
    statement_date: '2010-03-30'
    claim_group: ghost_interference_coincidence_problem
  - id: q13
    added_date: '2026-06-03'
    text: |-
      If the pattern observed by the camera can indeed be changed by switching the optical
      fiber routing, then this would constitute a direct demonstration on nonlocal
      communication. Such an observation would falsify the no-signal theorems mentioned
      above
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§VI. Nonlocal Communication Versus Signaling, ¶ "If the pattern observed by the camera"'
    significance: Coincidence-free test — if switching the optical fiber routing changes the camera pattern, it would constitute a direct demonstration of nonlocal communication and would falsify the no-signal theorems. (Source OCR reads "demonstration on" for "demonstration of".)
    statement_date: '2010-03-30'
    claim_group: coincidence_free_ghost_interference_test
  - id: q14
    added_date: '2026-06-03'
    text: |-
      In particular, the “send” instant could be made to occur well after the “receive” instant
      in the system, constituting a direct demonstration of retrocausal signaling.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §VIII. Superluminal and Retrocausal Nonlocal Communication, ¶2
    significance: Retrocausal application — by introducing delay paths the "send" instant could be made to occur well after the "receive" instant, constituting a direct demonstration of retrocausal signaling.
    statement_date: '2010-03-30'
    claim_group: superluminal_retrocausal_application
  - id: q15
    added_date: '2026-06-03'
    text: |-
      This would be a direct demonstration of retrocausal signaling using
      nonlocal communication and would constitute a direct violation of the principle of
      causality.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§VIII. Superluminal and Retrocausal Nonlocal Communication, ¶ "Now consider that the sending detector"'
    significance: Retrocausal application — receiving a message before it is sent would be a direct demonstration of retrocausal signaling using nonlocal communication and a direct violation of the principle of causality.
    statement_date: '2010-03-30'
    claim_group: superluminal_retrocausal_application
  - id: q16
    added_date: '2026-06-03'
    text: |-
      Now consider the application of a “rover” operated at interplanetary distances, with
      nonlocal communications used to provide real-time “virtual reality” control of the mobile
      device.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§XI. Example: Real-Time Earth Control of Mars Rover, ¶1'
    significance: Mars-rover application — a rover operated at interplanetary distances, with nonlocal communications providing real-time virtual-reality control of the mobile device.
    statement_date: '2010-03-30'
    claim_group: mars_rover_application
  - id: q17
    added_date: '2026-06-03'
    text: |-
      The entangled photons would experience
      the same delay, but the nonlocal control signal would be sent backwards up the time
      stream, arriving at the probe at the instant the video signals and data were being
      transmitted, so that the nonlocal signal could steer and control the probe in real time,
      and an Earth-based operator could “drive” the rover on Mars using virtual-reality
      techniques.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§XI. Example: Real-Time Earth Control of Mars Rover, ¶ "In parallel with this nonlocal"'
    significance: Mars-rover application — the nonlocal control signal sent backwards up the time stream would arrive at the probe as its video and data were transmitted, letting an Earth-based operator drive the rover on Mars in real time using virtual-reality techniques.
    statement_date: '2010-03-30'
    claim_group: mars_rover_application
  - id: q18
    added_date: '2026-06-03'
    text: |-
      Such “proofs” become invalid if quantum mechanics is
      allowed to be slightly "nonlinear," a technical term meaning that when quantum waves
      are superimposed, they may generate a small cross-term not present in the standard
      formalism.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§XII. Another Superluminal Possibility: Nonlinear Quantum Mechanics, ¶2'
    significance: Nonlinear-QM path — the no-signal "proofs" become invalid if quantum mechanics is allowed to be slightly nonlinear, generating a small cross-term not present in the standard formalism.
    statement_date: '2010-03-30'
    claim_group: nonlinear_qm_path
  - id: q19
    added_date: '2026-06-03'
    text: |-
      Two years after Weinberg's nonlinear quantum mechanics theory was published, Joseph
      Polchinski published a paper demonstrating that Weinberg's nonlinear corrections upset
      the balance in quantum mechanics that prevents superluminal communication using
      EPR experiments (Reference 26).
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§XII. Another Superluminal Possibility: Nonlinear Quantum Mechanics, ¶3'
    significance: Nonlinear-QM path — Joseph Polchinski demonstrated that Weinberg's nonlinear corrections upset the balance in quantum mechanics that prevents superluminal communication using EPR experiments.
    statement_date: '2010-03-30'
    claim_group: nonlinear_qm_path
  - id: q20
    added_date: '2026-06-03'
    text: |-
      Thus, in
      an environment where strong space curvature is expected—for example, the vicinity
      of a neutron star or black hole—sufficient quantum nonlinearity may exist to facilitate
      nonlocal communication.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: '§XII. Another Superluminal Possibility: Nonlinear Quantum Mechanics, ¶ "However, emerging from work on quantum gravity"'
    significance: Nonlinear-QM path — in an environment of strong space curvature (the vicinity of a neutron star or black hole), sufficient quantum nonlinearity may exist to facilitate nonlocal communication.
    statement_date: '2010-03-30'
    claim_group: nonlinear_qm_path
  - id: q21
    added_date: '2026-06-03'
    text: |-
      Ultimately, the question of whether nonlocal communication is possible is an
      experimental one. The issue should be resolvable by testing for nonlocal communication
      and observing what experimental limits appear.
    source:
      path: government/dird-16-quantum-entanglement-nonlocality-20100330.pdf
      location: §XIII. Conclusion
    significance: Conclusion — whether nonlocal communication is possible is ultimately an experimental question, resolvable by testing for nonlocal communication and observing what experimental limits appear.
    statement_date: '2010-03-30'
    claim_group: conclusion_experimental_resolution
