  text: '4) Award a short-term, sole source extension to the incumbent contractor, Sancorp Consulting, LLC [CAGE Code: 7NZQ9; 3235 Valley Lane, Falls Church, VA 22044-1740]. The Contractor is currently performing services under contract HQ003424C0046, with services concluding on March 27, 2025. The anticipated period of performance for the bridge contracts is for four months, from March 28, 2025, to July 27, 2025.'
  source:
    path: government/samgov-tr011720251116-notice.json
    location: '"description[0].body" field, ¶ 4) (HQ003424C0046)'
  significance: 'The WHS Acquisition Directorate ([`/organizations/whs-acquisition-directorate`]) names HQ003424C0046 (Sancorp Consulting ([`/organizations/sancorp-consulting`]), the IPMO-support contract) among the incumbent contracts concluding on March 27, 2025, with an anticipated four-month bridge from March 28, 2025, to July 27, 2025. The notice does not name IPMO; the tie to IPMO rests on other sources that identify HQ003424C0046 as the IPMO-support contract.'
  context: 'Item 4 of five sole-source bridge extensions announced in SAM.gov notice of intent TR011720251116 (postedDate 2025-03-11T19:51:30), issued by Washington Headquarters Services, Acquisition Directorate, on behalf of the OUSD(I&S) I&S Enterprise.'
  claim_group: 'HQ003424C0046 bridge extension (SAM.gov notice TR011720251116)'
  statement_date: '2025-03-11'
