  statement_date: '2023-09-11'
- id: q5
  added_date: '2026-09-26'
  text: 'The Washington Headquarters Services, Acquisition Directorate, a component of the Office of the Secretary of Defense, conducted a search of their records systems and located 125 pages determined to be responsive to your request.'
