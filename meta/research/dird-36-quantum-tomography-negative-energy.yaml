  text: 'What is surprising here is that Marecki (private communication, Leipzig University, Germany, 2010) claims that the Quantum Inequalities should also apply to the case of static sub-vacuum fluctuations, and their corresponding static sub-vacuum (negative) energy density, inside Casimir cavities.'
