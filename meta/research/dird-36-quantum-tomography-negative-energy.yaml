  context: 'Transition sentence into the experimental-systems section.'
  claim_group: 'balanced homodyne detectors as negative-energy measurement devices'
- id: q16
  added_date: '2026-06-19'
  text: 'Marecki [5, 6] theoretically evaluated the use of BHDs for this purpose. He proposed that a BHD can be used to detect and spatially map the sub-vacuum fluctuation region inside a Casimir cavity as well as measure its negative energy density spectrum. Marecki discovered that by exploiting a trick with the subtraction of the output of balanced photodiodes, it is possible to quantify the fluctuations of the quantum field (even in the vacuum!), which uniquely addresses Davies and Ottewill''s [54] negative energy detector hypothesis.'
  source:
    path: government/dird-36-quantum-tomography-negative-energy-20110111.pdf
    location: 'section "Balanced Homodyne System for Casimir Cavities", first paragraph'
