    spintronic technologies and their aerospace applications.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "Introduction", report-arrangement ¶'
  significance: The explicit tie between the science and the AAWSAP aerospace mandate — flags Section 5 as the aerospace-applications locus
  statement_date: '2010-03-23'
- id: q-gmr-basics
  added_date: '2026-05-26'
  text: |-
    GMR in magnetic multilayers refers to a dramatic reduction in the resistance of the
    multilayers when subjected to an external magnetic field. GMR's size is usually defined
    as the resistance change in magnetic field relative to its peak value.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "GMR Basics", ¶2'
  significance: The working definition of giant magnetoresistance anchoring Section 2
  statement_date: '2010-03-23'
- id: q-gmr-applications
  added_date: '2026-05-26'
  text: |-
    GMR is currently used in magnetic field sensors, including those in read heads for
    computer hard drives, in galvanic isolators, and in nonvolatile random access memory
    devices. Reading information stored on magnetic hard disk drives in computers was the
    first large-scale commercial application of GMR.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "GMR Applications", ¶1'
  significance: GMR's mature commercial footprint — hard-drive read heads, galvanic isolators, nonvolatile memory
  statement_date: '2010-03-23'
- id: q-stt-definition
  added_date: '2026-05-26'
  text: |-
    This section focuses on the spin-transfer-torque (STT) phenomenon, which refers to a
    novel method to control and manipulate magnetic moments in nanostructures by spin
    currents—one of the forefront and most exciting areas in magnetism research today.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "Spin-Transfer-Torque", ¶1'
  significance: Defines STT — current-driven manipulation of magnetic moments in nanostructures — the report's forward-looking core
  statement_date: '2010-03-23'
- id: q-stt-first-observation-tsoi
  added_date: '2026-05-26'
  text: |-
    The first observation of such a spin-transfer phenomenon in magnetic multilayers was
    recorded by Tsoi et al. (Reference 5) (see Figure 3). In this experiment, the spin-transfer-induced
    excitations were produced by injecting high-density electrical currents into a
    Co/Cu magnetic multilayer through a mechanical point contact.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "STT Basics", ¶2'
  significance: Credits the first experimental observation of spin transfer to "Tsoi et al." — the body's closest echo of the products-list authorship attribution, though the body never names Tsoi as the report's author
  statement_date: '2010-03-23'
- id: q-stt-recording-oscillator
  added_date: '2026-05-26'
  text: |-
    In high-speed, high-density magnetic recording
    technology, for instance, SST could replace the Oersted field currently used for writing
    magnetic bits in storage media (for example, in magnetic random access memory
    [MRAM]). This may lead to a smaller and faster magnetic memory.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "STT Basics", ¶3'
  significance: An early STT application — replacing the Oersted write field in MRAM for smaller, faster magnetic memory; preserves the source's "SST" typo for STT
  statement_date: '2010-03-23'
- id: q-stt-tsoi-nature2000
  added_date: '2026-05-26'
  text: |-
    The first experiment providing unequivocal evidence that a dc electrical current can
    result in high-frequency (tens of GHz) precession of magnetic moments was reported
    by Tsoi et al. in (Reference 9). Here an STT device—point contact—was placed in a
    microwave cavity of a high-frequency, high-field electron spin resonance (ESR)
    spectrometer.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "STT Experiments", high-frequency precession ¶'
  significance: The second Tsoi et al. attribution — credits the first unequivocal evidence of current-driven GHz precession to Tsoi et al. (Reference 9); echoes the external products-list authorship attribution while the body still never names the report's author
  statement_date: '2010-03-23'
- id: q-stt-stxm-resolution
  added_date: '2026-05-26'
  text: |-
    The M-vector field of the free layer can be reconstructed from the measured Mx and My
    components as illustrated in Figure 9c, and the ultrafast x-ray microscopy technique
    provided a means to monitor this field as a function of time with ~100-picosond
    resolution.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "STT Experiments", STXM/Figure 9 ¶'
  significance: The Section 3.2 experimental endpoint — scanning transmission x-ray microscopy resolves the free CoFe layer magnetization vector field with ~100-picosond temporal resolution; source preserves the ~100-picosond spelling for ~100-picosecond
  statement_date: '2010-03-23'
- id: q-stt-applications-oscillator
  added_date: '2026-05-26'
  text: |-
    STT MRAM (see Figure 10b) removes the constraints on scalability. Here the switching
    of the free layer magnetic moment is achieved by STT switching when a high-density
    electrical current is driven directly through the storage element (MTJ or spin valve).
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "STT Applications", STT-MRAM ¶'
  significance: STT-MRAM as the scalable successor to conventional MRAM — drives the write current directly through the storage element, removing the Oersted-field scaling limit
  statement_date: '2010-03-23'
- id: q-racetrack-memory
  added_date: '2026-05-26'
  text: |-
    Moving magnetic domain walls with
    current was proposed as the basis for a
    new type of magnetic memory called
    "racetrack" (Reference 83).
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "STT-Driven Motion of Magnetic Domain Walls", racetrack ¶'
  significance: Introduces racetrack memory — current-driven domain-wall motion — as a third STT-enabled storage technology
  statement_date: '2010-03-23'
- id: q-antiferromagnetic-prediction
  added_date: '2026-05-26'
  text: |-
    Recently, MacDonald and coworkers (Reference 84) predicted that effects similar to
    GMR and STT observed with ferromagnets ought to occur in multilayer systems where
    the ferromagnetic (F) components are replaced by antiferromagnets (AFM).
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "Antiferromagnetic Metal Spintronics", ¶1'
  significance: Opens the antiferromagnetic-spintronics direction — GMR/STT analogues predicted when ferromagnets are replaced by antiferromagnets
  statement_date: '2010-03-23'
- id: q-conclusions-moores-law
  added_date: '2026-05-26'
  text: |-
    The semiconductor industry has distinguished itself by a long-term trend known as
    Moore's law (Reference 97) that foresees an exponential increase in transistor density
    on a chip, doubling approximately every 2 years. Continuing at this pace, the transistor
    density will reach ~ 10¹³ cm⁻² by 2035, which at clock speeds of ~10 GHz would result
    in ~40 MW/cm² of power dissipated on a chip.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "Summary and Conclusions", ¶1 (Moore''s-law power-density ¶)'
  significance: States the motivating problem — the Moore's-law power-density trend projecting ~40 MW/cm² dissipation by 2035
  statement_date: '2010-03-23'
- id: q-conclusions-redbrickwall
  added_date: '2026-05-26'
  text: |-
    The International Technology Roadmap for Semiconductors (http://www.itrs.net) has
    termed this imminent collapse the "Red Brick Wall," where "Red" indicates no "known
    manufacturable solutions" (of reasonable confidence) exist for continued scaling in
    some aspect of the semiconductor technology.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "Summary and Conclusions", ¶1 (Red Brick Wall ¶)'
  significance: Names the "Red Brick Wall" — the semiconductor-scaling collapse that motivates a charge-free, spin-based alternative
  statement_date: '2010-03-23'
- id: q-conclusions-aerospace-radiation
  added_date: '2026-05-26'
  text: |-
    The radiation resistance would be of particular interest for aerospace applications
    because the radiation in space is known to severely damage conventional electronics by
    building up a destructive charge in transistors. Long space trips that would expose
    onboard electronics to years of radiation would benefit from the radiation resistance
    and reduced power consumption (for example, like a nonvolatile memory that can
    retain the stored information even when not powered) of metallic spintronic devices.
  source:
    path: government/dird-10-metallic-spintronics-20100323.pdf
    location: 'section "Summary and Conclusions", aerospace ¶'
  significance: The report's explicit aerospace/defense relevance — radiation resistance and low power consumption of metallic spintronic devices as advantages for onboard electronics on long space missions (the AAWSAP tie-in)
  statement_date: '2010-03-23'
