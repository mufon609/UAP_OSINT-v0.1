  extrinsic_authorship: 'No author is named on the document itself — the Author line is redacted under FOIA exemption (b)(6) and the Prepared by line under (b)(3):10 USC 424. The DIA-to-Congress AAWSAP products list attributes the report to Dr. M. Tsoi of the University of Texas at Austin (attachment 24). The document''s own body does not name its author, though it foregrounds work by "Tsoi et al." — for example, it credits the first experimental observation of spin transfer to Tsoi et al. (Reference 5). Cross-reference [`/documents/dia-aatip-products-list-2018`]. The body cites "Tsoi et al." only at those reference markers; nothing about specific reference co-authorship is asserted beyond what is visible in the body.'
description: 'Metallic Spintronics. The Defense Intelligence Reference Document is 23 March 2010, with an ICOD of 1 December 2009 and control DIA-08-1003-011, UNCLASSIFIED//FOR OFFICIAL USE ONLY, with FOR OFFICIAL USE ONLY struck through to UNCLASSIFIED. Where the document shows Prepared by and Author, it shows [(b)(3):10 USC 424] and Defense Intelligence Agency ([`/organizations/dia`]) and [(b)(6)]. An Administrative Note states the product is one in a series of advanced technology reports produced in FY 2009 under the Defense Intelligence Agency, [(b)(3):10 USC 424] Advanced Aerospace Weapon System Applications (AAWSA) Program [`/organizations/aawsap`], and that comments or questions pertaining to this document should be addressed to the AAWSA Program Manager. The document is made available through the declassification efforts and research of John Greenewald, Jr., creator of The Black Vault. It is one of the FY 2009 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]); the Author line shows [(b)(6)].


  The report discusses the physics and applications of metallic spintronics, a nanoscale technology (a neologism for "spin-based electronics") in which information is carried not by the electron''s charge, as in conventional microchips, but by the electron''s intrinsic spin. It is discussed from the perspective of two phenomena. Giant magnetoresistance (GMR), research on which was awarded the Nobel Prize in Physics in 2007, refers to a dramatic reduction in the resistance of magnetic multilayers when subjected to an external magnetic field; GMR is currently used in magnetic field sensors, including those in read heads for computer hard drives, in galvanic isolators, and in nonvolatile random access memory devices, and reading information stored on magnetic hard disk drives was the first large-scale commercial application of GMR. The inverse effect, spin-transfer-torque (STT), refers to a novel method to control and manipulate magnetic moments in nanostructures by spin currents; the first observation of such a spin-transfer phenomenon in magnetic multilayers was recorded by Tsoi et al. (Reference 5). The report reviews STT experiments and applications, including STT MRAM, which removes the constraints on scalability when a high-density electrical current is driven directly through the storage element, and current-induced motion of magnetic domain walls proposed as the basis for "racetrack" memory.


  Section 4 discusses antiferromagnetic metal spintronics: MacDonald and coworkers predicted that effects similar to GMR and STT observed with ferromagnets ought to occur in multilayer systems where the ferromagnetic (F) components are replaced by antiferromagnets (AFM). Section 5 (Summary and Conclusions) discusses Moore''s law (Reference 97), which foresees transistor density of ~10¹³ cm⁻² by 2035 and ~40 MW/cm² of power dissipated on a chip; the International Technology Roadmap for Semiconductors has termed this imminent collapse the "Red Brick Wall." The report states that the radiation resistance would be of particular interest for aerospace applications because the radiation in space is known to severely damage conventional electronics, and that long space trips would benefit from the radiation resistance and reduced power consumption of metallic spintronic devices.

  '
