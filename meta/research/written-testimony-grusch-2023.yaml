quotes:
- id: q1
  added_date: '2026-04-20'
  text: My name is David Charles Grusch. I was an intelligence officer for 14 years, both in the US Air Force (USAF) at the rank of Major and most recently, from 2021-2023, at the National Geospatial-Intelligence Agency at the GS-15 civilian level, which is the military equivalent of a full-bird Colonel.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶3
  significance: Opening — identity, rank, agencies, service span
  context: opening statement
- id: q2
  added_date: '2026-04-20'
  text: I was my agency’s co-lead in Unidentified Anomalous Phenomena (UAP) and trans-medium object analysis, as well as reporting to UAP Task Force (UAPTF) and eventually the All-Domain Anomaly Resolution Office (AARO).
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶3
  significance: UAP-specific role — NGA co-lead; UAPTF and AARO reporting
  context: opening statement
- id: q3
  added_date: '2026-04-20'
  text: I became a Whistleblower, through a PPD-19 Urgent Concern filing with the Intelligence Community Inspector General (ICIG), following concerning reports from multiple esteemed and credentialed current and former military and Intelligence Community individuals that the US Government is operating with secrecy - above Congressional oversight - with regards to UAPs.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶4
  significance: Whistleblower filing mechanism — PPD-19 Urgent Concern with ICIG; motivating reports; characterization of secrecy above Congressional oversight
  context: whistleblower disclosure
- id: q4
  added_date: '2026-04-20'
  text: My testimony is based on information I have been given by individuals with a longstanding track record of legitimacy and service to this country – many of whom also shared compelling evidence in the form of photography, official documentation, and classified oral testimony.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶5
  significance: Evidentiary basis — relayed information from named classes of individuals; forms of evidence shared (photography, official documentation, classified oral testimony)
  context: evidentiary framing
- id: q5
  added_date: '2026-04-20'
  text: I have taken every step I can to corroborate this evidence over a period of 4 years and to do my due diligence on the individuals sharing it, and it is because of these steps that I believe strongly in the importance of bringing this information before you.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶6
  significance: Corroboration process — 4-year window of evidence corroboration and due diligence
  context: evidentiary framing
- id: q6
  added_date: '2026-04-20'
  text: But as I stand here under oath now, I am speaking to the facts as I have been told them.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶7
  significance: Sworn-testimony framing — Grusch explicitly distinguishes sworn testimony from independent verification; the facts are as he has been told them
  context: sworn framing
- id: q7
  added_date: '2026-04-20'
  text: In the USAF, in my National Reconnaissance Office (NRO) reservist capacity, I was a member of the UAPTF from 2019-2021. I served in the NRO Operations Center on the director’s briefing staff, which included the coordination of the Presidential Daily Brief (PDB) and supporting contingency operations.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶8
  significance: NRO reservist role — UAPTF membership 2019-2021; NRO Operations Center director's briefing staff; PDB coordination
  context: institutional role
- id: q8
  added_date: '2026-04-20'
  text: In 2019, the UAPTF director tasked me to identify all Special Access Programs & Controlled Access Programs (SAPs/CAPs) we needed to satisfy our congressionally mandated mission.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶9
  significance: SAPs/CAPs tasking — 2019 directive from UAPTF director to identify relevant compartmented programs
  context: institutional role
- id: q9
  added_date: '2026-04-20'
  text: At the time, due to my extensive executive-level intelligence support duties, I was cleared to literally all relevant compartments and in a position of extreme trust in both my military and civilian capacities.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶10
  significance: Clearance scope — self-description of compartmented access and institutional trust
  context: institutional role
- id: q10
  added_date: '2026-04-20'
  text: I was informed, in the course of my official duties, of a multi-decade UAP crash retrieval and reverse engineering program to which I was denied access to those additional read-on’s.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶11
  significance: Core allegation — multi-decade UAP crash retrieval and reverse engineering program; Grusch's stated denial of access to the program's read-on's
  context: core allegation
- id: q11
  added_date: '2026-04-20'
  text: I made the decision based on the data I collected, to report this information to my superiors and multiple Inspectors General, and in effect become a whistleblower.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶12
  significance: Reporting decision — report to superiors and multiple Inspectors General (plural)
  context: whistleblower disclosure
- id: q12
  added_date: '2026-04-20'
  text: As you know, I have suffered retaliation for my decision. But I am hopeful that my actions will ultimately lead to a positive outcome of increased transparency.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Opening ¶13
  significance: Retaliation statement — assertion of retaliation for the whistleblower decision; no specifics
  context: retaliation
- id: q13
  added_date: '2026-04-20'
  text: It is with a heavy heart and a determined spirit that I stand, under oath, before you today, having made the decision based on the data I collected, and reported, to provide this information to the committee. I am driven in this duty by a conviction to expose what I viewed as a grave congressional oversight issue and a potential abuse of executive branch authorities.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Closing ¶15
  significance: Closing oversight framing — characterization of the disclosure as a grave congressional oversight issue and potential abuse of executive branch authorities
  context: closing statement
- id: q14
  added_date: '2026-04-20'
  text: It is my hope that the revelations we unearth through investigations of the Non-Human Reverse Engineering Programs I have reported will act as an ontological (earth-shattering) shock, a catalyst for a global reassessment of our priorities.
  source:
    path: government/oversight-house-gov-grusch-written-testimony-20230726.pdf
    location: Closing ¶18
  significance: Closing terminology — "Non-Human Reverse Engineering Programs" naming; "ontological (earth-shattering) shock" framing
  context: closing statement
