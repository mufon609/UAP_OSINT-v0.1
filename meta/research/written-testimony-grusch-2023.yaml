description: 'Opening Statement and Closing Statement by David Charles Grusch ([`/people/david-grusch`]) for the [`/events/2023-07-26-house-uap-hearing`].


  Grusch''s Opening Statement: an intelligence officer for 14 years, in the US Air Force ([`/organizations/us-air-force`]) (USAF) at the rank of Major and most recently, from 2021-2023, at the National Geospatial-Intelligence Agency ([`/organizations/nga`]) at the GS-15 civilian level; co-lead in Unidentified Anomalous Phenomena (UAP) and trans-medium object analysis, reporting to UAP Task Force ([`/organizations/uaptf`]) (UAPTF) and eventually the All-Domain Anomaly Resolution Office ([`/organizations/aaro`]) (AARO).


  Whistleblower through a PPD-19 ([`/documents/ppd-19`]) Urgent Concern filing with the Intelligence Community Inspector General ([`/organizations/icig`]) (ICIG), following concerning reports from multiple esteemed and credentialed current and former military and Intelligence Community individuals that the US Government is operating with secrecy — above Congressional oversight — with regards to UAPs. Testimony based on information given by those individuals — many of whom also shared compelling evidence in the form of photography, official documentation, and classified oral testimony — and Grusch has taken every step to corroborate this evidence over a period of 4 years. Stand under oath, speaking to the facts as he has been told them.


  In the National Reconnaissance Office ([`/organizations/nro`]) (NRO) reservist capacity, a member of the UAPTF from 2019-2021, served in the NRO Operations Center on the director''s briefing staff, which included the coordination of the Presidential Daily Brief (PDB). In 2019 the UAPTF director tasked Grusch to identify all Special Access Programs & Controlled Access Programs (SAPs/CAPs) needed to satisfy the task force''s congressionally mandated mission; informed, in the course of official duties, of a multi-decade UAP crash retrieval and reverse engineering program to which Grusch was denied access. Suffered retaliation for the decision to report this information to superiors and multiple Inspectors General, and in effect become a whistleblower.


  Grusch''s Closing Statement: a conviction to expose what Grusch viewed as a grave congressional oversight issue and a potential abuse of executive branch authorities; hope that revelations we unearth through investigations of the Non-Human Reverse Engineering Programs will act as an ontological (earth-shattering) shock.

  '
