- id: q4
  added_date: '2026-06-15'
  text: 'Powerful onboard computing hardware is a desired option for future space travel. Without large data processing capability, the copious amounts of data acquired during flight from astronomical sensors as well as crew and vehicle sensors will need to be sent back to earthbound machines for processing, introducing delays measured in hours for routine calculations. Current commercial computer hardware trajectories in silicon substrate semiconductors are not likely to produce a radiation-hard or small and portable supercomputer without significant mission-specific alteration. Alternatives to traditional computing technology include computers based on entangled quantum states and molecular computing hardware based on DNA molecules.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Summary", opening paragraph'
  significance: Thesis/scope — frames the motivating problem (onboard space supercomputing) and the two alternative architectures the report surveys (quantum and DNA computing).
  context: Opening paragraph of the Summary.
  claim_group: thesis-and-scope
- id: q5
  added_date: '2026-06-15'
  text: 'Included in this review is significant introduction to the necessary elements of quantum computing and a summary of the state-of-the-art technologies. Following is background on DNA and production of engineered DNA chains. Finally, DNA logic gates are presented along with a treatment of nanomachines that will repair DNA circuitry. Forecasts of technology development in the 10-20 and 40-year horizons are included along the way, as well as summary discussion and a conclusion.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Summary", second paragraph'
  significance: Document roadmap — names the 10-20 and 40-year forecast horizons matching the AATIP/AAWSAP "out to the next 40 years" framing.
  context: Second paragraph of the Summary.
  claim_group: thesis-and-scope
- id: q6
  added_date: '2026-06-15'
  text: 'The first operating quantum computers capable of solving real-world problems will commence within 10 years and be based on ion trap technology. This is entirely based on the amount of research resources dedicated to the problem and the fact that there appear to only be engineering challenges remaining. Atomic and ion traps require very substantial cryogenic and EM shielding systems and are not practical for space travel.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Summary", forecast paragraph'
  significance: Core forecast — ion-trap quantum computers within 10 years, but impractical for space travel due to cryogenic/EM shielding needs.
  context: Forecast paragraph of the Summary (restated near-verbatim in the Discussion).
  claim_group: technology-forecasts
- id: q7
  added_date: '2026-06-15'
  text: 'Hybrid designs utilizing arrays of quantum dots and photon communication channels will be an option for space travel supercomputing on the 40-year timescale. These systems operate at attainable temperatures without cryonics, and require no more shielding than humans. It is likely that spintronics will be an essential ingredient.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Summary", 40-year-hybrid paragraph'
  significance: 40-year forecast — quantum-dot/photon hybrid designs as the viable space-travel supercomputing path, with spintronics essential.
  context: Summary paragraph on the 40-year hybrid-design horizon.
  claim_group: technology-forecasts
- id: q8
  added_date: '2026-06-15'
  text: 'Simple organic computing based on DNA tiles will be realized in the next 20 years. On the 40-year time horizon, useful DNA-based devices will be essential space exploration tools. These could take the form of orbital-delivered wireless sensors searching planetary/asteroid features or for essential compounds such as high concentrations of water. DNA computers will also be realized on the 40-year timeline. Their advantage over solid state devices will be the ability to repair nanoscale elements damaged in normal use or by cosmic radiation.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Summary", DNA-forecast paragraph'
  significance: DNA-computing forecast — DNA-tile computing in 20 years; DNA devices as space-exploration tools at 40 years, with self-repair against cosmic radiation the key advantage.
  context: Summary paragraph on the DNA-computing horizon.
  claim_group: technology-forecasts
- id: q9
  added_date: '2026-06-15'
  text: 'The quest for faster computing can be accomplished by making current hardware architecture faster, or by designing new hardware based on different architecture that solves the calculation in fewer steps. The current treatise concentrates on the latter, dramatically changing the architecture of modern computers to perform calculations in a different manner. Two methods are explored: that of creating logic gates, and that of creating a general Turing machine. The second of these is explored in the context of quantum computing with an emphasis on organic molecules as a core technology.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "INTRODUCTION", architecture-approach paragraph'
  significance: Methods/approach statement — defines the report's focus on new architectures (logic gates and a general Turing machine via quantum computing), emphasizing organic molecules.
  context: Introduction paragraph stating the report's analytical approach.
  claim_group: thesis-and-scope
- id: q10
  added_date: '2026-06-15'
  text: 'The history of manned spaceflight does not include powerful computers as integrated companions; space-borne supercomputers have so far been reserved to the world of science fiction. The main issue on space stations has been radiation hardness, while the main issue on vehicles such as the space shuttle has been safety. The amount of testing required for a microprocessor to be certified for space precludes the most current technology from becoming astro-worthy. Indeed, the most powerful general purpose computers riding in the shuttle are the laptops the astronauts bring with them.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "ULTRAFAST COMPUTING POWER IN AEROSPACE APPLICATIONS", opening paragraph'
  significance: Framing finding — no powerful onboard space computers exist to date; radiation hardness and certification testing are the limiting factors.
  context: Opening paragraph of the aerospace-applications section.
  claim_group: aerospace-computing-context
- id: q11
  added_date: '2026-06-15'
  text: "George's group at the University of Florida pursued this approach with earthbound success.(2, 3) A good question arises that if 50 years of space travel hasn't required one onboard supercomputer, why start now? It seems NASA asked this question as well and, after years of preparation, cancelled the space test of the technology in late 2009."
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "ULTRAFAST COMPUTING POWER IN AEROSPACE APPLICATIONS", radiation-hardness paragraph'
  significance: Names the University of Florida (George's group) COTS-parallel approach and the late-2009 NASA cancellation of the space test — an authorship/institutional signal.
  context: Paragraph on radiation-induced computation errors and parallel COTS architectures.
  claim_group: aerospace-computing-context
- id: q12
  added_date: '2026-06-15'
  text: 'Although smaller circuitry and supercomputing is a motivator, the driving application behind quantum computing is cryptography. First, there is cracking cipher codes. The vast majority of secured communications utilize a method known as public-key cryptography.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "APPLICATIONS OF QUANTUM COMPUTERS", opening paragraph'
  significance: Key finding of the applications section — cryptography (codebreaking) is the driving application of quantum computing.
  context: Opening of the quantum-computer-applications section.
  claim_group: quantum-computing-applications
- id: q13
  added_date: '2026-06-15'
  text: 'However, in 1994 Shor presented a quantum algorithm that would only require a polynomial number of steps, thus dramatically decreasing the required time to factor, assuming a quantum computer would ever be physically realized. (6) This speedup is primarily due to the nature of quantum waves; specifically, they can follow several parallel paths instead of the usual stepwise procedural execution of instructions.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "APPLICATIONS OF QUANTUM COMPUTERS", Shor-algorithm paragraph'
  significance: Names Shor's 1994 polynomial-time factoring algorithm as the basis for quantum codebreaking.
  context: Paragraph explaining the cryptographic threat from quantum factoring.
  claim_group: quantum-computing-applications
- id: q14
  added_date: '2026-06-15'
  text: 'A fundamental principle of quantum mechanics is that any external influence on a system necessarily disturbs the state of that system. This influence could be external disruption or internal leakage − either interaction will change the internal quantum state. This destructive process is known as decoherence. External influences will disturb the system and thus the circuits need to be isolated from the rest of the universe, also known as the ''closed box'' requirement.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "THE CLOSED BOX AND FAULT TOLERANCE", decoherence paragraph'
  significance: Defines decoherence and the closed-box isolation requirement — a load-bearing constraint on all quantum-computing hardware in the report.
  context: Section explaining the fault-tolerance and isolation requirements of quantum circuits.
  claim_group: closed-box-fault-tolerance
- id: q15
  added_date: '2026-06-15'
  text: 'In 1925, Austrian physicist Wolfgang Pauli proposed that an electron in a quantum state can assume only one of two states-"spin-up" or "spin down." (21) One approach to manipulate spin state and electrical charge independently for use in quantum computing has arisen in the quantum dot.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "The Quantum Dot Approach", electron-spin paragraph'
  significance: Names Pauli's 1925 two-state electron spin as the physical basis for spin qubits and the quantum-dot approach.
  context: Introduction to the quantum-dot approach to qubit manipulation.
  claim_group: quantum-dot-approach
- id: q16
  added_date: '2026-06-15'
  text: 'The graphene form of carbon, a hexagonal sheet array single atom thick, is a candidate substrate for quantum dots. However, two fundamental challenges need to be overcome before graphene can be used to form and operate spin qubits.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Electrostatic Quantum Dots in Graphene", opening paragraph'
  significance: Section finding — graphene as a candidate qubit substrate and the two fundamental obstacles to its use.
  context: Opening of the graphene quantum-dot section.
  claim_group: graphene-quantum-dots
- id: q17
  added_date: '2026-06-15'
  text: 'Recently, researchers at Princeton University discovered how to manipulate a single electron without disrupting any surrounding electrons (78). By utilizing an interferometer technique where one or two electrons are trapped in microscopic corrals that are created by applying voltage to miniscule electrodes, "spin qubits" were formed. This effort is ground-breaking in that previous research utilized techniques where the electrons were exposed to microwave radiation.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Spin Relaxation Due to Spin-orbit Interaction", Princeton-research paragraph'
  significance: Names Princeton University single-electron interferometer spin-qubit research as a ground-breaking result — institutional/authorship signal.
  context: Paragraph on superposition spin states and single-electron manipulation.
  claim_group: graphene-quantum-dots
- id: q18
  added_date: '2026-06-15'
  text: 'Recently, Ladd reviewed inorganic technologies. (5) Ladd proposes that ion traps are the most probable technology based on their long T2, but then concludes that a comparison between the technologies is incomplete without further development on all fronts. The current treatise concentrates on organic technology but summarizes here the work of Ladd and others for completeness.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "SUMMARY OF ADDITIONAL INORGANIC TECHNOLOGIES", opening paragraph'
  significance: Frames the inorganic-technologies survey on Ladd's review (reference 5) and reiterates the report's organic-technology emphasis.
  context: Opening of the inorganic-technologies summary section.
  claim_group: inorganic-technologies-summary
- id: q19
  added_date: '2026-06-15'
  text: 'More detail of such hurdles in trap technologies is revealed in a year earlier (much longer) review by Haffner. (81) Ion-trap-based gate operations are shown to have arbitrarily high fidelity, or higher fidelity than required for fault-tolerant computation.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Ion and Atomic Trap Technologies", Haffner paragraph'
  significance: Names Haffner's ion-trap review (reference 81) as the source for trap-technology hurdle analysis.
  context: Discussion of ion- and atomic-trap technology hurdles.
  claim_group: inorganic-technologies-summary
- id: q20
  added_date: '2026-06-15'
  text: "The most logical solution to overcome this restriction in silicon-based integrated circuit architectures resides within our own bodies, deoxyribonucleic acid (DNA). Living organisms also carry out complex physical processes under the direction of digital information. Biochemical reactions and ultimately an entire organism's operation are ruled by instructions stored in its genome, encoded in sequences of nucleic acids."
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA-BASED DESIGNS FOR MOLECULAR COMPUTERS", opening paragraph'
  significance: Thesis of the DNA-computing half of the report — DNA as the natural alternative medium when silicon reaches atomic limits.
  context: Opening of the DNA-based molecular-computers section.
  claim_group: dna-computing-thesis
- id: q21
  added_date: '2026-06-15'
  text: 'Watson and Crick may have never realized the full potential of the double helical structure they identified nearly 60 years ago, (83) for little was known about this amazing molecule that harnesses life.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Background", opening paragraph'
  significance: Names Watson and Crick's double-helix structure (reference 83) as the foundation of the DNA-background narrative.
  context: Opening of the DNA background subsection.
  claim_group: dna-background
- id: q22
  added_date: '2026-06-15'
  text: "But, it wasn't until 1977 that Fred Sanger developed the first dideoxynucleotide chain termination bottom up assembly method for DNA. (84) This technique would usher in a new age of nucleic acid research and open the door for the modern era of biotechnology."
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Background", Sanger paragraph'
  significance: Names Fred Sanger's 1977 chain-termination DNA sequencing method (reference 84) as a foundational biotechnology enabler.
  context: DNA background subsection, on the history of DNA sequencing.
  claim_group: dna-background
- id: q23
  added_date: '2026-06-15'
  text: 'In 1996, Winfree devised a theoretical proposal that addressed how crystal morphology and patterning can be programmed by tile design in an inherently asynchronous assembly process, in which it was addressed by the abstract Tile Assembly Model (aTAM). (90) Winfree explored how physical parameters, such as tile concentration and temperature, affect crystal growth and influence error rates, based on reversible tile association and dissociation rates (91).'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Background", aTAM/Winfree paragraph'
  significance: Names Winfree's 1996 abstract Tile Assembly Model (aTAM) (references 90, 91) — a load-bearing concept and authorship signal for the DNA-tile self-assembly section.
  context: DNA background subsection, on algorithmic self-assembly via the aTAM.
  claim_group: dna-self-assembly
- id: q24
  added_date: '2026-06-15'
  text: 'Later collaboration between Winfree and Seeman resulted in the first successful fabrication of a two-dimensional DNA lattice structure that utilized the mathematical principle of tiling (94). The self named DX (double crossover) molecule has two double helical motifs that are rigidly bound together by several single strands that are organized in a double crossover pattern forming a rigid structure of DNA.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Background", DX-molecule paragraph'
  significance: Names the Winfree-Seeman collaboration (reference 94) producing the first 2D DNA lattice via the DX molecule.
  context: DNA background subsection, on the double-crossover (DX) DNA tile.
  claim_group: dna-self-assembly
- id: q25
  added_date: '2026-06-15'
  text: 'However, the error suppression models Protected Tile Mechanism (PTM) and Layered Tile Mechanism (LTM) proposed by Fujibayashi and Murata can suppress all three error types illustrated in Figure 15. (98)(99).'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Error Suppression Mechanisms in DNA Self-Assembly", PTM/LTM paragraph'
  significance: Names the Fujibayashi-Murata PTM and LTM error-suppression models (references 98, 99) as suppressing all three DNA-tile error types.
  context: Error-suppression subsection, on tile-assembly error correction.
  claim_group: dna-self-assembly
- id: q26
  added_date: '2026-06-15'
  text: 'To overcome these restraints, researchers in Tokyo devised a microfluidic device specially designed for DNA tile assembly (105).'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Self-assembly with DNA-based Microfluidic Devices", microfluidic paragraph'
  significance: Names the Tokyo-group microfluidic DNA-tile self-assembler (reference 105).
  context: Microfluidic-devices subsection.
  claim_group: dna-self-assembly
- id: q27
  added_date: '2026-06-15'
  text: "Single-stranded origami such as William Shih's octahedron (113) cannot, by definition, suffer from this problem."
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Origami", Shih-octahedron paragraph'
  significance: Names William Shih's single-stranded DNA octahedron (reference 113) as a DNA-origami exemplar.
  context: DNA origami subsection, on single-stranded versus scaffolded origami.
  claim_group: dna-origami
- id: q28
  added_date: '2026-06-15'
  text: 'Recently, Seeman and colleagues at New York University have found a clever new way to tease DNA strands into mimicking exclusive OR (XOR) logic gates (117).'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Engineering DNA-Based Logic Gates", Seeman-NYU paragraph'
  significance: Names Seeman and colleagues at New York University (reference 117) for DNA-strand XOR logic gates — institutional/authorship signal.
  context: DNA logic-gates section, on DNA-based XOR gates.
  claim_group: dna-logic-gates
- id: q29
  added_date: '2026-06-15'
  text: 'The deoxyribozyme logic gates were applied to the construction of the first DNA-based Boolean automata capable of autonomously responding to human inputs: "MAYAs" are automata playing a game of tic-tac-toe against a human player.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Deoxyribozyme-based Boolean Automata", opening paragraph'
  significance: Section finding — the MAYA deoxyribozyme-based automata playing tic-tac-toe as the first DNA Boolean automata responding to human inputs.
  context: Opening of the deoxyribozyme Boolean-automata section.
  claim_group: dna-logic-gates
- id: q30
  added_date: '2026-06-15'
  text: 'To exhibit these capabilities, a team of scientists from Columbia University, Arizona State University, the University of Michigan, and the California Institute of Technology (Caltech) (123) have programmed an autonomous molecular "robot" made out of DNA to start, move, turn, and stop while following a DNA track.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "Robotic Bases (The DNA Robot)", molecular-robot paragraph'
  significance: Names the multi-institution team (Columbia, Arizona State, Michigan, Caltech — reference 123) that built the autonomous DNA molecular robot — a multi-institution authorship signal.
  context: DNA-robot section, on the autonomous molecular robot following a DNA track.
  claim_group: dna-robots
- id: q31
  added_date: '2026-06-15'
  text: 'The next level in complexity were "remotely-controlled" walkers introduced by Seeman and Pierce, as they were based on a series of successive unidirectional conformational changes driven by strand displacement.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Nanomotors", remotely-controlled-walkers paragraph'
  significance: Names Seeman and Pierce as introducers of remotely-controlled DNA walkers.
  context: DNA-nanomotors section, on the progression of DNA molecular motors.
  claim_group: dna-nanomotors
- id: q32
  added_date: '2026-06-15'
  text: 'The team from the University of Florida built a new type of "molecular nanomotor" driven only by photons, or particles of light. While it is not the first photon-driven nanomotor, the almost infinitesimal device is the first built entirely with a single molecule of DNA, offering a simplicity that increases its potential for development, manufacture and real-world applications in areas ranging from medicine to manufacturing.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "DNA Nanomotors", light-powered-nanomotor paragraph'
  significance: Names the University of Florida light-powered single-DNA-molecule nanomotor (reference 128) — institutional/authorship signal.
  context: DNA-nanomotors section, on the first single-DNA-molecule light-powered nanomotor.
  claim_group: dna-nanomotors
- id: q33
  added_date: '2026-06-15'
  text: 'A simple cargo carrying robot was demonstrated by Gu. (129) Spiders follow a designated path placed on a surface, picking up gold atoms as they pass over them. Such a device could be used to collect samples from asteroid or planetary surfaces. On a massive scale, they could collect mission critical materials from an exploration site.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "The Nano Walker; a Spider-like Approach", Gu paragraph'
  significance: Names Gu's cargo-carrying DNA nanowalker (reference 129) and ties it to asteroid/planetary sample collection — a space-mission application.
  context: Nano-walker section opening, on the cargo-carrying spider robot.
  claim_group: dna-nanomotors
- id: q34
  added_date: '2026-06-15'
  text: 'In a different approach, a nano-scale molecular proto-robot with a potential for integration with computing and sensing (i.e., into a real molecular robot), (130) was introduced by Stojanovic:'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "The Nano Walker; a Spider-like Approach", Stojanovic paragraph'
  significance: Names Stojanovic's deoxyribozyme-based molecular proto-robot (reference 130).
  context: Nano-walker section, on the self-repelling-random-walk spider robot.
  claim_group: dna-nanomotors
- id: q35
  added_date: '2026-06-15'
  text: 'We have presented an introduction to quantum computing and the technologies that comprise the current state-of-the-art. In the 10-20 year horizon, we will see optical and DNA-based computers realized on small production scales, but their readiness level for space travel will be lacking. On the 40-year horizon four major advances in space-ready technology will be seen: devices developed for optical computing will allow an all-optical computer to augment or replace general purpose computers; optical communication will play an essential role in hybrid designs of space-based quantum computers along with quantum dots; DNA devices will perform simple distributed sensor data analyses; and fault tolerant DNA computers will be available for mission-critical analysis tasks.'
  source:
    path: government/dird-35-quantum-computing-organic-molecules-2010.pdf
    location: 'section "CONCLUSION", sole paragraph'
  significance: The document's formal conclusion — the four 40-year space-ready advances (all-optical computers, optical communication in hybrid quantum designs, DNA distributed sensor analysis, fault-tolerant DNA computers).
  context: Conclusion section, single paragraph.
  claim_group: conclusion
