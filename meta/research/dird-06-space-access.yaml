  statement_date: '2010-03-08'
- id: q-intro-aerospace-veterans-hardware-issue
  added_date: '2026-05-25'
  text: |-
    veterans responded, "It was not a technology issue; it was a hardware issue."
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 5, ¶ continued (Introduction, printed p. vi)'
  significance: Hardware-not-technology framing — Aerospace Corporation veterans, asked about space access, responded that it was not a technology issue but a hardware issue (the lead-in clause "When asked about space access at the time, a group of Aerospace Corporation" closes printed p. v; this verbatim portion opens printed p. vi)
  statement_date: '2010-03-08'
- id: q-intro-x15-end-of-aircraft-to-space
  added_date: '2026-05-25'
  text: |-
    With the orbiting of Sputnik, the aircraft path to space, as represented by the X series of planes, ended with the X-15. With the X-15's demise, all efforts to fly aircraft to space ended, replaced by the more familiar (but less practical) strategy of loudly blasting to space with expendable rockets derived from undertested ballistic missile hardware, as documented in early failures.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 6, ¶2 (Introduction, printed p. vii)'
  significance: History — with Sputnik, the aircraft path to space (the X series) ended with the X-15, replaced by expendable rockets derived from undertested ballistic missile hardware
  statement_date: '2010-03-08'
- id: q-glider-vs-cruiser-two-configurations
  added_date: '2026-05-25'
  text: |-
    Two basic configuration types emerge. One configuration is for a hypersonic glider powered by either rocket or air-breathing rocket cycle propulsion that can operate as air-breathing propulsion to mach 5.5 or less. A versatile variable-capture, inward-turning inlet⁴ can be integrated with the vehicle configuration derived from the FDL series of hypersonic gliders developed by the U.S. Air Force Flight Dynamics Laboratory (AFFDL)⁵ and the work of the McDonnell Douglas Astronautics Company.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 9, ¶2 (Hypersonic Configuration Concepts, printed p. 3)'
  significance: Configuration taxonomy — the rocket / air-breathing-rocket hypersonic glider is derived from the AFFDL FDL series of hypersonic gliders and the McDonnell Douglas Astronautics Company''s work
  statement_date: '2010-03-08'
- id: q-stephens-weight-factor-lifting-spacecraft
  added_date: '2026-05-25'
  text: |-
    A report cited in Appendix A (Stephens, 1965) concluded, "Weight factor for lifting spacecraft results primarily from larger surface area and only secondarily from the associated spacecraft environment and may be as large as a factor of two greater than ballistic spacecraft."
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 14, ¶3 (Hypersonic Configuration Concepts, printed p. 8)'
  significance: Weight-factor analysis — a 1965 Stephens report concluded the weight factor for lifting spacecraft results primarily from larger surface area and may be as much as twice that of a ballistic spacecraft
  statement_date: '2010-03-08'
- id: q-fdl7-cross-range-no-waiting
  added_date: '2026-05-25'
  text: |-
    The hypersonic glider based on the FDL-7C and the hypersonic air-breathing aircraft in Figure 8 both have hypersonic L/D ratios in excess of 2.7. In very practical terms, that means unpowered cross ranges in excess of 4,500 nautical miles and down ranges on the order of the Earth's circumference. So these two craft can depart from any location of a low-altitude orbit and land in CONUS or in continental Europe.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 16, ¶1 (Hypersonic Configuration Concepts, printed p. 10)'
  significance: Glider capability — the FDL-7C class has hypersonic L/D ratios above 2.7, giving unpowered cross ranges in excess of 4,500 nautical miles so the craft can depart any low orbit and land in CONUS or continental Europe
  statement_date: '2010-03-08'
- id: q-xlr129-vs-ssme-development-time
  added_date: '2026-05-25'
  text: |-
    The XLR-129 was a shuttle-class engine that operated with turbopump exit pressures of 3,500 psi. It was brought to full pressure operation for the U.S. Air Force in just over 3 months.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 31, ¶2 (Rocket Propulsion, printed p. 25)'
  significance: Lost capability — the Pratt & Whitney XLR-129, a shuttle-class engine, was brought to full pressure operation in just over three months, contrasted in the source with the space shuttle main engine''s three years and lack of reusability without overhaul
  statement_date: '2010-03-08'
- id: q-horizontal-takeoff-a-priori-defeat
  added_date: '2026-05-25'
  text: |-
    So the resulting observation was "See! Air breathers are not lighter than all-rocket!" And so the rocket proponents have defeated an air-breathing solution since the first aerospace plane in 1958.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 39, ¶1 (Up-and-Down Operations, printed p. 33)'
  significance: Takeoff-mode argument — an a priori dictate of horizontal takeoff inflates air-breather gross weight, and on that basis rocket proponents have defeated an air-breathing solution since the first aerospace plane in 1958
  statement_date: '2010-03-08'
- id: q-conclusion-where-is-infrastructure
  added_date: '2026-05-25'
  text: |-
    But where is our space infrastructure? Forty years after Apollo, why have we advanced so little (as illustrated in Figure 43)? Like the pioneers' Conestoga wagons, most of our trips to LEO are one way, and when we do return, we do so with little more than the people we took to space.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 44, ¶3 (Conclusion, printed p. 38)'
  significance: Conclusion — forty years after Apollo there is no space infrastructure; most trips to LEO are one way, like the pioneers'' Conestoga wagons
  statement_date: '2010-03-08'
- id: q-conclusion-space-business-backwards
  added_date: '2026-05-25'
  text: |-
    Without an infrastructure, we are doomed to expendable vehicles at low launch rates for specific, one-time missions with no semblance of an infrastructure. Neither the United Kingdom nor the United States had any long-distance, two-way commerce until the railroads were established. After that, cities and commerce centers were created, enabling two-way commerce. The space business has it backwards: There is no commerce until the infrastructure is in place, not vice versa.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 45, ¶2 (Conclusion, printed p. 39)'
  significance: Infrastructure-before-commerce — as with the railroads enabling two-way commerce, the space business has it backwards because there is no commerce until the infrastructure is in place
  statement_date: '2010-03-08'
- id: q-conclusion-known-50-years-not-technology
  added_date: '2026-05-25'
  text: |-
    Is it a technology issue? Hardly! We have known for 50 years how to create it. Werner von Braun had Walt Disney create a clear visual image of what is required. But nobody listened, as we were too busy creating new things and throwing away the old things, destroying any development continuity.
  source:
    path: government/dird-06-bv-space-access-20100308.pdf
    location: 'p. 45, ¶3 (Conclusion, printed p. 39)'
  significance: Not-a-technology-issue — creating a LEO infrastructure is not a technology issue; the document states we have known for 50 years how to create it but destroyed development continuity
  statement_date: '2010-03-08'
