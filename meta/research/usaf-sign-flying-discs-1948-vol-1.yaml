  added_date: '2026-06-08'
  text: |-
    Inclosed herewith is also a report prepared by the Royal
    Aircraft Establishment, Technical Note, AERO 1703, which describes
    the Horten tailless aircraft.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, Air Materiel Command (TSWAD-2B) to CG Army Air Forces, subj: "Flying Disc", 24 Sep 1947, ¶3'
  significance: Documents the early intelligence hypothesis linking "flying disc" reports to German Horten-brothers tailless/flying-wing aircraft, via an RAE technical note.
  statement_date: '1947-09-24'
- id: q2
  added_date: '2026-06-08'
  text: |-
    A recent report from the U. S. Military attache, Moscow, USSR,
    dated 9 June 1947, indicates that 1800 aircraft, directly or indirectly
    based on the Horten VIII design (six engine pusher, having a wing spread
    of 131 feet and a gross weight of approximately thirty-three thousand
    pounds) are being built for bomber squadron use.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, Air Materiel Command (TSWAD-2B) to CG Army Air Forces, subj: "Flying Disc", 24 Sep 1947, ¶4'
  significance: Records a 1947 Moscow military-attaché report alleging Soviet mass production of Horten-derived aircraft — the Cold War foreign-technology framing of the flying-disc question.
  statement_date: '1947-09-24'
- id: q3
  added_date: '2026-06-08'
  text: |-
    By letter from this Headquarters, dated 30 December 1947 with subject
    as above, the Commanding General, Air Materiel Command is instructed to "set up
    a project whose purpose is to collect, collate, evaluate and distribute to
    interested government agencies and contractors all information concerning sight-ings and phenomena in the atmosphere which can be construed to be of concern to
    the national security".
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Routing and Record Sheet, "Flying Discs", Director of Intelligence to Director of Plans and Operations, Comment No. 1, 12 Feb 1948, ¶1'
  significance: Documents the 30 December 1947 letter instructing Air Materiel Command to stand up the project — the directive that established what became Project SIGN. The typewriter line-wrap "sight-ings" is preserved verbatim.
  statement_date: '1948-02-12'
- id: q4
  added_date: '2026-06-08'
  text: |-
    The Commanding General, Air Materiel Command feels that the responsibility
    assigned to him for collecting and developing information and intelligence on the
    "flying discs" should be complemented by a requirement that all Air Force installa-tions in the United States and Alaska provide a minimum of one each fighter or
    night interceptor type aircraft, with necessary crews, on a continuous alert basis.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Routing and Record Sheet, "Flying Discs", Comment No. 1, 12 Feb 1948, ¶2'
  significance: Records the Air Materiel Command proposal for a standing fighter/interceptor alert force, equipped with gun cameras, to intercept and photograph flying discs — the interception proposal later rejected as unfeasible.
  statement_date: '1948-02-12'
- id: q5
  added_date: '2026-06-08'
  text: |-
    It is Air Force policy not to ignore reports of sightings and phenomena in
    the atmosphere, but to recognize that part of its mission is to collect, collate,
    evaluate, and act on information of this nature.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Disposition Form, AFOIR-CO-5 to CSGID, "Reporting of Information on ''Flying Discs.''", Comment No. 1, 27 Feb 1948, ¶1'
  significance: States the foundational early USAF policy posture toward UAP/flying-disc reports — official non-dismissal and a mandate to collect, collate, evaluate, and act.
  statement_date: '1948-02-27'
- id: q6
  added_date: '2026-06-08'
  text: |-
    In Implementing this policy the Air Materiel Command has been designated
    the Air Force agency to collect, collate, evaluate and distribute to interested
    government agencies and contractors all information concerning sightings and pheno-mena in the atmosphere which can be construed to be of concern to the national security.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Disposition Form, AFOIR-CO-5 to CSGID, Comment No. 1, 27 Feb 1948, ¶2'
  significance: Designates Air Materiel Command (Wright-Patterson) as the lead Air Force agency for flying-disc information — the institutional precursor of Project SIGN's organizational home. The source's own mid-sentence capital "Implementing" and the typewriter line-wrap "pheno-mena" are preserved verbatim.
  statement_date: '1948-02-27'
- id: q7
  added_date: '2026-06-08'
  text: |-
    Air Materiel Command has been authorized direct contact with all Air Force
    installations whenever required to develop additional information on the flying discs.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Disposition Form, AFOIR-CO-5 to CSGID, Comment No. 1, 27 Feb 1948, ¶4'
  significance: Grants Air Materiel Command direct-contact authority across all installations for flying-disc information development.
  statement_date: '1948-02-27'
- id: q8
  added_date: '2026-06-08'
  text: |-
    The proposal of Air Materiel Command for stationing fighter aircraft at all
    bases on a continuous alert status is not considered feasible for the following reasons:
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Routing and Record Sheet, "Flying Discs", Director of Plans and Operations to Director of Intelligence, Comment No. 2, 3 Mar 1948, ¶1'
  significance: The Plans and Operations rejection of the continuous-alert fighter proposal — establishing that the USAF declined a dedicated interception posture for flying discs in early 1948.
  statement_date: '1948-03-03'
- id: q9
  added_date: '2026-06-08'
  text: |-
    It is recommended that Air Materiel Command's responsibility for "collecting"
    information on unusual phenomena in the atmosphere be confined to the establishment of
    direct channels for the receipt of such information.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Routing and Record Sheet, "Flying Discs", Comment No. 2, 3 Mar 1948, ¶2'
  significance: Recommends limiting AMC's flying-disc role to establishing direct reporting channels rather than active interception — shaping how the collection program was actually scoped.
  statement_date: '1948-03-03'
- id: q10
  added_date: '2026-06-08'
  text: |-
    Observation by Mr. Les Buchner, Bakersfield, California,
    of two objects falling to earth from unknown source on 5 March 1948
    between 1610 and 1655 hours.  Description of objects similar to falling
    aircraft with smoke and debris trailing.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, Headquarters Fourth Air Force, subj: Investigation of Flying Disc, 11 Mar 1948, ¶1a'
  significance: A specific civilian sighting (Bakersfield, CA, 5 March 1948) actively investigated by Fourth Air Force — an instance of the early-USAF flying-disc investigation activity.
  statement_date: '1948-03-11'
- id: q11
  added_date: '2026-06-08'
  text: |-
    Reference is made to Colonel McCoy's informal proposal
    that certain fighter aircraft be maintained on a continuous alert
    status, within the Zone of the Interior, to aid in gathering in-formation on Flying Discs.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, AFOIR-CO-5 to CG Air Materiel Command, subj: Flying Discs, 17 Mar 1948, ¶1'
  significance: Attributes the continuous-alert fighter proposal to Colonel McCoy of AMC (T-2) and forms the basis for the formal USAF rejection.
  statement_date: '1948-03-17'
- id: q12
  added_date: '2026-06-08'
  text: |-
    Proper interception is not possible, except by acci-dent, without complete radar coverage.  The Air Force is incapable
    of providing such coverage.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, AFOIR-CO-5 to CG Air Materiel Command, subj: Flying Discs, 17 Mar 1948, ¶2b'
  significance: Official 1948 USAF acknowledgment that it could not reliably intercept flying discs absent complete radar coverage it lacked.
  statement_date: '1948-03-17'
- id: q13
  added_date: '2026-06-08'
  text: |-
    It is doubtful if fighter aircraft would be able to
    follow up reports emnating, for the most part, from civilian sources.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, AFOIR-CO-5 to CG Air Materiel Command, subj: Flying Discs, 17 Mar 1948, ¶2c'
  significance: Notes that flying-disc reports came predominantly from civilian sources, a recurring early-USAF characterization of the sighting population.
  statement_date: '1948-03-17'
- id: q14
  added_date: '2026-06-08'
  text: |-
    The attached report was received this Headquarters 27 May
    1948, from Special Agent, D.K. Brown, Federal Bureau of Investigation,
    Cleveland, Ohio.  This Headquarters has no further information and is
    not initiating any investigation in accordance with paragraph 2, ADC
    Ltr. 45-5.
  source:
    path: government/18_6369445_general_1948_vol_1.pdf
    location: 'Letter, Headquarters Eleventh Air Force to Chief of Staff USAF, subj: Report of "Flying Discs", ¶1'
  significance: Shows the FBI-to-Air-Force reporting channel for flying-disc sightings and the Eleventh Air Force's decision not to investigate the Hobson, Ohio sighting.
  statement_date: '1948-06-15'
