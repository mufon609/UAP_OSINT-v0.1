description: 'Aneutronic Fusion Propulsion. The Defense Intelligence Reference Document, 01 November 2010, with an ICOD of 20 July 2010 and the number DIA-08-1011-003, in the Defense Futures series, UNCLASSIFIED//FOR OFFICIAL USE ONLY. Where the document shows Prepared by and Author, it shows (b)(3):10 USC 424 and (b)(6). The Administrative Notes place the product as one in a series of advanced technology reports produced in FY 2010 under the Defense Intelligence Agency ([`/organizations/dia`]), (b)(3):10 USC 424 Advanced Aerospace Weapon System Applications (AAWSA) Program ([`/organizations/aawsap`]), with a (U) COPYRIGHT WARNING that further dissemination of the photographs in this publication is not authorized, and that comments or questions pertaining to this document should be addressed to the AAWSA Program Manager, Defense Intelligence Agency. The document is made available through the declassification efforts and research of John Greenewald, Jr., creator of The Black Vault ([`/organizations/the-black-vault`]). It is one of the FY 2010 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]).


  The focus of this study is on aneutronic fusion propulsion, and integral to the study are the topics of fuel, rocket design, and the organizations that research aneutronic fusion development. These aneutronic fusion reactions take place without neutron production and decrease the need to carry large amounts of radiation shielding material for the crew, and the energy from charged particles generated by aneutronic fusion can be captured in conductive coils and converted directly into electricity; aneutronic fusion is presented as an important mechanism for future space propulsion, although novel accelerator or laser systems must be researched and developed in order to initiate, sustain, and control the fusion reaction. Integral to the study are the organizations that research aneutronic fusion development — including EMC2, the private company Robert Bussard and his colleagues formed in Santa Fe, New Mexico to test components of a practical fusion drive, whose work has been funded by DARPA, NASA, and the U.S. Navy, and the NASA Glenn Research Center, which between 1987 and 2004 developed the concept for the Discovery II vehicle. In the Conclusions, among the various aneutronic fusion propulsion technologies developed, Robert Bussard and his colleagues appear to have the best developed proposals, while antimatter engines are a more promising technology, since the technique to harvest and store small amounts of antihydrogen already exists, antimatter being a denser form of energy than fusion fuels and presents the possibility of creating a rocket that approaches the speed of light relative to Earth.

  '
