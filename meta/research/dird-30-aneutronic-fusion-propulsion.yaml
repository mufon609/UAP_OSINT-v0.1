- id: q4
  added_date: '2026-06-08'
  text: |-
    These "aneutronic fusion" reactions take place without
    neutron production and decrease the need to carry large amounts of radiation shielding
    material for the crew.  The energy from charged particles generated by aneutronic
    fusion can also be captured in conductive coils and converted directly into electricity.
    Aneutronic fusion promises to be an important mechanism for future space propulsion,
    although novel accelerator or laser systems must be researched and developed in order
    to initiate, sustain, and control the fusion reaction.
  source:
    path: government/dird-30-aneutronic-fusion-propulsion-2010.pdf
    location: 'Introduction'
  significance: 'Core technical claim defining "aneutronic fusion" — reactions without neutron production, with charged-particle energy convertible directly to electricity — and its asserted promise for future space propulsion contingent on novel accelerator or laser systems.'
  context: 'Introduction section (printed folio v).'
  statement_date: '2010-11-01'
  claim_group: aneutronic-fusion-thesis
- id: q5
  added_date: '2026-06-08'
  text: |-
    Among the various aneutronic fusion propulsion technologies developed, Robert
    Bussard and his colleagues appear to have the best developed proposals.
  source:
    path: government/dird-30-aneutronic-fusion-propulsion-2010.pdf
    location: 'section "Chapter 7: Conclusions"'
  significance: 'Headline conclusion singling out Robert Bussard and his colleagues as having the best developed aneutronic fusion propulsion proposals.'
  context: 'Opening sentence of Chapter 7: Conclusions.'
  statement_date: '2010-11-01'
  claim_group: bussard-conclusion
- id: q6
  added_date: '2026-06-08'
  text: |-
    Antimatter engines are a more promising technology, since the technique to harvest
    and store small amounts of antihydrogen already exists. Antimatter is a denser form of
    energy than fusion fuels and presents the possibility of creating a rocket that
    approaches the speed of light relative to Earth.
  source:
    path: government/dird-30-aneutronic-fusion-propulsion-2010.pdf
    location: 'section "Chapter 7: Conclusions"'
  significance: 'Comparative judgment that antimatter engines are "a more promising technology" than the titled aneutronic-fusion subject — antimatter as a denser energy form raising the prospect of a near-light-speed rocket.'
  context: 'Chapter 7: Conclusions, second paragraph, following the Bussard conclusion.'
  statement_date: '2010-11-01'
  claim_group: antimatter-conclusion
- id: q7
  added_date: '2026-06-08'
  text: |-
    Reliable fusion of p + ¹¹B has only been demonstrated in a laboratory setting using a picoseconds laser in 2005 by V. S. Belyaev in Russia.
  source:
    path: government/dird-30-aneutronic-fusion-propulsion-2010.pdf
    location: 'Appendix B: Aneutronic Fusion Rocket, "Fusion Initiation" research-challenge bullet'
  significance: 'Relayed external result (V. S. Belyaev, Russia, 2005) given as the proton-boron fusion state of the art — a picosecond-laser laboratory demonstration.'
  context: 'Appendix B: Aneutronic Fusion Rocket, first of the research-challenge bullets ("Fusion Initiation"). Relayed external research result.'
  statement_date: '2010-11-01'
  claim_group: research-challenges
