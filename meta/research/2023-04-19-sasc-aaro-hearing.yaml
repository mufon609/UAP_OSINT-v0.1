description: 'Subcommittee on Emerging Threats and Capabilities of the Senate Committee on Armed Services hearing to receive testimony on the mission, activities, oversight, and budget of the All-Domain Anomaly Resolution Office ([`/organizations/aaro`]). The Subcommittee met April 19, 2023 in Room SR-232A, Russell Senate Office Building, pursuant to notice, at 11:08 a.m. and adjourned at 12:08 p.m. Today''s earlier closed session was not part of the open transcript. Senator Kirsten E. Gillibrand ([`/people/kirsten-gillibrand`]), chairwoman of the subcommittee, presiding; Ranking Member Joni Ernst ([`/people/joni-ernst`]) and Senator Rosen ([`/people/jacky-rosen`]) were present. The witness was Dr. Sean M. Kirkpatrick ([`/people/sean-kirkpatrick`]), Director of AARO.


  Senator Gillibrand''s opening described the specific issues she would probe: the President''s budget for fiscal years 2023 and 2024 requested only enough funding to defray the operating expenses of AARO, and it took a letter to Secretary Austin ([`/people/lloyd-austin`]) from Senator Rubio ([`/people/marco-rubio`]) and Gillibrand and 14 other senators to get the office temporary relief; the fiscal year 2023 National Defense and Intelligence Authorization Act established a direct reporting chain from the AARO director to the Deputy Secretary of Defense, with the role of the Office of the Under Secretary of Defense for Intelligence and Security limited to administrative support; whether Kirkpatrick could achieve the necessary control over sensor filters and the storage and access to raw surveillance data; and the publicly discoverable and accessible process for safe disclosure that Congress mandated for witnesses of UAP events or participants in government UAP-related activities. As former Deputy Secretary of Defense David Norquist ([`/people/david-norquist`]) observed, had any of these objects had the label made in China there would be an uproar in the government and media; Senator Gillibrand also looked at the recent incursion of the unidentified PRC high-altitude balloon and the recent incidents over North America, where Pentagon leadership did not turn to AARO to play a leading role in advising the combatant commander.


  Kirkpatrick''s statement described AARO''s structure (a team of more than three dozen experts organized around four functional areas: operations, scientific research, integrated analysis, and strategic communications), its analytic process (a five-step process with an intelligence community team and an S&T team made up as a red team, blue team, or competitive analysis), and its case holdings (over 650 cases as of that week, up from about 366 reported in January). Kirkpatrick said clearly for the record that AARO has found no credible evidence thus far of extraterrestrial activity, off world technology, or objects that defy the known laws of physics. He said AARO''s mission is to turn UAP into SEP, somebody else''s problem — to quickly and efficiently hand off readily explainable objects to the intelligence, law enforcement, or operational safety communities. The hearing then surfaced specific issues: Kirkpatrick said he was currently reporting to USDINS until DOD and DNI come up with the plan for how they are going to implement legislation; the public-facing safe disclosure website had been submitted for approval before Christmas and was still under review with no estimate when his superiors will respond; and AARO did not play a role in DOD''s response to the recent UAP incidents over North America other than initial advice based on what was known at that time.


  Related: [`/transcripts/2023-04-19-sasc-kirkpatrick`] [`/documents/written-testimony-kirkpatrick-2023`] [`/organizations/aaro`] [`/organizations/uaptf`] [`/organizations/sasc`] [`/organizations/dod`] [`/organizations/odni`] [`/organizations/nasa`] [`/organizations/joint-staff`] [`/organizations/northcom`] [`/organizations/usspacecom`] [`/organizations/doe`] [`/organizations/ousd-is`] [`/people/sean-kirkpatrick`] [`/people/kirsten-gillibrand`] [`/people/joni-ernst`] [`/people/jacky-rosen`] [`/people/marco-rubio`] [`/people/lloyd-austin`] [`/people/david-norquist`] [`/people/harry-reid`] [`/people/david-spergel`] [`/people/glen-vanherck`]

  '
