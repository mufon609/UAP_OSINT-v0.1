- id: q3
  added_date: '2026-06-09'
  text: |-
    There are a number of different techniques available to detect hypersonic objects and to determine their position, velocity, and trajectory.  These detection methods can be broadly divided into electromagnetic, optical, and acoustic/seismic methods.  Each method relies on the properties of the surface of the object to reflect incident radiation or upon the properties of the hot ionized gases caused by the bow shock and entrained into the object's wake.  The theory of external fluid flow around objects in subsonic, supersonic, and hypersonic regimes will be reviewed and various detection methods will be compared in this report.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Introduction, closing paragraph'
  significance: 'The document''s thesis and scope statement — a comparative survey of electromagnetic, optical, and acoustic/seismic detection of hypersonic objects.'
  context: 'Final paragraph of the Introduction.'
  statement_date: '2010-11-20'
  claim_group: document-scope
- id: q4
  added_date: '2026-06-09'
  text: |-
    Traditionally, the lower Mach number limit for the so-called hypersonic speed regime is about Mach 5 (1.7 km/sec).  "Low hypersonic" values range between Mach 5 to about Mach 10, while "high hypersonic" values range between approximately Mach 10 to Mach 30 or above.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Introduction, first paragraph'
  significance: 'The operative definition of the hypersonic regime the whole report is built on.'
  context: 'Opening paragraph defining Mach regimes before classifying hypersonic-object classes.'
  statement_date: '2010-11-20'
  claim_group: hypersonic-flight-theory
- id: q5
  added_date: '2026-06-09'
  text: |-
    Other real and conceptual aircraft capable of reaching hypersonic speeds include the alleged Aurora SR-91 (Mach 4 to 6), the Boeing X-51, an unmanned Mach 6 scramjet, the HTV-2 from the DARPA Falcon project (designed for M=20 flight to low-Earth orbit), the HyperSoar (M = 12), the Russian Leninetz Ayaks, and the Skylon (designed for single-stage-to-orbit flights).
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Introduction, fourth-class-of-hypersonic-vehicles paragraph'
  significance: 'A DIA reference document listing the "alleged Aurora SR-91" alongside acknowledged programs — an in-house acknowledgment that rumored classified aircraft belong in the hypersonic-detection problem set.'
  context: 'Survey of the fourth class of hypersonic vehicles (manned and unmanned rockets and aircraft), after the X-15 and SR-71.'
  statement_date: '2010-11-20'
  claim_group: hypersonic-vehicle-inventory
- id: q6
  added_date: '2026-06-09'
  text: |-
    The wake rapidly becomes turbulent as it extends downstream.  The Strouhal eddies are detectable and have a shedding frequency that is expressed in terms of the Strouhal number, St = f D/V, where f is the Strouhal shedding frequency (hz), D is the diameter (m) of the projectile, and V is its velocity (m/s) through the air.  The Strouhal number is a function of Reynolds number, as shown in Figure 3.  By measuring the Strouhal frequency, the velocity of the projectile can be determined with moderate accuracy.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Subsonic Flow and Drag"'
  significance: 'Chapter 1''s load-bearing result — a vehicle''s wake eddies are themselves a velocity-measurement channel, the physical basis for the wake-signature recommendations in Chapter 4.'
  context: 'Boundary-layer / wake discussion in Chapter 1, Theory Governing Objects in Flight.'
  statement_date: '2010-11-20'
  claim_group: hypersonic-flight-theory
- id: q7
  added_date: '2026-06-09'
  text: |-
    Ionization is responsible for the glowing wake that follows reentry vehicles and meteors as electrons rush to recombine with ions releasing x-rays and visible light.  The ionization also interferes with radio transmissions, but provides a convenient way to identify hypersonic objects due to the emitted light.  A "rule of thumb" is that the peak shock layer temperature in degrees kelvin is 1,000 times larger than the aircraft speed in km/s.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Chapter 2: Hypersonic Compressible Flow Theory"'
  significance: 'Chapter 2''s central finding — shock-layer ionization makes hypersonic objects self-luminous and radio-disruptive, the physical signature most detection methods exploit.'
  context: 'Discussion of where perfect-gas shock relations break down above 550° C.'
  statement_date: '2010-11-20'
  claim_group: hypersonic-flight-theory
- id: q8
  added_date: '2026-06-09'
  text: |-
    Currently, the best devices for the detection of hypersonic vehicles are based on the reflection of radio and microwave radiation through RADAR and upon the detection of infrared energy emitted by the ionized gases surrounding high-speed vehicles and in their wake.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Chapter 3: Detection Technologies", paragraph following the laser-chronograph discussion'
  significance: 'The report''s headline assessment of the 2010 state of the art — RADAR and infrared are the best available hypersonic-detection modalities.'
  context: 'Chapter 3 overview before the electromagnetic-methods subsections.'
  statement_date: '2010-11-20'
  claim_group: detection-technology-survey
- id: q9
  added_date: '2026-06-09'
  text: |-
    This technique for detecting hypersonic meteors is not fully developed and appears to be employed only by hobbyists.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Radio Reflection Detection"'
  significance: 'Candid maturity assessment — a passive over-the-horizon detection channel for hypersonic objects existed in 2010 only at hobbyist level.'
  context: 'Assessment of passive radio-reflection detection of meteors and other atmosphere-entering objects.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q10
  added_date: '2026-06-09'
  text: |-
    Since a receiver can be tuned to a specific over-the-horizon transmitter, it may be possible to develop a network of radio receivers to provide information on high-speed objects in the atmosphere.  Multiple stations would allow triangulation of the object to determine velocity and position as a function of time, i.e., tracking and path prediction.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Radio Reflection Detection", network-proposal paragraph'
  significance: 'A concrete proposal for a passive national radio-reflection tracking network for high-speed atmospheric objects.'
  context: 'Same paragraph closes with the recommendation captured as q11.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q11
  added_date: '2026-06-09'
  text: |-
    This detection technology should be further developed.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Radio Reflection Detection", network-proposal paragraph, closing sentence'
  significance: 'Explicit development recommendation for radio-reflection detection (non-adjacent to q10 within the same paragraph; emitted separately per the contiguous-span rule).'
  context: 'Closing sentence of the radio-reflection network paragraph.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q12
  added_date: '2026-06-09'
  text: |-
    Infrared detection of reentry vehicles and ICBMs by satellites has been available since the early 1960s, with the United States leading the effort through detection of possible missile launches from the Soviet Union.  In addition to RADAR, infrared detection is one of the best techniques for the detection of hypersonic vehicles.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Infrared Detection", opening paragraph'
  significance: 'Section finding — IR ranks with RADAR as the best hypersonic-detection technique, with a US lead dating to the early 1960s.'
  context: 'Opening of the Infrared Detection subsection of Chapter 3.'
  statement_date: '2010-11-20'
  claim_group: detection-technology-survey
- id: q13
  added_date: '2026-06-09'
  text: |-
    Satellite systems currently monitor 2.5- to 5-micron IR emissions and could detect aircraft with speeds as low as Mach 3.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Application of Planck''s Law to Hypersonic Vehicles", peak-wavelength paragraph'
  significance: 'Quantified capability claim — existing satellite IR coverage already reaches down to Mach 3 aircraft.'
  context: 'Discussion of Figure 15 peak-wavelength curves for Mach 1 to Mach 100.'
  statement_date: '2010-11-20'
  claim_group: surveillance-infrastructure
- id: q14
  added_date: '2026-06-09'
  text: |-
    The DSP system is capable of monitoring more than ICBMs.  In 1972, the system detected a large meteor passing over several western states 94 km above the Earth.  This meteor, moving at 18 km/s, was on a trajectory over Salt Lake City that would have done significant damage if it had impacted the Earth.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Commercial and Governmental IR Systems", DSP-capability paragraph'
  significance: 'Documents that the DSP missile-warning constellation detects non-missile hypersonic objects (the 1972 Great Daylight Fireball class of event) — directly relevant to what national sensors see of anomalous fast movers.'
  context: 'History of MIDAS/DSP infrared early-warning satellites.'
  statement_date: '2010-11-20'
  claim_group: surveillance-infrastructure
- id: q15
  added_date: '2026-06-09'
  text: |-
    The current operational inventory is classified.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Commercial and Governmental IR Systems", DSP-capability paragraph, closing sentence'
  significance: 'Explicit classification boundary on the DSP constellation within an otherwise unclassified survey.'
  context: 'Same DSP paragraph as q14; non-adjacent sentence, emitted separately per the contiguous-span rule.'
  statement_date: '2010-11-20'
  claim_group: surveillance-infrastructure
- id: q16
  added_date: '2026-06-09'
  text: |-
    LIDAR can be used to detect and monitor hypersonic objects in several ways.  By using a micropulse laser, a LIDAR system could be used to scan the sky for supersonic airborne objects.  LIDAR can also detect the presence of a hypersonic vehicle by measuring the air velocities in the long turbulent wakes that they leave in the atmosphere.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "LIDAR", hypersonic-applications paragraph'
  significance: 'Section finding — LIDAR can find a hypersonic vehicle indirectly through its persistent turbulent wake even when the vehicle itself is missed.'
  context: 'LIDAR subsection of Chapter 3, optical methods.'
  statement_date: '2010-11-20'
  claim_group: detection-technology-survey
- id: q17
  added_date: '2026-06-09'
  text: |-
    While they have not yet been used to sense nuclear detonations, they do detect sonic booms, and they were responsible for identifying and tracking two large bolides, or brilliant meteors, that entered the Earth's atmosphere in 2000 and 2001.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Infrasound", Los Alamos stations paragraph'
  significance: 'The Los Alamos infrasound network — built for nuclear-test detection — has in practice functioned as a hypersonic-object (bolide) tracker.'
  context: 'Description of the four LANL infrasound stations installed in 1983.'
  statement_date: '2010-11-20'
  claim_group: surveillance-infrastructure
- id: q18
  added_date: '2026-06-09'
  text: |-
    On 9 December 1993, the network successfully detected the flight of an SR-71 flying over Edwards Air Force Base at a maximum speed of Mach 3.2.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Seismic", TERRAscope detections paragraph'
  significance: 'Demonstrated seismic-network detection of a high-speed classified-lineage aircraft — ground earthquake sensors as an aircraft-tracking channel.'
  context: 'TERRAscope seismic-network results, alongside the STS-42 shuttle-reentry detection.'
  statement_date: '2010-11-20'
  claim_group: surveillance-infrastructure
- id: q19
  added_date: '2026-06-09'
  text: |-
    One interesting investigation that involved the use of these seismic arrays involved mysterious sonic booms heard over Southern California in 1991 and 1992.  By using data from the TERRAscope array, the source of these disturbances was traced to two F-4 Phantom aircraft flying over Edwards Air Force Base at speeds near Mach 1.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Seismic", mysterious-sonic-booms paragraph'
  significance: 'A worked precedent of instrumented anomaly resolution — "mysterious sonic booms" (widely speculated at the time to be the Aurora aircraft) traced by sensor data to conventional F-4s.'
  context: 'Closing investigation example in the Seismic subsection.'
  statement_date: '2010-11-20'
  claim_group: anomaly-resolution-precedent
- id: q20
  added_date: '2026-06-09'
  text: |-
    While conventional RADAR and optical systems may be able to track existing vehicles, future aircraft capable of Mach 8 and above are now being designed and tested.  New propulsion technology and drag reduction techniques also offer new ways to detect such aircraft.  Based on a review of hypersonic vehicle detection and tracking, four recommendations are made for research and technology development over the next 30 years to increase the detectability of hypersonic objects passing through the Earth's atmosphere.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Detectability of New Hypersonic Aircraft"'
  significance: 'Frames the document''s deliverable — four 30-year R&D recommendations for detecting next-generation hypersonic vehicles.'
  context: 'Chapter 4, Vision of Progress Over the Next 30 Years.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q21
  added_date: '2026-06-09'
  text: |-
    Authors Mark Garnet and Aaron Altman from the University of Dayton29 proposed the development of a database of turbulent wake data for conventional aircraft to allow their identification.  They point out that, although the aircraft may be designed for stealth, their wakes cannot be hidden.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Recommendation #1 - Build a Database of the Wake Characteristics for Existing Aircraft'
  significance: 'The counter-stealth premise of Recommendation #1 — wakes cannot be hidden even when airframes are. In-line endnote marker "Dayton29" preserved verbatim.'
  context: 'Recommendation #1, citing Garnet and Altman (endnote 29).'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q22
  added_date: '2026-06-09'
  text: |-
    Several new propulsion systems for hypersonic aircraft will be tested over the next 30 years. These include pulsed detonation engines (PDE) successfully tested in 2008 by the Air Force Research Laboratory and Innovative Scientific Solutions, Inc. over the Mojave Desert.  While these engines are capable of Mach > 6, they have one characteristic that makes them very detectable.  The pulsed detonation of combustible fuel creates a wake with periodic bulges referred to as "donuts on a rope."
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Recommendation #2 - Exploit the Detectability of Hypersonic Aircraft Based on the Features That Allow Them To Fly Efficiently at High Speeds'
  significance: 'Confirms 2008 AFRL pulsed-detonation-engine flight testing and the distinctive "donuts on a rope" contrail signature long associated with Aurora-type sighting reports.'
  context: 'Recommendation #2 opening paragraph.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q23
  added_date: '2026-06-09'
  text: |-
    Golovitichev and Hansson presented a paper in 199931 that stated the following: "The concentrated energy drag reduction concept has proven to be effective for the cruise range vehicles, preventing the missile deceleration with the benefit that the spike "products" could envelope the missile in a film of ionized gas which would be impervious to RADAR pulses, thereby rendering it electronically "invisible".
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Recommendation #3 - Explore the Detection of Vehicles Designed To Be Undetectable, quoted Golovitichev-Hansson passage (the quotation continues across an interposed page banner; remainder reads "The infra-red penalty at close range would be significantly offset by the high speed of the flight.")'
  significance: 'A DIA reference document quoting published work that a plasma-sheathed hypersonic vehicle would be "electronically ''invisible''" to RADAR — load-bearing for plasma-stealth discussion in the UAP context.'
  context: 'Recommendation #3; span ends at the printed-page break per the page-spanning-quote rule. In-line endnote marker "199931" preserved verbatim.'
  statement_date: '2010-11-20'
  claim_group: plasma-stealth
- id: q24
  added_date: '2026-06-09'
  text: |-
    This discussion about the AJAX engine concerned the generation of ion combustion products that would be further accelerated by an MHD (magnetohydrodynamic drive).  The increased number of various carbon-based molecules in the wake of this aircraft could be detected using LIDAR.  The increased temperature near the surface of this aircraft would also increase its detectability due to increased emission of infrared radiation.  For AJAX (AYAK) vehicles, development of enhanced LIDAR systems and IR detectors should proceed over the next 30 years to increase their detection and tracking.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Recommendation #3, AJAX-engine discussion paragraph'
  significance: 'The report''s counter to plasma stealth — RADAR-invisible MHD vehicles remain detectable via LIDAR wake chemistry and elevated IR emission.'
  context: 'Follows the Golovitichev-Hansson quotation in Recommendation #3.'
  statement_date: '2010-11-20'
  claim_group: plasma-stealth
- id: q25
  added_date: '2026-06-09'
  text: |-
    One characteristic of hypersonic flight (M > 5) is the ionization of air in the region downstream of the bow shock and the disassociation of oxygen and nitrogen at very high speeds.  When electrons recombine with ions generated by the shock, they emit electromagnetic radiation that can be detected.  This radiation extends from the visible range, as evidenced by the glowing trail left by meteors entering the Earth's atmosphere, but the emitted radiation also extends into the ultraviolet and x-ray range.  Although such electro-optical sensors are likely part of the existing DARPA/USAF space surveillance system, telescope systems that monitor the UV range should be developed, along with x-ray detectors capable of monitoring the atmosphere.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Recommendation #4 - Explore the Development of Novel Detectors'
  significance: 'Recommendation #4''s UV/x-ray detector proposal, with the author''s inference that such electro-optical sensors likely already exist in the DARPA/USAF space-surveillance system.'
  context: 'Recommendation #4 opening paragraphs.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q26
  added_date: '2026-06-09'
  text: |-
    As hypersonic objects pass through the atmosphere, the object becomes ionized with a significant positive charge.  Technology should be developed to sense the flight of objects with an electrostatic charge as they pass through the atmosphere.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'Recommendation #4 - Explore the Development of Novel Detectors, closing paragraph'
  significance: 'Novel-detector proposal — electrostatic-charge sensing of hypersonic objects, a detection channel with no existing infrastructure.'
  context: 'Final paragraph of Recommendation #4.'
  statement_date: '2010-11-20'
  claim_group: detection-recommendations
- id: q27
  added_date: '2026-06-09'
  text: |-
    Each detection system discussed in the previous section has both benefits and problems.  A comparison of the various detection techniques is shown in Figure 19 based on their ability to detect specific properties, relative cost, and accuracy.
  source:
    path: government/dird-31-hypersonic-detection-tracking-2010.pdf
    location: 'section "Summary"'
  significance: 'The summary''s framing of the comparative matrix (Figure 19) that constitutes the report''s bottom line.'
  context: 'Summary section closing Chapter 4.'
  statement_date: '2010-11-20'
  claim_group: document-scope
