description: 'Detection and High Resolution Tracking of Vehicles at Hypersonic Velocities. The Defense Intelligence Reference Document, 20 November 2010, with an ICOD of 30 August 2010 and the number DIA-08-1012-001, in the Defense Futures series, UNCLASSIFIED//FOR OFFICIAL USE ONLY. Where the document shows Prepared by and Author, it shows (b)(3):10 USC 424 and (b)(6). The product is given as one of a series of advanced technology reports produced in FY 2010 under the Defense Intelligence Agency ([`/organizations/dia`]), (b)(3):10 USC 424 Advanced Aerospace Weapons System Applications (AAWSA) Program ([`/organizations/aawsap`]), with a (U) COPYRIGHT WARNING that further dissemination of the photographs in this publication is not authorized, and comments or questions pertaining to the document addressed to the AAWSA Program Manager, Defense Intelligence Agency. The document is made available through the declassification efforts and research of John Greenewald, Jr. ([`/people/john-greenewald`]), creator of The Black Vault ([`/organizations/the-black-vault`]). It is one of the FY 2010 AAWSA Program advanced technology reports ([`/documents/dia-aatip-products-list-2018`]).


  There are a number of different techniques available to detect hypersonic objects and to determine their position, velocity, and trajectory; the detection methods can be broadly divided into electromagnetic, optical, and acoustic/seismic methods, and each method relies on the properties of the surface of the object to reflect incident radiation or upon the properties of the hot ionized gases caused by the bow shock and entrained into the object''s wake. The theory of external fluid flow around objects in subsonic, supersonic, and hypersonic regimes is reviewed and various detection methods are compared. Currently, the best devices for the detection of hypersonic vehicles are based on the reflection of radio and microwave radiation through RADAR and upon the detection of infrared energy emitted by the ionized gases surrounding high-speed vehicles and in their wake. Based on a review of hypersonic vehicle detection and tracking, four recommendations are made for research and technology development over the next 30 years to increase the detectability of hypersonic objects passing through the Earth''s atmosphere — build a database of the wake characteristics for existing aircraft, exploit the detectability of hypersonic aircraft based on the features that allow them to fly efficiently at high speeds, explore the detection of vehicles designed to be undetectable, and explore the development of novel detectors — and a comparison of the various detection techniques is shown in Figure 19 based on their ability to detect specific properties, relative cost, and accuracy.

  '
