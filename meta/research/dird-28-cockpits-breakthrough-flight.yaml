  extrinsic_authorship: 'The Author line on the document is redacted under FOIA (b)(6), so no author name appears on the document face. The DIA-to-Congress products list ([`/documents/dia-aatip-products-list-2018`]) attributes this report (attachment #27, "Cockpits in the Era of Breakthrough Flight") to Dr. G. Millis ([`/people/marc-millis`]), Tau Zero ([`/organizations/tau-zero`]) — the list renders the initial "G." while the document''s own figure credits read "[Credit: M. Millis]" (Figures 6 and 14) and its primary reference is the book "Frontiers of Propulsion Science [Millis & Davis, 2009]" co-edited by Marc Millis; both forms are preserved as their respective sources give them. Internal evidence is consistent with that attribution: the figure credits to M. Millis, the dependence of the physics chapters on the Frontiers book Millis co-edited, and the first-person passage in Chapter 1 ("these interpretive predictions and cockpit implications are solely generated by the author"). On the document itself the Author identity is withheld under (b)(6) and the preparing component under (b)(3):10 USC 424.'
