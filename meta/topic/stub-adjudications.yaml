# Stub-reconcile adjudication ledger — the candidate duplicate-stub clusters
# that `scripts/tools/stub-reconcile.py` surfaces and a contributor has
# source-confirmed as NOT one entity. The sweep reads this file and suppresses
# a surfaced cluster ONLY when the cluster's membership exactly equals an
# entry's `members`. If a stub joins or leaves a ruled cluster, the cluster
# re-surfaces, flagged against the entry it used to match, for a fresh ruling.
# Update the entry's `members`, `rationale`, `sources` and `date` when you
# re-rule it.
#
# Topic content: slugs are this instance's content, so the ledger lives under
# meta/topic/ and is deleted on a fork. If the file is missing, nothing is
# suppressed.
#
# Standing rule: source-confirm each candidate before ruling it, because
# slug-shape confidence is NOT entity confidence. Where the identity is not
# obvious from the artifact, confirm it at the source document AND on the web.
# A real duplicate is never recorded here. Canonicalize it to one slug
# instead (the fullest source-attested form).
#
# Entry fields:
#   id         stable kebab label (unique)
#   members    the cluster's full `/type/slug` paths, all of one type (≥ 2)
#   verdict    distinct    different entities that share slug tokens
#              part-whole  a component and its parent (or siblings under one
#                          parent); not duplicates
#              eponym      a bare-name stub that stands in an eponym
#                          construction ("Einstein's field equations"), left
#                          apart from the person's full-name stub
#              unresolved  identity or containment is not settled by any
#                          source in hand. Kept as separate slugs, because a
#                          merge would assert an unsourced answer. Re-rule
#                          when a source settles it
#   rationale  one line; what each member names
#   sources    deciding source path(s), relative to sources/
#   web        (optional) URL(s) consulted for web confirmation
#   date       ruling date (YYYY-MM-DD)
#   surfaced   (optional, default true) false for a ruling on stubs the
#              sweep's matching rules never cluster (e.g. short-token
#              anchors such as `whs`); kept as the record, never suppresses

