# Primary-source investigation knowledge-base — speaker-attribution schema
#
# Specification for the source-layer speaker-attribution sibling produced
# by `/prepare-transcript-sibling` (the agent-based attribution pipeline).
# One sibling per label-less transcript source. Sibling lives next to the
# source file at `sources/transcripts/{stem}-attribution.yaml` and is the
# source-of-truth for the `speaker_id` field on transcript-artifact
# `quote_entry` items (see schema-research-artifact.yaml::quote_entry).
#
# Loaded by `scripts/build/validate-speaker-attribution.py`. Rendered into
# a human-readable `{stem}-attributed.md` by
# `scripts/tools/render-speaker-transcript.py`. Cross-references use the
# form `schema-speaker-attribution.yaml::X`.
#
# The sibling indexes into the source file by 1-indexed line range. It
# never duplicates source text — agents emit references only. The
# renderer reads source-file bytes verbatim and wraps them with the
# attribution labels from this yaml. This is the verbatim-quote-chain
# discipline (the source file remains the authoritative bytes); the agent
# producer cannot drift from source because there is no `text` field in
# this schema for it to populate.
#
# Provenance contract: this sibling is regeneratable from
# (source_path, agent producer, agent verifier). It is NOT hand-curated.
# Contributor edits go through the skill's re-run path, not direct
# editing — same discipline as the OCR sibling (meta/conventions.md
# "Producing the `.txt` sibling").
#
# Structural twist vs the OCR sibling: the OCR sibling REPLACES a corrupt
# pdftotext layer for verbatim-quote matching; the attribution sibling
# COEXISTS with the original transcript (which remains the verbatim
# source). validate.py matches `quote.text` against the source file
# unchanged; validate-research.py matches each transcript-quote's
# `speaker_id` against the attribution sibling at the quote's line range.

path_prefix: sources/transcripts/
path_suffix: -attribution.yaml
format: yaml

# Closed enums shared across this schema.

# `on_camera_role` classifies a speaker's typical visual presence in the
# source recording. Drives downstream behavior: `voiceover` and
# `off-camera` speakers should NOT be expected to match face baselines at
# their turn timestamps — the conditional image-verification step skips
# them by default. `mixed` speakers (host who narrates AND appears in
# segments) require per-turn judgment.
on_camera_role_values:
  - primary       # speaker appears on camera during most of their turns
  - voiceover     # speaker is heard but not shown (documentary narrator)
  - mixed         # speaker appears in some turns, narrates over others
  - off-camera    # speaker is heard but never visible (phone caller, etc.)

# `foreign_kind` classifies content NOT attributable to any in-room
# speaker. Distinct from speakers[] (which carries the live participants,
# including off-camera narrators / hosts — those are speakers, not
# foreign content). Foreign content is content whose AUTHOR is outside
# the live speaker set: a jingle composed by the show, a memo authored by
# a third party, an archival clip recorded in a different context. The kinds
# are enumerated in `foreign_kind_values` below; for how foreign content sits
# alongside the live speaker set on a transcript artifact, see meta/conventions.md
# "Transcript quotes carry structural speaker attribution".
foreign_kind_values:
  - foreign-jingle        # show-intro lyric/music with brand identifier
  - foreign-intro         # third-person framing voiceover (NOT a speaker)
  - foreign-outro         # closing third-person framing voiceover
  - foreign-ad-read       # sponsor read, promo code, product mention
  - foreign-narration     # off-screen voice describing footage/b-roll
                          # (when the narrator is NOT a defined speaker;
                          # if the narrator IS a defined speaker — e.g.
                          # documentary host Ammar Kandil narrating over
                          # Grusch footage — use that speaker's id and
                          # set their on_camera_role to voiceover/mixed)
  - foreign-archival      # embedded recording from a different context
                          # (news clip, prior interview, hearing footage)
                          # — the speaker(s) in the recording are NOT live
                          # in-room participants
  - foreign-recitation    # in-room speaker reading verbatim from a
                          # primary document (FBI memo, AARO email, slide
                          # quote) — text originates with a third-party
                          # author even though spoken by a live speaker.
                          # Use `referenced_source` on the turn entry to
                          # identify the recited document.
  - foreign-prepared      # in-room speaker reading their OWN written
                          # statement (Lacatski's 9-min prepared remarks
                          # in weaponized-096). Same speaker, but the text
                          # was composed not spontaneous. Border case;
                          # contributor judgment per meta/conventions.md.
  - foreign-music         # bracket-tagged non-speech audio ([Music],
                          # [Applause]) — typically zero-content
  - foreign-other         # clearly non-conversational, doesn't fit above

confidence_values: [high, medium, low]

# Verification status of the sibling as a whole. Producer emits `draft`;
# the structural validator + independent verifier promote to `verified`.
# Failed verification leaves the sibling at `draft` with a `verifier_notes`
# field populated.
verification_status_values: [draft, verified, rejected]

# ---------------------------------------------------------------------------
# Top-level required keys
# ---------------------------------------------------------------------------

required_keys:
  - slug                  # MUST match {stem} of source_path
  - source_path           # path under sources/, relative; matches a
                          # manifest entry with transcript_provenance ∈
                          # {auto-caption, human-corrected-caption}
  - source_line_count     # int; MUST equal `wc -l` of source_path. The
                          # coverage check uses this as the upper bound
                          # for the turns array. Drift = source file
                          # changed underneath the sibling → re-run skill.
  - generated_date        # YYYY-MM-DD
  - producer_session      # agent session id of the producer (for audit)
  - verification_status   # draft | verified | rejected
  - speakers              # list of speaker_entry
  - turns                 # list of turn_entry; covers every line of
                          # source_path with no gaps + no overlaps

optional_keys:
  - verifier_session      # agent session id of the independent verifier
                          # (required when verification_status == verified)
  - verifier_notes        # free-text; required when verification_status
                          # == rejected (carries the correction list).
                          # FORBIDDEN when == verified (stripped on finalize).
  - source_content_hash   # "sha256:<hex>" over the raw source-file bytes.
                          # COMPUTED by scripts/build/finalize-attribution.py
                          # (W2); REQUIRED once verification_status == verified
                          # (parallels verifier_session). The strong drift
                          # detector — source_line_count is a cheap pre-check,
                          # this catches any byte change under a constant line
                          # count. validate-speaker-attribution.py recomputes
                          # and compares; mismatch = re-run finalize. Not
                          # hand-authored.
  - image_verification    # list of image_verification_entry (only for
                          # turns whose `needs_image_verification` was
                          # resolved against the photo-identity-log)

# ---------------------------------------------------------------------------
# speaker_entry — one per live in-room participant
# ---------------------------------------------------------------------------
#
# Live participants ONLY. Off-camera narrators who are part of the
# production (documentary host) are speakers. Third-party authors whose
# words appear via recitation, archival clip, or news anchor cut-in are
# NOT speakers — their content is `foreign-*` per foreign_kind_values
# above. Border cases (a hearing co-chair briefly recorded in the
# documentary's archival news segment): contributor judgment — if their
# words appear ONLY via the archival clip, use foreign-archival; if they
# also participate in the live segment, they ARE a speaker.

speaker_entry:
  required: [id, name, on_camera_role]
  optional: [role, node_link, no_repo_node, notes]
  # id: short stable handle, conventionally `s1`, `s2`, ... in turn-
  #   appearance order. Referenced by turn_entry.speaker_id; same form
  #   as the existing speakers[] convention on transcript artifacts
  #   (schema-research-artifact.yaml::speaker_entry).
  # name: display name (e.g., "Joe Rogan", "Luis Elizondo", "Ammar
  #   Kandil"). Free-text; rendered as the speaker label in the
  #   -attributed.md output.
  # on_camera_role: enum (see on_camera_role_values). Drives the
  #   conditional image-verification step's per-speaker behavior — a
  #   `voiceover`-tagged speaker's turns are NOT auto-flagged for
  #   image verification even when face-detection misses, because their
  #   face is structurally not expected to appear at their turn
  #   timestamps. A `primary`-tagged speaker's low-confidence turns DO
  #   route to image verification by default.
  # role: free-text description (e.g., "Host", "Guest", "Whistleblower",
  #   "Narrator", "Interviewer"). Same convention as the existing
  #   speakers[] role field on transcript artifacts.
  # node_link: /people/{slug} path for the speaker's repository node.
  #   Renders as a wrap-link in the speaker label. In a VERIFIED sibling
  #   every live speaker MUST carry one (W4 — the authoritative identity
  #   join key downstream; kills honorific/name-matching fragility). A
  #   stub to an unbuilt node is the CORRECT value (per meta/conventions.md
  #   "Cross-reference paths to unbuilt nodes — use a stub, never null");
  #   the broken-link registry tracks it via the transcript node body, so
  #   target existence is NOT required here.
  # no_repo_node: true marks a live speaker with no resolvable repository
  #   identity — an anonymous role (an unnamed studio anchor) or a
  #   peripheral first-name-only participant. Such a speaker is exempt
  #   from the node_link requirement and must NOT also carry a node_link.
  # notes: free-text. Use for non-obvious context the verifier needs
  #   (e.g., "Ammar Kandil narrates ~32% of runtime in voiceover; his
  #   live in-room appearances are confined to Days 1-2").

# ---------------------------------------------------------------------------
# turn_entry — coverage spine; one array, every line covered exactly once
# ---------------------------------------------------------------------------
#
# The coverage discipline:
# - Every line in source_path (1..source_line_count) MUST be covered by
#   exactly one turn entry.
# - line_range values across all entries form a strict partition: no
#   gaps, no overlaps. Validator enforces.
# - Adjacent same-speaker turns are NOT pre-merged by the producer; the
#   renderer collapses them at output time. Two reasons: (1) the
#   verifier needs per-turn confidence ratings, (2) a topic shift may
#   warrant a fresh turn even within one speaker's continuous speech.
# - The first and last turns are typically `foreign-jingle` /
#   `foreign-intro` and `foreign-outro` / `foreign-music` respectively;
#   the coverage discipline still applies — line 1 must be covered.

turn_entry:
  required: [speaker_id, line_range, confidence]
  optional: [start_ts, end_ts, rationale, referenced_source, needs_image_verification, verifier_notes]
  # speaker_id: three shapes accepted, mirroring the existing
  #   schema-research-artifact.yaml::quote_entry.speaker_id convention:
  #
  #   - a single STRING matching a speakers[].id (e.g. `s2`) — the
  #     common case; renders as "Speaker: {name}" in -attributed.md.
  #   - a single STRING matching a `foreign-*` value from
  #     foreign_kind_values — content NOT attributable to any speaker;
  #     renders as "[{kind}]" with the rationale and referenced_source
  #     surfaced in the line preamble.
  #   - a LIST of 2+ strings, all matching speakers[].id (e.g.
  #     `[s1, s2]`) — mixed exchange / unresolvable boundary. Renders
  #     as "Speakers — mixed exchange: {name1}, {name2}". A 1-element
  #     list is rejected (use the bare string). Foreign-* values cannot
  #     appear in a mixed-exchange list (foreign content is not a
  #     "speaker" — use a separate foreign-* turn or split the range).
  #
  # line_range: 1-indexed line numbers into source_path. Two forms:
  #
  #   - "N" — a single line (validator accepts; equivalent to "N-N").
  #   - "N-M" — closed interval [N, M], 1 ≤ N ≤ M ≤ source_line_count.
  #
  #   Validator confirms every line in [1, source_line_count] is
  #   covered by exactly one turn entry, with no overlaps. Ranges
  #   must be sorted ascending across the turns array (chronological
  #   reading order).
  #
  # start_ts / end_ts: integer seconds — the first and last caption-tick
  #   times spanned by line_range. COMPUTED by
  #   scripts/build/finalize-attribution.py (W2) from the source file's
  #   `[MM:SS]` / `[H:MM:SS]` ticks; NOT hand-authored. Absent when the turn
  #   covers no timestamped source line (e.g. a header-only intro turn).
  #   On a VERIFIED sibling a turn whose line_range contains a timestamped
  #   line MUST carry both, and they must equal the value derived from
  #   (source, line_range) — validate-speaker-attribution.py recomputes and
  #   compares, so the fields are tamper-evident. start_ts <= end_ts, and the
  #   ticks are non-decreasing across the turns array (chronological order).
  #
  # confidence: high | medium | low.
  #   - high: speaker boundary is clean (self-introduction, second-
  #     person address, clear topic continuity, unambiguous register
  #     shift).
  #   - medium: boundary is plausible from textual cues but not
  #     conclusive (could be confirmed by audio anchor at the
  #     timestamp, but mechanical pipeline isn't being run).
  #   - low: boundary is uncertain; producer's best judgment. Routes
  #     to verifier scrutiny by default; routes to conditional image-
  #     verification if `needs_image_verification: true` is set.
  #
  # rationale: free-text. DRAFT-PHASE VERIFICATION SCAFFOLDING — the cue
  #   the producer relied on, which the independent verifier checks against
  #   the source. REQUIRED while verification_status != verified (draft /
  #   rejected) when confidence < high OR speaker_id is a `foreign-*` kind
  #   OR speaker_id is a mixed-exchange list. Once the sibling is VERIFIED
  #   the rationale has served its purpose and is STRIPPED by
  #   scripts/build/finalize-attribution.py — a verified sibling carries no
  #   rationale (the validator FATALs if it does). `confidence` is the
  #   durable uncertainty marker on the committed artifact; an investigator
  #   reads the source lines to judge a boundary.
  #   For foreign content: explain WHY this span is foreign (e.g.,
  #   "Elizondo announces 'scroll down to paragraph 6' and reads the
  #   1950 NM AF memo verbatim through line 428"). For low/medium
  #   confidence: name the cue the producer relied on (e.g.,
  #   "second-person address pattern; no name spoken").
  #
  # referenced_source: free-text identifier of the document/recording
  #   being recited or replayed. REQUIRED when speaker_id is
  #   `foreign-recitation` or `foreign-archival`. Examples: "1950 NM
  #   AF memo paragraph 6", "NewsNation Coulthart-Grusch interview,
  #   June 2023", "House oversight hearing July 26 2023, Mace question".
  #
  # needs_image_verification: bool (default false). DRAFT-PHASE
  #   VERIFICATION SCAFFOLDING — the producer's request that this turn be
  #   confirmed against the source recording when textual cues are
  #   insufficient. Routed to the conditional image-verification step
  #   against sources/photo-identity-log/baselines/. Like rationale, it is
  #   draft-phase only: once the sibling is VERIFIED the flag has served its
  #   purpose and is STRIPPED by scripts/build/finalize-attribution.py — a
  #   verified sibling carries no needs_image_verification (the validator
  #   FATALs if it does). The durable record of a resolved turn is its
  #   `confidence` plus any image_verification_entry; an unresolved turn
  #   carries only `confidence` (image verification is the backstop, not a
  #   prerequisite — see the skill).
  #
  # verifier_notes: free-text added by the independent verifier on
  #   turns they corrected or specifically reviewed. Not added by the
  #   producer. Like rationale, draft-phase scaffolding — STRIPPED on
  #   finalize; forbidden on a verified sibling.

# ---------------------------------------------------------------------------
# image_verification_entry — record of conditional image-verification
# resolution for low-confidence turns
# ---------------------------------------------------------------------------
#
# Optional top-level `image_verification: []` list. One entry per turn
# whose `needs_image_verification: true` was resolved against the photo-
# identity-log. Records the durable outcome — which turn, what the
# resolution was, who confirmed (agent verifier vs. contributor), and a
# prose note. Extraction frames are transient /tmp working files and are
# NOT recorded (committing /tmp paths produces dead references the moment
# the dir is cleared); the timestamps live in the resolved turn and the
# prose note. The mechanical face-detection machinery
# (scripts/tools/detect-faces.py, sources/photo-identity-log/baselines/)
# is preserved as the higher-confidence backstop — see
# meta/conventions.md "Speaker attribution: source format selects the
# method" for the image-path discipline.

image_verification_entry:
  required: [turn_line_range, resolution, resolved_speaker_id, resolved_by]
  optional: []
  # Structured-only. The four required fields ARE the durable record — an
  # `ambiguous` resolution with `resolved_speaker_id: [s1, s2]` already says
  # "couldn't resolve who; mixed exchange stands." No free-text: a prose note
  # restating the structured verdict is clutter (it renders into the .md, eats
  # tokens, and invites opinion). Frame inspection is transient working state,
  # not recorded.
  # turn_line_range: the line_range of the turn this entry resolves;
  #   must match an entry in turns[] exactly.
  # resolution: enum [confirmed, corrected, ambiguous].
  #   - confirmed: image evidence supports the producer's
  #     resolved_speaker_id (no change to turns[]).
  #   - corrected: image evidence contradicts; turns[] was updated to
  #     resolved_speaker_id (which differs from producer's original).
  #   - ambiguous: image evidence is inconclusive; resolved_speaker_id
  #     is the contributor's judgment, may be a mixed-exchange list.
  # resolved_speaker_id: the final speaker_id assigned (after image
  #   verification). Same three shapes as turn_entry.speaker_id.
  # resolved_by: enum [agent-verifier, contributor].
  #   - agent-verifier: the independent verifier agent extracted frames
  #     and matched against baselines unambiguously.
  #   - contributor: a human reviewer made the call (face baseline
  #     missing, multiple plausible matches, or LLM-confidence too low).
  #     This is the path the photo-identity-log human-in-the-loop
  #     workflow preserves.

# ---------------------------------------------------------------------------
# Cross-schema integration points
# ---------------------------------------------------------------------------
#
# This sibling INTEGRATES with the research-artifact schema as follows:
#
# 1. `transcript_provenance` on the manifest source entry (see
#    schema.yaml::transcript_provenance_values) gates eligibility:
#    only `auto-caption` and `human-corrected-caption` sources need a
#    sibling. Stenographic / published-transcript sources carry speaker
#    labels in their own bytes; no sibling required (validator skips
#    sibling-presence check for those provenances).
#
# 2. `speaker_id` on transcript-artifact `quote_entry` items must
#    resolve against this sibling's `turns[]` at the quote's source
#    location. The cross-validator —
#    `scripts/checks/speaker_attribution_consistency.py`, run by
#    validate-research.py — resolves each quote's `[MM:SS]` anchor to a
#    source line, finds the covering turn(s), maps the sibling's speaker
#    to the artifact's speaker by node_link / name (the two `speakers[]`
#    lists are authored independently and their ids can disagree), and
#    confirms the quote's speaker_id is among the speakers active across
#    the lines the quote spans. Drift = data error, routed by
#    route_failure.py to the artifact-data fix role.
#
# 3. `speakers[]` on the transcript artifact and `speakers[]` on this
#    sibling are NOT required to match. The artifact's speakers[] lists
#    only speakers whose quotes appear in the artifact (cross-reference
#    surface); the sibling's speakers[] lists ALL participants in the
#    source recording (attribution surface). The sibling is the
#    superset.
#
# 4. The manifest entry for the sibling carries the URL suffix
#    `#speaker-attribution` (parallels `#clean-text-transcription` on
#    the OCR sibling — both are fragment-marked derived artifacts pointing
#    at a parent manifest entry). `--wayback-skip` is required (derived
#    artifact, not fetchable). Parent manifest entry remains the source-
#    of-truth for the verbatim transcript bytes. The rendered companion
#    `{stem}-attributed.md` (deterministic output of
#    `scripts/tools/render-speaker-transcript.py`) is a SECOND manifest
#    entry under the same parent + `#speaker-attribution` fragment,
#    distinguished by its `format: md` (vs the YAML's `format: yaml`).
